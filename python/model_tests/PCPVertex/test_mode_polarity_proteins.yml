# The model configuration for the heterogeneous Savanna Model
---
parameter_space:  
  PCPVertex: !model
    model_name: PCPVertex
    
    gamma: 0.01
    cell_cell_polarity_interaction: 2.
    cell_polarity_exclusion: 1.
    cell_initialisation_protein_level: 1.

    data_manager:
      tasks:
        Energy_total: &energy
          active: true
          trigger: build_once
          decider: write_always
        Energy_linetension: *energy
        Energy_areaelasticity: *energy
        Energy_cell_contractility: *energy
        Energy_edge_contractility: *energy
        Energy_boundary_area_elasticity: *energy
        Energy_boundary_shape_elasticity: *energy
        Energy_cell_cell_polarity: *energy
        Energy_polarity_exclusion: *energy
        Energy_lagrange_net_polarisation: *energy
        Energy_lagrange_const_concentration: *energy
        Energy_time: *energy
