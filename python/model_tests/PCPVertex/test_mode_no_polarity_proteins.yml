# The model configuration for the heterogeneous Savanna Model
---
parameter_space:  
  PCPVertex: !model
    model_name: PCPVertex
    
    gamma: 0.0
    cell_cell_polarity_interaction: 0.
    cell_polarity_exclusion: 0.
    cell_initialisation_protein_level: 0.

    data_manager:
      tasks:
        Energy_cell_cell_polarity: 
          active: false
        Energy_polarity_exclusion: 
          active: false
        Energy_lagrange_net_polarisation: 
          active: false
        Energy_lagrange_const_concentration: 
          active: false
        Vertices: &agents
          active: true
          trigger: build_always
          decider: write_always
        Cells: *agents
        Edges: *agents
        Cell_energies: &agent_energies
          active: false
          trigger: build_always
          decider: write_always
        Edge_energies: *agent_energies
