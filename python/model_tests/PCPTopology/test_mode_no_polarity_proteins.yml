# The model configuration for the heterogeneous Savanna Model
---
parameter_space:  
  PCPTopology: !model
    model_name: PCPTopology
    
    equilibration_tolerance: 100000.
    num_equilibration_steps: 1000
    max_equilibration_iterations: 1

    PCPVertex:    
      gamma: 0.0
      cell_cell_polarity_interaction: 0.
      cell_polarity_exclusion: 0.
      cell_initialisation_protein_level: 0.

      data_manager:
        deciders:      
          write_slice: &slicer
            type: slice
            args:
              start: 0
              stop: 1000000
              step: 1000
        triggers:
          build_slice: *slicer
        tasks:
          Energy_cell_cell_polarity: 
            active: false
          Energy_polarity_exclusion: 
            active: false
          Energy_lagrange_net_polarisation: 
            active: false
          Energy_lagrange_const_concentration: 
            active: false

          Vertex_position: &position
            active: true
            trigger: build_slice
            decider: write_slice
          Cell_position:
            <<: *position
          Edge_link:
            <<: *position
