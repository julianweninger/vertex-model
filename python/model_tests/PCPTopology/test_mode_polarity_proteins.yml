# The model configuration for the heterogeneous Savanna Model
---
parameter_space:  
  PCPTopology: !model
    model_name: PCPTopology
    
    equilibration_tolerance: 100000.
    num_equilibration_steps: 200
    max_equilibration_iterations: 1
    
    cell_divisions_per_step: 1

    proliferation:
      num_cell_divisions: 1

    PCPVertex:
      gamma: 0.01
      cell_cell_polarity_interaction: 2.
      cell_polarity_exclusion: 1.
      cell_initialisation_protein_level: 1.

      data_manager:
        deciders:      
          write_slice: &slicer
            type: slice
            args:
              start: 0
              stop: 1000000
              step: 200
        triggers:
          build_slice: *slicer
        tasks:
          Energy_total: &energy
            active: true
            trigger: build_once
            decider: write_always
          Energy_linetension: 
            <<: *energy
          Energy_areaelasticity: 
            <<: *energy
          Energy_contractility: 
            <<: *energy
          Energy_cell_cell_polarity: 
            <<: *energy
          Energy_polarity_exclusion: 
            <<: *energy
          Energy_lagrange_net_polarisation: 
            <<: *energy
          Energy_lagrange_const_concentration: 
            <<: *energy
          Energy_time:
            <<: *energy

          Vertex_position: &position
            active: true
            trigger: build_slice
            decider: write_slice
          Cell_position:
            <<: *position
          Edge_link:
            <<: *position
