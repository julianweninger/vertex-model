# The test configuration for the PCPTopology model
# testing the increment operations
---
perform_sweep: False

paths:
  model_note: test_increment_operations

parameter_space:
  num_steps: 40

  PCPTopology: !model
    model_name: PCPTopology
    log_level: debug

    PCPVertex:
      log_level: info

    NotchDelta:
      log_level: warn
      
    stretch_domain:
      active: False

    increment_area:
      active: True

    increment_shape_index:
      active: True

    increment_linetension:
      active: True

    increment_contractility:
      active: True

