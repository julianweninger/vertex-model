# The model configuration for the heterogeneous Savanna Model
---
parameter_space:  
  PCPTopology: !model
    model_name: PCPTopology
    
    equilibration_tolerance: 100000.
    num_equilibration_steps: 200
    max_equilibration_iterations: 1
    
    cell_divisions_per_step: 1

    proliferation:
      num_cell_divisions: 1

    PCPVertex:    
      periodic_bc: false

      data_manager:
        deciders:      
          write_slice: &slicer
            type: slice
            args:
              start: 0
              stop: 1000000
              step: 200
        triggers:
          build_slice: *slicer
        tasks:
          Vertex_position: &position
            active: true
            trigger: build_slice
            decider: write_slice
          Cell_position:
            <<: *position
          Edge_link:
            <<: *position
