# The model configuration for the heterogeneous Savanna Model
---
perform_sweep: True

parameter_space:
  num_steps: 14

  PCPTopology: !model
    model_name: PCPTopology

    PCPVertex:    
      gamma: 0.0
      update_scheme: !sweep
        default: steepest_gradient
        values: [conjugate_gradient, steepest_gradient, steepest_gradient_adaptive]

    equilibration:
      tolerance: 1.e-6
      num_jiggle: 1

