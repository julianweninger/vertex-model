# The test configuration for the PCPTopology model
# testing the modes for the update scheme
---
perform_sweep: True

paths:
  model_note: test_solvers
  
run_kwargs:
  stop_conditions:
    - !stop-condition
      name: single simulation timeout
      description: terminates a simulation if it ran for too long
      enabled: true               # (optional, true by default)
      to_check:                   # A sequence of AND-connected conditions
        - func: timeout_wall      # Looked up in utopya.stopcond_funcs
          seconds: !expr 60*5    # --> terminated after 10 minutes wall time

parameter_space:
  num_steps: 2

  PCPTopology:
    model_name: PCPTopology
    
    initialisation:
      # Add some noise to initial lattice
      0_add_noise:
        enabled: true
      
      1_by_proliferation:
        enabled: false
    
    minimization:
      tolerance: 1.e-6
      max_steps: 15000
      jiggle_tolerance: 1.e-5
      dt: 0.01
      num_steps: 100

    space:
      periodic: !sweep
        default: True
        values: [False, True]
        name: periodic_BC
      extent: !coupled-sweep
        target_name: periodic_BC
        default: [1., 1.]
        values: [[40., 40.], [1., 1.]]
        name: extent

    PCPVertex:
      log_level: trace
      
      work_function_terms:
      - linetension:
          linetension: 0.02
      - linetension_fluctuations:
          amplitude: 0.02
          timescale: 24
      - edge_contractility:
          contractility: 0.02
      - area_elasticity:
          elastic_modulus: 1
          preferential_area: 1
      - cell_contractility:
          contractility: 1.
          preferential_shape: 3.72
      
      space:
        periodic: !coupled-sweep
          target_name: periodic_BC
        extent: !coupled-sweep
          target_name: periodic_BC
          default: [1., 1.]
          values: [[40., 40.], [1., 1.]]
    
    operations:
      - void:
          times: []
          iterations_prolog: 1

      - proliferate:
          times: [1]

          iterations: 4

          num_increases: 0
          area_threshold: 0.

          # minimization:
          #   mode: manual

      - proliferate:
          times: [3]

          iterations: 8

          num_increases: 0
          area_threshold: 0.

          # minimization:
          #   mode: manual

      - proliferate:
          times: [4]

          iterations: 8

          num_increases: 0
          area_threshold: 0.

          # minimization:
          #   mode: manual

      - proliferate:
          times: !listgen [5, 20]

          iterations: 16

          num_increases: 0
          area_threshold: 0.

          # minimization:
          #   mode: manual

      - void: 
          times: !listgen [2, 20]
