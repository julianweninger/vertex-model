# The test configuration for the PCPTopology model
# testing the modes for the update scheme
---
perform_sweep: True

paths:
  model_note: test_solvers

parameter_space:
  num_steps: 2

  PCPTopology: !model
    model_name: PCPTopology

    PCPVertex:
      log_level: trace
      update_scheme: !sweep
        default: steepest_gradient
        values: [conjugate_gradient, steepest_gradient, steepest_gradient_adaptive]
    
    operations:
      - jiggle:
          times: []
          iterations_prolog: 1

          minimization:
            num_repeat: 1
            jiggle_intensity: 1.e-3

      - proliferate:
          times: [1]

          iterations: 64

          num_increases: 0
          area_threshold: 0.

          minimization:
            mode: manual

      - jiggle:
          times: [2]
          minimization:
            num_repeat: 1
            tolerance: 1e-5
            jiggle_tolerance: 1e-5
