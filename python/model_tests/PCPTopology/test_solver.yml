# The test configuration for the PCPTopology model
# testing the modes for the update scheme
---
perform_sweep: True

paths:
  model_note: test_solvers

parameter_space:
  num_steps: 14

  PCPTopology: !model
    model_name: PCPTopology

    PCPVertex:    
      gamma: 0.0
      update_scheme: !sweep
        default: steepest_gradient
        values: [conjugate_gradient, steepest_gradient, steepest_gradient_adaptive]
