# The test configuration for the PCPTopology model
# testing the modes for the update scheme
---
perform_sweep: True

paths:
  model_note: test_solvers
  
run_kwargs:
  stop_conditions:
    - !stop-condition
      name: single simulation timeout
      description: terminates a simulation if it ran for too long
      enabled: true               # (optional, true by default)
      to_check:                   # A sequence of AND-connected conditions
        - func: timeout_wall      # Looked up in utopya.stopcond_funcs
          seconds: !expr 60*5    # --> terminated after 10 minutes wall time

parameter_space:
  num_steps: 5

  PCPTopology: !model
    model_name: PCPTopology
    
    minimization:
      tolerance: 1.e-6
      max_steps: 15000
      num_repeat: 3
      jiggle_tolerance: 1.e-5
      jiggle_intensity: 0.01

    periodic_BC: !sweep
      default: True
      values: [False, True]
      name: periodic_BC
    space:
      periodic: !coupled-sweep
        target_name: periodic_BC
      extent: !coupled-sweep
        target_name: periodic_BC
        default: [1., 1.]
        values: [[40., 40.], [1., 1.]]

    PCPVertex:
      log_level: trace
      update_scheme: !sweep
        default: steepest_gradient
        values: [conjugate_gradient, steepest_gradient, steepest_gradient_adaptive]
      
      space:
        periodic: !coupled-sweep
          target_name: periodic_BC
        extent: !coupled-sweep
          target_name: periodic_BC
          default: [1., 1.]
          values: [[40., 40.], [1., 1.]]
    
    operations:
      - jiggle:
          times: []
          iterations_prolog: 1

          minimization:
            num_repeat: 1
            jiggle_intensity: 1.e-3

      - proliferate:
          times: [1]

          iterations: 4

          num_increases: 0
          area_threshold: 0.

          minimization:
            mode: manual

      - proliferate:
          times: [3]

          iterations: 8

          num_increases: 0
          area_threshold: 0.

          minimization:
            mode: manual

      - proliferate:
          times: [4]

          iterations: 8

          num_increases: 0
          area_threshold: 0.

          minimization:
            mode: manual

      - proliferate:
          times: !listgen [5, 20]

          iterations: 16

          num_increases: 0
          area_threshold: 0.

          minimization:
            mode: manual

      - jiggle:
          times: !listgen [2, 20]
