---
task_defaults:
  eval:
    model_name: PCPTopology
    out_dir: "~/ownCloud/Institution/Thesis_figures/{task_name:}"
    
    data_manager:
      out_dir_kwargs:
        # Allow that the data directory may already exist
        exist_ok: true
      load_cfg:
        uni_cfg:
          # NOTE parallel loading not allowed
          parallel: {enabled: false}

    plot_manager:
      # Allow config files to be overwritten
      cfg_exists_action: overwrite_nowarn

      # For each creator, allow that individual plot files may
      # already exist, thus *not prohibiting* overwriting
      creator_init_kwargs:
          universe:
            exist_ok: true
          multiverse:
            exist_ok: true
    
    plots_cfg: 
      my_style:
        enabled: False
        file_ext: svg
        style:
          base_style: seaborn-v0_8-paper
          font.size: 10
          font.family: sans-serif
          font.sans-serif: helvetica
          figure.titlesize: &Titlesize medium
          legend.title_fontsize: &Labelsize small
          legend.fontsize: &Ticksize x-small
          axes.labelsize: *Labelsize
          xtick.labelsize: *Ticksize
          ytick.labelsize: *Ticksize
          figure.autolayout: False
          axes.linewidth: &Linewidth 0.25
          xtick.major.width: *Linewidth
          xtick.minor.width: 0.2
          ytick.major.width: *Linewidth
          ytick.minor.width: 0.2
          grid.linewidth: *Linewidth
          patch.linewidth: *Linewidth

        helpers:
          setup_figure:
            figsize: [!expr 5.90 / 2, !expr 5.90 / 2 * 2 / 3]

      __definitions:
        enabled: False
        linewidth_theory: &linewidth_theory 0.75
        Gamma: &Gamma_best_fit 0.1
        color_homogeneous_theory: &color_homogeneous_theory m
        color_heterogeneous_theory: &color_heterogeneous_theory red
        palette_data_scatter: &palette_data_scatter gist_heat
        get_data:
          BP_data_path: &BP_data_path '~/ownCloud/Institution/Collaboration_NCBS_UNIGE/data/summary_tissue_averages.csv'
          BP_treatment_data_path: &BP_treatment_data_path '~/ownCloud/Institution/Collaboration_NCBS_UNIGE/data/summary_tissue_averages_w_treatments.csv'
          BP_raw_data_path: &BP_raw_data_path '~/ownCloud/Institution/Collaboration_NCBS_UNIGE/data/summary_cells.csv'
          BP_treatment_raw_data_path: &BP_treatment_raw_data_path '~/ownCloud/Institution/Collaboration_NCBS_UNIGE/data/summary_cells_w_treatments.csv'
        save_data:
          BP_data_path: &__BP_data_path '~/ownCloud/Institution/Thesis_figures/BP_explant_analysis/data/tissue_averages.csv'
          BP_treatment_data_path: &__BP_treatment_data_path '~/ownCloud/Institution/Thesis_figures/BP_explant_analysis/data/tissue_averages__w_treatments.csv'
          BP_raw_data_path: &__BP_raw_data_path '~/ownCloud/Institution/Thesis_figures/BP_explant_analysis/data/cells.csv'
          BP_treatment_raw_data_path: &__BP_treatment_raw_data_path '~/ownCloud/Institution/Thesis_figures/BP_explant_analysis/data/cells__w_treatments.csv'

tasks:
  eval:
    BP_explant_analysis:
      
      enabled: False
      
      model_name: PCPTopology
      run_dir: 220905-130915_dummy__BP_explant
      
      plots_cfg:
        load_dummy_data:
          enabled: false
          select:
            __dummy:
              path: data/PCPTopology/Cells
              transform:
                - .sel: [!dag_prev , {property: num_neighbors}]
                - .rename: [!dag_prev , num_neighbors]

        load_raw_data:
          enabled: false
          transform:
            - import_and_call:
              args: 
                - model_plots.PCPTopology.data_ops
                - read_csv
                - *BP_raw_data_path
              tag: BP_cells
            - call_lambda:
              - "lambda data, pos: data.loc[data['position'] != pos]"
              - !dag_tag BP_cells
              - 25I
              tag: BP_cells__25I
            - call_lambda:
              - "lambda data, pos: data.loc[data['position'] != pos]"
              - !dag_tag BP_cells
              - 75I
              tag: BP_cells__75I

        # stage_mapped:
        #   based_on:
        #     - load_dummy_data
        #     - .plot.multiplot
        #     - universe
        #     - my_style
        #   enabled: False
        #   module: model_plots.PCPTopology
        #   plot_func: histogram_plot

        #   data_tag: experiment
        #   label: Experiment
        #   color: orange

        #   # data_tag_split: mapped_data
        #   # label_split: Theory
        #   # color_split: blue

        #   x: stage
        #   x_order: ['E8', 'E10', 'E12', 'E14']

        #   y: num_neighbors
        #   y_label: HC neighbour no.
        #   y_range: [3, 12]

        #   helpers:
        #     set_labels:
        #       x: Embryonic day
        #     set_ticks:
        #       x:
        #         major:
        #           locs: [1, 3, 5, 7]
        #           labels: ['E8', 'E10', 'E12', 'E14']
        #         minor:
        #           locs: [0, 2, 4, 6, 8]
        #       y:
        #         major:
        #           locs: [1, 3, 5, 7]
        #           labels: ['4', '6', '8', '10']
        #         minor:
        #           locs: [0, 2, 4, 6, 8]
        #     set_limits:
        #       y: [0, 9.5]
        #     setup_figure:
        #       figsize: [!expr 5.9/2, !expr 5.9/2 * 2/3]

        # stage_mapped/01__HC_neighbours__hom__histplot:
        #   based_on: stage_mapped

        #   select_and_com:
        #     subspace: 
        #       Gamma: 0

        #   color_split: blue
