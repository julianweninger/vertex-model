        stage_mapped:
          based_on:
            - .plot.multiplot
            - multiverse
            - select_cells_properties_mv.map_stage
            - my_style
          enabled: False
          module: model_plots.PCPTopology
          plot_func: histogram_plot

          data_tag: experiment
          label: Experiment
          color: orange

          data_tag_split: nearest_data
          label_split: Theory
          color_split: *color_homogeneous_theory

          plot_means_kwargs:
            color: black
            linestyles: dashed # [0, [1.5, 1]]
            linewidths: *Linewidth

          x: stage
          x_order: ['E8', 'E10', 'E12', 'E14']

          y: num_neighbors
          y_label: HC neighbour number
          y_range: [3, 13]

          select_and_combine:
            allow_missing_or_failing: silent
            fields:
              _area:
                path: data/PCPTopology/Cells
                transform:
                  - .sel: [!dag_prev , {property: area}]
                  - .sel: [!dag_prev , {time: !slice [1, ~]}]
                  - .rename: [!dag_prev , area]

                  - .sel: [!dag_node -4, {property: cell_type}]
                  - create_mask: [!dag_node -1, ==, 1]
                  
                  - .where: [!dag_node -3, !dag_node -1]
                  - .mean: [!dag_prev , id]
              _property:
                path: data/PCPTopology/Cells
                transform:
                  - .sel: [!dag_prev , {property: num_neighbors}]
                  - .sel: [!dag_prev , {time: !slice [1, ~]}]
                  - .rename: [!dag_prev , num_neighbors]

                  - .sel: [!dag_node -4, {property: cell_type}]
                  - create_mask: [!dag_node -1, ==, 1]
                  
                  - .where: [!dag_node -3, !dag_node -1]
            subspace:
              HC_sep: True
              rho: 0.2

          transform:

            # import the reference
            - import_and_call:
              - model_plots.PCPTopology.data_ops
              - read_csv
              - *BP_raw_data_path
            - call_lambda:
              - "lambda cells: cells.loc[cells['is_HC']]"
              - !dag_prev 
            - call_lambda:
              - "lambda cells, pos: cells.loc[cells['position'] == pos]"
              - !dag_prev 
              - 25I
            # - call_lambda:
            #   - "lambda cells: cells.loc[(cells['aligned_with_PD_axis']) | (cells['stage'] == 'E14')]"
            #   - !dag_prev 
              tag: __experiment
              # the raw experimental data

            - call_lambda:
              - "lambda cells: cells.groupby(by=['file_id', 'stage']).mean()['normalized_area_cells'].reset_index()"
              - !dag_tag __experiment
            - print: [!dag_prev ]
              tag: tissue_HC_areas

            - lambda:
              - "lambda data, stage: data.loc[data['stage'] == stage]"
              tag: select_stage
            - lambda:
              - "lambda tissue_average: tissue_average.loc[tissue_average['normalized_area_cells'] == np.percentile(tissue_average['normalized_area_cells'], 50, method='nearest'), 'file_id'].iloc[0]"
              tag: tissue_id_at_median_HC_area
            # - lambda:
            #   - "lambda tissue_average, HC_area: tissue_average.loc[np.abs(tissue_average['normalized_area_cells'] - HC_area) < 0.001, 'file_id'].iloc[0]"
            #   tag: tissue_id_at_median_HC_area
              
            - call:
              - !dag_tag select_stage
              - !dag_tag tissue_HC_areas
              - 'E8'
            - call: 
              - !dag_tag tissue_id_at_median_HC_area
              - !dag_prev
              # - 0.634967
              tag: tissue_id__E8_median
              # the median of tissues by HC area at stage E8
            - call:
              - !dag_tag select_stage
              - !dag_tag tissue_HC_areas
              - 'E10'
            - call: 
              - !dag_tag tissue_id_at_median_HC_area
              - !dag_prev
              # - 0.829771
              tag: tissue_id__E10_median
              # the median of tissues by HC area at stage E8
            - call:
              - !dag_tag select_stage
              - !dag_tag tissue_HC_areas
              - 'E12'
            - call: 
              - !dag_tag tissue_id_at_median_HC_area
              - !dag_prev
              # - 1.509222
              tag: tissue_id__E12_median
              # the median of tissues by HC area at stage E8
            - call:
              - !dag_tag select_stage
              - !dag_tag tissue_HC_areas
              - 'E14'
            - call: 
              - !dag_tag tissue_id_at_median_HC_area
              - !dag_prev
              # - 3.957211
              tag: tissue_id__E14_median
              # the median of tissues by HC area at stage E8

            - call_lambda:
              - "lambda cells, E8_id, E10_id, E12_id, E14_id: cells.loc[(cells['file_id'] == E8_id) | (cells['file_id'] == E10_id) | (cells['file_id'] == E12_id) | (cells['file_id'] == E14_id)]"
              - !dag_tag __experiment
              - !dag_tag tissue_id__E8_median
              - !dag_tag tissue_id__E10_median
              - !dag_tag tissue_id__E12_median
              - !dag_tag tissue_id__E14_median
              tag: experiment
            - call_lambda:
              - "lambda cells: print(cells['filename'].unique())"
              - !dag_tag experiment
              tag: print_experiment
            - call_lambda:
              - "lambda cells: print(cells['file_id'].unique())"
              - !dag_tag experiment
              tag: print_experiment_
            

            - call_lambda:
              - "lambda cells: cells.groupby(by='stage')['HC_normalized_area'].mean()"
              - !dag_tag experiment
            - print: [!dag_prev ]
            - xr.DataArray: [!dag_prev ]
              tag: reference

            # the map
            - import_and_call:
              - model_plots.PCPTopology.data_ops
              - map_directional_time
              - !dag_tag _area
            - .squeeze: [!dag_prev ]
            - .dropna: [!dag_prev , time, all]
            - import_and_call:
              - model_plots.PCPTopology.data_ops
              - stack
              - !dag_prev
              - {frames: [seed, time]}
            - .dropna: [!dag_prev , frames]
              tag: mapper
            - call_lambda:
              - "lambda data: data.unstack()"
              - !dag_prev
            - .max: [!dag_prev , time]
            - print: [!dag_prev ]
              tag: print_mapper

            # The data 
            - import_and_call:
              - model_plots.PCPTopology.data_ops
              - map_directional_time
              # - !dag_prev
              - !dag_tag _property
            - .squeeze: [!dag_prev ]
            - .dropna: [!dag_prev , time, all]
            - import_and_call:
              - model_plots.PCPTopology.data_ops
              - stack
              - !dag_prev
              - {frames: [seed, time]}
            - .dropna: [!dag_prev , frames]
              kwargs:
                how: all
            - print: [!dag_prev ]
              tag: property

            # assign coords from mapper
            - .assign_coords: [!dag_tag property, {area: !dag_tag mapper}]
            - .swap_dims: [!dag_prev , {frames: area}]
            - call_lambda:
              - "lambda data: data.drop_duplicates(dim='area')"
              - !dag_prev 
            - call_lambda:
              - "lambda data, by: data.sortby(by)"
              - !dag_prev
              - area
            - .drop_vars: [!dag_prev , [_time, direction, frames]]
            - print: [!dag_prev ]
              tag: mapped_data
            
            # interpolate coords from mapper with reference
            - call_lambda: 
              - "lambda data, **kwargs: data.interp(**kwargs)"
              - !dag_tag mapped_data
              kwargs:
                area: !dag_tag reference
                method: 'nearest'
            - print: [!dag_prev ]
              tag: nearest_data_xr
            - import_and_call:
              args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
              tag: nearest_data


          helpers:
            set_labels:
              x: ''
            set_ticks:
              x:
                major:
                  fontsize: *Labelsize
              y:
                major: [4, 6, 8, 10, 12]
                minor: [3, 5, 7, 9, 11]
            setup_figure:
