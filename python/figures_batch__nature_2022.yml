                path: data/PCPTopology/Cells
                transform:
                - .sel: null
                  args: [!dag_node -1]
                  kwargs: {property: cell_type}
                - .sel: [!dag_node -1, {time: 100}]
                - .rename: [!dag_node -1, cell_types]
              _is_boundary:
                path: data/PCPTopology/Cells
                transform:
                - .sel: [!dag_node -1, {property: is_boundary}]
                - .sel: [!dag_node -1, {time: 100}]
                - .rename: [!dag_node -1, is_boundary]

          to_plot:
            - function: sns.histplot
              data: !dag_result hair_cells
              x: polarity
              bins: 16
              binrange: [0, !expr 2*3.1415]
          helpers:
            set_labels:
              x: ''
              y: ''
            set_ticks:
              x: 
                major:
                  locs: [0, !expr 3.1415/2, 3.1415, !expr 3.1415*3/2]
                  labels: ['D', 'S', 'P', 'I']
              y: [250, 500]
            setup_figure:
              figsize: [1.2, 1.2]
              subplot_kw:
                projection: polar
          style:
