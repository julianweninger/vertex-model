        BP_explant:
          based_on:
            - load_dummy_data
            - .plot.multiplot
            - universe
            - my_style
          enabled: False
          transform:
            - import_and_call:
              args: 
                - model_plots.PCPTopology.data_ops
                - read_csv
                - *BP_data_path
              tag: BP_tissue_averages
            - call_lambda:
              - "lambda data, path: data.to_csv(path)"
              - !dag_prev 
              - *__BP_data_path
              tag: __BP_tissue_averages

            - import_and_call:
              args: 
                - model_plots.PCPTopology.data_ops
                - read_csv
                - *BP_treatment_data_path
            - call_lambda:
              - "lambda data: data.loc[data['Experiment'] != 'Control']"
              - !dag_prev 
              tag: BP_tissue_averages__treatments
            - call_lambda:
              - "lambda data, path: data.to_csv(path)"
              - !dag_prev 
              - *__BP_treatment_data_path
              tag: __BP_tissue_averages__treatments

            - import_and_call:
              args: 
                - model_plots.PCPTopology.data_ops
                - read_csv
                - *BP_raw_data_path
              tag: BP_cells
            - call_lambda:
              - "lambda data, path: data.to_csv(path)"
              - !dag_prev 
              - *__BP_raw_data_path
              tag: __BP_cells

            - import_and_call:
              args: 
                - model_plots.PCPTopology.data_ops
                - read_csv
                - *BP_treatment_raw_data_path
            - call_lambda:
              - "lambda data: data.loc[data['Experiment'] != 'Control']"
              - !dag_prev 
              tag: BP_cells__treatment
            - call_lambda:
              - "lambda data, path: data.to_csv(path)"
              - !dag_prev 
              - *__BP_treatment_raw_data_path
              tag: __BP_cells__treatment

          x: HC_area
          helpers:
            set_labels:
              x: norm. HC area
            set_limits:
              x: [0., 4.]
            setup_figure:
              figsize: [!expr 5.9/3, !expr 5.9/3]
            set_legend:
              bbox_to_anchor: [1.05, 1.05]

          to_plot:
            - &scatter_tissue
              function: sns.scatterplot
              data: !dag_result BP_tissue_averages
              hue: Stage
              palette: copper
              style: P-D position
            - &scatter_tissue__full
              function: sns.scatterplot
              data: !dag_result BP_tissue_averages
              hue: Stage
              palette: copper
              style: P-D position
              size: S-I position
              size_order: ['Superior', 'Mid', 'Inferior']
            - &scatter_tissue__errors
              function: [matplotlib.pyplot, errorbar]
              data: !dag_result BP_tissue_averages
              xerr: HC_area__std
              label: ~
              ls: ''
              lw: 0.2
              color: black
              alpha: 0.5
              zorder: 0
            - &scatter_tissue__treatments
              function: sns.scatterplot
              data: !dag_result BP_tissue_averages__treatments
              hue: 'is_Control'
              hue_order: [True, False]
              palette: ['blue', 'red']
              style: 'Experiment_Series'
              style_order: ['Live', 'MLCKdmso-4hrs', 'MLCKml7-4hrs', 'MLCK_16hrs', 'Vangl2', 'Atoh1']
              size: 'Experiment_Series'
            - &scatter_tissue__errors__treatments {
                <<: *scatter_tissue__errors,
                data: !dag_result BP_tissue_averages__treatments
              }

        BP_explant/save_data:
          based_on: BP_explant
          x: ~
          to_plot:
            - function: sns.scatterplot
              data: !dag_result __BP_tissue_averages
            - function: sns.scatterplot
              data: !dag_result __BP_tissue_averages__treatments
            - function: sns.scatterplot
              data: !dag_result __BP_cells
            - function: sns.scatterplot
              data: !dag_result __BP_cells__treatment

        BP_explant/area_mapped/HC_neighbours:
          based_on: BP_explant

          y: coordination_number
          to_plot:
            - { <<: *scatter_tissue }
            - { <<: *scatter_tissue__errors,
                yerr: coordination_number__std}
          helpers:
            set_labels:
              y: HC neighbour no.
            set_limits:
              y: [3, 11]
        BP_explant/area_mapped/HC_neighbours__full:
          based_on: BP_explant/area_mapped/HC_neighbours

          to_plot:
            - { <<: *scatter_tissue__full }
            - { <<: *scatter_tissue__errors,
                yerr: coordination_number__std}
        BP_explant/area_mapped/HC_neighbours__treatment:
          based_on: BP_explant/area_mapped/HC_neighbours
          to_plot:
            - { <<: *scatter_tissue }
            - { <<: *scatter_tissue__errors,
                yerr: coordination_number__std}
            - { <<: *scatter_tissue__treatments }
            - { <<: *scatter_tissue__errors__treatments,
                yerr: coordination_number__std}

        BP_explant/area_mapped/SC_neighbours:
          based_on: BP_explant

          y: subordination_number
          to_plot:
            - { <<: *scatter_tissue }
            - { <<: *scatter_tissue__errors,
                yerr: subordination_number__std}
          helpers:
            set_labels:
              y: SC neighbour no.
            set_limits:
              y: [3, 9]
        BP_explant/area_mapped/SC_neighbours__full:
          based_on: BP_explant/area_mapped/SC_neighbours
          to_plot:
            - { <<: *scatter_tissue__full }
            - { <<: *scatter_tissue__errors,
                yerr: subordination_number__std}
        BP_explant/area_mapped/SC_neighbours__treatment:
          based_on: BP_explant/area_mapped/SC_neighbours
          to_plot:
            - { <<: *scatter_tissue }
            - { <<: *scatter_tissue__errors,
                yerr: subordination_number__std}
            - { <<: *scatter_tissue__treatments }
            - { <<: *scatter_tissue__errors__treatments,
                yerr: subordination_number__std}

        BP_explant/area_mapped/topology:
          based_on: BP_explant
          y: neighbor_number
          to_plot:
            - { <<: *scatter_tissue }
            - { <<: *scatter_tissue__errors,
                yerr: neighbor_number__std}
          helpers:
            set_labels:
              y: neighbour no.
            set_limits:
              y: [3, 9]
        BP_explant/area_mapped/tissue_size:
          based_on: BP_explant
          y: area__no_norm
          to_plot:
            - { <<: *scatter_tissue }
            - { <<: *scatter_tissue__errors,
                yerr: area__no_norm__std}
          helpers:
            set_labels:
              y: Cell area [$\mu m^2$]
            set_limits:
              y: [0, ~]

        BP_explant/area_mapped/HC_density:
          based_on: BP_explant
          y: HC_density
          to_plot:
            - { <<: *scatter_tissue }
            - { <<: *scatter_tissue__errors }
          helpers:
            set_labels:
              y: HC no. density
            set_limits:
              y: [0, 0.4]
        BP_explant/area_mapped/HC_density__w_treatment:
          based_on: BP_explant/area_mapped/HC_density
          to_plot:
            - { <<: *scatter_tissue }
            - { <<: *scatter_tissue__errors }
            - { <<: *scatter_tissue__treatments }
            - { <<: *scatter_tissue__errors__treatments }
        
        BP_explant/area_mapped/hexatic_order:
          based_on: BP_explant
          y: hexatic_order
          to_plot:
            - { <<: *scatter_tissue }
            - { <<: *scatter_tissue__errors,
                yerr: hexatic_order__std}
          helpers:
            set_labels:
              y: Hexatic order [$\psi_6$]
            set_limits:
              y: [0, 1]
        BP_explant/area_mapped/hexatic_order_corrected:
          based_on: BP_explant/area_mapped/hexatic_order
          y: hexatic_order_corrected
          to_plot:
            - { <<: *scatter_tissue }
            - { <<: *scatter_tissue__errors,
                yerr: hexatic_order_corrected__std}
          helpers:
            set_labels:
              y: Hexatic order (corr.) [$\psi_6^\star$]
        BP_explant/area_mapped/hexatic_order_corrected__full:
          based_on: BP_explant/area_mapped/hexatic_order_corrected
          to_plot:
            - { <<: *scatter_tissue__full }
            - { <<: *scatter_tissue__errors,
                yerr: hexatic_order_corrected__std}
        BP_explant/area_mapped/hexatic_order_corrected__w_treatment:
          based_on: BP_explant/area_mapped/hexatic_order
          to_plot:
            - { <<: *scatter_tissue }
            - { <<: *scatter_tissue__errors,
                yerr: hexatic_order_corrected__std}
            - { <<: *scatter_tissue__treatments }
            - { <<: *scatter_tissue__errors__treatments,
                yerr: hexatic_order_corrected__std}

        BP_explant/area_mapped/polarity_variance:
          based_on: BP_explant/area_mapped/hexatic_order
          y: polarity__variance
          to_plot:
            - { <<: *scatter_tissue }
            - { <<: *scatter_tissue__errors }
          helpers:
            set_labels:
              y: polarity circular variance
        BP_explant/area_mapped/polarity_variance__full:
          based_on: BP_explant/area_mapped/polarity_variance
          to_plot:
            - { <<: *scatter_tissue__full }
            - { <<: *scatter_tissue__errors }
        BP_explant/area_mapped/polarity_variance__w_treatment:
          based_on: BP_explant/area_mapped/polarity_variance
          to_plot:
            - { <<: *scatter_tissue }
            - { <<: *scatter_tissue__errors }
            - { <<: *scatter_tissue__treatments }
            - { <<: *scatter_tissue__errors__treatments }
        BP_explant/area_mapped/polarity_variance__vs_hex_order:
          based_on: BP_explant/area_mapped/hexatic_order
          x: hexatic_order_corrected
          y: polarity__variance
          to_plot:
            - { <<: *scatter_tissue }
            - { <<: *scatter_tissue__errors }
          helpers:
            set_labels:
              x: Hexatic order (corr.) [$\psi_6^\star$]
              y: polarity circular variance
            set_limits:
              x: [0, 1]
        BP_explant/area_mapped/polarity_variance__vs_hex_order__full:
          based_on: BP_explant/area_mapped/polarity_variance__vs_hex_order
          to_plot:
            - { <<: *scatter_tissue__full }
            - { <<: *scatter_tissue__errors }
        BP_explant/area_mapped/polarity_variance__vs_hex_order__w_treatment:
          based_on: BP_explant/area_mapped/polarity_variance__vs_hex_order
          to_plot:
            - { <<: *scatter_tissue }
            - { <<: *scatter_tissue__errors }
            - { <<: *scatter_tissue__treatments }
            - { <<: *scatter_tissue__errors__treatments }


    Increment_area:
      enabled: false

      run_dir: 220524-130244_job58109854_experiment__increment_area
      
      plots_cfg:
        area_mapped: &Increment_area__area_mapped
          based_on:
            - .plot.multiplot
            - multiverse
            - select_cells_properties_mv.map_stage
            - my_style
          enabled: false

          select_and_combine:
            allow_missing_or_failing: silent
            fields:
              _property:
                path: data/PCPTopology/Cells
                transform:
                  - .sel: [!dag_prev , {property: num_neighbors}]
                  - .rename: [!dag_prev , num_neighbors]
            subspace:
              HC_sep: &HC_SEP True
              rho: &density 0.2

          lw: *linewidth_theory

          transform:
            # a mask to select only hair / support cells
            - import_and_call:
              args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _cell_type,
                    {ids: [seed, id]}]
            - .squeeze: [!dag_prev ]
              tag: cell_type
            - create_mask: [!dag_tag cell_type, ==, 1]
              tag: _hair_cells
            - create_mask: [!dag_tag cell_type, ==, 2]
              tag: _support_cells

            # stack the seeds
            - import_and_call:
              args: 
                - model_plots.PCPTopology.data_ops
                - stack
                - !dag_tag _area
                - {ids: [seed, id]}
            - .where: [!dag_prev , !dag_tag _hair_cells]
            - .mean: [!dag_prev , ids]
              tag: HC_area    

            - import_and_call:
              args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _property,
                    {ids: [seed, id]}]
            - .assign_coords: [!dag_prev , {area: !dag_tag HC_area}]
              tag: property

            - import_and_call:
              args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
            - callattr: [!dag_prev , reset_index]
            - call_lambda:
              - "lambda data: data.sort_values(by='area')"
              - !dag_prev 
              tag: all_cells

            # the data for hair cells
            - .where: [!dag_tag property, !dag_tag _hair_cells]
              tag: hair_cells_xarray
            - import_and_call:
              args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
            - callattr: [!dag_prev , reset_index]
            - call_lambda:
              - "lambda data: data.sort_values(by='area')"
              - !dag_prev
              tag: hair_cells
            - call_lambda:
              - "lambda data: data.loc[data['Gamma'] == 0]"
              - !dag_tag hair_cells
              tag: hair_cells_hom
            - call_lambda:
              - "lambda data: data.loc[data['Gamma'] > 0]"
              - !dag_tag hair_cells
              tag: hair_cells_het

            # the data for support cells
            - .where: [!dag_tag property, !dag_tag _support_cells]
              tag: support_cells_xarray
            - import_and_call:
              args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
            - callattr: [!dag_prev , reset_index]
            - call_lambda:
              - "lambda data: data.sort_values(by='area')"
              - !dag_prev 
              tag: support_cells
            - call_lambda:
              - "lambda data: data.loc[data['Gamma'] == 0]"
              - !dag_tag support_cells
              tag: support_cells_hom
            - call_lambda:
              - "lambda data: data.loc[data['Gamma'] > 0]"
              - !dag_tag support_cells
              tag: support_cells_het

            - import_and_call:
              args: 
                - model_plots.PCPTopology.data_ops
                - read_csv
                - *BP_data_path
              tag: data_experiment

          helpers:
            set_labels:
              y: HC neighbour number
              x: Normalised HC area
            set_limits:
              x: [0., 4.]
              y: [3., 11]
            set_ticks:
              y:
                major: [4, 6, 8, 10]
                minor: [3, 5, 7, 9, 11]
            setup_figure:
              figsize: [2.75, !expr 5.9/3]
          style:
            axes.grid: false
            legend.title_fontsize: x-small
            legend.fontsize: xx-small

        area_mapped/03a__HC_neighbours:
          based_on: area_mapped

          select_and_combine:
            subspace: {Gamma: [0., *Gamma_best_fit]}

          to_plot:
            - function: sns.lineplot
              data: !dag_result hair_cells_hom
              x: area
              y: num_neighbors
              ci: sd
              color: *color_homogeneous_theory
              label: Homogeneous
            - function: sns.lineplot
              data: !dag_result hair_cells_het
              x: area
              y: num_neighbors
              ci: sd
              color: *color_heterogeneous_theory
              label: Heterogeneous
            - function: sns.scatterplot
              data: !dag_result data_experiment
              x: HC_area
              y: coordination_number
              hue: Stage
              palette: *palette_data_scatter
              style: P-D position
            - function: [matplotlib.pyplot, errorbar]
              data: !dag_result data_experiment
              x: HC_area
              y: coordination_number
              xerr: HC_area__std
              yerr: coordination_number__std
              ls: ''
              lw: 0.2
              color: black
              alpha: 0.5
              zorder: 0

        area_mapped/03b__HC_neighbours__full:
          based_on: area_mapped/03a__HC_neighbours

          to_plot:
            - function: sns.lineplot
              data: !dag_result hair_cells_hom
              x: area
              y: num_neighbors
              ci: sd
              color: *color_homogeneous_theory
              label: Homogeneous
            - function: sns.lineplot
              data: !dag_result hair_cells_het
              x: area
              y: num_neighbors
              ci: sd
              color: *color_heterogeneous_theory
              label: Heterogeneous
            - function: sns.scatterplot
              data: !dag_result data_experiment
              x: HC_area
              y: coordination_number
              hue: Stage
              palette: *palette_data_scatter
              style: P-D position
              size: S-I position
              size_order: ['Superior', 'Mid', 'Inferior']
            - function: [matplotlib.pyplot, errorbar]
              data: !dag_result data_experiment
              x: HC_area
              y: coordination_number
              xerr: HC_area__std
              yerr: coordination_number__std
              ls: ''
              lw: 0.2
              color: black
              alpha: 0.5
              zorder: 0

              
        area_mapped/05a__SC_neighbours:
          based_on: area_mapped

          to_plot:
            - function: sns.lineplot
              data: !dag_result support_cells_hom
              x: area
              y: num_neighbors
              ci: sd
              color: *color_homogeneous_theory
              label: Homogeneous
            - function: sns.lineplot
              data: !dag_result support_cells_het
              x: area
              y: num_neighbors
              ci: sd
              color: *color_heterogeneous_theory
              label: Heterogeneous
            - function: sns.scatterplot
              data: !dag_result data_experiment
              x: HC_area
              y: subordination_number
              hue: Stage
              palette: *palette_data_scatter
              style: P-D position
            - function: [matplotlib.pyplot, errorbar]
              data: !dag_result data_experiment
              x: HC_area
              y: subordination_number
              xerr: HC_area__std
              yerr: subordination_number__std
              ls: ''
              lw: 0.2
              color: black
              alpha: 0.5
              zorder: 0
          helpers:
