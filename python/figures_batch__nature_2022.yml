              - model_plots.PCPTopology.data_ops
              - read_csv
              - *BP_raw_data_path
            - call_lambda:
              - "lambda cells: cells.loc[cells['is_HC']]"
              - !dag_prev 
              tag: experiment
              # the raw experimental data

            - call_lambda:
              - "lambda cells: cells.groupby(by=['file_id']).mean()['normalized_area_cells']"
              - !dag_tag experiment
            - xr.DataArray: [!dag_prev ]
              tag: reference__BP_explants

            # the map
            - import_and_call:
              - model_plots.PCPTopology.data_ops
              - map_directional_time
              - !dag_tag _area
            - .squeeze: [!dag_prev ]
            - .dropna: [!dag_prev , time, all]
            - import_and_call:
              - model_plots.PCPTopology.data_ops
              - stack
              - !dag_prev
              - {frames: [seed, time]}
            - .dropna: [!dag_prev , frames]
              tag: mapper

            # The data 
            - import_and_call:
              - model_plots.PCPTopology.data_ops
              - map_directional_time
              # - !dag_prev
              - !dag_tag _property
            - .squeeze: [!dag_prev ]
            - .dropna: [!dag_prev , time, all]
            - import_and_call:
              - model_plots.PCPTopology.data_ops
              - stack
              - !dag_prev
              - {frames: [seed, time]}
            - .dropna: [!dag_prev , frames]
              tag: property

            # assign coords from mapper
            - .assign_coords: [!dag_tag property, {area: !dag_tag mapper}]
            - .swap_dims: [!dag_prev , {frames: area}]
            - call_lambda:
              - "lambda data: data.drop_duplicates(dim='area')"
              - !dag_prev 
            - call_lambda:
              - "lambda data, by: data.sortby(by)"
              - !dag_prev
              - area
            - .drop_vars: [!dag_prev , [_time, direction, frames]]
              tag: mapped_data
            
            # interpolate coords from mapper with reference
            - call_lambda: 
              - "lambda data, **kwargs: data.interp(**kwargs)"
              - !dag_tag mapped_data
              kwargs:
                area: !dag_tag reference__BP_explants
                method: 'nearest'
              tag: nearest_data_xr
            # - import_and_call:
            #   args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
            #   tag: nearest_data

            - call_lambda:
              - "lambda cells: cells.groupby(by='file_id')['num_neighbors'].mean()"
              - !dag_tag experiment
            - xr.DataArray: [!dag_prev ]
              tag: data_experiment
            - call_lambda:
              - "lambda model, data: model - data"
              - !dag_tag nearest_data_xr
              - !dag_tag data_experiment
              tag: residuals
            - pow: [!dag_prev , 2]
              tag: squared_residuals 
            - .sum: [!dag_prev , file_id]
            - print: [!dag_prev ]
              tag: sum_squared_residuals
            - call_lambda: 
              - "lambda data: data.var() * data.count()"
              - !dag_tag data_experiment
              tag: total_sum_squared
            - call_lambda: 
              - "lambda SS_res, SS_tot: 1 - SS_res / SS_tot"
              - !dag_tag sum_squared_residuals
              - !dag_tag total_sum_squared
            - print: [!dag_prev ]
              tag: R_squared

          helpers:
            set_labels:
              x: ''
            set_ticks:
              x:
                major:
                  fontsize: *Labelsize
              y:
                major: [4, 6, 8, 10, 12]
                minor: [3, 5, 7, 9, 11]
            setup_figure:
              figsize: [!expr 5.9/3, !expr 5.9/3]

