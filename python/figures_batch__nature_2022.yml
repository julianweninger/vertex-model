        cell_segmentation__polarity__snapshot:
          based_on:
            - cellular_structure
            - my_style

          universes: 
            seed: 0
            curvature: 0.
            pMLC: [-0.1]
            ppMLC: [0.4]

          property_resolution: [2048, 2048]

          select:
            property:
              path: data/PCPTopology/Cells
              transform:
                - .sel: [!dag_node -1, {property: polarity}]
                - call_lambda:
                  - "lambda data: (data <= math.pi / 4) | (data > 7 * math.pi / 4)"
                  - !dag_node -1
                - call_lambda:
                  - "lambda data: (data > math.pi / 4) & (data <= 3 * math.pi / 4)"
                  - !dag_node -2
                - call_lambda:
                  - "lambda data: (data > 3 * math.pi / 4) & (data <= 5 * math.pi / 4)"
                  - !dag_node -3
                - call_lambda:
                  - "lambda data: (data > 5 * math.pi / 4) & (data <= 7 * math.pi / 4)"
                  - !dag_node -4
                - call_lambda: 
                  - "lambda q0, q1, q2, q3: xr.where(q0, -0.75, xr.where(q1, 0.75, xr.where(q2, -1, 1)))"
                  - !dag_node -4
                  - !dag_node -3
                  - !dag_node -2
                  - !dag_node -1
                - .sel: [!dag_node -7, {property: cell_type}]
                - call_lambda:
                  - "lambda d, type: d.where(type==1)"
                  - !dag_node -2
                  - !dag_node -1
                - .sel: [!dag_node -9, {property: is_boundary}]
                - call_lambda:
                  - "lambda d, boundary: d.where(boundary==0)"
                  - !dag_node -2
                  - !dag_node -1
                - .rename: [!dag_prev , Polarity]
            vector_property:
              path: data/PCPTopology/Cells
              transform:
                - .sel: [!dag_prev , {property: polarity}]
                - .sel: [!dag_node -2, {property: cell_type}]
                - call_lambda:
                  - "lambda d, type: d.where(type==1)"
                  - !dag_node -2
                  - !dag_node -1
                - .rename: [!dag_prev , Polarity]
            edge_property:
              path: data/PCPTopology/Edges
              transform:
                - call_lambda:
                  - "lambda d: d.sel(property='contractility_pMLC')"
                  - !dag_node -1
                - call_lambda:
                  - "lambda d: (d - d.min()) / np.abs(d.max() - d.min() + 1.e-8)"
                  # - "lambda d: np.abs(d) / np.abs(d).max()"
                  - !dag_prev
                - call_lambda:
                  - "lambda d: d.sel(property='contractility_ppMLC')"
                  - !dag_node -3
                - call_lambda:
                  - "lambda d: (d - d.min()) / np.abs(d.max() - d.min() + 1.e-8)"
                  # - "lambda d: np.abs(d) / np.abs(d).max()"
                  - !dag_prev
                - call_lambda:
                  - "lambda pMLC, ppMLC: pMLC + ppMLC - 1."
                  - !dag_node -3
                  - !dag_node -1
                - .rename: [!dag_prev , Asymmetric contractility]
          
          plot_vertices: false
          cell_center_marker_kwargs:
            s: 0
            colors: ['white', 'white', 'white']

          property_interpolation_plot_kwargs:
            interpolation: nearest
            # vmin: 0.
            # vmax: !expr 2 * 3.1416
            cmap: brg

          vector_property_kwargs:
            scale: 2.
            width: 0.01
            headlength: 2.5
            headwidth: 2.5
          #   headaxislength: 2.5

          quiver_kwargs:
            cmap: RdBu
            width: 0.005
            clim: [-1., 1.]
          
          set_limits:
            x: [0, 10]
            y: [0, 10]

          select_times: [100]

          animation:
            writer: frames
            writer_kwargs:
              ffmpeg:
                init:
                  fps: 10
                saving:
                  dpi: 300
              frames:
                saving:
                  dpi: 900
          
          helpers:
            setup_figure:
              figsize: [3.5, 2]

        cell_segmentation__polarity__curved__snapshot:
          based_on: cell_segmentation__polarity__snapshot
          universes:
            curvature: 0.06

          select:
            vector_property:
              path: data/PCPTopology/Cells
              transform:
                - .sel: [!dag_node -1, {property: x}]
                - .sel: [!dag_node -2, {property: y}]
                - call_lambda:
                  - "lambda x, y: np.arctan2(x, y+1/0.06)"
                  - !dag_node -2
                  - !dag_node -1
                - .sel: [!dag_node -4, {property: polarity}]
                - sub: [!dag_node -1, !dag_node -2]
                - .sel: [!dag_node -6, {property: cell_type}]
                - call_lambda:
                  - "lambda d, type: d.where(type==1)"
                  - !dag_node -2
                  - !dag_node -1
                - .sel: [!dag_node -8, {property: is_boundary}]
                - call_lambda:
                  - "lambda d, boundary: d.where(boundary==0)"
                  - !dag_node -2
                  - !dag_node -1
                - .rename: [!dag_prev , Polarity]
          
          set_limits:
            x: [0, 12.5]
            y: [0, 10]

        cell_segmentation__polarity:
          based_on: cell_segmentation__polarity__snapshot
          file_ext: png

          # select_times: [100]
          select_times: ~
          set_limits: ~

          quiver_kwargs:
