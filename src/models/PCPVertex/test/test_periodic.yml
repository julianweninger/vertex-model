---
PCPVertex: 
  periodic_bc: true
  
  dt: 0.01
  
  linetension: 0.1
  length_threshold: 0.05

  area_elasticity: 1.0
  area_preferential: 1.0
  area_threshold: 0.2

  hexagon_size: 0.62
  lattice_columns: 4
  lattice_rows: 4

  data_manager:
    # this builds the deciders
    deciders:
      write_always:
        type: always

    # this builds the triggers, here deciders are used
    triggers:
      build_once:
        type: once
        args:
          time: 0

    tasks:
      Time:
        active: true
        decider: write_always
        trigger: build_once

log_levels: {core: warning, data_io: warning, data_mngr: warning, model: debug}
monitor_emit_interval: 2.0
num_steps: 1000
output_path: test_data.h5
seed: 42
write_every: 25
write_start: 0