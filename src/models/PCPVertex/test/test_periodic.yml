---
PCPVertex: 
  periodic_bc: true
  
  dt: 0.001
  
  linetension:
    progenitor_progenitor: 1.
    progenitor_hair: 1.
    progenitor_support: 1.
    hair_hair: 1.
    hair_support: 1.
    support_support: 1.
  
  length_threshold: 0.1

  area_elasticity: 100.
  area_preferential:
    progenitor: 1.
    hair: 1.
    support: 1.
  area_threshold: 0.2

  # Contractility of perimeter
  contractility: 0.

  # Polarity interaction
  gamma: 0.
  cell_cell_polarity_interaction: 0.
  cell_polarity_exclusion: 0.
  cell_initialisation_protein_level: 0.

  hexagon_size: 0.62
  lattice_columns: 4
  lattice_rows: 4
  
  noise_constant: 0.0
  noise_linear: 0.0
  
  energy_change_history_length: 10

  data_manager:
    # this builds the deciders
    deciders:
      write_always:
        type: always

    # this builds the triggers, here deciders are used
    triggers:
      build_once:
        type: once
        args:
          time: 0

    tasks:
      Energy_time:
        active: true
        decider: write_always
        trigger: build_once

log_levels: {core: warning, data_io: warning, data_mngr: warning, model: debug}
monitor_emit_interval: 2.0
num_steps: 1000
output_path: test_data.h5
seed: 42
write_every: 25
write_start: 0