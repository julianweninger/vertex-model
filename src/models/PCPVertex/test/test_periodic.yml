---
PCPVertex:
  space:
    extent: [1., 1.]
    periodic: true

  agent_manager:
    setup_method: hexagonal
    setup_params:
      hexagonal:
        hexagon_size: 0.62
        lattice_rows: 8
        lattice_columns: 8
    vertex_manager:
      non_periodic_offset: [1, 1]

    edge_manager:
      agent_params:
        linetension: 0.1
        contractility: 0.02

    cell_manager:
      agent_params:
        area_preferential: 1.
        contractility: 0.02
        cell_type: progenitor

  initial_jiggle: 0.05

  # --- Dynamics
  # damping factor
  dt: 0.01
  update_scheme: steepest_gradient

  area_elasticity: 1.

  # Polarity interaction
  gamma: 0.
  cell_cell_polarity_interaction: 0.
  cell_polarity_exclusion: 0.
  cell_initialisation_protein_level: 0.

  T1_threshold: 0.1
  T1_probability: 0.05
  T1_barrier: 0.02
  T2_threshold: 0.075

  data_manager:
    # this builds the deciders
    deciders:
      write_always:
        type: always

    # this builds the triggers, here deciders are used
    triggers:
      build_once:
        type: once
        args:
          time: 0

    tasks:
      Energy_time:
        active: true
        decider: write_always
        trigger: build_once

log_levels: {core: warning, data_io: warning, data_mngr: warning, model: debug}
monitor_emit_interval: 2.0
num_steps: 2000
output_path: test_data.h5
seed: 42
