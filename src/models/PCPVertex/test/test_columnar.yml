---
PCPVertex:
  work_function_terms:
  - linetension:
      linetension: 0.1
  - edge_contractility:
      contractility: 0.01
  - area_elasticity:
      elastic_modulus: 1
      preferential_area: 1
  - cell_contractility:
      contractility: 1.
      preferential_perimeter: 4.
  T1_barrier: 0.02
  T1_probability: 1.0
  T1_separation_factor: 1.05
  T1_threshold: 0.03
  T2_threshold: 0.0075
  agent_manager:
    cell_manager:
      agent_params: {type: 0}
    edge_manager:
      agent_params: {}
    setup_method: column
    setup_params:
      hexagonal: {hexagon_size: 0.6204, hexagon_shape: pointy, lattice_columns: 8, lattice_rows: 8}
      single: {size: 0.62}
      column: {size: 1., height: 1., num_cells: 4, offset: 1.}
    vertex_manager: ~
  boundary_parameter:
    area_elasticity: 0.2
    area_preferential: 1.
    contractility: 0.2
    shape_index_preferential: 3.62
  data_manager:
    deciders:
      write_always: {type: always}
    tasks:
      Energy_time: {active: false, decider: write_always, trigger: build_once}
    triggers:
      build_once:
        args: {time: 0}
        type: once
  minimization: &Minimization
    update_scheme: steepest_gradient
    dt: 0.001
    jiggle_intensity: 0.01
    jiggle_tolerance: 1e-06
    max_steps: 15000
    num_repeat: 5
    tolerance: 1e-08
  initial_jiggle: 0.00001
  space:
    extent: [1.0, 1.0]
    periodic: false
  Energy_buffer_size: 20
  log_level: trace
log_levels: {core: debug, data_io: debug, data_mngr: debug, model: debug}
monitor_emit_interval: 2.0
num_steps: 0
output_path: test_data.h5
seed: 42
write_every: 1
write_start: 0

