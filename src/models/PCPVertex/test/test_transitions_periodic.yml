---
PCPVertex:
  T1_barrier: 1000.
  T1_probability: 1.
  T1_threshold: 0.3
  T2_threshold: 0.4
  T1_separation_factor: 1.05
  agent_manager:
    log_level: trace
    cell_manager:
      agent_params:
        area_preferential: 1.0
        shape_index_preferential: 3.6
        contractility: 0.02
        cell_type: progenitor
    edge_manager:
      agent_params: {contractility: 0.0, linetension: 0.}
    setup_method: hexagonal
    setup_params:
      hexagonal: {hexagon_size: 0.6204032394013997, lattice_columns: 4, lattice_rows: 4}
      single: {size: 0.6204032394013997}
      column: {size: 1., height: 1., num_cells: 4, offset: 1.}
    vertex_manager: ~
  area_elasticity: 1.0
  boundary_parameter:
    area_elasticity: 0.
    area_preferential: 1.
    contractility: 0.
    shape_index_preferential: 3.62
  cell_shape_implementation: contractile
  data_manager:
    deciders:
      write_always: {type: always}
    tasks:
      Energy_time: {active: false, decider: write_always, trigger: build_once}
    triggers:
      build_once:
        args: {time: 0}
        type: once
  minimization: &Minimization
    update_scheme: steepest_gradient
    dt: 0.01
    jiggle_intensity: 0.01
    jiggle_tolerance: 1e-06
    max_steps: 15000
    num_repeat: 5
    tolerance: 1e-08
  initial_jiggle: 0.05
  space:
    extent: [1.0, 1.0]
    periodic: true
log_levels: {core: debug, data_io: debug, data_mngr: debug, model: debug}
monitor_emit_interval: 2.0
num_steps: 0
output_path: test_data.h5
seed: 42
write_every: 1
write_start: 0

