---
perform_sweep: true

paths:
  model_note: default_stripe_boundary_condition

parameter_space:
  num_steps: 10000

  PCPVertex:
    space:
      periodic: false
    log_level: warning

    work_function_terms:
      - linetension_heterotypic:
          linetension: 
          - [0., 0.01]
          - [0.01, 0.]
          boundary_type: 1
      - area_elasticity:
          elastic_modulus: 1
          preferential_area: 1
      - shape_elasticity:
          elastic_modulus: 1.
          preferential_shape_index: 3.72
          
      - linetension_fluctuations:
          amplitude: 0.05
          timescale: 50

      - boundary_stripe_potential:
          elastic_constant: 10.
          height: 6.
          width: !expr 128 / 6.
          curvature: !sweep
            name: curvature
            default: 0.
            values:
              - 0.
              - 4.5e-2
          origin: [0, 0]
          deform_plastic: true
          stretch: true

    agent_manager:
      setup_method: hexagonal
      setup_params:
        hexagonal:
          lattice_rows: 8
          lattice_columns: 16

    data_manager:  
      deciders:
        write_interval: &interval
          args:
            intervals:
              - [0, 1000000, 250]
      triggers:
        build_interval: *interval
  