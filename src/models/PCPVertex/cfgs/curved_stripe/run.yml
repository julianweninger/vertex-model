---
paths:
  model_note: default_stripe_boundary_condition

parameter_space:
  num_steps: 1000

  PCPVertex:
    space:
      periodic: false
    log_level: warning

    work_function_terms:
      - linetension_heterotypic:
          linetension: 
          - [0., 0.01]
          - [0.01, 0.]
          boundary_type: 1
      - boundary_curved_stripe_potential:
          elastic_constant: 1
          height: 6.
          width: !expr 2 * 64 / 6.
          curvature: 1.5e-1
          origin: [-2, 0]
          deform_plastic: true

      - area_elasticity:
          elastic_modulus: 1
          preferential_area: 1
      - shape_elasticity:
          elastic_modulus: 1.
          preferential_shape_index: 3.72
          
      - linetension_fluctuations:
          amplitude: 0.02
          timescale: 50

    agent_manager:
      setup_method: hexagonal
      setup_params:
        hexagonal:
          lattice_rows: 8
          lattice_columns: 16
  