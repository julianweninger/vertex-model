# Base plot configuration for this model
#
# The configurations given here can be used in the <model_name>_plots.yml file
---
universe:
  based_on:
    - .defaults.style
    - .creator.universe.all
  file_ext: png

multiverse:
  creator: multiverse
  file_ext: png


select.uni.energy_terms:
  select:
    total: 
      path: data/PCPVertex/Energy/Total
      transform: &transform_energy_to_dataframe
        - .rename: [!dag_prev , energy]
        - import_and_call:
          args: [model_plots.PCPVertex.data_ops, to_dataframe, !dag_prev ]
    line_tension: 
      path: data/PCPVertex/Energy/Linetension
      transform: *transform_energy_to_dataframe
    area_elasticity: 
      path: data/PCPVertex/Energy/Areaelasticity
      transform: *transform_energy_to_dataframe
    cell_contractility: 
      path: data/PCPVertex/Energy/Cell_contractility
      transform: *transform_energy_to_dataframe
    edge_contractility: 
      path: data/PCPVertex/Energy/Edge_contractility
      transform: *transform_energy_to_dataframe
    boundary_area_elasticity: 
      path: data/PCPVertex/Energy/Boundary_area_elasticity
      transform: *transform_energy_to_dataframe
    boundary_shape_elasticity: 
      path: data/PCPVertex/Energy/Boundary_shape_elasticity
      transform: *transform_energy_to_dataframe

_energy:
  based_on:
    - .plot.multiplot

  x: time
  y: energy

  helpers:
    set_labels:
      x: time
      y: energy [a.u.]
      
energy:
  based_on:
    - universe
    - _energy
    - select.uni.energy_terms

  to_plot:
  - function: sns.lineplot
    data: !dag_result total
    label: total
  - function: sns.lineplot
    data: !dag_result line_tension
    label: line tension
  - function: sns.lineplot
    data: !dag_result area_elasticity
    label: area elasticity
  - function: sns.lineplot
    data: !dag_result cell_contractility
    label: cell contractility
  - function: sns.lineplot
    data: !dag_result edge_contractility
    label: edge contractility
    
energy_boundary:
  based_on:
    - universe
    - _energy
    - select.uni.energy_terms

  to_plot:
    - function: sns.lineplot
      data: !dag_result total
      label: total
    - function: sns.lineplot
      data: !dag_result line_tension
      label: line tension
    - function: sns.lineplot
      data: !dag_result area_elasticity
      label: area elasticity
    - function: sns.lineplot
      data: !dag_result cell_contractility
      label: cell contractility
    - function: sns.lineplot
      data: !dag_result edge_contractility
      label: edge contractility
    - function: sns.lineplot
      data: !dag_result boundary_area_elasticity
      label: boundary area elasticity
    - function: sns.lineplot
      data: !dag_result boundary_shape_elasticity
      label: boundary shape elasticity

transitions:
  based_on:
    - universe

  model_name: PCPVertex
  module: model_plots.PCPVertex
  plot_func: transitions



select_cells_properties:
  select:
    # NOTE the order in which datasets are created is alphabetically!
    #      (underscores) `_` are treated first

    # the data containing all cells
    _cells: data/PCPVertex/Cells
    
    # a mask to select only bulk cells
    _is_bulk:
      path: data/PCPVertex/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: is_boundary
        - .rename:
          args: [!dag_prev , is_bulk]
        - create_mask:
          args: [!dag_prev , <, 0.5] # not boundary

    # the type of the cells
    __cell_type:
      path: data/PCPVertex/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: cell_type
        - .rename:
          args: [!dag_prev , cell_types]

    # a mask to select only hair cells
    _hair_cells:
      path: data/PCPVertex/Cells
      transform:
        - create_mask:
          args: [!dag_tag __cell_type, ==, 1]
    
    # a mask to select only support cells
    _support_cells:
      path: data/PCPVertex/Cells
      transform:
        - create_mask:
          args: [!dag_tag __cell_type, ==, 2]
    
    
  transform:
    # the data for all cells
    - import_and_call:
      args: [model_plots.PCPVertex.data_ops, to_dataframe, !dag_tag property]
      tag: all_cells

    # the data for hair cells
    - .where: [!dag_tag property, !dag_tag _hair_cells]
      tag: hair_cells_xarray
    - import_and_call:
      args: [model_plots.PCPVertex.data_ops, to_dataframe, !dag_prev ]
      tag: hair_cells

    # the data for support cells
    - .where: [!dag_tag property, !dag_tag _support_cells]
      tag: support_cells_xarray
    - import_and_call:
      args: [model_plots.PCPVertex.data_ops, to_dataframe, !dag_prev ]
      tag: support_cells

    # the data for bulk cells
    - .where: [!dag_tag property, !dag_tag _is_bulk]
    - import_and_call:
      args: [model_plots.PCPVertex.data_ops, to_dataframe, !dag_prev ]
      tag: all_cells_bulk
    
    - .where: [!dag_tag hair_cells_xarray, !dag_tag _is_bulk]
    - import_and_call:
      args: [model_plots.PCPVertex.data_ops, to_dataframe, !dag_prev ]
      tag: hair_cells_bulk
    
    - .where: [!dag_tag support_cells_xarray, !dag_tag _is_bulk]
    - import_and_call:
      args: [model_plots.PCPVertex.data_ops, to_dataframe, !dag_prev ]
      tag: support_cells_bulk
      

cellular_structure:
  based_on:
    - universe
  module: model_plots.PCPVertex
  plot_func: cellular_structure
  
  datapath: PCPVertex
  cfgpath: PCPVertex

  plot_vertices: false
  cell_marker_size: 40

  helpers:
    set_labels:
      x: x [a.u.]
      y: y [a.u.]
    save_figure: {bbox_inches: tight}

  animation:
    enabled: true
    writer: frames
    writer_kwargs:
      ffmpeg:
        init:
          fps: 10
        saving:
          dpi: 300
      frames:
        saving:
          dpi: 300

    animation_update_kwargs: {}

  # Can use constrained layout, because axis labels don't change
  style:
    figure.constrained_layout.use: true
    axes.grid: false
