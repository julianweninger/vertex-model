# Base plot configuration for this model
#
# The configurations given here can be used in the <model_name>_plots.yml file
---
universe:
  based_on:
    - .defaults.style
    - .creator.universe.all
  file_ext: png

multiverse:
  creator: multiverse
  file_ext: png


select.uni.energy_terms:
  select:
    energy: 
      path: data/PCPVertex/Energy/Terms
      transform:
        - .rename: [!dag_prev , energy]
        - import_and_call:
          args: [model_plots.PCPVertex.data_ops, to_dataframe, !dag_prev ]

_energy:
  based_on:
    - .plot.multiplot

  x: time
  y: energy
  hue: term

  helpers:
    set_labels:
      x: time
      y: energy [a.u.]
      
energy:
  based_on:
    - universe
    - _energy
    - select.uni.energy_terms

  to_plot:
  - function: sns.lineplot
    data: !dag_result energy

select.uni.transitions:
  select:
    transitions: 
      path: data/PCPVertex/Energy/Transitions
      transform:
        - .rename: [!dag_prev , transitions]
        - import_and_call:
          args: [model_plots.PCPVertex.data_ops, to_dataframe, !dag_prev ]
          
transitions:
  based_on:
    - universe
    - .plot.multiplot
    - select.uni.energy_terms

  select:
    transitions: 
      path: data/PCPVertex/Energy/Transitions
      transform:
        - .rename: [!dag_prev , transitions]
        - import_and_call:
          args: [model_plots.PCPVertex.data_ops, to_dataframe, !dag_prev ]

  x: time

  to_plot:
    [0, 0]:
    - function: sns.lineplot
      data: !dag_result energy
      hue: term
      y: energy

    [1, 0]:
    - function: sns.lineplot
      data: !dag_result transitions
      y: transitions
      hue: type
      hue_order: [num_T1s, num_T1s_attempted, num_T2s]

  helpers:
    setup_figure:
      ncols: 2
      constrained_layout: True
    set_labels:
      x: time



select_cells_properties:
  select:
    # NOTE the order in which datasets are created is alphabetically!
    #      (underscores) `_` are treated first

    # the data containing all cells
    _cells: data/PCPVertex/Cells
    
    # a mask to select only bulk cells
    _is_bulk:
      path: data/PCPVertex/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: is_boundary
        - .rename:
          args: [!dag_prev , is_bulk]
        - create_mask:
          args: [!dag_prev , <, 0.5] # not boundary

    # the type of the cells
    __cell_type:
      path: data/PCPVertex/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: cell_type
        - .rename:
          args: [!dag_prev , cell_types]

    # a mask to select only hair cells
    _hair_cells:
      path: data/PCPVertex/Cells
      transform:
        - create_mask:
          args: [!dag_tag __cell_type, ==, 1]
    
    # a mask to select only support cells
    _support_cells:
      path: data/PCPVertex/Cells
      transform:
        - create_mask:
          args: [!dag_tag __cell_type, ==, 2]
    
    
  transform:
    # the data for all cells
    - .dropna: [!dag_tag property, id]
    - import_and_call:
      args: [model_plots.PCPVertex.data_ops, to_dataframe, !dag_prev ]
      tag: all_cells

    # the data for hair cells
    - .where: [!dag_tag property, !dag_tag _hair_cells]
    - .dropna: [!dag_prev , id]
      tag: hair_cells_xarray
    - import_and_call:
      args: [model_plots.PCPVertex.data_ops, to_dataframe, !dag_prev ]
      tag: hair_cells

    # the data for support cells
    - .where: [!dag_tag property, !dag_tag _support_cells]
    - .dropna: [!dag_prev , id]
      tag: support_cells_xarray
    - import_and_call:
      args: [model_plots.PCPVertex.data_ops, to_dataframe, !dag_prev ]
      tag: support_cells

    # the data for bulk cells
    - .where: [!dag_tag property, !dag_tag _is_bulk]
    - .dropna: [!dag_prev , id]
    - import_and_call:
      args: [model_plots.PCPVertex.data_ops, to_dataframe, !dag_prev ]
      tag: all_cells_bulk
    
    - .where: [!dag_tag hair_cells_xarray, !dag_tag _is_bulk]
    - .dropna: [!dag_prev , id]
    - import_and_call:
      args: [model_plots.PCPVertex.data_ops, to_dataframe, !dag_prev ]
      tag: hair_cells_bulk
    
    - .where: [!dag_tag support_cells_xarray, !dag_tag _is_bulk]
    - .dropna: [!dag_prev , id]
    - import_and_call:
      args: [model_plots.PCPVertex.data_ops, to_dataframe, !dag_prev ]
      tag: support_cells_bulk
      

cellular_structure:
  based_on: universe

  module: model_plots.PCPVertex
  plot_func: cellular_structure

  select:
    Vertices:
      path: data/PCPVertex/Vertices
      transform:
        - call_lambda:
          - "lambda data: xr.concat([data[t].sel(property=['x', 'y']) for t in data], dim='time')"
          - !dag_prev
        - call_lambda:
          - "lambda data, time_series: data.assign_coords(time=[int(t) for t in time_series])"
          - !dag_node -1
          - !dag_node -2
    Edges:
      path: data/PCPVertex/Edges
      transform:
        - call_lambda:
          - "lambda data: xr.concat([data[t].sel(property=['vertex_a', 'vertex_b']) for t in data], dim='time')"
          - !dag_prev
        - call_lambda:
          - "lambda data, time_series: data.assign_coords(time=[int(t) for t in time_series])"
          - !dag_node -1
          - !dag_node -2
    Cells:
      path: data/PCPVertex/Cells
      transform:
        - call_lambda:
          - "lambda data: xr.concat([data[t].sel(property=['x', 'y', 'cell_type']) for t in data], dim='time')"
          - !dag_prev
        - call_lambda:
          - "lambda data, time_series: data.assign_coords(time=[int(t) for t in time_series])"
          - !dag_node -1
          - !dag_node -2

    periodic: 
      path: cfg/PCPVertex
      transform:
        - call_lambda:
          - "lambda kv: kv['space']['periodic']"
          - !dag_prev
    Lx:
      path: data/PCPVertex/Vertices
      transform:
      - call_lambda:
        - "lambda d: xr.DataArray([d[t].attrs['Lx'][0] for t in d], dims=['time'], coords=dict(time=[int(t) for t in d]))"
        - !dag_prev
    Ly:
      path: data/PCPVertex/Vertices
      transform:
      - call_lambda:
        - "lambda d: xr.DataArray([d[t].attrs['Ly'][0] for t in d], dims=['time'], coords=dict(time=[int(t) for t in d]))"
        - !dag_prev

  plot_vertices: false
  cell_center_marker_kwargs:
    s: 0.5
    colors: ['white', 'r', 'gray']

  property_interpolation_kwargs:
    method: nearest
  property_interpolation_plot_kwargs: ~
  
  vector_property_is_nematic: False
  vector_property_kwargs:
    scale: 1
    headlength: 2.5
    # headwidth: 3
    headaxislength: 2.5

  quiver_kwargs:
    cmap: Blues

  file_ext: png
  animation:
    enabled: true
    writer: frames
    writer_kwargs:
      ffmpeg:
        init:
          fps: 10
        saving:
          dpi: 300
      frames:
        saving:
          dpi: 300

    animation_update_kwargs: {}

  helpers:
    save_figure: {bbox_inches: tight}

  # Can use constrained layout, because axis labels don't change
  style:
    figure.constrained_layout.use: true
    axes.grid: false

