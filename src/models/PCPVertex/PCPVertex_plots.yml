# The default plots of this model
#
# These can use the `based_on` feature with configurations specified in the
# accompanying *_base_plots.yml file and in the utopya base plot configs.
---
forces:
  based_on: .basic_uni.lineplots
  model_name: PCPVertex
  file_ext: png

  to_plot: 
    forces:
      label: forces_2

  helpers:
    set_labels:
      x: time
      y: force^2
    set_limits:
      x: 
        lower: 1.
        upper: max
        
cellular_structure:
  creator: universe
  universes: all
  module: model_plots.PCPVertex
  plot_func: cellular_structure
  file_ext: png

  helpers:
    set_labels:
      x: x [a.u.]
      y: y [a.u.]
    set_limits:
      x: [0, 500]
      y: [0, 500]

  animation:
    enabled: true
    writer: frames
    writer_kwargs:
      ffmpeg:
        init:
          fps: 10
        saving:
          dpi: 300
      frames:
        saving:
          dpi: 300

    animation_update_kwargs:  {}
