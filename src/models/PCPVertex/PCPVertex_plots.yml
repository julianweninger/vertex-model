# The default plots of this model
#
# These can use the `based_on` feature with configurations specified in the
# accompanying *_base_plots.yml file and in the utopya base plot configs.
---
energy:
  based_on: energy

  to_plot:
    Energy/Total:
      label: TOTAL
    Energy/Linetension:
      label: line-tension
    Energy/Areaelasticity:
      label: area-elasticity
    Energy/Cell_contractility:
      label: cell contractility
    Energy/Edge_contractility:
      label: edge contractility
    # Energy/Cell_cell_polarity: 
    #   label: cell-cell-polarity
    # Energy/Polarity_exclusion: 
    #   label: polarity-exclusion
    # Energy/Lagrange_net_polarisation: 
    #   label: lagrange-net-polarisation
    # Energy/Lagrange_const_concentration: 
    #   label: lagrange-const-concentration

energy_mechanics:
  based_on: energy
  enabled: false

  to_plot:
    Energy/Total:
      label: TOTAL
    Energy/Linetension:
      label: line-tension
    Energy/Areaelasticity:
      label: area-elasticity
    Energy/Cell_contractility:
      label: cell contractility
    Energy/Edge_contractility:
      label: edge contractility

energy_boundary:
  based_on: energy

  to_plot:
    Energy/Boundary_area_elasticity: 
      label: cell-cell-polarity
    Energy/Boundary_shape_elasticity: 
      label: polarity-exclusion

energy_polarity:
  based_on: energy
  enabled: false

  to_plot:
    Energy/Cell_cell_polarity: 
      label: cell-cell-polarity
    Energy/Polarity_exclusion: 
      label: polarity-exclusion
    Energy/Lagrange_net_polarisation: 
      label: lagrange-net-polarisation
    Energy/Lagrange_const_concentration: 
      label: lagrange-const-concentration

transitions:
  based_on: transitions


cell_area: &CELLAREA
  based_on:
    - .default_style_and_helpers
    - cell_property

  to_plot: 
    data:
      label: all cells

  select:
    _property:
      path: data/PCPVertex/Cells
      transform:
      - .sel:
        args: [!dag_tag _cells]
        kwargs:
          property: area

  helpers:
    set_labels:
      x: time
      y: average area

cell_pref_area:
  <<: *CELLAREA

  select:
    _property:
      path: data/PCPVertex/Cells
      transform:
      - .sel:
        args: [!dag_tag _cells]
        kwargs:
          property: area_preferential

  helpers:
    set_labels:
      x: time
      y: average pref. area

cell_shape:
  <<: *CELLAREA

  select:
    _property:
      path: data/PCPVertex/Cells
      transform:
      - .sel:
        args: [!dag_tag _cells]
        kwargs:
          property: shape_index

  helpers:
    set_labels:
      x: time
      y: average shape index

cellular_structure:
  based_on:
    - .default_style_and_helpers
    - cellular_structure
