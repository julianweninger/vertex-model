# The default plots of this model
#
# These can use the `based_on` feature with configurations specified in the
# accompanying *_base_plots.yml file and in the utopya base plot configs.
---
energy:
  based_on: energy

  to_plot:
    Energy/Total:
      label: TOTAL
    Energy/Linetension:
      label: line-tension
    Energy/Areaelasticity:
      label: area-elasticity
    Energy/Cell_contractility:
      label: cell contractility
    Energy/Edge_contractility:
      label: edge contractility

energy_mechanics:
  based_on: energy
  enabled: false

  to_plot:
    Energy/Total:
      label: TOTAL
    Energy/Linetension:
      label: line-tension
    Energy/Areaelasticity:
      label: area-elasticity
    Energy/Cell_contractility:
      label: cell contractility
    Energy/Edge_contractility:
      label: edge contractility

energy_boundary:
  based_on: energy

  to_plot:
    Energy/Boundary_area_elasticity: 
      label: area elasticity (boundary)
    Energy/Boundary_shape_elasticity: 
      label: shape elasticity (boundary)

transitions:
  based_on: transitions


cell_area:
  based_on:
    - .default_style_and_helpers
    - cell_property
  to_plot: 
    cells:
      label: all cells
  
  property: area

  helpers:
    set_labels:
      x: time
      y: average area

cell_pref_area:
  based_on: cell_area
  
  property: area_preferential

  helpers:
    set_labels:
      x: time
      y: average pref. area

cell_shape:
  based_on: cell_area

  property: shape_index

  helpers:
    set_labels:
      x: time
      y: average shape index

cellular_structure:
  based_on:
    - .default_style_and_helpers
    - cellular_structure
