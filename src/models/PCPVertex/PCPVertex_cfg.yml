# The model configuration for the PCPVertex model
#
# This file should ONLY contain model-specific configuration and needs to be
# written such that it can be used by _every_ model instance, regardless
# of the level within a model hierarchy.
# 
# To that end, it needs to specify the parameters at the level of the instance
# of a Model class.
# 
# This file is usually handled by the frontend: usage of advanced yaml features
# like anchors and tags is supported.
# 
# Note, however, that this file should hold the _default_ values for a single
# instance. Therefore, parameter sweeps should not be specified here!
# Furthermore, if including other models' parameters via the `!model` tag, make
# sure that no circular includes occur.
---
# --- Space
# The physical space this model is embedded in
space:
  extent: [1., 1.]
  periodic: true

# --- Initialization parameters
agent_manager:
  setup_method: hexagonal
  setup_params:
    single:
      size: 0.62
    hexagonal:
      hexagon_size: 0.62
      lattice_rows: 8
      lattice_columns: 8
  vertex_manager:
    non_periodic_offset: [1, 1]

  edge_manager:
    agent_params:
      linetension: 0.1
      contractility: 0.02

  cell_manager:
    agent_params:
      area_preferential: 1.
      area_preferential_var: 0.
      shape_index_preferential: 3.6
      contractility: 0.
      cell_type: progenitor

initial_jiggle: 0.05

# --- Dynamics
# damping factor
dt: 0.01                      # only used with fixed step size
minimization_tolerance: 1e-8  # only used with adaptive steps size
update_scheme: steepest_gradient
# can be steepest_gradient, steepest_gradient_adaptive, conjugate_gradient

area_elasticity: 1.

# Polarity interaction
gamma: 0.
cell_cell_polarity_interaction: 0.
cell_polarity_exclusion: 0.
cell_initialisation_protein_level: 0.

T1_threshold: 0.03
T1_separation_factor: 3
T1_probability: 1.
T1_barrier: 0.02
T2_threshold: 0.0075

# --- Data manager
data_manager:
  # this builds the deciders
  deciders:
    write_always:
      type: always
    
    write_interval: &interval
      type: interval
      args:
        intervals:
          - [0, 1000000, 1]

    write_at_last:
      type: once
      args: 
        time: 3000

  # this builds the triggers, here deciders are used
  triggers:
    build_interval: *interval

    build_once:
      type: once
      args:
        time: 0
    
    build_once_at_1:
      type: once
      args:
        time: 1
    
    build_always:
      type: always

    build_at_last:
      type: once
      args: 
        time: 1000000
  
  # these are the datasets written
  tasks:
    Energy_total: &energy
      active: true
      trigger: build_once
      decider: write_always
    Energy_linetension: *energy
    Energy_areaelasticity: *energy
    Energy_contractility: *energy
    Energy_time: *energy

    # The polarity energies
    Energy_cell_cell_polarity: 
      <<: *energy
      active: false
    Energy_polarity_exclusion: 
      <<: *energy
      active: false
    Energy_lagrange_net_polarisation: 
      <<: *energy
      active: false
    Energy_lagrange_const_concentration: 
      <<: *energy
      active: false

    num_T1s: *energy
    num_T1s_attempted: *energy
    num_T2s: *energy
    Statistics_time: *energy

    Vertices: &agents
      active: true
      trigger: build_interval
      decider: write_interval
    Cells: *agents
    Edges: *agents

    
    

    


