# The model configuration for the PCPVertex model
#
# This file should ONLY contain model-specific configuration and needs to be
# written such that it can be used by _every_ model instance, regardless
# of the level within a model hierarchy.
# 
# To that end, it needs to specify the parameters at the level of the instance
# of a Model class.
# 
# This file is usually handled by the frontend: usage of advanced yaml features
# like anchors and tags is supported.
# 
# Note, however, that this file should hold the _default_ values for a single
# instance. Therefore, parameter sweeps should not be specified here!
# Furthermore, if including other models' parameters via the `!model` tag, make
# sure that no circular includes occur.
---
# --- Space
# The physical space this model is embedded in

# --- Initialization parameters

# space periodicity
periodic_bc: true

# damping factor
dt: 0.001

# Linetension parameter
linetension: 1.
length_threshold: 0.001

# Area elasticity parameter
area_elasticity: 100.
area_preferential: 1.
area_threshold: 0.0001

# Topology parameter
hexagon_size: 0.62
lattice_rows: 4
lattice_columns: 4

# Noise
noise_constant: 0.0
noise_linear: 0.000

# --- Dynamics
# Add parameters and their documentation here ...


# anchor for the configuration of the Times task
<<: &times
  decider: write_slice
  trigger: build_once

data_manager:
  # this builds the deciders
  deciders:
    write_always:
      type: always
    
    write_slice: &slicer
      type: slice
      args:
        start: 0
        stop: 1000000
        step: 5000

    write_at_last:
      type: once
      args: 
        time: 1000000

  # this builds the triggers, here deciders are used
  triggers:
    build_slice: *slicer

    build_once:
      type: once
      args:
        time: 0
    
    build_once_at_1:
      type: once
      args:
        time: 1
    
    build_always:
      type: always

    build_at_last:
      type: once
      args: 
        time: 1000000
    

  tasks:
    Time:
      active: true
      <<: *times

    Energy: &energy
      active: true
      trigger: build_once
      decider: write_always

    Energy_linetension: 
      <<: *energy

    Energy_areaelasticity: 
      <<: *energy

    Vertex_position:
      <<: &position
        active: true
        decider: write_slice
        trigger: build_slice

    Cell_position:
      <<: *position

    Edge_link:
      <<: *position

    
    

    


