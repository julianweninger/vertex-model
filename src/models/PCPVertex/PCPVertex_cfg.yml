# The model configuration for the PCPVertex model
#
# This file should ONLY contain model-specific configuration and needs to be
# written such that it can be used by _every_ model instance, regardless
# of the level within a model hierarchy.
# 
# To that end, it needs to specify the parameters at the level of the instance
# of a Model class.
# 
# This file is usually handled by the frontend: usage of advanced yaml features
# like anchors and tags is supported.
# 
# Note, however, that this file should hold the _default_ values for a single
# instance. Therefore, parameter sweeps should not be specified here!
# Furthermore, if including other models' parameters via the `!model` tag, make
# sure that no circular includes occur.
---
# --- Space
# The physical space this model is embedded in
space:
  extent: [1., 1.]  # NOTE this is ignored in model
  periodic: true

# --- Initialization parameters
work_function_terms:
- linetension:
    linetension: 0.1
- edge_contractility:
    contractility: 0.01
- area_elasticity:
    elastic_modulus: 1
    preferential_area: 1
- cell_contractility:
    contractility: 1.
    preferential_perimeter: 3.72

agent_manager:
  setup_method: hexagonal
  setup_params:
    single:
      size: !expr (2 / 3**1.5)**0.5
    hexagonal:
      hexagon_size: !expr (2 / 3**1.5)**0.5
      hexagon_shape: pointy_top            # NOTE either pointy_top or flat_top
      lattice_rows: 16
      lattice_columns: 16
    column:
      size: 1.
      height: 1.
      num_cells: 8
      offset: 1.
  vertex_manager: ~
  edge_manager: ~
  cell_manager:
    agent_params:
      type: 0

initial_jiggle: 1.e-1

# --- Dynamics
# damping factor
minimization:
  dt: 0.001                      # only used with fixed step size
  tolerance: 1e-8               # only used with adaptive steps size
  update_scheme: steepest_gradient
  max_steps: 10000000000000
  temperature: 0.001
# can be steepest_gradient, steepest_gradient_adaptive, conjugate_gradient

boundary_parameter:
  area_elasticity: 0.
  area_preferential: 1.
  contractility: 0.
  shape_index_preferential: 3.76

T1_threshold: 0.03
T1_separation_factor: 1.05
T1_probability: 1.
T1_barrier: 0.02
T2_threshold: 0.0075

Energy_buffer_size: 10

# --- Data manager
data_manager:
  # this builds the deciders
  deciders:
    write_always:
      type: always
    
    write_interval: &interval
      type: interval
      args:
        intervals:
          - [0, 1000000, 100]

    write_at_last:
      type: once
      args: 
        time: 3000

    write_at_equilibrium:
      type: equilibrium_decider
      
  # this builds the triggers, here deciders are used
  triggers:
    build_interval: *interval

    build_once:
      type: once
      args:
        time: 0
    
    build_once_at_1:
      type: once
      args:
        time: 1
    
    build_always:
      type: always

    build_at_last:
      type: once
      args: 
        time: 1000000
  
  # these are the datasets written
  tasks:
    Energy: &write_always
      active: true
      trigger: build_once
      decider: write_always
    Energy_time: *write_always

    Transitions: *write_always
    Interface_length: *write_always

    Vertices: &agents
      active: true
      trigger: build_interval
      decider: write_interval
    Cells: *agents
    Edges: *agents
    Cell_energies: &agent_energies
      active: false
      trigger: build_interval
      decider: write_interval
    Edge_energies: *agent_energies
    
    

    


