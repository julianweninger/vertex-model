# Base plot configuration pool for this model
#
# The configurations given here can be used in the <model_name>_plots.yml file.
---
.variables:
  base_path: &base_path data/ActiveSLS



# =============================================================================
#  ╔╦╗╔═╗╔╦╗╔═╗╦  ╔═╗╔╦╗╔═╗╔═╗
#   ║ ║╣ ║║║╠═╝║  ╠═╣ ║ ║╣ ╚═╗
#   ╩ ╚═╝╩ ╩╩  ╩═╝╩ ╩ ╩ ╚═╝╚═╝
# =============================================================================
# -- Overloads ----------------------------------------------------------------
# Overload some configs to insert model-specific settings

# Model-specific defaults
.defaults:
  based_on: 
    - .defaults
    - .hlpr.tight_layout
  file_ext: svg

  # Can define something here ...


# .. Creators .................................................................
.creator.universe:
  based_on:
    - .creator.universe
    - .defaults

  dag_options:
    select_path_prefix: *base_path

.creator.multiverse:
  based_on:
    - .creator.multiverse
    - .defaults

  select_and_combine:
    base_path: *base_path





# =============================================================================
#  ╔═╗╦  ╔═╗╔╦╗╔═╗
#  ╠═╝║  ║ ║ ║ ╚═╗
#  ╩  ╩═╝╚═╝ ╩ ╚═╝
# =============================================================================

state.base:
  based_on:
    - .plot.multiplot

  x: time


state.universe:
  based_on:
    - .creator.universe
    - state.base

  select:
    length:
      path: junction
      transform:
      - .sel: [!dag_prev , {property: [length, target_length]}]
      - .rename: [!dag_prev , length]
      - import_and_call:
        args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    tension:
      path: tension
      transform: 
      - import_and_call:
        args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    activity:
      path: activity
      transform: 
      - import_and_call:
        args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]

  to_plot:
    [0, 0]:
      - function: sns.lineplot
        data: !dag_result length
        y: length
        hue: property
    [1, 0]:
      - function: sns.lineplot
        data: !dag_result tension
        y: tension
        hue: kind
    [2, 0]:
      - function: sns.lineplot
        data: !dag_result activity
        y: activity


  helpers:
    setup_figure: 
      ncols: 3
      constrained_layout: True


    