state_and_trait_anim:
  based_on: state_anim
  file_ext: png

  to_plot:
    cell_type:
      title: Cell Type
      limits: [0, 2]
      cmap:
        Progenitor: White
        Hair: Red
        Support: Gray
    atoh1_level:
      title: Atoh1
