---
densities:
  based_on: densities

percolation_diagram: !pspace
  based_on: percolation_diagram
  map_dim: beta
  
  transform:
    - .isel:
      args: [!dag_tag _cells]
      kwargs:
        time: -1
    - .sel:
      args: [!dag_prev ]
      kwargs:
        swap: !sweep
          default: 80
          linspace: [0., 0.01, 2]
          name: swap
      tag: cells

    - .isel:
      args: [!dag_tag _cluster_id]
      kwargs:
        time: -1
    - .sel:
      args: [!dag_prev ]
      kwargs:
        swap: !coupled-sweep          
          target_name: swap
      tag: cluster_id

rosettes_bifuraction:
  based_on: .dag.generic.facet_grid
  creator: multiverse
  file_ext: png

  x: hair density
  hue: swap

  marker: o

  select_and_combine:
    fields:
      _rosette_density: Rosettes
      _hair_density: Hair
    base_path: data/NotchDelta/Densities

  transform:
    - .coords:
      args: [!dag_tag _rosette_density, time]
    - create_mask:
      args: [!dag_prev , '>=', 700]
      tag: time_mask_rosette
    - .where:
      args: [!dag_tag _rosette_density, !dag_tag time_mask_rosette]
    - .mean:
      args: [!dag_prev , time]
      tag: rosette_density
      # the density of rosettes
    
    - .coords:
      args: [!dag_tag _hair_density, time]
    - create_mask:
      args: [!dag_prev , '>=', 700]
      tag: time_mask_hair
    - .where:
      args: [!dag_tag _hair_density, !dag_tag time_mask_hair]
    - .mean:
      args: [!dag_prev , time]
      tag: hair_density
      # the density of hairs

    - import_and_call:
      args: [model_plots.NotchDelta, replace_dim, !dag_tag rosette_density,
             !dag_tag hair_density]
      kwargs:
        dim: beta
        new_dim: hair density
      tag: data
      # exchange dimension beta with data from hair_density

heatmap_density:
  based_on: heatmap_density

heatmap_contacts:
  based_on: heatmap_contacts

percolation_bifurcation:
  based_on: percolation_bifurcation
  map_dim: beta
  # x: swap
  # col: param
  # sharey: false

  p0: [0.4, 0.01]
  min_perc_strength: 0.8