---
percolation_diagram: !pspace
  based_on: percolation_diagram
  map_dim: beta
  
  transform:
    - .isel:
      args: [!dag_tag _cells]
      kwargs:
        time: -1
    - .sel:
      args: [!dag_prev ]
      kwargs:
        swap: !sweep
          default: 80
          linspace: [0., 0.01, 2]
          name: swap
      tag: cells

    - .isel:
      args: [!dag_tag _cluster_id]
      kwargs:
        time: -1
    - .sel:
      args: [!dag_prev ]
      kwargs:
        swap: !coupled-sweep          
          target_name: swap
      tag: cluster_id

rosettes:
  based_on: .dag.generic.facet_grid
  creator: multiverse
  file_ext: png

  select_and_combine:
    fields:
      _data: Densities/Rosettes
    base_path: data/NotchDelta

  transform:
    - .coords:
      args: [!dag_tag _data, time]
    - create_mask:
      args: [!dag_prev , '>=', 700]
      tag: time_mask
    - .where:
      args: [!dag_tag _data, !dag_tag time_mask]
    - .mean:
      args: [!dag_prev , time]
      tag: data

heatmap_density:
  based_on: heatmap_density

heatmap_contacts:
  based_on: heatmap_contacts

percolation_bifurcation:
  based_on: percolation_bifurcation
  map_dim: beta
  # x: swap
  # col: param
  # sharey: false

  p0: [0.4, 0.01]
  min_perc_strength: 0.8