---
perform_sweep: True

paths:
  model_note: default_percolation_heatmap

parameter_space:
  num_steps: 1000
  NotchDelta:
    rate_ph:
      rate_0: !sweep
        default: 8e-3
        values: [0.001, 0.005, 0.01, 0.06]
        name: beta

    rate_swap: !sweep
      default: 0.
      linspace: [0., 0.01, 2]
      name: swap
