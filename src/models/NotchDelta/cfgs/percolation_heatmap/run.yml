---
perform_sweep: True

paths:
  model_note: default_percolation_heatmap

parameter_space:
  num_steps: 100
  NotchDelta:
    rate_ph:
      beta: !sweep
        default: 8e-3
        linspace: [4e-3, 8e-3, 4]
      rate_0: !coupled-sweep
        target_name: beta
    
    Environment:
      env_state_funcs:
        - noise:
            atoh1:
              mode: add
              distribution: exponential
              lambda: !sweep
                default: 80
                values: [80, 100]