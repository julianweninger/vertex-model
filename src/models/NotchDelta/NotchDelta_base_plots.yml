# The base plots of this model
#
# The configurations given here can be used in the <model_name>_plots.yml file
---
densities:
  based_on: .basic_uni.lineplots
  model_name: NotchDelta
  file_ext: png

  to_plot: 
    Densities/Hair:
      label: Hair
      color: red
    Densities/Support:
      label: Support
      color: black
    Densities/Progenitor:
      label: Progenitor
      color: gray

  helpers:
    set_labels:
      x: time
      y: density
    set_limits:
      y: [0,1.]

hair_hair_contacts:
  based_on: .basic_uni.lineplot
  model_name: NotchDelta
  file_ext: png

  path_to_data: Densities/Number_hair_hair_contacts
  label: Hair-hair contacts

  helpers:
    set_labels:
      x: time
      y: cnt

state_anim:
  based_on: .ca.state  
  file_ext: png

  model_name: NotchDelta

  to_plot:
    CM/Cell_type:
      title: Cell Type
      limits: [0, 2]
      cmap:
        Progenitor: White
        Hair: Red
        Support: Gray
    CM/Atoh1:
      title: Atoh1

  # Specify the time index (will be ignored, but needs to be specified)
  time_idx: 0

  # Enable animation (disabled by default)
  animation:
    enabled: true

heatmap_density: &heatmap_density
  based_on: .dag.generic.facet_grid
  creator: multiverse
  # module: model_plots.NotchDelta
  # plot_func: heatmap
  file_ext: png
  
  select_and_combine:
    fields: 
      data:
        path: data/NotchDelta/Densities/Hair
        with_previous_result: true
        transform:
          - .isel:
              time: -1

  cmap: cividis

  label: hair density

  helpers:
    set_labels:
      x: differentiation rate
      y: delay lambda

heatmap_contacts: 
  <<: *heatmap_density

  select_and_combine:
    fields: 
      data:
        path: data/NotchDelta/Densities/Number_hair_hair_contacts
        with_previous_result: true
        transform:
          - .isel:
              time: -1

  label: num contacts


# Plot the size of the biggest cluster vs density
# Multiverse plot with beta remapped to density
percolation_diagram:
  based_on: .dag.generic.facet_grid
  creator: multiverse
  file_ext: png

  select_and_combine:
    fields:
      cells:
        path: CM/Cell_type
        with_previous_result: true
        transform:
          - .isel:
              time: -1
      cluster_id:
        path: CM/Cluster_id
        with_previous_result: true
        transform:
          - .isel:
              time: -1
          - operation: where
            args: ['>', 0]
    base_path: data/NotchDelta

  transform:
    # calculate the num cells
    - operation: .count
      args: [!dag_tag cells]
      kwargs:
        dim: {x, y}
      tag: num_cells
    
    # calculate the hair density
    - operation: where
      args: [!dag_tag cells, '==', 1]
    - operation: .count
      args: [!dag_prev ]
      kwargs:
        dim: {x, y}
      tag: num_hair_cells
    - div: [!dag_tag num_hair_cells, !dag_tag num_cells]
      tag: density
    
    # calculate the size of the biggest cluster
    - operation: import_and_call
      args: [model_plots.NotchDelta, count_unique, !dag_tag cluster_id,
             ['x', 'y']]
      tag: cluster_sizes
    - operation: .max
      args: [!dag_prev ]
      kwargs:
        dim: unique
    - div: [!dag_prev , !dag_tag num_cells]
      tag: max_cluster_size

    # remap coords to density
    - operation: .assign_coords
      args: [!dag_tag max_cluster_size]
      kwargs:
        beta: !dag_tag density
    - operation: .rename
      args: [!dag_prev ]
      kwargs:
        beta: density
      tag: data

  x: density
  marker: '.'
  ls: None

  helpers:
    set_labels:
      y: max cluster density
    # set_limits:
      # x: [0, 0.45]
      # y: [0, 0.4]

bifurcation: &bifurcation
  based_on: .attractor.bifurcation_diagram_1d
  file_ext: png

  analysis_steps: [fixpoint]
  analysis_kwargs:
    fixpoint:
      abs_std: 0.1
      isclose_kwargs: {atol: 0.}
      spin_up_time: 800

  rectangle_map_kwargs:
    extend: true
    default_distance: 1.
    default_pos: [0., 0.5]

bifurcation_density:
  <<: *bifurcation

  select:
    fields:
      Hair: data/NotchDelta/Densities/Hair
      Support: data/NotchDelta/Densities/Support

  to_plot:
    Hair:
      label: hair cells
      plot_kwargs:
        color: red
        s: 14
    Support:
      label: support cells
      plot_kwargs:
        color: black
        s: 7

  helpers:
    set_labels:
      y: density / ratio

bifurcation_contacts:
  <<: *bifurcation

  select:
    fields:
      Contacts: data/NotchDelta/Densities/Number_hair_hair_contacts

  dim: lambda

  to_plot:
    Contacts:
      label: Hair-Hair contacts
      plot_kwargs:
        color: red
        s: 14
  
  helpers:
    set_labels:
      y: Counts
    set_limits:
      y: [0, 1000.]

