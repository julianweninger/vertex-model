# The base plots of this model
#
# The configurations given here can be used in the <model_name>_plots.yml file
---
state_anim:
  based_on: .ca.state
  
  model_name: NotchDelta

  # Specify the time index (will be ignored, but needs to be specified)
  time_idx: 0

  # Enable animation (disabled by default)
  animation:
    enabled: true

heatmap_density: &heatmap_density
  creator: multiverse
  module: model_plots.NotchDelta
  plot_func: heatmap
  file_ext: png
  
  select:
    fields: 
      Hair: data/NotchDelta/Densities/Hair
  transform_data:
    - isel:
        time: -1

  to_plot: Hair

  cmap: cividis

heatmap_contacts: 
  <<: *heatmap_density

  select:
    fields: 
      Contacts: data/NotchDelta/Densities/Number_hair_hair_contacts
  transform_data:
    - isel:
        time: -1

  to_plot: Contacts

bifurcation: &bifurcation
  based_on: .attractor.bifurcation_diagram_1d

  analysis_steps: [fixpoint]
  analysis_kwargs:
    fixpoint:
      abs_std: 0.1
      isclose_kwargs: {atol: 0.}
      spin_up_time: 800

  rectangle_map_kwargs:
    extend: true
    default_distance: 1.
    default_pos: [0., 0.5]

bifurcation_density:
  <<: *bifurcation

  select:
    fields:
      Ratio: data/NotchDelta/Densities/Ratio_hair_support
      Hair: data/NotchDelta/Densities/Hair
      Support: data/NotchDelta/Densities/Support

          
  to_plot:
    Hair:
      label: hair cells
      plot_kwargs:
        color: red
        s: 14
    Support:
      label: support cells
      plot_kwargs:
        color: black
        s: 7
    Ratio:
      label: ratio hair to support cells
      plot_kwargs:
        color: blue
        s: 7

  helpers:
    set_labels:
      y: density / ratio

bifurcation_contacts:
  <<: *bifurcation

  select:
    fields:
      Contacts: data/NotchDelta/Densities/Number_hair_hair_contacts

  dim: lambda

  to_plot:
    Contacts:
      label: Hair-Hair contacts
      plot_kwargs:
        color: red
        s: 14
  
  helpers:
    set_labels:
      y: Counts
    set_limits:
      y: [0, 1000.]

