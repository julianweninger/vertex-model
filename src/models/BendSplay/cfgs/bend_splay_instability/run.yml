---
perform_sweep: True

parameter_space:
  num_steps: 1000000

  seed: !sweep
    default: 42
    range: [8]
    order: !expr -np.inf

  BendSplay:
    initial_orientation: !sweep
      default: 0.
      linspace: [!expr 3.1415,  0., 9]
      name: init

    curvature: !sweep
      name: curvature
      default: 1
      values: [1, 2, 4, 8]
    inner_radius: !coupled-sweep
      target_name: curvature
      name: R_in
      values: [!expr 2/3 * 1/1, !expr 2/3 * 1/2, !expr 2/3 * 1/4, !expr 2/3 * 1/8]
    outer_radius: !coupled-sweep
      target_name: curvature
      name: R_out
      values: [!expr 2/1, !expr 2/2, !expr 2/4, !expr 2/8]

    init_symmetric: True

    dK: !sweep
      default: 0.2
      values: [0.2, -0.2]
