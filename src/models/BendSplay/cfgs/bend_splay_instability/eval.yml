# The default plots of this model
#
# These can use the `based_on` feature with configurations specified in the
# accompanying *_base_plots.yml file and in the utopya base plot configs.
---
_:
  enabled: false
  subspace_slice: &subspace_slice
    dK: !sweep
      default: 0.
      values: [0.2, -0.2]
      order: -10
  hue: &HUE curvature


# A time series plot of the circular mean and std of the agent orientation
energy: !pspace
  based_on: energy

  select_and_combine:
    subspace: *subspace_slice

  hue: *HUE
  to_plot: 
    - function: sns.lineplot
      data: !dag_result energy
      errorbar: sd
      style: curvature
      size: init

orientation: !pspace
  based_on: orientation
  select_and_combine:
    fields:
        _angles:
          path: data/BendSplay/Lattice/orientations
        x: 
          path: data/BendSplay/Lattice/coords_x
    subspace: *subspace_slice

  transform:
    - create_mask: [!dag_tag x, '<', 0.]
      tag: flip
    - .where: [!dag_tag _angles, !dag_tag flip]
    - call_lambda:
      - "lambda psi: np.arctan2(np.sin(psi).sum(dim='ids'), np.cos(psi).sum(dim='ids'))"
      - !dag_prev
    - import_and_call:
      args: [model_plots.BendSplay.data_ops, to_dataframe, !dag_prev ]
      tag: angles_left

    - create_mask: [!dag_tag x, '>=', 0.]
      tag: not_flip
    - .where: [!dag_tag _angles, !dag_tag not_flip]
    - call_lambda:
      - "lambda psi: np.arctan2(np.sin(psi).sum(dim='ids'), np.cos(psi).sum(dim='ids'))"
      - !dag_prev
    - import_and_call:
      args: [model_plots.BendSplay.data_ops, to_dataframe, !dag_prev ]
      tag: angles_right

    - call_lambda:
      - "lambda psi: np.arctan2(np.sin(psi).sum(dim='ids'), np.cos(psi).sum(dim='ids'))"
      - !dag_tag _angles
    - import_and_call:
      args: [model_plots.BendSplay.data_ops, to_dataframe, !dag_prev ]
      tag: angles


  to_plot: 
    - function: sns.scatterplot
      data: !dag_result angles_left
      style: init
      size: seed
    - function: sns.scatterplot
      data: !dag_result angles_right
      style: init
      size: seed
    # - function: sns.scatterplot
    #   data: !dag_result angles
    #   style: init
    #   size: seed

  hue: *HUE
  helpers:
    set_limits:
      y: [-1e3, 2e4]

vector_field:
  based_on: vector_field
  universes:
    seed: 0
    init: [3.1415, !expr 3.1415 / 2, 0.]
    curvature: [1, 8]
