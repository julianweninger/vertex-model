# The default plots of this model
#
# These can use the `based_on` feature with configurations specified in the
# accompanying *_base_plots.yml file and in the utopya base plot configs.
---
energy:
  based_on: energy
energy_boundary:
  based_on: energy_boundary
  enabled: false

energy_continuous:
  based_on: 
    - energy
    - select.uni.continuous_energy_terms
energy_continuous_boundary:
  based_on: 
    - energy_boundary
    - select.uni.continuous_energy_terms
  enabled: false

transitions:
  based_on: transitions

transitions_cumulated:
  based_on: transitions
  cumsum_transitions: true

transitions_continuous:
  based_on: transitions_continuous
  cumsum_transitions: true

transitions_multiplot:
  based_on:
    - transitions_multiplot
    - universe
    - select.uni.transitions

# effective diffusion
diffusion:
  based_on: diffusion_uni

# Displacement, i.e. MSD**0.5
displacement:
  based_on: displacement_uni

# Cell properties from cell statistics ----------------------------------------
cell_stats:
  enabled: false
  based_on:
    - universe
    - _cell_stats
    - select_cell_stats

  helpers:
    set_labels:
      x: time

cell_stats/area:
  based_on: cell_stats

  to_plot: 
    cells:
      label: all cells
    hair_cells:
      label: hair cells
    support_cells:
      label: support cells

  property: area

  helpers:
    set_labels:
      y: average area

cell_stats/area_pref:
  based_on: cell_stats/area

  property: area_preferential

  helpers:
    set_labels:
      y: average pref. area

cell_stats/shape:
  based_on: cell_stats/area

  property: shape_index

  helpers:
    set_labels:
      y: average shape index

cell_stats/HC_neighbors:
  based_on: cell_stats

  to_plot:
    bulk_cells:
      label: all cells (bulk)
    bulk_hair_cells:
      label: hair cells (bulk)
    bulk_support_cells:
      label: support cells (bulk)

  property: num_hair_neighbors

  helpers:
    set_labels:
      y: average hair cell neighbors

cell_stats/neighbors:
  based_on: cell_stats/HC_neighbors

  property: num_neighbors

  helpers:
    set_labels:
      y: average neighbors

cell_stats/hexatic_order:
  based_on: cell_stats

  to_plot: 
    bulk_hair_cells:
      label: hair cells (bulk)
      plot_min_max: True
  
  property: hexatic_order

  helpers:
    set_labels:
      y: average hexatic_order

cell_stats/neighbors_vs_area:
  based_on:
    - universe

  module: model_plots.PCPTopology
  plot_func: scatter_xy_data

  plot_time_color_gradient: true
  cmap: plasma

  select:
    # the data containing all cells
    x:
      path: data/PCPTopology/Statistics/Bulk_hair_cell_stats
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: area
    y:
      path: data/PCPTopology/Statistics/Bulk_hair_cell_stats
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: num_neighbors

  helpers:
    set_labels:
      x: HC area
      y: average neighbours for HCs
    set_limits:
      x: [0., 5.]
      y: [3., 12]

cell_stats/hc_neighbors_vs_area:
  based_on: cell_stats/neighbors_vs_area

  select:
    y:
      path: data/PCPTopology/Statistics/Bulk_hair_cell_stats
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: num_hair_neighbors

  helpers:
    set_labels:
      y: average hair-hair contacts
    set_limits:
      y: [0., 5]

# Cell properties from cell data ----------------------------------------------

cell_properties:
  based_on:
    - .plot.multiplot
    - universe
    - select_cells_properties
  enabled: False

  select:
    property:
      path: data/PCPTopology/Cells

  to_plot: 
    - function: sns.lineplot
      data: !dag_result all_cells
      label: all cells
      ci: sd
    - function: sns.lineplot
      data: !dag_result hair_cells
      label: hair cells
      ci: sd
    - function: sns.lineplot
      data: !dag_result support_cells
      label: support cells
      ci: sd

  x: time

  helpers:
    set_labels:
      x: time

cell_properties/area:
  based_on: cell_properties
  select:
    property:
      transform:
        - .sel: [!dag_prev , {property: area}]
        - .rename: [!dag_prev , area]
  y: area
  helpers:
    set_labels:
      y: average area

cell_properties/area_preferential:
  based_on: cell_properties
  select:
    property:
      transform:
        - .sel: [!dag_prev , {property: area_preferential}]
        - .rename: [!dag_prev , area_preferential]
  y: area_preferential
  helpers:
    set_labels:
      y: average pref. area

cell_properties/shape:
  based_on: cell_properties
  select:
    property:
      transform:
          - .sel: [!dag_prev , {property: perimeter}]
          - .sel: [!dag_node -2, {property: area_preferential}]
          - pow: [!dag_node -1 , 0.5]
          - div: [!dag_node -3, !dag_node -1]
          - .rename: [!dag_prev , shape_index]
  y: shape_index
  helpers:
    set_labels:
      y: average shape index

cell_properties/HC_neighbors:
  based_on: cell_properties
  select:
    property:
      transform:
        - .sel: [!dag_prev , {property: num_hair_neighbors}]
        - .rename: [!dag_prev , num_hair_neighbors]
  y: num_hair_neighbors
  helpers:
    set_labels:
      y: average hair neighbors

cell_properties/neighbors:
  based_on: cell_properties
  select:
    property:
      transform:
        - .sel: [!dag_prev , {property: num_neighbors}]
        - .rename: [!dag_prev , num_neighbors]
  y: num_neighbors
  helpers:
    set_labels:
      y: average neighbors

cell_properties/hexatic_order:
  based_on: cell_properties
  select:
    property:
      transform:
        - .sel: [!dag_prev , {property: hexatic_order}]
        - .rename: [!dag_prev , hexatic_order]
  y: hexatic_order
  to_plot: 
    - function: sns.lineplot
      data: !dag_result hair_cells_bulk
      label: hair cells
      ci: sd
  helpers:
    set_labels:
      y: average hexatic order

cell_properties/elongation:
  based_on: cell_properties
  select:
    property:
      transform:
        - .sel: [!dag_node -1, {property: q_x}]
        - .sel: [!dag_node -2, {property: q_y}]
        - call_lambda:
          - "lambda qx, qy: (qx**2 + qy**2)**0.5"
          - !dag_node -2
          - !dag_node -1
        - .rename: [!dag_prev , elongation]
  y: elongation
  to_plot: 
    - function: sns.lineplot
      data: !dag_result hair_cells_bulk
      label: hair cells
      ci: sd
  helpers:
    set_labels:
      y: average hexatic order

cell_properties_x_vs_y:
  enabled: false
  based_on:
    - .plot.multiplot
    - universe
    - select_cells_properties.xy_data

  select:
    x:
      path: data/PCPTopology/Cells
    y:
      path: data/PCPTopology/Cells
  hue: time
  
cell_properties/neighbors_vs_area:
  based_on: cell_properties_x_vs_y
  select:
    x:
      transform:
        - .sel: [!dag_prev , {property: area}]
        - .rename: [!dag_prev , area]
    y:
      transform:
        - .sel: [!dag_prev , {property: num_neighbors}]
        - .rename: [!dag_prev , num_neighbors]

  to_plot:
    - function: sns.scatterplot
      data: !dag_result hair_cells

  x: area
  y: num_neighbors

cell_properties/HH_contacts_vs_area:
  based_on: cell_properties_x_vs_y

  select:
    x:
      transform:
        - .sel: [!dag_prev , {property: area}]
        - .rename: [!dag_prev , area]
    y:
      transform:
        - .sel: [!dag_prev , {property: num_hair_neighbors}]
        - .rename: [!dag_prev , num_hair_neighbors]

  to_plot:
    - function: sns.scatterplot
      data: !dag_result hair_cells

  x: area
  y: num_hair_neighbors
  hue: time
      
energy_vs_SCHC_contacts:
  based_on: universe
  enabled: False

  module: model_plots.PCPTopology
  plot_func: scatter_xy_data

  plot_time_color_gradient: True
  cmap: plasma

  select:
    # the data containing all cells
    _cells: data/PCPTopology/Cells
    property:
      path: data/PCPTopology/Cells
      transform:
      - .sel:
        args: [!dag_tag _cells]
        kwargs:
          property: num_hair_neighbors
    y: 
      path: data/PCPTopology/Energy/Edge_contractility
    
  transform:
    - .sel:
      args: [!dag_tag _cells]
      kwargs:
        property: cell_type
    - create_mask:
      args: [!dag_prev , ==, 2]
    - .where:
      args: [!dag_tag property, !dag_prev ]
    - .mean:
      args: [!dag_prev  ,id]
      kwargs:
        skipna: True
      tag: x

  helpers:
    set_labels:
      x: average HC neighbors for SCs
      y: edge contractility energy

energy_vs_HCHC_contacts:
  based_on: energy_vs_SCHC_contacts
  enabled: False
  
  transform:
    - .sel:
      args: [!dag_tag _cells]
      kwargs:
        property: cell_type
    - create_mask:
      args: [!dag_prev , ==, 1]
    - .where:
      args: [!dag_tag property, !dag_prev ]
    - .mean:
      args: [!dag_prev , id]
      kwargs:
        skipna: True
      tag: x

  helpers:
    set_labels:
      x: average HC neighbors for HCs
      y: edge contractility energy
   
pressure:
  based_on:
    - .plot.multiplot
    - universe
    - select_cells_properties

  to_plot: 
    - function: sns.lineplot
      data: !dag_result all_cells
      label: all cells
      ci: sd
    - function: sns.lineplot
      data: !dag_result hair_cells
      label: hair cells
      ci: sd
    - function: sns.lineplot
      data: !dag_result support_cells
      label: support cells
      ci: sd

  select:
    property:
      path: data/PCPTopology/Cell_energies
      transform:
        - .sel: [!dag_prev , {energy_term: pressure}]
        - .rename: [!dag_prev , pressure]
  y: pressure
  x: time
  helpers:
    set_labels:
      y: pressure

tension:
  based_on:
    - .plot.multiplot
    - universe
    - select_edges_properties

  select:
    property:
      path: data/PCPTopology/Edge_energies
      transform:
        - .sel: [!dag_prev , {energy_term: tension}]
        - .rename: [!dag_prev , tension]
    
  to_plot: 
    - function: sns.lineplot
      data: !dag_result all_edges
      label: all edges
      ci: sd
    - function: sns.lineplot
      data: !dag_result ss_edges
      label: support-support
      ci: sd
    - function: sns.lineplot
      data: !dag_result hs_edges
      label: support-hair
      ci: sd

  x: time
  y: tension


# --- Equilibrium cellular structures -----------------------------------------
equilibrium_cellular_structure:
  based_on:
    - cellular_structure

  property_interpolation_kwargs:
    method: nearest
  property_interpolation_plot_kwargs:
    cmap: Reds


equilibrium_cellular_structure__area:
  based_on: equilibrium_cellular_structure
  enabled: false

  property: {property: area}
  property_label: cell area

equilibrium_cellular_structure__elongation:
  based_on: equilibrium_cellular_structure
  enabled: false

  vector_property_is_nematic: True

  vector_property:
    x: {property: q_x}
    y: {property: q_y}
  vector_property_kwargs:
    scale: 0.75
    headwidth: 1
    headlength: 1.

equilibrium_cellular_structure__tension:
  based_on: equilibrium_cellular_structure
  enabled: false

  property: ~
  property_path: ~
  edge_property: {energy_term: tension}
  edge_property_path: Edge_energies
  quiver_kwargs:
    cmap: cool
    width: 0.01

equilibrium_cellular_structure__pressure:
  based_on: equilibrium_cellular_structure
  enabled: false

  property: {energy_term: pressure}
  property_path: Cell_energies
  property_interpolation_plot_kwargs:
    cmap: cool


equilibrium_cellular_structure__area_elasticity:
  based_on: equilibrium_cellular_structure
  enabled: false

  property: {energy_term: area_elasticity}
  property_path: Cell_energies

equilibrium_cellular_structure__cell_contractility:
  based_on: equilibrium_cellular_structure
  enabled: false

  property: {energy_term: cell_contractility}
  property_path: Cell_energies

equilibrium_cellular_structure__linetension:
  based_on: equilibrium_cellular_structure
  enabled: false

  property: ~
  property_path: ~
  edge_property: {energy_term: linetension}
  edge_property_path: Edge_energies

equilibrium_cellular_structure__edge_contractility:
  based_on: equilibrium_cellular_structure
  enabled: false

  edge_property: {energy_term: edge_contractility}
  edge_property_path: Edge_energies

equilibrium_cellular_structure__hexatic_order:
  based_on: equilibrium_cellular_structure
  enabled: false

  property: {property: hexatic_order}
  property_path: ~
  property_hair_cells_only: True

equilibrium_cellular_structure__segmentation:
  based_on: equilibrium_cellular_structure
  enabled: false
  cell_marker_colors: ['w', 'cyan']
  quiver_kwargs:
    color: [1., 0., 1.]


# --- Continuous cellular structures ------------------------------------------
cellular_structure_continuous:
  based_on:
    - cellular_structure
  datapath: PCPTopology/PCPVertex


# --- Cellular geometries -----------------------------------------------------
cell_neighbourhood: !pspace
  based_on:
    - universe
    - _cell_neighbourhood

  select: &select_cell_neighbourhood
    area:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: area
        - .rename: [!dag_prev , area]
    cell_type:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: cell_type
        - .rename: [!dag_prev , cell_type]
    shape_index:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
        - .sel: [!dag_prev , {property: perimeter}]
        - .sel: [!dag_node -2, {property: area_preferential}]
        - pow: [!dag_node -1 , 0.5]
        - div: [!dag_node -3, !dag_node -1]
        - .rename: [!dag_prev , shape_index]
    num_neighbors:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: num_neighbors
        - .rename: [!dag_prev , num_neighbors]
    num_hair_neighbors:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: num_hair_neighbors
        - .rename: [!dag_prev , num_hair_neighbors]

  only_type: !sweep
    default: all
    values:
      - all
      # - hair
      # - support
      # - support_hair
      # - hair_hair
      
NotchDelta_densities:
  based_on: 
    - .plot.multiplot
    - universe

  select:
    progenitor:
      path: data/PCPTopology/NotchDelta/Densities/Progenitor
      transform: &transform_NDdensity_to_dataframe
        - .rename: [!dag_prev , density]
        - import_and_call:
          args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    support:
      path: data/PCPTopology/NotchDelta/Densities/Support
      transform: *transform_NDdensity_to_dataframe
    hair:
      path: data/PCPTopology/NotchDelta/Densities/Hair
      transform: *transform_NDdensity_to_dataframe
    rosettes:
      path: data/PCPTopology/NotchDelta/Densities/Rosettes
      transform: *transform_NDdensity_to_dataframe

  x: time
  y: density

  to_plot:
  - function: sns.lineplot
    data: !dag_result progenitor
    label: progenitor
  - function: sns.lineplot
    data: !dag_result support
    label: support cells
  - function: sns.lineplot
    data: !dag_result hair
    label: hair cells
  - function: sns.lineplot
    data: !dag_result rosettes
    label: HC rosettes

  helpers:
    set_labels:
      x: time
      y: density
    set_limits:
      y: [0,1.]

    