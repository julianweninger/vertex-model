# The default plots of this model
#
# These can use the `based_on` feature with configurations specified in the
# accompanying *_base_plots.yml file and in the utopya base plot configs.
---
energy:
  based_on: .basic_uni.lineplots
  model_name: PCPTopology/PCPVertex
  file_ext: png

  to_plot:
    Energy/Total:
      label: TOTAL
    Energy/Linetension:
      label: line-tension
    Energy/Areaelasticity:
      label: area-elasticity
    Energy/Contractility:
      label: contractility
    # Energy/Cell_cell_polarity: 
    #   label: cell-cell-polarity
    # Energy/Polarity_exclusion: 
    #   label: polarity-exclusion
    # Energy/Lagrange_net_polarisation: 
    #   label: lagrange-net-polarisation
    # Energy/Lagrange_const_concentration: 
    #   label: lagrange-const-concentration

  helpers:
    set_labels:
      x: time
      y: energy [a.u.]

energy_mechanics:
  based_on: .basic_uni.lineplots
  model_name: PCPTopology/PCPVertex
  file_ext: png

  enabled: false
  
  to_plot:
    Energy/Linetension:
      label: line-tension
    Energy/Areaelasticity:
      label: area-elasticity
    Energy/Contractility:
      label: contractility

  helpers:
    set_labels:
      x: time
      y: energy [a.u.]

energy_polarity:
  based_on: .basic_uni.lineplots
  model_name: PCPTopology/PCPVertex
  file_ext: png

  enabled: false

  to_plot:
    Energy/Cell_cell_polarity: 
      label: cell-cell-polarity
    Energy/Polarity_exclusion: 
      label: polarity-exclusion
    Energy/Lagrange_net_polarisation: 
      label: lagrange-net-polarisation
    Energy/Lagrange_const_concentration: 
      label: lagrange-const-concentration

  helpers:
    set_labels:
      x: time
      y: energy [a.u.]

area_preferential:
  based_on: .basic_uni.lineplots
  model_name: PCPTopology/Environment
  file_ext: png
  to_plot:
    area_preferential_hair:
      label: hair pref. area
    area_preferential_support:
      label: support pref. area

cell_area:
  based_on: .basic_uni.lineplots
  model_name: PCPTopology
  file_ext: png


  to_plot:
    area_average:
      path_to_data: Statistics/Cell_area
      transform_data:
        - sel:
            properties: area_average
      label: average cell area
    area_hair_average:
      path_to_data: Statistics/Cell_area
      transform_data:
        - sel:
            properties: area_hair_average
      label: average area for HCs
    area_support_average:
      path_to_data: Statistics/Cell_area
      transform_data:
        - sel:
            properties: area_support_average
      label: average area for SCs

cell_neighbourhood:
  creator: universe
  universes: all
  module: model_plots.PCPTopology
  plot_func: cell_neighbourhood
  file_ext: png
  datapath: PCPTopology/Statistics

  enabled: false

  helpers:
    set_labels:
      x: bins [1]
      y: counts [1]
    set_limits:
      x: [0, 9]

  animation:
    enabled: true
    writer: frames
    writer_kwargs:
      ffmpeg:
        init:
          fps: 10
        saving:
          dpi: 300
      frames:
        saving:
          dpi: 300

    animation_update_kwargs:  {}

equilibrium_cellular_structure:
  creator: universe
  universes: all
  module: model_plots.PCPVertex
  plot_func: cellular_structure
  file_ext: png
  datapath: PCPTopology
  cfgpath: PCPTopology/PCPVertex

  helpers:
    set_labels:
      x: x [a.u.]
      y: y [a.u.]
    set_limits:
      x: [0, 500]
      y: [0, 500]

  animation:
    enabled: true
    writer: frames
    writer_kwargs:
      ffmpeg:
        init:
          fps: 10
        saving:
          dpi: 300
      frames:
        saving:
          dpi: 300

    animation_update_kwargs:  {}

cellular_structure:
  creator: universe
  universes: all
  module: model_plots.PCPVertex
  plot_func: cellular_structure
  file_ext: png
  datapath: PCPTopology/PCPVertex
  cfgpath: PCPTopology/PCPVertex

  enabled: true
  
  helpers:
    set_labels:
      x: x [a.u.]
      y: y [a.u.]
    set_limits:
      x: [0, 500]
      y: [0, 500]

  animation:
    enabled: true
    writer: frames
    writer_kwargs:
      ffmpeg:
        init:
          fps: 10
        saving:
          dpi: 300
      frames:
        saving:
          dpi: 300

    animation_update_kwargs:  {}