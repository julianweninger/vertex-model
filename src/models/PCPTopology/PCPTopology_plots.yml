# The default plots of this model
#
# These can use the `based_on` feature with configurations specified in the
# accompanying *_base_plots.yml file and in the utopya base plot configs.
---
energy:
  based_on: energy

energy_boundary:
  based_on: energy
  model_name: PCPTopology

  to_plot:
    Energy/Boundary_area_elasticity: 
      label: Boundary area-elasticity

    Energy/Boundary_shape_elasticity: 
      label: Boundary shape-elasticity

energy_continuous:
  based_on: energy
  model_name: PCPTopology/PCPVertex

energy_boundary_continuous:
  based_on: energy
  model_name: PCPTopology/PCPVertex

  to_plot:
    Energy/Boundary_area_elasticity: 
      label: Boundary area-elasticity

    Energy/Boundary_shape_elasticity: 
      label: Boundary shape-elasticity

energy_polarity_continuous:
  based_on: energy
  model_name: PCPTopology/PCPVertex
  enabled: false

  to_plot:
    Energy/Cell_cell_polarity: 
      label: cell-cell-polarity
    Energy/Polarity_exclusion: 
      label: polarity-exclusion
    Energy/Lagrange_net_polarisation: 
      label: lagrange-net-polarisation
    Energy/Lagrange_const_concentration: 
      label: lagrange-const-concentration

transitions:
  based_on: transitions
  map_to_continuous_time: True

transitions_continuous:
  based_on: transitions
  model_name: PCPTopology/PCPVertex
  map_to_discrete_time: True

cell_area: &CELLAREA
  based_on:
    - .default_style_and_helpers
    - cell_property

  to_plot: 
    data:
      label: all cells
      plot_std: False
    hair_cells:
      label: hair cells
    support_cells:
      label: support cells

  select:
    _property:
      path: data/PCPTopology/Cells
      transform:
      - .sel:
        args: [!dag_tag _cells]
        kwargs:
          property: area

  helpers:
    set_labels:
      x: time
      y: average area

cell_pref_area:
  <<: *CELLAREA

  select:
    _property:
      path: data/PCPTopology/Cells
      transform:
      - .sel:
        args: [!dag_tag _cells]
        kwargs:
          property: area_preferential

  helpers:
    set_labels:
      x: time
      y: average pref. area

cell_shape:
  <<: *CELLAREA

  select:
    _property:
      path: data/PCPTopology/Cells
      transform:
      - .sel:
        args: [!dag_tag _cells]
        kwargs:
          property: shape_index

  helpers:
    set_labels:
      x: time
      y: average shape index

hexatic_order:
  <<: *CELLAREA

  to_plot: 
    hair_cells:
      label: hair cells

  select:
    _property:
      path: data/PCPTopology/Cells
      transform:
      - .sel:
        args: [!dag_tag _cells]
        kwargs:
          property: hexatic_order

  helpers:
    set_labels:
      x: time
      y: average hexatic_order
      
equilibrium_cellular_structure:
  based_on:
    - .default_style_and_helpers
    - cellular_structure

equilibrium_cellular_structure__property: !pspace
  based_on:
    - .default_style_and_helpers
    - cellular_structure

  enabled: false

  property: !sweep
    default: area_elasticity
    values: 
      - area_elasticity
      - cell_contractility
      - linetension
      - edge_contractility
      - hexatic_order

  property_interpolation_kwargs:
    method: nearest
  property_interpolation_plot_kwargs:
    cmap: Reds

cellular_structure:
  based_on:
    - .default_style_and_helpers
    - cellular_structure
  datapath: PCPTopology/PCPVertex

cellular_structure__property: !pspace
  based_on:
    - .default_style_and_helpers
    - cellular_structure
  datapath: PCPTopology/PCPVertex

  enabled: false

  property: !sweep
    default: area_elasticity
    values: 
      - area_elasticity
      - cell_contractility
      - linetension
      - edge_contractility
      - hexatic_order

  property_interpolation_kwargs:
    method: nearest
  property_interpolation_plot_kwargs:
    cmap: Reds

cell_neighbourhood: !pspace
  based_on: cell_neighbourhood
  
  only_type: !sweep
    default: all
    values:
      - all
      - hair
      - support
      - support_hair
      - hair_hair
      
NotchDelta_densities:
  based_on: .basic_uni.lineplots
  model_name: PCPTopology
  file_ext: png

  to_plot:
    NotchDelta/Densities/Progenitor:
      label: Progenitor
      color: gray
    NotchDelta/Densities/Support:
      label: Support
      color: black
    NotchDelta/Densities/Hair:
      label: Hair
      color: red
    NotchDelta/Densities/Rosettes:
      label: Rosettes
      color: violet

  helpers:
    set_labels:
      x: time
      y: density
    set_limits:
      y: [0,1.]
