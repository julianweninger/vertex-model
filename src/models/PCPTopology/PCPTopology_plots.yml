# The default plots of this model
#
# These can use the `based_on` feature with configurations specified in the
# accompanying *_base_plots.yml file and in the utopya base plot configs.
---
energy:
  based_on: energy

energy_boundary:
  based_on: energy
  model_name: PCPTopology

  to_plot:
    Energy/Boundary_area_elasticity: 
      label: Boundary area-elasticity

    Energy/Boundary_shape_elasticity: 
      label: Boundary shape-elasticity

energy_continuous:
  based_on: energy
  model_name: PCPTopology/PCPVertex

energy_boundary_continuous:
  based_on: energy
  model_name: PCPTopology/PCPVertex

  to_plot:
    Energy/Boundary_area_elasticity: 
      label: Boundary area-elasticity

    Energy/Boundary_shape_elasticity: 
      label: Boundary shape-elasticity

energy_polarity_continuous:
  based_on: energy
  model_name: PCPTopology/PCPVertex
  enabled: false

  to_plot:
    Energy/Cell_cell_polarity: 
      label: cell-cell-polarity
    Energy/Polarity_exclusion: 
      label: polarity-exclusion
    Energy/Lagrange_net_polarisation: 
      label: lagrange-net-polarisation
    Energy/Lagrange_const_concentration: 
      label: lagrange-const-concentration

transitions:
  based_on: transitions
  map_to_continuous_time: True

transitions_continuous:
  based_on: transitions
  model_name: PCPTopology/PCPVertex
  map_to_discrete_time: True

cell_area: &CELLAREA
  based_on:
    - .default_style_and_helpers
    - cell_property
    - select_cells

  to_plot: 
    cells_mean:
      label: all cells
      plot_std: False
    hair_cells_mean:
      label: hair cells
    support_cells_mean:
      label: support cells

  select:
    property:
      path: data/PCPTopology/Cells
      transform:
      - .sel:
        args: [!dag_tag _cells]
        kwargs:
          property: area

  helpers:
    set_labels:
      x: time
      y: average area

cell_pref_area:
  <<: *CELLAREA

  select:
    property:
      path: data/PCPTopology/Cells
      transform:
      - .sel:
        args: [!dag_tag _cells]
        kwargs:
          property: area_preferential

  helpers:
    set_labels:
      x: time
      y: average pref. area

cell_shape:
  <<: *CELLAREA

  select:
    property:
      path: data/PCPTopology/Cells
      transform:
      - .sel:
        args: [!dag_tag _cells]
        kwargs:
          property: shape_index

  helpers:
    set_labels:
      x: time
      y: average shape index

HC_neighbors:
  <<: *CELLAREA

  to_plot:
    hair_cells_mean:
      label: hair cells
    support_cells_mean:
      label: support cells

  select:
    property:
      path: data/PCPTopology/Cells
      transform:
      - .sel:
        args: [!dag_tag _cells]
        kwargs:
          property: num_hair_neighbors

  helpers:
    set_labels:
      x: time
      y: average hair cell neighbors

hexatic_order:
  <<: *CELLAREA

  to_plot: 
    hair_cells_mean:
      label: hair cells

  select:
    property:
      path: data/PCPTopology/Cells
      transform:
      - .sel:
        args: [!dag_tag _cells]
        kwargs:
          property: hexatic_order

  helpers:
    set_labels:
      x: time
      y: average hexatic_order

rotation:
  <<: *CELLAREA

  to_plot: 
    cells_mean:
      label: all cells

  select:
    property:
      path: data/PCPTopology/Cells
      transform:
      - .sel:
        args: [!dag_tag _cells]
        kwargs:
          property: rotation

  helpers:
    set_labels:
      x: time
      y: average rotation

      
energy_vs_SCHC_contacts: &energy_vs_contacts
  based_on: .basic_uni.lineplot
  creator: universe
  universes: all
  module: model_plots.PCPTopology
  plot_func: scatter_xy_data
  file_ext: png

  enabled: False

  plot_time_color_gradient: True
  cmap: plasma

  select:
    # the data containing all cells
    _cells: data/PCPTopology/Cells
    property:
      path: data/PCPTopology/Cells
      transform:
      - .sel:
        args: [!dag_tag _cells]
        kwargs:
          property: num_hair_neighbors
    y: 
      path: data/PCPTopology/Energy/Edge_contractility
    
  transform:
    - .sel:
      args: [!dag_tag _cells]
      kwargs:
        property: cell_type
    - create_mask:
      args: [!dag_prev , ==, 2]
    - .where:
      args: [!dag_tag property, !dag_prev ]
    - .mean:
      args: [!dag_prev  ,id]
      kwargs:
        skipna: True
      tag: x

  helpers:
    set_labels:
      x: average HC neighbors for SCs
      y: edge contractility energy

energy_vs_HCHC_contacts:
  <<: *energy_vs_contacts
  
  transform:
    - .sel:
      args: [!dag_tag _cells]
      kwargs:
        property: cell_type
    - create_mask:
      args: [!dag_prev , ==, 1]
    - .where:
      args: [!dag_tag property, !dag_prev ]
    - .mean:
      args: [!dag_prev , id]
      kwargs:
        skipna: True
      tag: x

  helpers:
    set_labels:
      x: average HC neighbors for HCs
      y: edge contractility energy

equilibrium_cellular_structure:
  based_on:
    - .default_style_and_helpers
    - cellular_structure

equilibrium_cellular_structure__area_elasticity: &Property
  based_on:
    - .default_style_and_helpers
    - cellular_structure

  enabled: false

  property: area_elasticity

  property_interpolation_kwargs:
    method: nearest
  property_interpolation_plot_kwargs:
    cmap: Reds

equilibrium_cellular_structure__cell_contractility:
  <<: *Property
  property: cell_contractility
equilibrium_cellular_structure__linetension:
  <<: *Property
  property: linetension
equilibrium_cellular_structure__edge_contractility:
  <<: *Property
  property: edge_contractility
equilibrium_cellular_structure__hexatic_order:
  <<: *Property
  property: hexatic_order
  property_hair_cells_only: True
equilibrium_cellular_structure__rotation:
  <<: *Property
  cell_marker_size: 0.
  property: rotation
  property_interpolation_plot_kwargs:
    cmap: seismic
    vmin: -3.1415
    vmax: 3.1415
  property_bulk_cells_only: False


cellular_structure:
  based_on:
    - .default_style_and_helpers
    - cellular_structure
  datapath: PCPTopology/PCPVertex

cellular_structure__property: !pspace
  based_on:
    - .default_style_and_helpers
    - cellular_structure
  datapath: PCPTopology/PCPVertex

  enabled: false

  property: !sweep
    default: area_elasticity
    values: 
      - area_elasticity
      - cell_contractility
      - linetension
      - edge_contractility
      - hexatic_order

  property_interpolation_kwargs:
    method: nearest
  property_interpolation_plot_kwargs:
    cmap: Reds

cell_neighbourhood: !pspace
  based_on: cell_neighbourhood
  
  only_type: !sweep
    default: all
    values:
      - all
      - hair
      - support
      - support_hair
      - hair_hair
      
NotchDelta_densities:
  based_on: .basic_uni.lineplots
  model_name: PCPTopology
  file_ext: png

  to_plot:
    NotchDelta/Densities/Progenitor:
      label: Progenitor
      color: gray
    NotchDelta/Densities/Support:
      label: Support
      color: black
    NotchDelta/Densities/Hair:
      label: Hair
      color: red
    NotchDelta/Densities/Rosettes:
      label: Rosettes
      color: violet

  helpers:
    set_labels:
      x: time
      y: density
    set_limits:
      y: [0,1.]
