# The default plots of this model
#
# These can use the `based_on` feature with configurations specified in the
# accompanying *_base_plots.yml file and in the utopya base plot configs.
---
energy:
  based_on: energy

energy_boundary:
  based_on: energy
  model_name: PCPTopology

  to_plot:
    Energy/Boundary_area_elasticity: 
      label: Boundary area-elasticity

    Energy/Boundary_shape_elasticity: 
      label: Boundary shape-elasticity

energy_continuous:
  based_on: energy
  model_name: PCPTopology/PCPVertex

energy_boundary_continuous:
  based_on: energy
  model_name: PCPTopology/PCPVertex

  to_plot:
    Energy/Boundary_area_elasticity: 
      label: Boundary area-elasticity

    Energy/Boundary_shape_elasticity: 
      label: Boundary shape-elasticity

energy_polarity_continuous:
  based_on: energy
  model_name: PCPTopology/PCPVertex
  enabled: false

  to_plot:
    Energy/Cell_cell_polarity: 
      label: cell-cell-polarity
    Energy/Polarity_exclusion: 
      label: polarity-exclusion
    Energy/Lagrange_net_polarisation: 
      label: lagrange-net-polarisation
    Energy/Lagrange_const_concentration: 
      label: lagrange-const-concentration

transitions:
  based_on:
    - universe

  model_name: PCPTopology
  module: model_plots.PCPTopology
  plot_func: transitions

  map_to_continuous_time: True

transitions_continuous:
  based_on:
    - universe

  model_name: PCPTopology/PCPVertex
  module: model_plots.PCPTopology
  plot_func: transitions
  
  map_to_discrete_time: True

# Cell properties from cell statistics ----------------------------------------
cell_stats/area:
  based_on:
    - .default_style_and_helpers
    - universe
    - cell_property
    - select_cell_stats

  to_plot: 
    cells:
      label: all cells
    hair_cells:
      label: hair cells
    support_cells:
      label: support cells

  property: area

  helpers:
    set_labels:
      x: time
      y: average area

cell_stats/area_ratio:
  based_on:
    - .default_style_and_helpers
    - universe
    - cell_property
    - select_cell_stats

  to_plot: 
    ratio:
      label: data
      plot_std: false

  property: ~

  transform:
    - .sel:
      args: [!dag_tag hair_cells]
      kwargs:
        property: area
      tag: hair_area
    - .sel:
      args: [!dag_tag hair_cells]
      kwargs:
        property: area__stddev
    - div:
      args: [!dag_prev , !dag_tag hair_area]
      tag: hair_area__stddev
    - .sel:
      args: [!dag_tag support_cells]
      kwargs:
        property: area
      tag: support_area
    - .sel:
      args: [!dag_tag support_cells]
      kwargs:
        property: area__stddev
    - div:
      args: [!dag_prev , !dag_tag support_area]
      tag: support_area__stddev
    - div:
      args: [!dag_tag hair_area, !dag_tag support_area]
      tag: ratio

  helpers:
    set_labels:
      x: time
      y: average area

cell_stats/pref_area:
  based_on: cell_stats/area

  property: area_preferential

  helpers:
    set_labels:
      y: average pref. area

cell_stats/shape:
  based_on: cell_stats/area

  property: shape_index

  helpers:
    set_labels:
      y: average shape index

cell_stats/HC_neighbors:
  based_on:
    - .default_style_and_helpers
    - universe
    - cell_property
    - select_cell_stats

  to_plot:
    bulk_cells:
      label: all cells (bulk)
    bulk_hair_cells:
      label: hair cells (bulk)
    bulk_support_cells:
      label: support cells (bulk)

  property: num_hair_neighbors

  helpers:
    set_labels:
      x: time
      y: average hair cell neighbors

cell_stats/neighbors:
  based_on: cell_stats/HC_neighbors

  property: num_neighbors

  helpers:
    set_labels:
      y: average neighbors

cell_stats/hexatic_order:
  based_on:
    - .default_style_and_helpers
    - universe
    - cell_property
    - select_cell_stats

  to_plot: 
    bulk_hair_cells:
      label: hair cells (bulk)
      plot_min_max: True
  
  property: hexatic_order

  helpers:
    set_labels:
      x: time
      y: average hexatic_order

cell_stats/rotation:
  based_on:
    - .default_style_and_helpers
    - universe
    - cell_property
    - select_cell_stats

  to_plot: 
    bulk_cells:
      label: all cells (bulk)

  property: rotation

  helpers:
    set_labels:
      x: time
      y: average rotation

cell_stats/neighbors_vs_area:
  based_on:
    - .basic_uni.lineplot
    - universe

  module: model_plots.PCPTopology
  plot_func: scatter_xy_data

  plot_time_color_gradient: true
  cmap: plasma

  select:
    # the data containing all cells
    bulk_hair_cells:
      path: data/PCPTopology/Statistics/Bulk_hair_cell_stats
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: area
    bulk_support_cells:
      path: data/PCPTopology/Statistics/Bulk_support_cell_stats
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: area
    y:
      path: data/PCPTopology/Statistics/Bulk_hair_cell_stats
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: num_neighbors
      
  transform:
    - div:
      args: [!dag_tag bulk_hair_cells, !dag_tag bulk_support_cells]
      tag: x

  helpers:
    set_labels:
      x: area av HC / av SC
      y: average hair cell neighbors
    set_limits:
      x: [0., 7.]
      y: [3., 15]

# Cell properties from cell data ----------------------------------------------
cell_properties/area:
  based_on:
    - .default_style_and_helpers
    - .dag.multiplot
    - universe
    - select_cells_properties

  to_plot: 
    - function: sns.lineplot
      data: !dag_result all_cells
      label: all cells
    - function: sns.lineplot
      data: !dag_result hair_cells
      label: hair cells
    - function: sns.lineplot
      data: !dag_result support_cells
      label: support cells

  select:
    property:
      path: data/PCPTopology/Cells
      transform:
        - .sel: [!dag_prev , {property: area}]
        - .rename: [!dag_prev , area]

  x: time
  y: area

  helpers:
    set_labels:
      x: time
      y: average area

cell_properties/pref_area:
  based_on: cell_properties/area
  select:
    property:
      path: data/PCPTopology/Cells
      transform:
        - .sel: [!dag_prev , {property: area_preferential}]
        - .rename: [!dag_prev , area_preferential]
  y: area_preferential
  helpers:
    set_labels:
      y: average pref. area

cell_properties/shape:
  based_on: cell_properties/area
  select:
    property:
      path: data/PCPTopology/Cells
      transform:
        - .sel: [!dag_prev , {property: shape_index}]
        - .rename: [!dag_prev , shape_index]
  y: shape_index
  helpers:
    set_labels:
      y: average shape index

cell_properties/HC_neighbors:
  based_on: cell_properties/area
  select:
    property:
      path: data/PCPTopology/Cells
      transform:
        - .sel: [!dag_prev , {property: num_hair_neighbors}]
        - .rename: [!dag_prev , num_hair_neighbors]
  y: num_hair_neighbors
  helpers:
    set_labels:
      y: average hair neighbors

cell_properties/neighbors:
  based_on: cell_properties/area
  select:
    property:
      path: data/PCPTopology/Cells
      transform:
        - .sel: [!dag_prev , {property: num_neighbors}]
        - .rename: [!dag_prev , num_neighbors]
  y: num_neighbors
  helpers:
    set_labels:
      y: average neighbors

cell_properties/hexatic_order:
  based_on: cell_properties/area
  select:
    property:
      path: data/PCPTopology/Cells
      transform:
        - .sel: [!dag_prev , {property: hexatic_order}]
        - .rename: [!dag_prev , hexatic_order]
  y: hexatic_order
  to_plot: 
    - function: sns.lineplot
      data: !dag_result hair_cells_bulk
      label: hair cells
  helpers:
    set_labels:
      y: average hexatic order

cell_properties/rotation:
  based_on: cell_properties/area
  select:
    property:
      path: data/PCPTopology/Cells
      transform:
        - .sel: [!dag_prev , {property: rotation}]
        - .rename: [!dag_prev , rotation]
  y: rotation
  to_plot: 
    - function: sns.lineplot
      data: !dag_result all_cells_bulk
      label: hair cells
  helpers:
    set_labels:
      y: average rotation

cell_properties/neighbors_vs_area:
  based_on:
    - .default_style_and_helpers
    - .dag.multiplot
    - universe
    - select_cells_properties.xy_data

  select:
    x:
      path: data/PCPTopology/Cells
      transform:
        - .sel: [!dag_prev , {property: area}]
        - .rename: [!dag_prev , area]
    y:
      path: data/PCPTopology/Cells
      transform:
        - .sel: [!dag_prev , {property: num_neighbors}]
        - .rename: [!dag_prev , num_neighbors]

  to_plot:
    - function: sns.scatterplot
      data: !dag_result all_cells

  x: area
  y: num_neighbors
  hue: time
      
energy_vs_SCHC_contacts: &energy_vs_contacts
  based_on: .basic_uni.lineplot
  creator: universe
  universes: all
  module: model_plots.PCPTopology
  plot_func: scatter_xy_data
  file_ext: png

  enabled: False

  plot_time_color_gradient: True
  cmap: plasma

  select:
    # the data containing all cells
    _cells: data/PCPTopology/Cells
    property:
      path: data/PCPTopology/Cells
      transform:
      - .sel:
        args: [!dag_tag _cells]
        kwargs:
          property: num_hair_neighbors
    y: 
      path: data/PCPTopology/Energy/Edge_contractility
    
  transform:
    - .sel:
      args: [!dag_tag _cells]
      kwargs:
        property: cell_type
    - create_mask:
      args: [!dag_prev , ==, 2]
    - .where:
      args: [!dag_tag property, !dag_prev ]
    - .mean:
      args: [!dag_prev  ,id]
      kwargs:
        skipna: True
      tag: x

  helpers:
    set_labels:
      x: average HC neighbors for SCs
      y: edge contractility energy

energy_vs_HCHC_contacts:
  <<: *energy_vs_contacts
  
  transform:
    - .sel:
      args: [!dag_tag _cells]
      kwargs:
        property: cell_type
    - create_mask:
      args: [!dag_prev , ==, 1]
    - .where:
      args: [!dag_tag property, !dag_prev ]
    - .mean:
      args: [!dag_prev , id]
      kwargs:
        skipna: True
      tag: x

  helpers:
    set_labels:
      x: average HC neighbors for HCs
      y: edge contractility energy

equilibrium_cellular_structure:
  based_on:
    - .default_style_and_helpers
    - cellular_structure

equilibrium_cellular_structure__area_elasticity: &Property
  based_on:
    - .default_style_and_helpers
    - cellular_structure

  enabled: false

  property: area_elasticity

  property_interpolation_kwargs:
    method: nearest
  property_interpolation_plot_kwargs:
    cmap: Reds

equilibrium_cellular_structure__cell_contractility:
  <<: *Property
  property: cell_contractility
equilibrium_cellular_structure__linetension:
  <<: *Property
  property: linetension
equilibrium_cellular_structure__edge_contractility:
  <<: *Property
  property: edge_contractility
equilibrium_cellular_structure__hexatic_order:
  <<: *Property
  property: hexatic_order
  property_hair_cells_only: True
equilibrium_cellular_structure__rotation:
  <<: *Property
  cell_marker_size: 0.
  property: rotation
  property_interpolation_plot_kwargs:
    cmap: seismic
    vmin: -3.1415
    vmax: 3.1415
  property_bulk_cells_only: False


cellular_structure_continuous:
  based_on:
    - .default_style_and_helpers
    - cellular_structure
  datapath: PCPTopology/PCPVertex

cellular_structure__property: !pspace
  based_on:
    - .default_style_and_helpers
    - cellular_structure
  datapath: PCPTopology/PCPVertex

  enabled: false

  property: !sweep
    default: area_elasticity
    values: 
      - area_elasticity
      - cell_contractility
      - linetension
      - edge_contractility
      - hexatic_order

  property_interpolation_kwargs:
    method: nearest
  property_interpolation_plot_kwargs:
    cmap: Reds

cell_neighbourhood: !pspace
  based_on:
    - .default_style_and_helpers
    - universe
    - _cell_neighbourhood

  select: &select_cell_neighbourhood
    area:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: area
    cell_type:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: cell_type
    shape_index:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: shape_index
    num_neighbors:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: num_neighbors
    num_hair_neighbors:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: num_hair_neighbors

  only_type: !sweep
    default: all
    values:
      - all
      - hair
      - support
      - support_hair
      - hair_hair
      
NotchDelta_densities:
  based_on: .basic_uni.lineplots
  model_name: PCPTopology
  file_ext: png

  to_plot:
    NotchDelta/Densities/Progenitor:
      label: Progenitor
      color: gray
    NotchDelta/Densities/Support:
      label: Support
      color: black
    NotchDelta/Densities/Hair:
      label: Hair
      color: red
    NotchDelta/Densities/Rosettes:
      label: Rosettes
      color: violet

  helpers:
    set_labels:
      x: time
      y: density
    set_limits:
      y: [0,1.]

    