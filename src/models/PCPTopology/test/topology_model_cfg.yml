---
PCPTopology:
  log_level: debug
  PCPVertex:
    log_level: info
    T1_barrier: 0.02
    T1_probability: 0.
    T1_separation_factor: 3
    T1_threshold: 0.03
    T2_threshold: 0.0075
    agent_manager:
      cell_manager:
        agent_params: {area_preferential: 1.0, area_preferential_var: 0.0, cell_type: progenitor,
          contractility: 1.0, shape_index_preferential: 3.6}
      edge_manager:
        agent_params: {contractility: 0.0, linetension: 0.0}
      setup_method: hexagonal
      setup_params:
        hexagonal: {hexagon_size: 0.62, lattice_columns: 8, lattice_rows: 8}
        single: {size: 0.62}
      vertex_manager:
        non_periodic_offset: [1, 1]
    area_elasticity: 1.0
    cell_cell_polarity_interaction: 0.0
    cell_initialisation_protein_level: 0.0
    cell_polarity_exclusion: 0.0
    data_manager:
      deciders:
        write_always: {type: always}
        write_interval: &id004
          args:
            intervals:
            - [0, 10]
          type: interval
      tasks:
        Cells: &id003 {active: false, decider: write_interval, trigger: build_interval}
        Edges: *id003
        Energy_areaelasticity: {active: false, decider: write_always, trigger: build_once}
        Energy_cell_cell_polarity: {active: false, decider: write_always, trigger: build_once}
        Energy_cell_contractility: {active: false, decider: write_always, trigger: build_once}
        Energy_edge_contractility: {active: false, decider: write_always, trigger: build_once}
        Energy_lagrange_const_concentration: {active: false, decider: write_always,
          trigger: build_once}
        Energy_lagrange_net_polarisation: {active: false, decider: write_always, trigger: build_once}
        Energy_linetension: {active: false, decider: write_always, trigger: build_once}
        Energy_polarity_exclusion: {active: false, decider: write_always, trigger: build_once}
        Energy_time: {active: false, decider: write_always, trigger: build_once}
        Energy_total: {active: false, decider: write_always, trigger: build_once}
        Vertices: *id003
        Cell_energies: *id003
        Edge_energies: *id003
        num_T1s: {active: false, decider: write_always, trigger: build_once}
        num_T1s_attempted: {active: false, decider: write_always, trigger: build_once}
        num_T2s: {active: false, decider: write_always, trigger: build_once}
        Statistics_time: {active: false, decider: write_always, trigger: build_once}
      triggers:
        build_always: {type: always}
        build_interval: *id004
        build_once:
          args: {time: 0}
          type: once
    dt: 0.01
    gamma: 0.0
    minimization_tolerance: 1e-08
    space: &id008
      extent: [1.0, 1.0]
      periodic: true
    update_scheme: steepest_gradient_adaptive
  data_manager:
    deciders:
      write_always: {type: always}
    tasks:
      Energy_time: {active: false, decider: write_always, trigger: build_once}
    triggers:
      build_always: {type: always}
      build_once:
        args: {time: 0}
        type: once
  minimization: {jiggle_intensity: 0.01, jiggle_tolerance: 1e-06, max_steps: 15000,
    num_repeat: 5, tolerance: 1e-08}
  operations: ~
  space: *id008
log_levels: {core: warning, data_io: warning, data_mngr: warning, model: info}
monitor_emit_interval: 2.0
num_steps: 3
output_path: test_data.h5
seed: 42
write_every: 1
write_start: 0

