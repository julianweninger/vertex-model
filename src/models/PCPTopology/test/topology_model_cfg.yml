---
PCPTopology:
  log_level: debug
  minimization: &Minimization
    dt: 0.01
    jiggle_intensity: 0.01
    jiggle_tolerance: 1e-06
    max_steps: 15000
    num_repeat: 5
    tolerance: 1e-08
  PCPVertex:
    work_function_terms:
    - area_elasticity:
        elastic_modulus: 1
        preferential_area: 1
    - cell_contractility:
        contractility: 1.
        preferential_shape: 3.72
    log_level: debug
    T1_barrier: 0.02
    T1_probability: 0.
    T1_separation_factor: 3
    T1_threshold: 0.03
    T2_threshold: 0.0075
    agent_manager:
      cell_manager:
        agent_params: 
          type: 0
      edge_manager: ~
      setup_method: hexagonal
      setup_params:
        hexagonal: {hexagon_size: 0.6204032394013997, hexagon_shape: pointy, lattice_columns: 8, lattice_rows: 8}
        single: {size: 0.6204032394013997}
        column: {size: 1., height: 1., num_cells: 4, offset: 1.}
      vertex_manager: ~
    boundary_parameter:
      area_elasticity: 0.
      area_preferential: 1.
      contractility: 0.
      shape_index_preferential: 3.62
    Energy_buffer_size: 20
    data_manager:
      deciders:
        write_always: {type: always}
        write_interval: &id004
          args:
            intervals:
            - [0, 10]
          type: interval
      tasks:
        Energy: &energy_continuous
          active: true
          trigger: build_once
          decider: write_always
        Energy_time: *energy_continuous

        Transitions: *energy_continuous
        Interface_length: *energy_continuous

        Vertices: &agents_continuous
          active: false
          trigger: build_interval
          decider: write_interval
        Cells: *agents_continuous
        Edges: *agents_continuous
        Cell_energies: &agent_energies_continuous
          active: false
          trigger: build_interval
          decider: write_interval
        Edge_energies: *agent_energies_continuous
      triggers:
        build_always: {type: always}
        build_interval: *id004
        build_once:
          args: {time: 0}
          type: once
    minimization: *Minimization
    space: &id008
      extent: [1.0, 1.0]
      periodic: true
  data_manager:
    deciders:
      write_always: {type: always}
    tasks:
      Energy_time: {active: false, decider: write_always, trigger: build_once}
    triggers:
      build_always: {type: always}
      build_once:
        args: {time: 0}
        type: once
  operations: ~
  initialisation: {
    0_add_noise: {enabled: False},
    1_by_proliferation: {enabled: False}
  }
  space: *id008
log_levels: {core: warning, data_io: warning, data_mngr: warning, model: info}
monitor_emit_interval: 2.0
num_steps: 3
output_path: test_data.h5
seed: 42
write_every: 1
write_start: 0

