---
PCPTopology:
  log_level: debug
  minimization: &Minimization
    update_scheme: steepest_gradient_adaptive
    dt: 0.01
    jiggle_intensity: 0.01
    jiggle_tolerance: 1e-06
    max_steps: 15000
    num_repeat: 5
    tolerance: 1e-08
  PCPVertex:
    log_level: debug
    T1_barrier: 0.02
    T1_probability: 0.
    T1_separation_factor: 3
    T1_threshold: 0.03
    T2_threshold: 0.0075
    agent_manager:
      cell_manager:
        agent_params: {area_preferential: 1.0, area_preferential_var: 0.0, cell_type: progenitor,
          contractility: 1.0, shape_index_preferential: 3.6}
      edge_manager:
        agent_params: {contractility: 0.0, linetension: 0.0}
      setup_method: hexagonal
      setup_params:
        hexagonal: {hexagon_size: 0.6204032394013997, lattice_columns: 8, lattice_rows: 8}
        single: {size: 0.6204032394013997}
        column: {size: 1., height: 1., num_cells: 4, offset: 1.}
      vertex_manager: ~
    area_elasticity: 1.0
    boundary_parameter:
      area_elasticity: 0.
      area_preferential: 1.
      contractility: 0.
      shape_index_preferential: 3.62
    cell_shape_implementation: contractile
    data_manager:
      deciders:
        write_always: {type: always}
        write_interval: &id004
          args:
            intervals:
            - [0, 10]
          type: interval
      tasks:
        Bulk_cell_stats: {active: false, decider: write_always, trigger: build_once}
        Bulk_hair_cell_stats: {active: false, decider: write_always, trigger: build_once}
        Bulk_support_cell_stats: {active: false, decider: write_always, trigger: build_once}
        Cell_energies: {active: false, decider: write_interval, trigger: build_interval}
        Cell_stats: {active: false, decider: write_always, trigger: build_once}
        Cells: {active: false, decider: write_interval, trigger: build_interval}
        Edge_energies: {active: false, decider: write_interval, trigger: build_interval}
        Edges: {active: false, decider: write_interval, trigger: build_interval}
        Energy_areaelasticity: {active: false, decider: write_always, trigger: build_once}
        Energy_boundary_area_elasticity: {active: false, decider: write_always, trigger: build_once}
        Energy_boundary_shape_elasticity: {active: false, decider: write_always, trigger: build_once}
        Energy_cell_contractility: {active: false, decider: write_always, trigger: build_once}
        Energy_edge_contractility: {active: false, decider: write_always, trigger: build_once}
        Energy_linetension: {active: false, decider: write_always, trigger: build_once}
        Energy_time: {active: false, decider: write_always, trigger: build_once}
        Energy_total: {active: false, decider: write_always, trigger: build_once}
        Hair_cell_stats: {active: false, decider: write_always, trigger: build_once}
        Interface_length: {active: false, decider: write_always, trigger: build_once}
        Statistics_time: {active: false, decider: write_always, trigger: build_once}
        Support_cell_stats: {active: false, decider: write_always, trigger: build_once}
        Vertices: {active: false, decider: write_interval, trigger: build_interval}
        transitions: {active: false, decider: write_always, trigger: build_once}
      triggers:
        build_always: {type: always}
        build_interval: *id004
        build_once:
          args: {time: 0}
          type: once
    minimization: *Minimization
    space: &id008
      extent: [1.0, 1.0]
      periodic: true
  data_manager:
    deciders:
      write_always: {type: always}
    tasks:
      Energy_time: {active: false, decider: write_always, trigger: build_once}
    triggers:
      build_always: {type: always}
      build_once:
        args: {time: 0}
        type: once
  operations: ~
  space: *id008
log_levels: {core: warning, data_io: warning, data_mngr: warning, model: info}
monitor_emit_interval: 2.0
num_steps: 3
output_path: test_data.h5
seed: 42
write_every: 1
write_start: 0

