---
PCPVertex:
  work_function_terms:
  - area_elasticity:
      elastic_modulus: 1
      preferential_area: 1
  - cell_contractility:
      contractility: 1.
      preferential_shape: 3.72
  log_level: debug
  T1_barrier: 1000.
  T1_probability: 1.
  T1_threshold: 0.2
  T2_threshold: 0.0075
  T1_separation_factor: 3
  agent_manager:
    cell_manager:
      agent_params:
        type: 0
    edge_manager: ~
    setup_method: hexagonal
    setup_params:
      hexagonal: {hexagon_size: 0.6204032394013997, hexagon_shape: pointy, lattice_columns: 8, lattice_rows: 8}
      single: {size: 0.6204032394013997}
      column: {size: 1., height: 1., num_cells: 4, offset: 1.}
    vertex_manager: ~
  boundary_parameter:
    area_elasticity: 0.
    area_preferential: 1.
    contractility: 0.
    shape_index_preferential: 3.62
  Energy_buffer_size: 20

  data_manager:
    deciders:
      write_always: {type: always}
    tasks:
      Energy_time: {active: false, decider: write_always, trigger: build_once}
    triggers:
      build_once:
        args: {time: 0}
        type: once
  minimization: &Minimization
    update_scheme: steepest_gradient
    dt: 0.01
    jiggle_intensity: 0.01
    jiggle_tolerance: 1e-06
    max_steps: 15000
    num_repeat: 5
    tolerance: 1e-08
  initial_jiggle: 0.
  space:
    extent: [1.0, 1.0]
    periodic: true

  
NotchDelta:
  lambda: 40
  atoh1_suppression: {rate_0: 1.0, rate_1: 1.0}
  atoh1_threshold: 1.0
  cell_manager:
    cell_params: null
    grid: {resolution: 16, structure: square}
    neighborhood: {mode: Moore}
  data_manager:
    deciders:
      write_always: {type: always}
      write_interval: &id003
        args:
          intervals:
          - [0, 1000000, 50]
        type: interval
    tasks:
      Density_time: {active: true, decider: write_always, trigger: build_once}
    triggers:
      build_always: {type: always}
      build_interval: *id003
      build_once:
        args: {time: 0}
        type: once
  rate_ph: {rate_0: 0.005, rate_1: 0.0}
  rate_ps: 0.01
  rate_swap: 0.1
  space: {periodic: true}


log_levels: {core: warn, data_io: warn, data_mngr: info, model: debug}
monitor_emit_interval: 2.0
num_steps: 0
output_path: test_data.h5
seed: 42
write_every: 1
write_start: 0
