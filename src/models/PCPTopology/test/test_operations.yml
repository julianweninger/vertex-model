---
default_minimization:
  update_scheme: steepest_gradient
  dt: 0.01

  tolerance: 1.e-8
  max_steps: 5
  num_steps: 2
  num_repeat: 5
  jiggle_tolerance: 1.e-6
  jiggle_intensity: 0.01
  temperature: 0.

apply_operation_prolog:
  times: []
  iterations_prolog: 4

  minimization: &Minimization
    num_repeat: 2
    num_steps: 2
    max_steps: 2
    tolerance: 1e10
    jiggle_tolerance: 1e10
    jiggle_intensity: 0.

apply_operation:
  times: [1]
  iterations: 5

  minimization: *Minimization

apply_operation_every:
  times: [2]
  iterations: 5

  minimization:
    num_repeat: 2
    num_steps: 2
    max_steps: 2
    tolerance: 1e10
    jiggle_tolerance: 1e10
    jiggle_intensity: 0.
    mode: every

apply_operation_once:
  times: [3]
  iterations: 5

  minimization: 
    num_repeat: 2
    num_steps: 2
    max_steps: 2
    tolerance: 1e10
    jiggle_tolerance: 1e10
    jiggle_intensity: 0.
    mode: once

apply_operation_manual:
  times: [4]
  iterations: 5

  minimization:
    num_repeat: 2
    num_steps: 2
    max_steps: 2
    tolerance: 1e10
    jiggle_tolerance: 1e10
    jiggle_intensity: 0.
    mode: manual
    
apply_operation_repeat:
  times: [5]
  iterations: 5

  minimization:
    num_repeat: 3
    num_steps: 2
    max_steps: 2
    tolerance: 1e10
    jiggle_tolerance: 1e10
    jiggle_intensity: 0.

apply_operation_epilog:
  times: []
  iterations_epilog: 4

  minimization: *Minimization

jiggle:
  times: []

jiggle__linetension_fluctuations_1:
  times: []
  minimization:
    update_scheme: steepest_gradient
    jiggle_intensity: 0.
    linetension_fluctuation: 0.3
    linetension_fluctuation_tau: 1.

    dt: 0.01
    num_steps: 1


jiggle__linetension_fluctuations_2:
  times: []
  minimization:
    update_scheme: steepest_gradient
    jiggle_intensity: 0.
    linetension_fluctuation: 0.
    linetension_fluctuation_tau: 1.

    dt: 0.01
    num_steps: 1

jiggle__linetension_fluctuations_3:
  times: []
  minimization:
    update_scheme: steepest_gradient
    jiggle_intensity: 0.
    linetension_fluctuation: 0.4
    linetension_fluctuation_tau: 1.

    dt: 0.02
    num_steps: 1

jiggle__area_fluctuations_1:
  times: []
  minimization:
    update_scheme: steepest_gradient
    jiggle_intensity: 0.
    linetension_fluctuation: 0.

    dt: 0.01
    num_steps: 1
    area_fluctuation: 0.3
    area_fluctuation_A_min: 0.4
    area_fluctuation_tau: 1.


jiggle__area_fluctuations_2:
  times: []
  minimization:
    update_scheme: steepest_gradient
    jiggle_intensity: 0.
    linetension_fluctuation: 0.

    dt: 0.01
    num_steps: 1
    area_fluctuation: 0.
    area_fluctuation_A_min: 0.4
    area_fluctuation_tau: 1.

jiggle__area_fluctuations_3:
  times: []
  minimization:
    update_scheme: steepest_gradient
    jiggle_intensity: 0.
    linetension_fluctuation: 0.

    dt: 0.02
    num_steps: 1
    area_fluctuation: 0.35
    area_fluctuation_A_min: 0.3
    area_fluctuation_tau: 1.


differentiate_random:
  times: []
  probability: 0.25

differentiate_random_fraction:
  times: []
  fraction: 0.23

differentiate_Collier:
  times: []
  steps: 100
  
  Collier:
    log_level: info
    cell_manager:
      grid: {resolution: 15, structure: square}
      neighborhood: {compute_and_store: false, mode: empty}
      cell_params:
        notch: 1.
        notch_sigma: 0.2
        delta: 1.
        delta_sigma: 0.2
        nicd: 0.1
        nicd_sigma: 0.02
    data_manager:
      deciders:
        write_always: {type: always}
      tasks:
        Density_time: {active: true, decider: write_always, trigger: build_once}
      triggers:
        build_once: {type: once}
    space: {periodic: false}

    time_resolution: 1000
    degradation_delta: 1.
    degradation_notch: 1.
    production_notch: 1.
    production_delta: 50.
    production_nicd: 200.
    interaction_strength_trans: 1.
    interaction_strength_cis: 10.
    cooperativity_delta: 1.
    cooperativity_nicd: 1.
    notch_threshold_factor: 0.1

differentiate_Collier_second_task:
  times: []
  steps: 10

  # reusing the Collier model from `differentiate_Collier`

differentiate_NotchDelta: &NotchDelta
  times: []
  steps: 100
  
  NotchDelta: &NotchDelta
    log_level: info
    lambda: 40
    atoh1_suppression: {rate_0: 10.0, rate_1: 1.0}
    atoh1_threshold: 1.0
    cell_manager:
      cell_params: null
      grid: {resolution: 15, structure: square}
      neighborhood: {compute_and_store: false, mode: empty}
    data_manager:
      deciders:
        write_always: {type: always}
      tasks:
        Density_time: {active: true, decider: write_always, trigger: build_once}
      triggers:
        build_once: {type: once}
    rate_ph: {rate_0: 0.008, rate_1: 0.0}
    rate_ps: 0.01
    rate_swap: 1.0
    space: {periodic: false}

differentiate_NotchDelta_skip_init:
  Random:
    times: []
    probability: 0.35
    
  NotchDelta:
    times: []
    steps: 0

    discard_initialisation: True
    
    NotchDelta: *NotchDelta
    
  NotchDelta_2nd_task:
    times: []
    steps: 100

differentiate_NotchDelta_second_task:
  times: []
  steps: 10

  # reusing the NotchDelta model from `differentiate_NotchDelta`

increment_area:
  times: []

  progenitor: 1.
  stddev_progenitor: 0.1
  hair: 2.
  stddev_hair: 0.2
  support: 3.
  stddev_support: 0.3

increment_area_adapt:
  times: []

  hair: 1.
  stddev_hair: 0.1
  adapt_support: True

increment_area_relax:
  times: []

  hair: 1.
  stddev_hair: 0.1
  support: 2.
  stddev_support: 0.3
  relax_domain: True

increment_cell_contractility:
  times: []

  progenitor: 1.
  hair: 2.
  support: 3.

increment_domain:
  times: []

  value: [0.1, 0.2] # increment by values
  compensate: false

increment_domain_area:
  times: []

  value: 0.02 # increment by area value -- keep ratio
  compensate: false

increment_domain_compensate:
  times: []

  value: 0.1
  compensate: true
  fix_hair_cell_area: false

increment_domain_compensate_fix_hc:
  times: []

  value: 0.1
  compensate: true
  fix_hair_cell_area: true

increment_domain_compensate_fix_sc:
  times: []

  value: 0.1
  compensate: true
  fix_support_cell_area: true

increment_edge_contractility: &edge_props
  times: []
  progenitor_progenitor: 0.11
  progenitor_hair: 0.
  progenitor_support: 0.
  hair_hair: 0.22
  hair_support: 0.23
  support_support: 0.33

increment_edge_contractility_heterogeneous:
  times: []
  set_ppMLC: 0.1
  set_ppMLC_angle: 1.5708 # pi / 2
  set_pMLC: -0.2  # NOTE non-physical

increment_linetension: *edge_props

increment_shape_index:
  times: []

  progenitor: 1.
  hair: 2.
  support: 3.

proliferate:
  times: []
  num_increases: 1
  area_threshold: 0.

  minimization_after_increase:
    tolerance: 1000
    num_repeat: 1
    jiggle_tolerance: 1000
    jiggle_intensity: 0.

relax_area:
  times: []

  factor: 0.1
  minimum: 0.1
  maximum: 15.

relax_area_minimum:
  times: []

  factor: 1.

  # preferential areas initialised very large, then relaxed
  minimum: 12.
  minimum_hair: 18.
  minimum_support: 16.

relax_area_maximum:
  times: []

  factor: 1.
  # preferential areas initialised very small, then relaxed
  maximum: 0.4
  maximum_hair: 0.3
  maximum_support: 0.2

set_area:
  times: []

  progenitor: 2.
  stddev_progenitor: 0.1
  hair: 4.
  stddev_hair: 0.2
  support: 5.
  stddev_support: 0.3

set_area_partial:
  times: []

  hair: 0. # do not change areas of HCs
  support: 6.
  stddev_support: 0.2

set_area_fixed:
  times: []

  hair: 2. # do not change areas of HCs
  # stddev_hair: 0. by default
  support: 7.
  stddev_support: 0.  # no variation

set_area_relax:
  times: []

  hair: 4.
  stddev_hair: 0.2
  support: 5.
  stddev_support: 0.3
  relax_domain: True

set_area_relax_PD_axis:
  times: []

  hair: 4.
  stddev_hair: 0.2
  support: 5.
  stddev_support: 0.3
  relax_domain_PD_axis: True

set_area_relax_PD_axis_FAIL:
  times: []

  hair: 4.
  stddev_hair: 0.2
  support: 5.
  stddev_support: 0.3

  # can't both be True
  relax_domain_PD_axis: True
  relax_domain: True
