# The model configuration for the PCPTopology model
#
# This file should ONLY contain model-specific configuration and needs to be
# written such that it can be used by _every_ model instance, regardless
# of the level within a model hierarchy.
# 
# To that end, it needs to specify the parameters at the level of the instance
# of a Model class.
# 
# This file is usually handled by the frontend: usage of advanced yaml features
# like anchors and tags is supported.
# 
# Note, however, that this file should hold the _default_ values for a single
# instance. Therefore, parameter sweeps should not be specified here!
# Furthermore, if including other models' parameters via the `!model` tag, make
# sure that no circular includes occur.
---
# --- Space
# The physical space this model is embedded in
space: &SPACE
  extent: [1., 1.]
  periodic: true

# --- Operations
# Proliferation -- cell division
proliferation:
  active: True
  times:
    prolog: 8
    begin: -1
    end: -1
    iterates: 0
    emit_interval: 4

# Differentiation of progenitor to hair and support cells
differentiation:
  active: True
  times:
    prolog: 0
    begin: 0
    end: 0
    iterates: 1
    emit_interval: 0

  hair_cell_fraction: 0.25  # only used if method='random'
  notch_delta_steps: 1000
  method: NotchDelta    # can be: NotchDelta, random
  
  # the matrices defining the interaction for the additional cell types
  linetension:
    progenitor_progenitor: &Linetension 0.1
    progenitor_hair: *Linetension
    progenitor_support: *Linetension
    hair_hair: 0.12
    hair_support: *Linetension
    support_support: *Linetension

  area_preferential:
    progenitor: &Area_preferential 1.
    hair: *Area_preferential
    support: *Area_preferential

  contractility:
    progenitor_progenitor: &Contractility 0.02
    progenitor_hair: *Contractility
    progenitor_support: *Contractility
    hair_hair: *Contractility
    hair_support:  *Contractility
    support_support: *Contractility

# stretch the domain
stretch_domain:
  active: True
  times:
    begin: 1
    # no end
  stretch_speed: [0.01, 0.0]
  fix_hair_cell_volume: True

# for the growth of hair cells at the expense of the support cells
Environment:
  cell_manager:
    cell_params: ~
    grid:
      structure: square
      resolution: 1
  
  area_preferential_hair: *Area_preferential
  area_preferential_support: *Area_preferential
  
  env_param_funcs:
    - increment:
        area_preferential_hair:
          value: 0.05
          times: !listgen [1, 10000]
          invoke_at_initialization: False
          # increase is compensated by support cells
  init_env_state_funcs: ~
  env_state_funcs: ~

# A model used in differentiation
NotchDelta:
  space: &NOTCHSPACE
    periodic: false

  # --- CellManager and cell initialization
  cell_manager:
    grid:
      structure: square
      resolution: 15   # this is automatically set

    neighborhood:
      mode: empty      # the neighborhood is automatically inherited from the
                       # Vertex model 

    # Cell initialization parameters
    cell_params: ~

  # -- Dynamics
  rate_ph:
    rate_0: 8.e-3 # the rate above threshold
    # the rates below threshold
    #   if more than one entry given, linear mapping.
    #   latter rates correspond to lower concentrations of atoh1
    rate_1: 0.

  rate_ps: 1.e-2

  atoh1_suppression:
    # in every step the atoh1 level in neighboring cells is divided by this value 
    rate_0: 10. # for 0 HC neighbors
    # for one or more HC neighbors
    #   if more than one entry given, each entry for one more neighbor
    #   i.e. rate_1 for one HC neighbor, rate_2 for 2 HC neighbors, etc.
    #   last entry for n or more HC neighbors 
    rate_1: 1.
  
  # HC differentiate if atoh1 accumulated above threshold
  atoh1_threshold: 1.
  
  # Swap state with a neighbor with this probability if HC-HC contact
  rate_swap: 1.

  # for the accumulation of atoh1
  Environment:
    space: *NOTCHSPACE

    env_state_funcs:
      - noise:
          atoh1:
            mode: add
            distribution: exponential
            lambda: 100

  data_manager:
    # this builds the deciders
    deciders:
      write_always:
        type: always

    # this builds the triggers, here deciders are used
    triggers:      
      build_once:
        type: once
      
    # the tasks
    tasks:
      Density_progenitor: &density
        active: true
        trigger: build_once
        decider: write_always
      Density_hair: *density
      Density_support: *density
      Density_ratio_hair_support: *density
      Number_hair_hair_contacts: *density
      Density_time: *density


# --- Dynamics
# Equilibration parameter
equilibration:
  tolerance: 1.e-8
  num_steps: 1000
  num_iterations: 1
  # NOTE after num_steps tolerance is checked, repeated for num_iterations
  num_jiggle: 5
  jiggle_intensity: 0.01
  jiggle_tolerance: 1.e-6

# epilog:
#   set_noise_const: 0.1
#   # set_noise_linear: 0.01
#   num_epilog_steps: 150000

# The model for energy minimization
PCPVertex:
  space: *SPACE

  # --- Initialization parameters
  agent_manager:
    setup_method: hexagonal
    setup_params:
      single:
        size: 0.62
      hexagonal:
        hexagon_size: 0.62
        lattice_rows: 8
        lattice_columns: 8
    vertex_manager:
      non_periodic_offset: [1, 1]

    edge_manager:
      agent_params:
        linetension: *Linetension
        contractility: *Contractility

    cell_manager:
      agent_params:
        area_preferential: *Area_preferential
        contractility: 0.
        cell_type: progenitor


  # --- Dynamics
  # damping factor
  dt: 0.01
  update_scheme: conjugate_gradient

  area_elasticity: 1.

  # Polarity interaction
  gamma: 0.
  cell_cell_polarity_interaction: 0.
  cell_polarity_exclusion: 0.
  cell_initialisation_protein_level: 0.

  T1_threshold: 0.1
  T1_probability: 0.05
  T1_barrier: 0.02
  T2_threshold: 0.075

  data_manager: &data_manager
    # this builds the deciders
    deciders:
      write_always:
        type: always
      
      write_slice: &slicer
        type: slice
        args:
          start: 0
          stop: 1
          step: 1

      write_at_last:
        type: once
        args: 
          time: 1000000

    # this builds the triggers, here deciders are used
    triggers:
      build_slice: *slicer

      build_once:
        type: once
        args:
          time: 0
      
      build_once_at_1:
        type: once
        args:
          time: 1
      
      build_always:
        type: always

      build_at_last:
        type: once
        args: 
          time: 1000000      
  
    # these are the datasets written
    tasks:
      Energy_total: &energy
        active: true
        trigger: build_once
        decider: write_always
      Energy_linetension: 
        <<: *energy
      Energy_areaelasticity: 
        <<: *energy
      Energy_contractility: 
        <<: *energy
      Energy_time:
        <<: *energy

      # the polarity energies
      Energy_cell_cell_polarity: 
        <<: *energy
        active: false
      Energy_polarity_exclusion: 
        <<: *energy
        active: false
      Energy_lagrange_net_polarisation: 
        <<: *energy
        active: false
      Energy_lagrange_const_concentration: 
        <<: *energy
        active: false

      Vertex_position: &position
        active: false
        trigger: build_slice
        decider: write_slice
      Cell_position: *position
      Edge_link: *position

# plotting
data_manager:
  # this builds the deciders
  deciders:
    write_always:
      type: always
    
    write_slice: &slicer_2
      type: slice
      args:
        start: 0
        stop: 10000
        step: 5

    write_composite: &slicer_comp
      type: simple_composite
      args:
        interval:
          intervals:
            - [0, 2]
        slice:
          start: 0
          stop: 500
          step: 5

    write_at_last:
      type: once
      args: 
        time: 1000000

  # this builds the triggers, here deciders are used
  triggers:
    build_slice: *slicer_2

    build_once:
      type: once
      args:
        time: 0
    
    build_once_at_1:
      type: once
      args:
        time: 1
    
    build_always:
      type: always

    build_composite: *slicer_comp

    build_at_last:
      type: once
      args: 
        time: 1000000
  
  # these are the datasets written
  tasks:
    Cell_area: &Statistics
      active: true
      trigger: build_once
      decider: write_always
    Statistics_time: *Statistics
    Cell_neighbourhood: *Statistics    
    Cell_area_histogram: *Statistics

    Vertex_position: &Position_topology
        active: true
        trigger: build_composite
        decider: write_composite

    Cell_position: *Position_topology

    Edge_link: *Position_topology

