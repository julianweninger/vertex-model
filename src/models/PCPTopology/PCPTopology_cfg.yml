# The model configuration for the PCPTopology model
#
# This file should ONLY contain model-specific configuration and needs to be
# written such that it can be used by _every_ model instance, regardless
# of the level within a model hierarchy.
# 
# To that end, it needs to specify the parameters at the level of the instance
# of a Model class.
# 
# This file is usually handled by the frontend: usage of advanced yaml features
# like anchors and tags is supported.
# 
# Note, however, that this file should hold the _default_ values for a single
# instance. Therefore, parameter sweeps should not be specified here!
# Furthermore, if including other models' parameters via the `!model` tag, make
# sure that no circular includes occur.
---
# --- Space
# The physical space this model is embedded in
space: &SPACE
  extent: [1., 1.]  # NOTE this is ignored in vertex model
  periodic: true

# --- Operations
# A proliferation of cells before prolog operations

# Often used initialisations
initialisation:
  # Add some noise to initial lattice
  0_add_noise:
    enabled: true

    minimization:
      num_repeat: 1

  # Proliferate cells
  1_by_proliferation:
    enabled: true
    num_generations: 1
    minimization_between_generations: ~
    minimization:
      num_repeat: &equilibration_time 25

# The sequence of operations
operations:  
  # this happens after the proliferation
  
  # - differentiate_NotchDelta:
  #     times: []
  #     iterations_prolog: 2
      
  #     steps: 1000        # only used if method='NotchDelta'

  # - increment_area:
  #     times: !listgen [0, 10, 1]
      
  #     hair: 0.01
  #     stddev_hair: 0.01
  #     adapt_support: true

  # - increment_domain:
  #     times: []

  #     value: [0., 0.]
  #     compensate: true
  #     fix_hair_cell_area: false

  # - increment_shape_index:
  #     times: []

  #     progenitor: 0.
  #     hair: 0.
  #     support: 0.

  # - increment_linetension:
  #     times: []
      
  #     hair_hair: 10.
  #     support_support: 0.

  # - increment_edge_contractility:
  #     times: []
      
  #     hair_hair: 0.
  #     support_support: 0.

  - void: # this is a void operation, but calling minimization
      times: []
      iterations_epilog: 4

      emit_interval: 4


# --- Dynamics
# Minimization parameter
minimization: &Minimization
  update_scheme: steepest_gradient
  dt: 0.05
  num_steps: 20

  linetension_fluctuations: 0.01
  linetension_fluctuations_tau: 24

  tolerance: 1.e-8
  jiggle_tolerance: 1.e-6
  jiggle_intensity: 0.
  
  max_steps: 15000

  num_repeat: 1


# The model for energy minimization
PCPVertex:
  log_level: info

  initial_jiggle: 1.e-2

  space: *SPACE

  # --- Initialization parameters
  work_function_terms:
  - linetension_fluctuations:
      amplitude: 0.02
      timescale: 24
  - area_elasticity:
      elastic_modulus: 1
      preferential_area: 1
  - cell_contractility:
      contractility: 1.
      preferential_shape: 3.72

  # --- Initialization parameters
  agent_manager:
    setup_method: hexagonal
    setup_params:
      single:
        size: !expr (2 / 3**1.5)**0.5
      hexagonal:
        hexagon_size: !expr (2 / 3**1.5)**0.5
        hexagon_shape: pointy_top
        # NOTE either pointy_top or flat_top
        lattice_rows: 4
        lattice_columns: 4
      column:
        size: 1.
        height: 1.
        num_cells: 8
        offset: 1.
    
    vertex_manager: ~

    edge_manager: ~

    cell_manager:
      agent_params:
        type: 0

  # --- Dynamics
  minimization: *Minimization

  T1_threshold: 0.03
  T1_separation_factor: 1.05
  T1_probability: 1.
  T1_barrier: 0.06
  T1_timeout: 12
  T2_threshold: 0.0075

  Energy_buffer_size: !expr 24 * 20

  data_manager: &data_manager
    deciders:
      write_always: {type: always}
      write_interval: &interval_continuous
        type: interval
        args:
          intervals:
            - [0, 100, 24]
      write_at_equilibrium:
        type: equilibrium_decider
    triggers:
      build_interval: *interval_continuous
      build_once:
        type: once
        args:
          time: 0
      build_always: {type: always}
    tasks:
      Energy: &energy_continuous
        active: true
        trigger: build_once
        decider: write_always
      Energy_time: *energy_continuous

      Transitions: *energy_continuous
      Interface_length: *energy_continuous

      Vertices: &agents_continuous
        active: true
        trigger: build_interval
        decider: write_interval
      Cells: *agents_continuous
      Edges: *agents_continuous
      Cell_energies: &agent_energies_continuous
        active: false
        trigger: build_interval
        decider: write_interval
      Edge_energies: *agent_energies_continuous

# plotting
data_manager:
  deciders:
    write_always: {type: always}
    write_interval: &interval
      type: interval
      args:
        intervals:
          - [0, 10, 1]
          - [10, 100, 10]
  triggers:
    build_once:
      type: once
      args:
        time: 0
    build_always: {type: always}
    build_interval: *interval
  
  # these are the datasets written
  tasks:
    Energy: &energy
      active: true
      trigger: build_once
      decider: write_always
    Energy_time: *energy
    Continuous_time: *energy
    
    Transitions: *energy
    Interface_length: *energy
    
    Vertices: &agents_equilibrium
      active: true
      trigger: build_interval
      decider: write_interval
    Cells: *agents_equilibrium
    Edges: *agents_equilibrium

    Cell_energies: &agent_energies
      active: true
      trigger: build_interval
      decider: write_interval
    Edge_energies: *agent_energies

    Cell_cluster: 
      <<: *agents_equilibrium
      active: false

    PCP_Cells:
      active: false
      trigger: build_interval
      decider: write_interval
    PCP_Proteins:
      active: false
      trigger: build_interval
      decider: write_interval