# The evaluation of default_proliferation_minimal
---
energy:
  based_on: energy

energy_continuous:
  based_on: 
    - energy
    - select.uni.continuous_energy_terms

transitions:
  based_on: transitions

transitions_cumulated:
  based_on: transitions
  cumsum_transitions: true

transitions_continuous:
  based_on: transitions_continuous
  cumsum_transitions: true



cell_properties:
  based_on:
    - .plot.multiplot
    - universe
    - select_cells_properties
  enabled: False

  select:
    property:
      path: data/PCPTopology/Cells

  to_plot: 
    - function: sns.lineplot
      data: !dag_result all_cells
      label: all cells
      ci: sd
    - function: sns.lineplot
      data: !dag_result hair_cells
      label: hair cells
      ci: sd
    - function: sns.lineplot
      data: !dag_result support_cells
      label: support cells
      ci: sd

  x: time

  helpers:
    set_labels:
      x: time

cell_properties/area:
  based_on: cell_properties
  select:
    property:
      transform:
        - .sel: [!dag_prev , {property: area}]
        - .rename: [!dag_prev , area]
  y: area
  helpers:
    set_labels:
      y: average area


cell_properties/shape:
  based_on: cell_properties
  select:
    property:
      transform:
          - .sel: [!dag_prev , {property: perimeter}]
          - .sel: [!dag_node -2, {property: area_preferential}]
          - pow: [!dag_node -1 , 0.5]
          - div: [!dag_node -3, !dag_node -1]
          - .rename: [!dag_prev , shape_index]
  y: shape_index
  helpers:
    set_labels:
      y: average shape index
      
      
equilibrium_cellular_structure:
  based_on: cellular_structure

cellular_structure:
  based_on: cellular_structure
  datapath: PCPTopology/PCPVertex


cell_neighbourhood: !pspace
  based_on:
    - universe
    - _cell_neighbourhood

  select: &select_cell_neighbourhood
    area:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: area
    cell_type:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: cell_type
    shape_index:
      path: data/PCPTopology/Cells
      transform:
        - .sel: [!dag_prev , {property: perimeter}]
        - .sel: [!dag_node -2, {property: area_preferential}]
        - pow: [!dag_node -1 , 0.5]
        - div: [!dag_node -3, !dag_node -1]
        - .rename: [!dag_prev , shape_index]
    num_neighbors:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: num_neighbors
    num_hair_neighbors:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: num_hair_neighbors

  only_type: !sweep
    default: all
    values:
      - all
      - hair
      - support
      - support_hair
      - hair_hair
