# --- Cell segmentation ------------------------------------------------------
cell_segmentation:
  based_on:
    - cellular_structure
    - single_universe
    - my_style

  select:
    edge_property:
      path: data/PCPTopology/Edges
      transform:
        - .sel: [!dag_node -1, {property: edge_contractility_polar__contractility}]
        - call_lambda:
          - "lambda d: (d - d.min()) / np.abs(d.max() - d.min() + 1.e-8)"
          - !dag_prev
        - .sel: [!dag_node -3, {property: edge_contractility_axial__contractility}]
        - call_lambda:
          - "lambda d: (d - d.min()) / np.abs(d.max() - d.min() + 1.e-8)"
          - !dag_prev
        - call_lambda:
          - "lambda pMLC, ppMLC: pMLC - ppMLC"
          - !dag_node -3
          - !dag_node -1
        - .rename: [!dag_prev , Contractility (diverging to high values)]
    vector_property:
      path: data/PCPTopology/Cells
      transform:
        - .sel: [!dag_prev , {property: edge_contractility_polar__polarity}]
        - .sel: [!dag_node -2, {property: cell_type}]
        - create_mask: [!dag_prev , ==, 1]
        - .where: [!dag_node -3, !dag_node -1]
        - .rename: [!dag_prev , polarity]
    property:
      path: data/PCPTopology/Cells
      transform:
        - .sel: [!dag_prev , {property: edge_contractility_polar__polarity_to_axis}]
        - add: [!dag_prev , 3.1416]
        - call_lambda:
          - "lambda data: (data <= 1 / 4 * math.pi) | (data > 7 / 4 * math.pi)"
          - !dag_node -1
          # right
        - call_lambda:
          - "lambda data: (data > 1 / 4 * math.pi) & (data <= 3 / 4 * math.pi)"
          - !dag_node -2
          # up
        - call_lambda:
          - "lambda data: (data > 3 / 4 * math.pi) & (data <= 5 / 4 * math.pi)"
          - !dag_node -3
          # left
        - call_lambda:
          - "lambda data: (data > 5 / 4 * math.pi) & (data <= 7 / 4 * math.pi)"
          - !dag_node -4
          # down
        - call_lambda: 
          - "lambda qr, qu, ql, qd: xr.where(qr, -0.75, xr.where(ql, -1, xr.where(qu, 0.75, 1)))"
          - !dag_node -4
          - !dag_node -3
          - !dag_node -2
          - !dag_node -1
        - .sel: [!dag_node -8, {property: cell_type}]
        - call_lambda:
          - "lambda d, type: d.where(type==1)"
          - !dag_node -2
          - !dag_node -1
        - .sel: [!dag_node -10, {property: is_boundary}]
        - call_lambda:
          - "lambda d, boundary: d.where(boundary==0)"
          - !dag_node -2
          - !dag_node -1
        - .rename: [!dag_prev , Polarity]
  
  cell_center_marker_kwargs:
    s: 0
    colors: ['white', 'white', 'white']

  property_interpolation_plot_kwargs:
    interpolation: nearest
    cmap: brg

  vector_property_kwargs:
    scale: 1.5
    width: 0.0025
    headlength: 2.5
    headwidth: 2.

  quiver_kwargs:
    cmap: RdBu
    width: 0.001
    clim: [-1., 1.]