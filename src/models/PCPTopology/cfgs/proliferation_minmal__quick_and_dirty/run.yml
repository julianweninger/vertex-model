# A minimal configuration to do cell proliferation
# In quick and dirty during proliferation the energy is not minimized.
# This results in a significant (~ factor 100) speed up with similar results.
#
# The model can be run by typing : 
# $ cd /path-to-Utopia/vertex-model
# $ utopia run PCPTopology src/models/PCPTopology/cfgs/<choose>/run.yml \
#          --plots-cfg src/models/PCPTopology/cfgs/<choose>/eval.yml
#
# The content of this file is used to update the corresponding entries in
# ../PCPTopology_cfg.yml
---
paths:
  model_note: default_proliferation_quick_and_dirty

parameter_space:
  num_steps: 2

  PCPTopology:
    operations:
      - jiggle:
          times: []
          iterations_prolog: 1

          minimization: &MinimzationQuickAndDirty
            jiggle_intensity: 1.e-3
            num_repeat: 5
            tolerance: 1.e-8
            jiggle_tolerance: 1.e-6

      - proliferate:
          times: [1]
          emit_interval: 32

          iterations: 16

          num_increases: 0
          area_threshold: 0.

          minimization:
            mode: manual
      # 32 cells

      # NOTE time 2: jiggle (see last operation)

      - proliferate:
          times: [4]
          iterations_prolog: 0
          iterations_epilog: 0
          emit_interval: 32

          iterations: 32

          num_increases: 0
          area_threshold: 0.

          minimization:
            mode: manual
      # 64 cells

      - proliferate:
          times: [5]
          iterations_prolog: 0
          iterations_epilog: 0
          emit_interval: 32

          iterations: 64

          num_increases: 0
          area_threshold: 0.

          minimization:
            mode: manual
      # 128 cells
      
      - proliferate:
          times: [6]
          iterations_prolog: 0
          iterations_epilog: 0
          emit_interval: 32

          iterations: 128

          num_increases: 0
          area_threshold: 0.

          minimization:
            mode: manual
      # 256 cells
      
      - proliferate:
          times: [7]
          iterations_prolog: 0
          iterations_epilog: 0
          emit_interval: 32

          iterations: 256

          num_increases: 0
          area_threshold: 0.

          minimization:
            mode: manual
      # 512 cells
      
      - proliferate:
          times: [8]
          iterations_prolog: 0
          iterations_epilog: 0
          emit_interval: 32

          iterations: 512

          num_increases: 0
          area_threshold: 0.

          minimization:
            mode: manual
      # 1024 cells
      
      - proliferate:
          times: [9]
          iterations_prolog: 0
          iterations_epilog: 0
          emit_interval: 32

          iterations: 1024

          num_increases: 0
          area_threshold: 0.

          minimization:
            mode: manual
      # 2048 cells 
      
      - proliferate:
          times: [10]
          iterations_prolog: 0
          iterations_epilog: 0
          emit_interval: 32

          iterations: 2048

          num_increases: 0
          area_threshold: 0.

          minimization:
            mode: manual
      # 4096 cells 

      - jiggle:
          times: !listgen [2, 1000]

    PCPVertex:
      log_level: warn

      data_manager:
        deciders:
          write_interval: &interval_continuous
            type: interval
            args:
              intervals:
                - [100, 800, 100]
        triggers:
          build_interval: *interval_continuous
          
    data_manager:
      deciders:
        write_interval: &interval
          type: interval
          args:
            intervals:
              - [0, 12, 1]
              - [12, 32, 4]
              - [32, 128, 8]
      triggers:
        build_interval: *interval
