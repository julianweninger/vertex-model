# A minimal configuration to do cell proliferation
# In quick and dirty during proliferation the energy is not minimized.
# This results in a significant (~ factor 100) speed up with similar results.
#
# The model can be run by typing : 
# $ cd /path-to-Utopia/vertex-model
# $ utopia run PCPTopology src/models/PCPTopology/cfgs/<choose>/run.yml \
#          --plots-cfg src/models/PCPTopology/cfgs/<choose>/eval.yml
#
# The content of this file is used to update the corresponding entries in
# ../PCPTopology_cfg.yml
---
paths:
  model_note: default_proliferation_quick_and_dirty

parameter_space:
  num_steps: 2

  PCPTopology:
    minimization:
      update_scheme: conjugate_gradient
      dt: 0.01

      tolerance: 1.e-8
      max_steps: 15000
      num_repeat: 50
      jiggle_tolerance: 1.e-6
      jiggle_intensity: 0.1

    operations:
      - jiggle:
          times: []
          iterations_prolog: 1

          minimization:
            num_repeat: 1
            jiggle_intensity: 1.e-3

      - proliferate:
          times: [1]
          iterations_prolog: 0
          iterations_epilog: 0
          emit_interval: 32

          iterations: 16

          num_increases: 0
          area_threshold: 0.

          minimization:
            mode: manual

      - jiggle:
          times: [2]
          
      - proliferate:
          times: !listgen [3, 1000]
          iterations_prolog: 0
          iterations_epilog: 0
          emit_interval: 32

          iterations: 16

          num_increases: 0
          area_threshold: 0.

          minimization:
            mode: manual

      - jiggle:
          times: !listgen [3, 1000]

    PCPVertex:
      log_level: warn

      data_manager:
        deciders:
          write_interval: &interval_continuous
            type: interval
            args:
              intervals:
                - [100, 800, 100]
        triggers:
          build_interval: *interval_continuous
          
    data_manager:
      deciders:
        write_interval: &interval
          type: interval
          args:
            intervals:
              - [0, 12, 1]
              - [12, 32, 4]
              - [32, 128, 8]
      triggers:
        build_interval: *interval
