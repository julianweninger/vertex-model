# A minimal configuration to do cell proliferation 
#
# The model can be run by typing : 
# $ cd /path-to-Utopia/vertex-model
# $ utopia run PCPTopology src/models/PCPTopology/cfgs/<choose>/run.yml \
#          --plots-cfg src/models/PCPTopology/cfgs/<choose>/eval.yml
#
# The content of this file is used to update the corresponding entries in
# ../PCPTopology_cfg.yml
---
paths:
  model_note: default_proliferation

parameter_space:
  seed: 0
  num_steps: 3

  PCPTopology:
    initialisation:
      1_by_proliferation:
        enabled: false

    operations:
      - proliferate:
          times: !listgen [101]
          iterations_prolog: 0
          iterations_epilog: 0
          emit_interval: 0

          num_increases: 4
          area_threshold: 1.75

          minimization_after_increase: ~
          minimization: ~     # use default

    PCPVertex:
      log_level: info
      work_function_terms:
      - linetension_fluctuations:
          amplitude: 0.02
          timescale: 24
      - area_elasticity:
          elastic_modulus: 1
          preferential_area: 1
      - cell_contractility:
          contractility: 1.
          preferential_shape: 3.72

    data_manager:
      deciders:
        write_interval: &Interval
          type: interval
          args:
            intervals:
              - [0, 5, 1]
              - [5, 25, 5]
              - [25, 51, 25]
              - [64, 65, 1]
              - [75, 101, 25]
      triggers:
        build_interval: *Interval