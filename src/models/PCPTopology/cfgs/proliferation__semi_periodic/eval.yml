# The evaluation of default_proliferation_minimal
---
energy:
  based_on: energy

energy_continuous:
  based_on: 
    - energy
    - select.uni.continuous_energy_terms

transitions:
  based_on: transitions



cell_properties:
  based_on:
    - .plot.multiplot
    - universe
    - select_cells_properties
  enabled: False

  select:
    property:
      path: data/PCPTopology/Cells

  to_plot: 
    - function: sns.lineplot
      data: !dag_result all_cells
      label: all cells
      errorbar: sd

  x: time

  helpers:
    set_labels:
      x: time

cell_properties/area:
  based_on: cell_properties
  select:
    property:
      transform:
        - .sel: [!dag_prev , {property: area}]
        - .rename: [!dag_prev , area]
  y: area
  helpers:
    set_labels:
      y: average area


cell_properties/shape:
  based_on: cell_properties
  select:
    property:
      transform:
          - .sel: [!dag_prev , {property: perimeter}]
          - .sel: [!dag_node -2, {property: area_preferential}]
          - pow: [!dag_node -1 , 0.5]
          - div: [!dag_node -3, !dag_node -1]
          - .rename: [!dag_prev , shape_index]
  y: shape_index
  helpers:
    set_labels:
      y: average shape index
      
      
cell_segmentation:
  based_on: cellular_structure
  semi_periodic_space: True
  cell_center_marker_kwargs:
    colors: ['grey', 'r', 'gray']
  select:
    property:
      path: data/PCPTopology/Cells
      transform:
          - .sel: [!dag_prev , {property: area}]
          - .rename: [!dag_prev , area]

  property_interpolation_plot_kwargs:
    interpolation: nearest
    vmin: 0.8
    vmax: 1.2
    cmap: seismic
