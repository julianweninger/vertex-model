# The default plots of this model
#
# These can use the `based_on` feature with configurations specified in the
# accompanying *_base_plots.yml file and in the utopya base plot configs.
---
energy:
  based_on: energy

  to_plot:
    Energy/Total:
      label: TOTAL
    Energy/Linetension:
      label: line-tension
    Energy/Areaelasticity:
      label: area-elasticity
    Energy/Contractility:
      label: contractility

cell_area:
  based_on: .basic_uni.lineplots
  model_name: PCPTopology
  file_ext: png


  to_plot:
    area_average:
      path_to_data: Statistics/Cell_area
      transform_data:
        - sel:
            property: area_average
      label: average cell area

equilibrium_cellular_structure:
  based_on: cellular_structure
  datapath: PCPTopology
  cfgpath: PCPTopology/PCPVertex

cell_neighbourhood:
  creator: universe
  universes: all
  module: model_plots.PCPTopology
  plot_func: cell_neighbourhood
  file_ext: png
  datapath: PCPTopology/Statistics

  enabled: true

  helpers:
    set_labels:
      x: bins [1]
      y: counts [1]
    set_limits:
      x: [0, 9]

  animation:
    enabled: true
    writer: frames
    writer_kwargs:
      ffmpeg:
        init:
          fps: 10
        saving:
          dpi: 300
      frames:
        saving:
          dpi: 300

    animation_update_kwargs:  {}

shape_index:
  based_on: cell_property_multiverse
  
  select_and_combine: 
    fields:
      data:
        transform:
        - .sel:
            time: 5
            property: shape_index
        - .mean: {dim: id}

area:
  based_on: cell_property_multiverse
  
  select_and_combine: 
    fields:
      data:
        transform:
        - .sel:
            time: 5
            property: area
        - .mean: {dim: id}

perimeter:
  based_on: cell_property_multiverse
  
  select_and_combine: 
    fields:
      data:
        transform:
        - .sel:
            time: 5
            property: perimeter
        - .mean: {dim: id}