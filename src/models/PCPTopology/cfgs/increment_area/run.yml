# A minimal configuration to do cell proliferation
# In quick and dirty during proliferation the energy is not minimized.
# This results in a significant (~ factor 100) speed up with similar results.
#
# The model can be run by typing : 
# $ cd /path-to-Utopia/vertex-model
# $ utopia run PCPTopology src/models/PCPTopology/cfgs/<choose>/run.yml \
#          --plots-cfg src/models/PCPTopology/cfgs/<choose>/eval.yml
#
# The content of this file is used to update the corresponding entries in
# ../PCPTopology_cfg.yml
---
perform_sweep: true
paths:
  model_note: default__increment_area

worker_manager:
  nonzero_exit_handling: warn_all

parameter_space:
  num_steps: 10
  # NOTE for testing reduced!
  # recommendation: 350 steps (area +-0.7)
  # for complete: 1500 (area +-3) or the following
  # num_steps: !coupled-sweep
  #   target_name: direction
  #   default: 350
  #   values: [1500, 375]

  num_cells: &NUM_CELLS 64     # The final number of cells

  seed: !sweep
    default: 42
    range: [2]
    order: -1

  PCPTopology:  
    # The sequence of operations
    operations:
      - jiggle:
          times: []
          iterations_prolog: 1

      - proliferate_quick_and_dirty:
          times: []
          iterations_prolog: 1
          target_num_cells: *NUM_CELLS
          minimization_quick: ~
          minimization:
            num_repeat: &equilibration_time 5
      # END proliferation

      # Differentiate hair and support cells
      - differentiate_random:
          times: []
          iterations_prolog: 1
          fraction: !sweep
            default: 0.2
            values: [0.1, 0.2, 0.26]        # The HC densities
            name: rho
          minimization:
            mode: manual
      - differentiate_NotchDelta:
          times: []
          iterations_prolog: 1
          discard_initialisation: True
          # NOTE: Notch model skipped because random differentiation terminal
          #       Swap removes HC-HC contacts partially
          
          steps: 2000

          minimization:
            mode: manual
      # END differentiation
      
      # Eliminate HC-HC contacts
      - increment_linetension:
          times: []
          iterations_prolog: 10
          hair_hair: 1
      - increment_linetension:
          times: []
          iterations_prolog: 1
          hair_hair: 1000

      # Introduce junctional heterogeneity
      - increment_edge_contractility:
          times: []
          iterations_prolog: 1
          support_support: !sweep
            default: 0.
            linspace: [0., 1., 6]
            name: Gamma
          minimization:
            num_repeat: *equilibration_time
      # END Differential junctional properties


      - increment_area:
          times: !listgen [1501]
          hair: !coupled-sweep
            target_name: direction
            default: 0.0005
            values: [2.e-3, -2.e-3]
            name: increment
          direction: !sweep
            default: forward
            values: [forward, backward]
            name: direction
            order: 2
          
          adapt_support: True
          

    # --- Dynamics
    # Minimization parameter
    minimization: &minimization
      update_scheme: steepest_gradient
      dt: 0.01
      tolerance: 1.e-8
      max_steps: 500000
      num_repeat: 1
      num_steps: 100
      jiggle_intensity: 0.
      linetension_fluctuation: 0.
      jiggle_tolerance: 1.e-6

      area_fluctuation: 0.35
      area_fluctuation_tau: 1.
      area_fluctuation_A_min: 0.15


    PCPVertex:      
      area_elasticity: 1.
      
      cell_shape_implementation: contractile
      # possible contractile or shape_elastic
      # whether to normalize shape index to A^0 or A, respectively

      agent_manager:
        cell_manager:
          agent_params:
            area_preferential: 1.
            contractility: 1.
            shape_index_preferential: 3.76
        edge_manager:
          agent_params:
            linetension: 0.
            contractility: 0.
        setup_params:
          hexagonal:
            lattice_rows: &ROWS 4
            lattice_columns: *ROWS

      minimization: *minimization

      T1_threshold: 0.03
      T1_separation_factor: 1.05
      T1_probability: 1.
      T1_barrier: 0.02
      T2_threshold: 0.0075


      log_level: warning
      
      # continuous data manager
      data_manager:
        deciders:
          write_energy:
            type: interval
            args: 
              intervals:
                - [0, 1000000000, 50]
        tasks:
          Energy_total: &energy_continuous {decider: write_energy}
          Energy_linetension: *energy_continuous
          Energy_areaelasticity: *energy_continuous
          Energy_cell_contractility: *energy_continuous
          Energy_edge_contractility: *energy_continuous
          Energy_boundary_area_elasticity: {active: false}
          Energy_boundary_shape_elasticity: {active: false}
          Energy_time: *energy_continuous
          transitions: *energy_continuous

          Vertices: &position {active: false}
          Cells: *position
          Edges: *position

    # equilibrium data manager
    data_manager:
      deciders:
        write_always:
          type: always

        write_interval: &interval
          type: interval
          args:
            intervals:
              - [0  ,  500,  5]
              - [500, 1501, 25]
      triggers:
        build_interval: *interval
      tasks:
        Energy_boundary_area_elasticity: {enabled: false}
        Energy_boundary_shape_elasticity: {enabled: false}
