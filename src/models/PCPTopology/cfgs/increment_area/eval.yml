area_mapped/coordination_fit: !pspace
  based_on: area_mapped/neighbors_w_data
  enabled: False
  
  transform:
    # a mask to select only hair / support cells
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _cell_type,
             {ids: [seed, id]}]
    - *map_directional_time
    - .squeeze: [!dag_prev ]
      tag: cell_type
    - create_mask: [!dag_tag cell_type, ==, 1]
      tag: _hair_cells
    - create_mask: [!dag_tag cell_type, ==, 2]
      tag: _support_cells

    # stack the seeds
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _area,
             {ids: [seed, id]}]
    - *map_directional_time
    - .where: [!dag_prev , !dag_tag _hair_cells]
    - .mean: [!dag_prev , ids]
      tag: HC_area    

    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _property,
             {ids: [seed, id]}]
    - *map_directional_time
    - .assign_coords: [!dag_prev , {area: !dag_tag HC_area}]
    - .squeeze: [!dag_prev ]
      tag: property

    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: all_cells

    # the data for hair cells
    - .where: [!dag_tag property, !dag_tag _hair_cells]
      tag: hair_cells_xarray
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: hair_cells

    # the data for support cells
    - .where: [!dag_tag property, !dag_tag _support_cells]
      tag: support_cells_xarray
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: support_cells
    
    - .mean: [!dag_tag hair_cells_xarray, ids]
      tag: hair_cells_mean
    - .coords: [!dag_tag hair_cells_mean, area]
      tag: data_coords
    - create_mask: [!dag_prev ,'>=', 0]
    - .where: [!dag_tag hair_cells_mean, !dag_prev ]
      kwargs:
        drop: true
    - .polyfit: 
      args: [!dag_prev , area, 1]
      kwargs: 
        skipna: true
        cov: true
    - getitem: [!dag_prev , polyfit_coefficients]
      tag: fit
    - getitem: [!dag_prev , 0]
      tag: fit_slope
    - getitem: [!dag_tag fit, 1]
      tag: fit_offset

    - mul: [!dag_tag data_coords, !dag_tag fit_slope]
    - add: [!dag_prev , !dag_tag fit_offset]
    - .rename: [!dag_prev , linear_fit]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: linear_fit


    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, define_exp_coordin_area]
    - .dropna: [!dag_prev , area]
      tag: experiment_xr
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: experiment

    - .coords: [!dag_tag experiment_xr, area]
    - create_mask: [!dag_prev ,'>', 0]
    - .where: [!dag_tag experiment_xr, !dag_prev ]
      kwargs:
        drop: true
    - .polyfit: 
      args: [!dag_prev , area, 1]
      kwargs: 
        skipna: true
        cov: true
    - getitem: [!dag_prev , polyfit_coefficients]
      tag: fit_experiment
    - getitem: [!dag_prev , 0]
      tag: fit_experiment_slope
    - getitem: [!dag_tag fit_experiment, 1]
      tag: fit_experiment_offset

    - mul: [!dag_tag data_coords, !dag_tag fit_experiment_slope]
    - add: [!dag_prev , !dag_tag fit_experiment_offset]
    - .rename: [!dag_prev , linear_fit]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: linear_fit_experiment
    
  to_plot:
    - function: sns.lineplot
      data: !dag_result hair_cells
      hue: Gamma
      errorbar: sd
    - function: sns.lineplot
      data: !dag_result linear_fit_experiment
      label: lin. fit experiment
      y: linear_fit
      color: black
    - function: sns.scatterplot
      data: !dag_result experiment
      label: 
      hue: stage
      style: position
      palette: copper
    - function: sns.lineplot
      data: !dag_result linear_fit
      label: lin. fit
      y: linear_fit
      color: orange

