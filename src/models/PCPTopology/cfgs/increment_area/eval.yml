---
single_universe:
  enabled: False
  universes:
    seed: 0
    
_definitions:
  enabled: false
  hue: &HUE Gamma
  subspace_slice: &subspace_slice
    direction: forward
    Gamma: !sweep
      default: 0.
      values: [0., 0.1, 0.2]
    # HC_sep: !sweep
    #   default: false
    #   values: 
    #     # - true
    #     - false
    #   order: -1

    rho: !sweep
      default: 0.2
      values: 
        - 0.2
        # - 0.26
        # - 0.1
      order: 0

  Gamma_best_fit: &Gamma_best_fit 0.4

  hue_2: &HUE_2 rho
  subspace_slice_2: &subspace_slice_2
    direction: forward
    # HC_sep: !sweep
    #   default: false
    #   values: [true, false]
    #   order: -1

    rho: !sweep
      default: 0.2
      values: 
        - 0.2
        # - 0.26
        # - 0.1
      order: 0

  map_directional_time: &map_directional_time
    # pass: [!dag_prev ]
    import_and_call:
    args: [model_plots.PCPTopology.data_ops, map_directional_time, !dag_prev ]

  BP_data_path: &BP_data_path '~/ownCloud/Institution/Collaboration_NCBS_UNIGE/data/summary_cells.csv'



# The energy at uniform t distances
energy:
  based_on: [energy, single_universe]
  enabled: false

# The energy at uniform numerical step distances
energy_continuous:
  based_on: [energy, single_universe]
  enabled: false
  model_name: PCPTopology/PCPVertex

# Number of T1 and T2 transitions
transitions:
  based_on: [transitions, single_universe]
  enabled: false

transitions_cumulated:
  based_on: [transitions, single_universe]
  enabled: false
  cumsum_transitions: true


# effective diffusion
diffusion: !pspace
  based_on: diffusion_mv
  enabled: False
  select_and_combine:
    subspace: *subspace_slice
  hue: *HUE
  helpers:
    set_limits:
      y: [0, 0.3]

# Displacement, i.e. MSD**0.5
displacement: !pspace
  based_on: diffusion
  enabled: False

  to_plot: 
  - function: sns.lineplot
    data: !dag_result distance
    y: distance

  helpers:
    set_labels:
      y: $\sqrt{MSD}$
    set_limits:
      y: [0, 16]

diffusion_constant: !pspace
  based_on:
    - .plot.multiplot
    - multiverse
  enabled: False

  select_and_combine:
    allow_missing_or_failing: silent
    fields:
      _displacement:
        path: data/PCPTopology/Cells
        transform:
          - import_and_call:
            args: 
              - model_plots.PCPTopology.data_ops
              - displacement
              - !dag_node -1
              - property
              - [x, y]
          - .rename: [!dag_prev , displacement]
    subspace: *subspace_slice_2
  transform:
    - pass: [!dag_tag _displacement]
    - .squeeze: [!dag_prev ]
      tag: displacement

    # the time coordinates
    - .coords: [!dag_tag displacement, time]
      tag: time
    - create_mask: [!dag_prev , ">=", 120]
      tag: equilibrium_short
    - create_mask: [!dag_tag time, ">=", 800]
      tag: equilibrium

    # square displacement
    - pow: [!dag_tag displacement, 2]
    - .sum: [!dag_prev , property]
      kwargs: {skipna: False}
    - .rename: [!dag_prev , square_displ]
      tag: square_displ_xr

    # diffusion
    - div: [!dag_tag square_displ_xr, !dag_tag time]
    - div: [!dag_prev , 2]
    - .rename: [!dag_prev , diffusion]
      tag: diffusion_xr
    - .where: [!dag_prev , !dag_tag equilibrium]
    - .mean: [!dag_prev , time]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: diffusion_const
    - .where: [!dag_tag diffusion_xr, !dag_tag equilibrium_short]
    - .mean: [!dag_prev , time]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: diffusion_const_short

  x: *HUE
  hue: *HUE_2
  y: diffusion

  to_plot: 
  - function: sns.lineplot
    data: !dag_result diffusion_const
  - function: sns.lineplot
    data: !dag_result diffusion_const_short
    linestyle: ':'

  helpers:
    set_labels:
      y: diffusion constant [$A_0^2 / \tau_\lambda$]
    set_scales:
      y: log
    set_limits: 
      y: [1.e-5, 0.25]


# Mapped to area
area_mapped/neighbors: !pspace
  based_on:
    - .plot.multiplot
    - multiverse
    - select_cells_properties_mv.map_stage

  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: num_neighbors}]
          - .rename: [!dag_prev , num_neighbors]
    subspace: *subspace_slice

  transform:
    # a mask to select only hair / support cells
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _cell_type,
             {ids: [seed, id]}]
    - *map_directional_time
    - pass: [!dag_prev ]
      tag: cell_type
    - create_mask: [!dag_tag cell_type, ==, 1]
      tag: _hair_cells
    - create_mask: [!dag_tag cell_type, ==, 2]
      tag: _support_cells

    # stack the seeds
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _area,
             {ids: [seed, id]}]
    - *map_directional_time
    - .where: [!dag_prev , !dag_tag _hair_cells]
    - .mean: [!dag_prev , ids]
      tag: HC_area    

    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _property,
             {ids: [seed, id]}]
    - *map_directional_time
    - .assign_coords: [!dag_prev , {area: !dag_tag HC_area}]
    - .squeeze: [!dag_prev ]
      tag: property

    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, dropna, !dag_prev , ids]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: all_cells

    # the data for hair cells
    - .where: [!dag_tag property, !dag_tag _hair_cells]
      tag: hair_cells_xarray
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, dropna, !dag_prev , ids]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: hair_cells

    # the data for support cells
    - .where: [!dag_tag property, !dag_tag _support_cells]
      tag: support_cells_xarray
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, dropna, !dag_prev , ids]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: support_cells

  to_plot:
    - function: sns.lineplot
      data: !dag_result all_cells
      label: all cells
      color: grey
      errorbar: ~
    - function: sns.lineplot
      data: !dag_result hair_cells
      label: hair cells
      color: red
      errorbar: sd
    - function: sns.lineplot
      data: !dag_result support_cells
      label: support cells
      color: royalblue
      errorbar: sd

  x: area
  y: num_neighbors

  helpers:
    set_labels:
      y: number of neighbors
      x: normalized HC area
    set_limits:
      x: [0., 5.]
      y: [3., 12]

