stage_mapped/coordination: !pspace
  based_on:
    - .plot.multiplot
    - multiverse
    - select_cells_properties_mv.map_stage
    
  module: model_plots.PCPTopology
  plot_func: coordination_histogram

  enabled: False

  y_range: [3, 9]

  select_and_combine:
    fields:
      _area:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: area}]
          - .sel: [!dag_prev , {time: !slice [1, ~]}]
          - .rename: [!dag_prev , area]
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: num_neighbors}]
          - .sel: [!dag_prev , {time: !slice [1, ~]}]
          - .rename: [!dag_prev , num_neighbors]
    subspace:
      <<: *subspace_slice
      seed: 0
  
  transform:
    # a mask to select only hair / support cells
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _cell_type,
             {ids: [seed, id]}]
    - *map_directional_time
    - .squeeze: [!dag_prev ]
      tag: cell_type
    - create_mask: [!dag_tag cell_type, ==, 1]
      tag: _hair_cells
    - create_mask: [!dag_tag cell_type, ==, 2]
      tag: _support_cells

    # stack the seeds
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _area,
             {ids: [seed, id]}]
    - .squeeze: [!dag_prev ]
    - *map_directional_time
    - pass: [!dag_prev ]
      tag: area

    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _property,
             {ids: [seed, id]}]
    - .squeeze: [!dag_prev ]
    - *map_directional_time
    - pass: [!dag_prev ]
      tag: property

    - .where: [!dag_tag area, !dag_tag _hair_cells]
    - .mean: [!dag_prev , ids]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    - callattr: [!dag_prev , reset_index]
    - print: [!dag_prev ]
      tag: hair_cells_area

    - .where: [!dag_tag property, !dag_tag _hair_cells]
    - .mean: [!dag_prev , ids]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: hair_cells_neighbors

    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, read_csv, *BP_data_path]
    - print: [!dag_prev ]
      tag: data_experiment

stage_mapped/coordination_violin: !pspace
  based_on:
    - .plot.multiplot
    - multiverse
    - select_cells_properties_mv.map_stage

  enabled: False

  select_and_combine:
    fields:
      _area:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: area}]
          - .sel: [!dag_prev , {time: !slice [1, ~]}]
          - .rename: [!dag_prev , area]
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: num_neighbors}]
          - .sel: [!dag_prev , {time: !slice [1, ~]}]
          - .rename: [!dag_prev , num_neighbors]
    subspace: *subspace_slice

  to_plot: 
    - function: sns.violinplot
      # scale: count
      data: !dag_result hair_cells
      hue: type
      split: true

  transform: &TRANSFORM_STAGEMAP_W_DATA
    # a mask to select only hair / support cells
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _cell_type,
             {ids: [seed, id]}]
    - *map_directional_time
    - .squeeze: [!dag_prev ]
      tag: cell_type
    - create_mask: [!dag_tag cell_type, ==, 1]
    - .squeeze: [!dag_prev ]
      tag: _hair_cells
    - create_mask: [!dag_tag cell_type, ==, 2]
    - .squeeze: [!dag_prev ]
      tag: _support_cells

    # stack the seeds
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _area,
             {ids: [seed, id]}]
    - *map_directional_time
    - .squeeze: [!dag_prev ]
    - pass: [!dag_prev ]
      tag: area

    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _property,
             {ids: [seed, id]}]
    - *map_directional_time
    - .squeeze: [!dag_prev ]
    - pass: [!dag_prev ]
      tag: property

    # HC area as mapping
    - .where: [!dag_tag area, !dag_tag _hair_cells]
    - .mean: [!dag_prev , ids]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, dropna, !dag_prev , time]
      tag: HC_area

    # the data for support and hair cells
    - .where: [!dag_tag property, !dag_tag _hair_cells]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, map_stage,
             !dag_prev , !dag_tag HC_area]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, concat_exp_coordination,
             !dag_prev ]
    - print: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: hair_cells

  x: stage
  y: num_neighbors

  helpers:
    set_limits:
      y: [3., 12]
    set_labels:
      x: stage [E]
      y: Contacts



# The average cell area
cell_properties/area: !pspace
  based_on:
    - .plot.multiplot
    - multiverse
    - select_cells_properties_mv
  to_plot: 
    - function: sns.lineplot
      data: !dag_result all_cells
      errorbar: ~
    - function: sns.lineplot
      data: !dag_result hair_cells
      color: red
      errorbar: sd
    - function: sns.lineplot
      data: !dag_result support_cells
      color: gray
      errorbar: sd
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: area}]
          - .rename: [!dag_prev , area]
    subspace: *subspace_slice

  x: time
  y: area
  hue: *HUE

  helpers:
    set_labels:
      x: time
      y: average area

# The average cell shape
cell_properties/shape: !pspace
  based_on: cell_properties/area
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: perimeter}]
          - .sel: [!dag_node -2, {property: area_preferential}]
          - pow: [!dag_node -1 , 0.5]
          - div: [!dag_node -3, !dag_node -1]
          - .rename: [!dag_prev , shape_index]
  y: shape_index
  helpers:
    set_labels:
      y: average shape index
    set_limits:
      y: [3.72, 4.4]

cell_properties/elongation: !pspace
  based_on: cell_properties/area
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_node -1, {property: q_x}]
          - .sel: [!dag_node -2, {property: q_y}]
          - call_lambda:
            - "lambda qx, qy: (qx**2 + qy**2)**0.5"
            - !dag_node -2
            - !dag_node -1
          - .rename: [!dag_prev , elongation]
  y: elongation
  helpers:
    set_labels:
      y: average elongation

# The average cell geometry
cell_properties/neighbors: !pspace
  based_on: cell_properties/area
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: num_neighbors}]
          - .rename: [!dag_prev , num_neighbors]
  y: num_neighbors
  helpers:
    set_labels:
      y: average neighbors
    set_limits:
      y: [3, 10]

cell_properties/coordination: !pspace
  based_on: cell_properties/neighbors
  to_plot: 
    - function: sns.lineplot
      data: !dag_result hair_cells
      errorbar: sd

cell_properties/subordination: !pspace
  based_on: cell_properties/neighbors
  to_plot: 
    - function: sns.lineplot
      data: !dag_result support_cells
      errorbar: sd

cell_properties/HH_neighbors: !pspace
  based_on: cell_properties/area
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_node -1, {property: cell_type}]
          - .sel: [!dag_node -2, {property: num_neighbors}]
          - .sel: [!dag_node -3, {property: num_neighbors__self}]
          - call_lambda:
            - "lambda type, nbs, _nbs: xr.where(type == 1, _nbs, nbs - _nbs)"
            - !dag_node -3
            - !dag_node -2
            - !dag_node -1
          - .rename: [!dag_prev , num_hair_neighbors]
  y: num_hair_neighbors
  to_plot: 
    - function: sns.lineplot
      data: !dag_result hair_cells
      errorbar: sd
  helpers:
    set_labels:
      y: average neighbors
    set_limits:
      y: [0, 4]


edge_properties/min_length: !pspace
  enabled: False
  based_on:
    - .plot.multiplot
    - multiverse
    - select_edges_properties_mv
  to_plot: 
    - function: sns.lineplot
      data: !dag_result all_edges
      errorbar: sd
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Edges
        transform:
          - .sel: [!dag_prev , {property: length}]
          - .min: [!dag_prev , id]
          - .expand_dims: [!dag_prev , id]
          - .rename: [!dag_prev , length]
    subspace: *subspace_slice

  x: time
  y: length
  hue: *HUE

  helpers:
    set_labels:
      x: time
      y: average area


# A 2D representation of the cells by their edges
cell_segmentation:
  based_on:
    - cellular_structure
    - single_universe