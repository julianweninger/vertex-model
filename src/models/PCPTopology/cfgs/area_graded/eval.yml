edge_properties/min_length: !pspace
  enabled: False
  based_on:
    - .plot.multiplot
    - multiverse
    - select_edges_properties_mv
  to_plot: 
    - function: sns.lineplot
      data: !dag_result all_edges
      errorbar: sd
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Edges
        transform:
          - .sel: [!dag_prev , {property: length}]
          - .min: [!dag_prev , id]
          - .expand_dims: [!dag_prev , id]
          - .rename: [!dag_prev , length]
    subspace: *subspace_slice

  x: time
  y: length
  hue: *HUE

  helpers:
    set_labels:
      x: time
      y: average area


# A 2D representation of the cells by their edges
cell_segmentation:
  based_on:
    - cellular_structure
    - single_universe
  cell_center_marker_kwargs:
    colors: ['white', 'r']
    s: 2
