---
single_universe:
  enabled: False
  universes:
    seed: 0
    
_definitions:
  enabled: false
  hue: &HUE ~
  subspace_slice: &subspace_slice ~

  Gamma_best_fit: &Gamma_best_fit 0.1

  hue_2: &HUE_2 ~
  subspace_slice_2: &subspace_slice_2 ~


  timepoint_spatial: &TIMEPOINT_SPATIAL 10
  sel_spatial_time: &TIME_SPATIAL
    # .sel: [!dag_prev , {time: 800}]
    .isel: [!dag_prev , {time: -1}]

  map_directional_time: &map_directional_time
    # pass: [!dag_prev ]
    import_and_call:
    args: [model_plots.PCPTopology.data_ops, map_directional_time, !dag_prev ]

  BP_data_path: &BP_data_path '~/ownCloud/Institution/Collaboration_NCBS_UNIGE/data/HCA-Actn4/summary_cells.csv'



# The energy at uniform t distances
energy:
  based_on: [energy, single_universe]
  enabled: false

# The energy at uniform numerical step distances
energy_continuous:
  based_on: [energy, single_universe]
  enabled: false
  model_name: PCPTopology/PCPVertex

# Number of T1 and T2 transitions
transitions:
  based_on: [transitions, single_universe]
  enabled: false

transitions_cumulated:
  based_on: [transitions, single_universe]
  enabled: false
  cumsum_transitions: true


# effective diffusion
diffusion: !pspace
  based_on: diffusion_mv
  enabled: False
  select_and_combine:
    subspace: *subspace_slice
  hue: *HUE
  helpers:
    set_limits:
      y: [0, 0.3]

# Displacement, i.e. MSD**0.5
displacement: !pspace
  based_on: diffusion
  enabled: False

  to_plot: 
  - function: sns.lineplot
    data: !dag_result distance
    y: distance

  helpers:
    set_labels:
      y: $\sqrt{MSD}$
    set_limits:
      y: [0, 16]

diffusion_constant: !pspace
  based_on:
    - .plot.multiplot
    - multiverse
  enabled: False

  select_and_combine:
    allow_missing_or_failing: silent
    fields:
      _displacement:
        path: data/PCPTopology/Cells
        transform:
          - import_and_call:
            args: 
              - model_plots.PCPTopology.data_ops
              - displacement
              - !dag_node -1
              - property
              - [x, y]
          - .rename: [!dag_prev , displacement]
    subspace: *subspace_slice_2
  transform:
    - pass: [!dag_tag _displacement]
    - .squeeze: [!dag_prev ]
      tag: displacement

    # the time coordinates
    - .coords: [!dag_tag displacement, time]
      tag: time
    - create_mask: [!dag_prev , ">=", 120]
      tag: equilibrium_short
    - create_mask: [!dag_tag time, ">=", 800]
      tag: equilibrium

    # square displacement
    - pow: [!dag_tag displacement, 2]
    - .sum: [!dag_prev , property]
      kwargs: {skipna: False}
    - .rename: [!dag_prev , square_displ]
      tag: square_displ_xr

    # diffusion
    - div: [!dag_tag square_displ_xr, !dag_tag time]
    - div: [!dag_prev , 2]
    - .rename: [!dag_prev , diffusion]
      tag: diffusion_xr
    - .where: [!dag_prev , !dag_tag equilibrium]
    - .mean: [!dag_prev , time]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: diffusion_const
    - .where: [!dag_tag diffusion_xr, !dag_tag equilibrium_short]
    - .mean: [!dag_prev , time]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: diffusion_const_short

  x: *HUE
  hue: *HUE_2
  y: diffusion

  to_plot: 
  - function: sns.lineplot
    data: !dag_result diffusion_const
  - function: sns.lineplot
    data: !dag_result diffusion_const_short
    linestyle: ':'

  helpers:
    set_labels:
      y: diffusion constant [$A_0^2 / \tau_\lambda$]
    set_scales:
      y: log
    set_limits: 
      y: [1.e-5, 0.25]


# Spatial mapping in graded space ---------------------------------------------
cells_spatial: !pspace
  based_on:
    - .plot.multiplot
    - multiverse
    - select_cells_properties_mv
  enabled: False

  to_plot:
    - function: sns.scatterplot
      data: !dag_result all_cells
      label: all cells
    - function: sns.scatterplot
      data: !dag_result support_cells
      label: support cells
    - function: sns.scatterplot
      data: !dag_result hair_cells
      label: hair cells

  select_and_combine:
    allow_missing_or_failing: silent
    fields:
      _cell_type:
        path: data/PCPTopology/Cells
        transform:
        - .sel: [!dag_node -1, {property: cell_type}]
        - *TIME_SPATIAL
        - .rename: [!dag_node -1, cell_types]
      _is_boundary:
        path: data/PCPTopology/Cells
        transform:
        - .sel: [!dag_node -1, {property: is_boundary}]
        - *TIME_SPATIAL
        - .rename: [!dag_node -1, is_boundary]
      _x:
        path: data/PCPTopology/Cells
        transform:
        - .sel: [!dag_node -1, {property: x}]
        - *TIME_SPATIAL
        - .rename: [!dag_node -1, x]
        - call_lambda:
          - 'lambda x: 1. - np.abs(x / x.max() - 0.5) * 2'
          - !dag_node -1
    subspace: *subspace_slice
        
  transform:
  - args: ['lambda d, *, args: d.stack(*args)', !dag_tag _x]
    call_lambda: null
    kwargs:
      args:
      - ids: [seed, id]
    tag: x
  - args: ['lambda d, *, args: d.stack(*args)', !dag_tag _cell_type]
    call_lambda: null
    kwargs:
      args:
      - ids: [seed, id]
  - create_mask: [!dag_node -1, ==, 1]
    tag: _hair_cells
  - args: ['lambda d, *, args: d.stack(*args)', !dag_tag _cell_type]
    call_lambda: null
    kwargs:
      args:
      - ids: [seed, id]
  - create_mask: [!dag_node -1, ==, 0]
    tag: _support_cells
  - args: ['lambda d, *, args: d.stack(*args)', !dag_tag _property]
    call_lambda: null
    kwargs:
      args:
      - ids: [seed, id]
    tag: property
  - args: [model_plots.PCPTopology.data_ops, spatial_binning, !dag_tag x, !dag_tag property]
    import_and_call: null
    kwargs: {bins: 10}
    tag: all_cells
  - .where: [!dag_tag property, !dag_tag _hair_cells]
  - args: [model_plots.PCPTopology.data_ops, spatial_binning, !dag_tag x, !dag_node -1]
    import_and_call: null
    kwargs: {bins: 10}
    tag: hair_cells
  - .where: [!dag_tag property, !dag_tag _support_cells]
  - args: [model_plots.PCPTopology.data_ops, spatial_binning, !dag_tag x, !dag_node -1]
    import_and_call: null
    kwargs: {bins: 10}
    tag: support_cells

  x: x_bins

  helpers:
    set_labels:
      x: Position (binned)
    set_limits:
      x: [0., 1.]
    set_hv_lines:
      vlines:
        - &bins {pos: 0.1, ls: ':', color: black, linewidth: 0.1}
        - {<<: *bins, pos: 0.2} 
        - {<<: *bins, pos: 0.3}
        - {<<: *bins, pos: 0.4}
        - {<<: *bins, pos: 0.5}
        - {<<: *bins, pos: 0.6}
        - {<<: *bins, pos: 0.7}
        - {<<: *bins, pos: 0.8}
        - {<<: *bins, pos: 0.9}

cells_spatial/area: !pspace
  based_on: cells_spatial
  
  select_and_combine:
