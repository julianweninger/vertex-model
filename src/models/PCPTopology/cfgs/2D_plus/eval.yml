---
single_universe:
  enabled: False
  universes:
    seed: 1
    
_definitions:
  enabled: false
  subspace_slice: &subspace_slice ~
    # Hc: !sweep
    #   default: 0.9
    #   values: [0.7, 0.8, 0.85, 0.9, 0.95]

    #   default: 0.2
    #   values: 
    #     - 0.2
    #     # - 0.26

  hue: &HUE ~
  subspace: &subspace ~
    # <<: *subspace_slice
    # Gamma: !sweep
    #   default: 0.
    #   values: 
    #     - &Gamma_0 0.
    #     - &Gamma_10 0.1
    #     - &Gamma_20 0.2
    #     - &Gamma_30 0.3
    # rho: !sweep

  Gamma_best_fit: &Gamma_best_fit 0.4

  hue_2: &HUE_2 rho
  subspace_slice_2: &subspace_slice_2 ~

  BP_data_path: &BP_data_path '~/ownCloud/Institution/Collaboration_NCBS_UNIGE/data/summary_cells.csv'



# The energy at uniform t distances
energy: !pspace
  based_on:
    - .plot.multiplot
    - multiverse
    
  to_plot:
  - function: sns.lineplot
    data: !dag_result energy
    style: seed
  select_and_combine:
    fields:
      _energy: 
        path: data/PCPTopology/Energy/Terms
    subspace: *subspace

  transform:
    - .rename: [!dag_prev , energy]
    - import_and_call:
      args: [model_plots.PCPVertex.data_ops, to_dataframe, !dag_prev ]
      tag: energy

  x: time
  y: energy
  hue: term

  helpers:
    set_labels:
      x: time
      y: energy [a.u.]

energy_net: !pspace
  based_on: energy
  select_and_combine:
    allow_missing_or_failing: silent
    fields:
      _energy: 
        path: data/PCPTopology/Energy/Terms
        transform:
          - .sel: [!dag_node -1 , {term: total}]
          - .sel: [!dag_node -2 , {term: linetension_fluctuations}]
          - sub: [!dag_node -2, !dag_node -1]
  hue: ~

# Number of T1 and T2 transitions
transitions:
  based_on: [transitions, single_universe]

transitions_cumulated:
  based_on: [transitions, single_universe]
  enabled: False
  cumsum_transitions: true



# The average cell area
cell_properties: !pspace
  based_on:
    - .plot.multiplot
    - multiverse
    - select_cells_properties_mv
  enabled: False
  to_plot: 
    - function: sns.lineplot
      data: !dag_result all_cells
      color: black
      errorbar: sd
      palette: Grays
      hue: ~
    - function: sns.lineplot
      data: !dag_result support_cells
      color: blue
      errorbar: sd
      palette: Blues
    - function: sns.lineplot
      data: !dag_result hair_cells
      color: red
      errorbar: sd
      palette: Reds
  select_and_combine:
    allow_missing_or_failing: silent
    subspace: *subspace_slice

  x: time
  hue: *HUE

  helpers:
    set_labels:
      x: time


# The average cell area
cell_properties/area: !pspace
  based_on: cell_properties
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: area}]
          - .rename: [!dag_prev , area]

  y: area
  helpers:
    set_labels:
      y: average area
    # set_limits: 
    #   y: [0., 4]

# The average cell area
cell_properties/height: !pspace
  based_on: cell_properties
  to_plot:
    - function: sns.lineplot
      data: !dag_result hair_cells
      color: red
      errorbar: sd
      palette: Reds
    - function: sns.lineplot
      data: !dag_result hair_cells
      color: red
      errorbar: ~
      estimator: median
      palette: Reds
      linestyle: dashed
    - function: sns.lineplot
      data: !dag_result hair_cells
      color: red
      errorbar: ~
      estimator: max
      palette: Reds
      linestyle: dotted
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: volume_elasticity__height}]
          - .rename: [!dag_prev , height]

  y: height
  helpers:
    set_labels:
      y: average height
    # set_limits: 
    #   y: [0., 1]
cell_properties/extrusiveness: !pspace
  based_on: cell_properties
  to_plot:
    - function: sns.lineplot
      data: !dag_result hair_cells
      color: red
      errorbar: sd
      palette: Reds
    - function: sns.lineplot
      data: !dag_result hair_cells
      color: red
      estimator: median
      linestyle: dashed
      # errorbar: sd
      palette: Reds
    - function: sns.lineplot
      data: !dag_result hair_cells
      color: red
      hue: id
      # estimator: median
      linestyle: dotted
      # errorbar: sd
      palette: Reds
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cell_energies
        transform:
          - .sel: [!dag_prev , {term: volume_elasticity__extrusiveness}]
          - .rename: [!dag_prev , extrusiveness]

  y: extrusiveness
  helpers:
    set_labels:
      y: extrusiveness
    # set_limits: 
    #   y: [0., 1]
    

cell_properties/volume: !pspace
  based_on: cell_properties
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: volume_elasticity__volume}]
          - .rename: [!dag_prev , volume]

  y: volume
  helpers:
    set_labels:
      y: average volume

cell_properties/surface: !pspace
  based_on: cell_properties
  
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: surface_elasticity__surface}]
          - .rename: [!dag_prev , surface]

  y: surface
  helpers:
    set_labels:
      y: average surface
    # set_limits: 
    #   y: [5.0, ~]

cell_properties/neighbors: !pspace
  based_on: cell_properties
  enabled: True
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: num_neighbors}]
          - .rename: [!dag_prev , num_neighbors]
  y: num_neighbors
  helpers:
    set_labels:
      y: average neighbors
    set_limits:
      y: [3, 10]

cell_properties/HH_neighbors: !pspace
  based_on: cell_properties
  to_plot: 
    - function: sns.lineplot
      data: !dag_result hair_cells
      color: red
      errorbar: sd
      palette: Reds
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_node -1, {property: cell_type}]
          - .sel: [!dag_node -2, {property: num_neighbors}]
          - .sel: [!dag_node -3, {property: num_neighbors__self}]
          - call_lambda:
            - "lambda type, nbs, _nbs: xr.where(type == 1, _nbs, nbs - _nbs)"
            - !dag_node -3
            - !dag_node -2
            - !dag_node -1
          - .rename: [!dag_prev , num_hair_neighbors]
  y: num_hair_neighbors
  helpers:
    set_labels:
      y: average neighbors
    set_limits:
      y: [0, 4]


# A 2D representation of the cells by their edges
cell_segmentation:
  based_on:
    - cellular_structure
    - single_universe
  enabled: false

cell_segmentation__height:
  based_on: cell_segmentation
  # enabled: False

  select:
    property:
      path: data/PCPTopology/Cells
      transform:
        - .sel: [!dag_node -1, {property: volume_elasticity__height}]
        - .sel: [!dag_node -2, {property: cell_type}]
        - create_mask: [!dag_prev , ==, 1]
        - .where: [!dag_node -3, !dag_node -1]
        - .rename: [!dag_prev , Height]
    edge_property:
      path: data/PCPTopology/Edges
      transform:
        - .sel: [!dag_node -1, {property: edge_contractility__contractility}]
        - .rename: [!dag_prev , contractility]


  property_interpolation_plot_kwargs:
    interpolation: nearest
    vmin: 0.25
    vmax: 1.
    cmap: cool
  

cell_segmentation__volume:
  based_on: cell_segmentation
  # enabled: False

  select:
    property:
      path: data/PCPTopology/Cells
      transform:
        - .sel: [!dag_node -1, {property: volume_elasticity__volume}]
        - .rename: [!dag_prev , Volume]

  property_interpolation_plot_kwargs:
    interpolation: nearest
    vmin: 0.5
    vmax: 1.5
    cmap: seismic

cell_segmentation__area:
  based_on: cell_segmentation__volume
  enabled: False

  select:
    property:
      path: data/PCPTopology/Cells
      transform:
        - .sel: [!dag_node -1, {property: area}]
        - .rename: [!dag_prev , area]

  property_interpolation_plot_kwargs:
    interpolation: nearest
    vmin: 0.5
    vmax: 1.5
    cmap: seismic


cell_segmentation__surface:
  based_on: cell_segmentation
  # enabled: False

  select:
    property:
      path: data/PCPTopology/Cells
      transform:
        - .sel: [!dag_node -1, {property: surface_elasticity__surface}]
        - .rename: [!dag_prev , Surface]

  property_interpolation_plot_kwargs:
    interpolation: nearest
    vmin: 2.
    vmax: 6.5
    cmap: magma


cell_segmentation__extrusiveness:
  based_on: cell_segmentation
  # enabled: False

  select:
    property:
      path: data/PCPTopology/Cell_energies
      transform:
        - .sel: [!dag_node -1, {term: volume_elasticity__extrusiveness}]
        - .rename: [!dag_prev , extrusiveness]

  property_interpolation_plot_kwargs:
    interpolation: nearest
    vmin: ~
    vmax: ~
    cmap: magma