---
perform_sweep: true
paths:
  model_note: default__2d_plus

worker_manager:
  nonzero_exit_handling: warn_all
    
parameter_space:
  num_steps: 200

  seed: !sweep
    default: 42
    range: [1]
    order: !expr -np.inf

  PCPTopology:
    log_level: info

    # --- Dynamics
    # Minimization parameter
    minimization:
      update_scheme: steepest_gradient
      dt: 0.05
      num_steps: 20
      jiggle_intensity: 0.
      linetension_fluctuations: &dL 0.001
      linetension_fluctuations_tau: &tau_dL 24
      num_repeat: 1

    # -- Initialisation
    initialisation:
      0_add_noise:
        enabled: False
        minimization:
          num_repeat: 1
      1_by_proliferation:
        enabled: True
        num_generations: 2
        minimization_between_generations:
          num_repeat: 24
        minimization:
          linetension_fluctuations: 0.008
          num_repeat: 100

    #  --- The sequence of operations ---------------------------------
    operations:
      - differentiate_random:
          times: []
          iterations_prolog: 1
          method: fraction
          density: !sweep
            name: rho
            default: 0.26
            order: 0
            values: 
              # - &Rho17 0.17
              # - &Rho26 0.18
              - &Rho20 0.20
              # - &Rho23 0.23
              # - &Rho26 0.26
              # - &Rho29 0.29
              # - &Rho32 0.32
          distribution: !coupled-sweep
            target_name: rho
            name: distribution
            default: [0.74, 0.26]
            values: 
              # - [0.83, *Rho17]
              - [0.80, *Rho20]
              # - [0.77, *Rho23]
              # - [0.74, *Rho26]
              # - [0.71, *Rho29]
              # - [0.68, *Rho32]
          minimization:
            mode: manual


      - update_work_function_term:
          times: []
          iterations_prolog: 1
          name: edge_contractility_heterotypic
          parameters:
            Gamma: !sweep
              name: Gamma
              default: 0.04
              order: 1
              values:
                - &Gamma04 0.04
                # - &Gamma05 0.05
                # - &Gamma06 0.06
                # # - &Gamma065 0.065
                # - &Gamma07 0.07
                # # - &Gamma075 0.075
                # - &Gamma08 0.08
                # # - &Gamma085 0.085
                # - &Gamma09 0.09
                # # - &Gamma095 0.095
                # - &Gamma10 0.10
                # - &Gamma11 0.11
                # - &Gamma12 0.12
                # - &Gamma13 0.13
                # - &Gamma14 0.14
                - &Gamma15 0.15
                # - &Gamma17 0.17
                # - &Gamma19 0.19

            contractility: !coupled-sweep
              target_name: Gamma
              name: contractility
              values:
                - [[*Gamma04, 0.], [0., 0.]]
                # - [[*Gamma05, 0.], [0., 0.]]
                # - [[*Gamma06, 0.], [0., 0.]]
                # - [[*Gamma07, 0.], [0., 0.]]
                # - [[*Gamma08, 0.], [0., 0.]]
                # - [[*Gamma09, 0.], [0., 0.]]
                # - [[*Gamma10, 0.], [0., 0.]]
                # - [[*Gamma11, 0.], [0., 0.]]
                # - [[*Gamma12, 0.], [0., 0.]]
                # - [[*Gamma13, 0.], [0., 0.]]
                # - [[*Gamma14, 0.], [0., 0.]]
                - [[*Gamma15, 0.], [0., 0.]]
                # - [[*Gamma17, 0.], [0., 0.]]
                # - [[*Gamma19, 0.], [0., 0.]]

          minimization:
            mode: manual

      - update_work_function_term:
          times: [1]
          name: volume_elasticity
          parameters:
            set_height: 1
            gamma: !expr 1./(25*24)
          minimization:
            mode: manual

      # Minimize the energy using different fluctuation intensities
      - void:
          iterations_prolog: 25
          times:
            start: 1
            stop: 100001
            step: 1
          minimization:
            linetension_fluctuations: !coupled-sweep
              target_name: Gamma
              name: dL
              default: 0.013
              values:
                - !expr (0.008 + (0.020 - 0.008) / 0.1 * 0.04)
                # - !expr (0.008 + (0.020 - 0.008) / 0.1 * 0.05)
                # - !expr (0.008 + (0.020 - 0.008) / 0.1 * 0.06)
                # - !expr (0.008 + (0.020 - 0.008) / 0.1 * 0.07)
                # - !expr (0.008 + (0.020 - 0.008) / 0.1 * 0.08)
                # - !expr (0.008 + (0.020 - 0.008) / 0.1 * 0.09)
                # - !expr (0.008 + (0.020 - 0.008) / 0.1 * 0.10)
                # - !expr (0.008 + (0.020 - 0.008) / 0.1 * 0.11)
                # - !expr (0.008 + (0.020 - 0.008) / 0.1 * 0.12)
                # - !expr (0.008 + (0.020 - 0.008) / 0.1 * 0.12)
                # - !expr (0.008 + (0.020 - 0.008) / 0.1 * 0.13)
                # - !expr (0.008 + (0.020 - 0.008) / 0.1 * 0.13)
                # - !expr (0.008 + (0.020 - 0.008) / 0.1 * 0.14)
                - !expr (0.008 + (0.020 - 0.008) / 0.1 * 0.15)

    # --- The solver
    PCPVertex:
      log_level: warning

      work_function_terms:
      - volume_elasticity:
      # - volume_elasticity_triangle:
          name: volume_elasticity
          elastic_modulus: 1
          preferential_volume: 1
          tissue_height: 1.
          minimum_height: 0.10
          gamma: 0.
          height_parameter_name: height
      - surface_elasticity:
          VolumeElasticity_term: volume_elasticity
          height_parameter_name: height
          elastic_modulus: 1.
          preferential_surface: 3.81
          tissue_height: 1.
      - edge_contractility_heterotypic:
          boundary_type: 1
          contractility: [[0., 0.], [0., 0.]]
      - linetension_fluctuations:
          amplitude: 1.e6
          timescale: 1.e-6

      agent_manager:
        setup_params:
          hexagonal:
            lattice_rows: 4
            lattice_columns: 4

      T1_barrier: 1.e-2
      T1_probability: 1.
      T1_timeout: 12
      T1_threshold: 0.06
              
      # continuous data manager
      data_manager:
        deciders:
          write_energy:
            type: interval
            args: 
              intervals:
                - [0, 1000000000, 480]
        tasks:
          Energy: &energy_continuous
            decider: write_energy
            active: false
          Energy_time: *energy_continuous
          Transitions: *energy_continuous
          Interface_length: {active: false}

          Vertices: &position {active: false}
          Cells: *position
          Edges: *position

    NotchDelta:
      data_manager:
        deciders: {write_always: {type: always}}
        triggers: {build_once: {type: once}}
        tasks:
          Density_progenitor: &density_ND
            active: false
            trigger: build_once
            decider: write_always
          Density_hair: *density_ND
          Density_support: *density_ND
          Density_rosettes: *density_ND
          Density_time: *density_ND


    # --- Data Manager -------------------------------------------------
    data_manager:
      deciders:
        write_interval: &interval
          type: interval
          args:
            intervals:
              - [0, 5, 1]
              - [5, 20, 2]
              - [20, 50, 5]
              - [50, 100, 10]
              - [100, 200, 20]
              - [200, 500, 50]
              - [500, 1000, 100]
              - [1000, 2000, 200]
              - [2000, 10001, 1000]
      triggers:
        build_interval: *interval
      tasks:
        Vertices: {active: true}
        Cells: {active: true}
        Edges: {active: true}
        Interface_length: {active: false}
        Cell_energies: {active: true}
        Edge_energies: {active: false}
