    # --- The solver
    PCPVertex:
      log_level: warning

      work_function_terms:
      - triangle_approximation_update:
          gamma: 1.
          tissue_height: &tissue_height 1.
          maximum_height: 1.
          minimum_height: 0.1
          critical_height: &critical_height 0.9
          steepness: &steepness 3
      - volume_elasticity_triangle:
          name: volume_elasticity
          elastic_modulus: 1.
          preferential_volume: 1.
          tissue_height: *tissue_height
          critical_height: *critical_height
          steepness: *steepness
      - surface_elasticity:
          elastic_modulus: 1.
          preferential_surface: 5.78
          tissue_height: *tissue_height
          critical_height: *critical_height
          steepness: *steepness
      - edge_contractility_heterotypic:
          name: edge_contractility
          boundary_type: 1
          contractility: [[0., 0.], [0., 0.]]

      - linetension_fluctuations:
          amplitude: 1.e6
          timescale: 1.e-6

      agent_manager:
        setup_params:
          hexagonal:
            lattice_rows: 4
            lattice_columns: 4

      initial_jiggle: 1.e-1
      
      T1_barrier: 1.e-2
      T1_probability: 1.
      T1_timeout: 12
      T1_threshold: 0.06
              
      # continuous data manager
      data_manager:
        deciders:
          write_energy:
            type: interval
            args: 
              intervals:
                - [0, 1000000000, 480]
        tasks:
          Energy: &energy_continuous
            decider: write_energy
            active: false
          Energy_time: *energy_continuous
          Transitions: *energy_continuous
          Interface_length: {active: false}

          Vertices: &position {active: false}
          Cells: *position
          Edges: *position

    NotchDelta:
      data_manager:
        deciders: {write_always: {type: always}}
        triggers: {build_once: {type: once}}
        tasks:
          Density_progenitor: &density_ND
            active: false
            trigger: build_once
            decider: write_always
          Density_hair: *density_ND
          Density_support: *density_ND
          Density_rosettes: *density_ND
          Density_time: *density_ND


    # --- Data Manager -------------------------------------------------
    data_manager:
      deciders:
        write_interval: &interval
          type: interval
          args:
            intervals:
              - [0, 5, 1]
              - [5, 20, 5]
              - [20, 100, 10]
              - [100, 200, 50]
              - [200, 1000, 100]
              - [1000, 2000, 200]
              - [2000, 10000, 1000]
              - [10000, 20000, 2000]
              - [20000, 100000, 10000]
              - [100000, 200000, 20000]
      triggers:
        build_interval: *interval
      tasks:
        Vertices: {active: true}
        Cells: {active: true}
        Edges: {active: true}
        Interface_length: {active: false}
        Cell_energies: {active: true}
        Edge_energies: {active: false}
