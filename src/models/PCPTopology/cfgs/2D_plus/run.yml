parameter_space:
  num_steps: 5000

  seed: !sweep
    default: 42
    range: [8]
    order: !expr -np.inf

  PCPTopology:
    log_level: info

    # --- Dynamics
    # Minimization parameter
    minimization:
      dt: 0.05
      # num_steps: 100
      num_steps: 20
      jiggle_intensity: 0.
      linetension_fluctuations: &dL 0.0
      # linetension_fluctuations: &dL 0.012
      # linetension_fluctuations: &dL 0.016
      linetension_fluctuations_tau: &tau_dL 24
      # num_repeat: 24
      num_repeat: 1

    # -- Initialisation
    initialisation:
      0_add_noise:
        enabled: False
        minimization:
          num_repeat: 1
      1_by_proliferation:
        # enabled: False
        enabled: True
        num_generations: 3
        minimization_between_generations:
          num_repeat: 24
        minimization:
          num_repeat: 100

    #  --- The sequence of operations ---------------------------------
    operations:
      - differentiate_random:
          times: []
          iterations_prolog: 1
          method: fraction
          density: !sweep
            name: rho
            default: 0.26
            order: 0
            values: 
              - &Rho20 0.20
          distribution: !coupled-sweep
            target_name: rho
            name: distribution
            default: [0.74, 0.26]
            values: 
              - [0.80, *Rho20]
          minimization:
            mode: manual
