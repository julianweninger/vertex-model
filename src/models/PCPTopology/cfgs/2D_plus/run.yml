---
perform_sweep: true
paths:
  model_note: default__2d_plus

worker_manager:
  nonzero_exit_handling: warn_all
    
parameter_space:
  num_steps: 200

  seed: !sweep
    default: 42
    range: [1]
    order: -1

  PCPTopology:
    log_level: info

    # --- Dynamics
    # Minimization parameter
    minimization:
      update_scheme: steepest_gradient
      dt: 0.01  # this was evaluated in the previous test to be a good dt
      num_steps: 100
      jiggle_intensity: 0.
      linetension_fluctuations: &dL 0.01
      linetension_fluctuations_tau: &tau_dL 24
      num_repeat: 24

    # -- Initialisation
    initialisation:
      0_add_noise:
        enabled: False
        minimization:
          num_repeat: 1
      1_by_proliferation:
        # enabled: false
        num_generations: 2
        minimization_between_generations:
          linetension_fluctuations: 0.01
          num_repeat: 24
        minimization:
          linetension_fluctuations: 0.01
          num_repeat: 100

    #  --- The sequence of operations ---------------------------------
    operations:
      # Put some markers into the tissue
      - differentiate_random:
          times: []
          iterations_prolog: 1
          rho: !sweep
            name: rho
            default: 0.26
            values:
              - 0.2
              # - 0.26
              # - 0.1
          method: fraction
          distribution: !coupled-sweep
            target_name: rho
            name: distribution
            default: [0.8, 0.2]
            values:
              - [0.80, 0.20]
              # - [0.74, 0.26]
              # - [0.90, 0.10]
          minimization:
            mode: manual

      # disperse them as much as possible
      - minimize_cell_contacts:
          times: []
          iterations_prolog: 1
          num_steps: 6000
          type: 1
          neutral_probability: 0.2
          minimization:
            mode: manual
      
      - update_work_function_term:
          times: []
          iterations_prolog: 1
          name: edge_contractility_heterotypic
          Gamma: !sweep
            name: Gamma
            default: 0.
            values: 
              - &Gamma_0 0.
              # - &Gamma_1 0.1
              - &Gamma_2 0.2
              # - &Gamma_3 0.3
              - &Gamma_4 0.4
              # - &Gamma_5 0.5
              - &Gamma_6 0.6
              # - &Gamma_7 0.7
              - &Gamma_8 0.8
              # - &Gamma_9 0.9
              - &Gamma_10 1.0
              # - &Gamma_11 1.1
              - &Gamma_12 1.2
              # - &Gamma_13 1.3
              - &Gamma_14 1.4
              # - &Gamma_15 1.5
            order: 2
          parameters:
            contractility: !coupled-sweep
              target_name: Gamma
              name: contractility
              default: [[0., 0., 0.], [0., 0., 0.], [0., 0., 0.]]
              values:
              - [[ *Gamma_0, 0.], [0., 0.]]
              # - [[ *Gamma_1, 0.], [0., 0.]]
              - [[ *Gamma_2, 0.], [0., 0.]]
              # - [[ *Gamma_3, 0.], [0., 0.]]
              - [[ *Gamma_4, 0.], [0., 0.]]
              # - [[ *Gamma_5, 0.], [0., 0.]]
              - [[ *Gamma_6, 0.], [0., 0.]]
              # - [[ *Gamma_7, 0.], [0., 0.]]
              - [[ *Gamma_8, 0.], [0., 0.]]
              # - [[ *Gamma_9, 0.], [0., 0.]]
              - [[ *Gamma_10, 0.], [0., 0.]]
              # - [[ *Gamma_11, 0.], [0., 0.]]
              - [[ *Gamma_12, 0.], [0., 0.]]
              # - [[ *Gamma_13, 0.], [0., 0.]]
              - [[ *Gamma_14, 0.], [0., 0.]]
              # - [[ *Gamma_15, 0.], [0., 0.]]
          minimization:
            mode: manual
      # END differentiation

      - void:
          times:
            start: 1
            stop: 100000
            step: 1

    # --- The solver
    PCPVertex:
      log_level: warning

      work_function_terms:
      - volume_elasticity:
          elastic_modulus: 1
          preferential_volume: 1
          tissue_height: 1
          height_parameter_name: height
      - edge_contractility:
          # contractility: 0.04
          contractility: 0.5
      - linetension_heterotypic:
          boundary_type: 2
          linetension:
            - [0., 0.]
            - [0., !expr 0. + 10.]
      - surface_tension:
          # surface_tension: 0.06
          surface_tension: -0.1
          VolumeElasticity_term: volume_elasticity
          height_parameter_name: height
      - edge_contractility_heterotypic:
          boundary_type: 1
          contractility:
            - [0., 0.]
            - [0., 0.]
      - linetension_fluctuations:
          amplitude: *dL
          timescale: *tau_dL

      agent_manager:
        setup_params:
          hexagonal:
            lattice_rows: 4
            lattice_columns: 4


      T1_barrier: 1.e-2
      T1_probability: 1.
      T1_timeout: 12
      T1_threshold: 0.06
              
      # continuous data manager
      data_manager:
        deciders:
          write_energy:
            type: interval
            args: 
              intervals:
                - [0, 1000000000, 320]
        tasks:
          Energy: &energy_continuous
            decider: write_energy
            active: true
          Energy_time: *energy_continuous
          Transitions: *energy_continuous
          Interface_length: {active: false}

          Vertices: &position {active: false}
          Cells: *position
          Edges: *position

    NotchDelta:
      data_manager:
        deciders: {write_always: {type: always}}
        triggers: {build_once: {type: once}}
        tasks:
          Density_progenitor: &density_ND
            active: false
            trigger: build_once
            decider: write_always
          Density_hair: *density_ND
          Density_support: *density_ND
          Density_rosettes: *density_ND
          Density_time: *density_ND


    # --- Data Manager -------------------------------------------------
    data_manager:
      deciders:
        write_interval: &interval
          type: interval
          args:
            intervals:
              - [0, 5, 1]
              - [5, 20, 2]
              - [20, 50, 5]
              - [50, 100, 10]
              - [100, 200, 20]
              - [200, 500, 50]
              - [500, 1000, 100]
              - [1000, 2000, 200]
              - [2000, 5000, 500]
              - [5000, 10000, 1000]
              - [10000, 20000, 2000]
              - [20000, 50000, 5000]
              - [50000, 100001, 10000]
      triggers:
        build_interval: *interval
      tasks:
        Interface_length: {active: false}
        Cell_energies: {active: true}
        Edge_energies: {active: false}
