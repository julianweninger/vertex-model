---
perform_sweep: true
paths:
  model_note: default_2Dp_model

worker_manager:
  nonzero_exit_handling: warn_all
    
# run_kwargs:
#   timeout: !expr 60*60*3.5

parameter_space:
  num_steps: 500

  seed: !sweep
    default: 42
    range: [1]
    order: !expr -np.inf

  PCPTopology:
    log_level: info

    # --- Dynamics
    # Minimization parameter
    minimization:
      update_scheme: steepest_gradient
      dt: 0.05
      num_steps: 20
      jiggle_intensity: 0.
      linetension_fluctuations: &dL 0.024
      linetension_fluctuations_tau: &tau_dL 24
      num_repeat: 24

    # -- Initialisation
    initialisation:
      0_add_noise:
        enabled: False
      1_by_proliferation:
        enabled: True
        num_generations: 3
        minimization_between_generations: ~
        minimization:
          num_repeat: 100

    #  --- The sequence of operations ---------------------------------
    operations:
      - differentiate_random:
          times: []
          iterations_prolog: 1
          method: fraction
          density: !sweep
            name: rho
            default: 0.25
            order: 0
            values: 
              - &Rho20 0.20
          distribution: !coupled-sweep
            target_name: rho
            name: distribution
            default: [0.75, 0.25]
            values: 
              - [0.80, *Rho20]
          minimization:
            mode: manual

      # disperse them as much as possible
      - minimize_cell_contacts:
          times: []
          iterations_prolog: 1
          num_steps: 6000
          type: 1
          neutral_probability: 0.2
          minimization:
            mode: manual

      - void:
          iterations_prolog: 0
          times:
            start: 1
            stop: 100001
            step: 1

    # --- The solver
    PCPVertex:
      log_level: warning

      work_function_terms:
      - triangle_approximation_update:
          name: 2D_plus_update
          gamma: 1.
          tissue_height: &tissue_height 1.
          maximum_height: 1.
          minimum_height: 0.001
      - volume_elasticity_triangle:
          name: volume_elasticity
          elastic_modulus: 1.
          preferential_volume: 1.
          tissue_height: *tissue_height
      - surface_elasticity:
          elastic_modulus: 1.
          preferential_surface: 5.78
          tissue_height: *tissue_height
      - perimeter_contractility:
          contractility: 0.01
      - area_elasticity_minimum:
          minimum_area: 0.2
          elastic_modulus: 1.
      - edge_contractility_heterotypic:
          name: edge_contractility
          boundary_type: 1
          contractility: [[0.4, 0.], [0., 0.]]

      - linetension_fluctuations:
          amplitude: 1.e6
          timescale: 1.e-6

      agent_manager:
        setup_params:
          hexagonal:
            lattice_rows: 4
            lattice_columns: 4

      initial_jiggle: 1.e-1
      
      T1_barrier: 1.e-2
      T1_probability: 1.
      T1_timeout: 12
      T1_threshold: 0.06
              
      # continuous data manager
      data_manager:
        deciders:
          write_energy:
            type: interval
            args: 
              intervals:
                - [0, 1000000000, 480]
        tasks:
          Energy: &energy_continuous
            decider: write_energy
            active: false
          Energy_time: *energy_continuous
          Transitions: *energy_continuous
          Interface_length: {active: false}

          Vertices: &position {active: false}
          Cells: *position
          Edges: *position

    NotchDelta:
      data_manager:
        deciders: {write_always: {type: always}}
        triggers: {build_once: {type: once}}
        tasks:
          Density_progenitor: &density_ND
            active: false
            trigger: build_once
            decider: write_always
          Density_hair: *density_ND
          Density_support: *density_ND
          Density_rosettes: *density_ND
          Density_time: *density_ND


    # --- Data Manager -------------------------------------------------
    data_manager:
      deciders:
        write_interval: &interval
          type: interval
          args:
            intervals:
              - [0, 5, 1]
              - [5, 20, 5]
              - [20, 100, 10]
              - [100, 200, 50]
              - [200, 1000, 100]
              - [1000, 2000, 200]
              - [2000, 10000, 1000]
              - [10000, 20000, 2000]
              - [20000, 100000, 10000]
              - [100000, 200000, 20000]
      triggers:
        build_interval: *interval
      tasks:
        Vertices: {active: true}
        Cells: {active: true}
        Edges: {active: true}
        Interface_length: {active: false}
        Cell_energies: {active: true}
        Edge_energies: {active: false}
