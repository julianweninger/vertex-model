      #     iterations_prolog: 1
      #     method: fraction
      #     num_seeds: 1
      #     cluster_size: 1
      #     minimization:
      #       mode: manual

      # disperse them as much as possible
      - minimize_cell_contacts:
          times: []
          iterations_prolog: 1
          num_steps: 6000
          type: 1
          neutral_probability: 0.2
          minimization:
            mode: manual
