# The evaluation of PCPTopology differentiation using the Collier model
---
energy:
  based_on: energy

energy_continuous:
  based_on: energy
  model_name: PCPTopology/PCPVertex

  to_plot:
    Energy/Total:
      label: TOTAL
    Energy/Linetension:
      label: line-tension
    Energy/Areaelasticity:
      label: area-elasticity
    Energy/Contractility:
      label: contractility
      
equilibrium_cellular_structure:
  based_on: cellular_structure

cell_neighbourhood: !pspace
  based_on: cell_neighbourhood
  
  only_type: !sweep
    default: all
    values:
      - all
      - hair
      - support
      - support_hair
      - support_support

Collier_densities:
  based_on: .basic_uni.lineplots
  model_name: PCPTopology
  file_ext: png

  to_plot:
    Collier/Densities/Progenitor:
      label: Progenitor
      color: gray
    Collier/Densities/Support:
      label: Support
      color: black
    Collier/Densities/Hair:
      label: Hair
      color: red
    Collier/Densities/Rosettes:
      label: Rosettes
      color: violet

  helpers:
    set_labels:
      x: time
      y: density
    set_limits:
      y: [0,1.]
