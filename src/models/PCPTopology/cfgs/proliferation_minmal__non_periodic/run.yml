# A minimal configuration to do cell proliferation
# In quick and dirty during proliferation the energy is not minimized.
# This results in a significant (~ factor 100) speed up with similar results.
#
# The model can be run by typing : 
# $ cd /path-to-Utopia/vertex-model
# $ utopia run PCPTopology src/models/PCPTopology/cfgs/<choose>/run.yml \
#          --plots-cfg src/models/PCPTopology/cfgs/<choose>/eval.yml
#
# The content of this file is used to update the corresponding entries in
# ../PCPTopology_cfg.yml
---
paths:
  model_note: default_proliferation_non_periodic

parameter_space:
  num_steps: 2

  PCPTopology:
    space: &SPACE
      periodic: false
      extent: [30, 30]

    operations:
      - jiggle:
          times: []
          iterations_prolog: 1

          minimization:
            num_repeat: 1
            jiggle_intensity: 1.e-3

      - proliferate:
          times: [1]
          iterations_prolog: 0
          iterations_epilog: 0
          emit_interval: 32

          iterations: 4

          num_increases: 0
          area_threshold: 0.

          minimization:
            mode: manual

      - jiggle:
          times: [2]
          iterations_prolog: 0

      - proliferate:
          times: [3]
          iterations_prolog: 0
          iterations_epilog: 0
          emit_interval: 32

          iterations: 8

          num_increases: 0
          area_threshold: 0.

          minimization:
            mode: manual

      - jiggle:
          times: [3]
          iterations_prolog: 0
          
      - proliferate:
          times: !listgen [4, 1000]
          iterations_prolog: 0
          iterations_epilog: 0
          emit_interval: 32

          iterations: 16

          num_increases: 0
          area_threshold: 0.

          minimization:
            mode: manual

      - jiggle:
          times: !listgen [3, 1000]
          iterations_prolog: 0

    PCPVertex:
      log_level: info

      space: *SPACE

      # --- Initialization parameters
      agent_manager:
        setup_method: hexagonal
        setup_params:
          single:
            size: 0.62
          hexagonal:
            hexagon_size: 0.62
            lattice_rows: 4
            lattice_columns: 4
        vertex_manager:
          non_periodic_offset: [10, 10]

      data_manager:
        deciders:
          write_interval: &interval_continuous
            type: interval
            args:
              intervals:
                - [100, 800, 100]
        triggers:
          build_interval: *interval_continuous

    data_manager:
      deciders:
        write_interval: &interval
          type: interval
          args:
            intervals:
              - [0, 12, 1]
              - [12, 32, 4]
              - [32, 128, 8]
      triggers:
        build_interval: *interval
