# A minimal configuration to do cell proliferation
# In quick and dirty during proliferation the energy is not minimized.
# This results in a significant (~ factor 100) speed up with similar results.
#
# The model can be run by typing : 
# $ cd /path-to-Utopia/vertex-model
# $ utopia run PCPTopology src/models/PCPTopology/cfgs/<choose>/run.yml \
#          --plots-cfg src/models/PCPTopology/cfgs/<choose>/eval.yml
#
# The content of this file is used to update the corresponding entries in
# ../PCPTopology_cfg.yml
---
paths:
  model_note: default_proliferation_non_periodic

parameter_space:
  num_steps: 2

  PCPTopology:
    space: &SPACE
      periodic: false
      extent: [30, 30]

    operations:
      - jiggle:
          times: []
          iterations_prolog: 1

          minimization: &JiggleQuickDirty
            jiggle_intensity: 1.e-3
            num_repeat: 2
            tolerance: 1.e-8
            jiggle_tolerance: 1.e-6

      - proliferate_quick_and_dirty:
          times: [1]
          target_num_cells: 32
          minimization_quick:
            mode: manual
          minimization:
            mode: manual
      # 32 cells

      - jiggle:
          times: [2]
      # NOTE time 2: jiggle (see last operation)

      - proliferate_quick_and_dirty:
          times: [3]
          target_num_cells: 64
          minimization_quick: *JiggleQuickDirty
      # 64 cells

      - proliferate_quick_and_dirty:
          times: [4]
          target_num_cells: 128
          minimization_quick: *JiggleQuickDirty
      # 128 cells
      
      - proliferate_quick_and_dirty:
          times: [5]
          target_num_cells: 256
          minimization_quick: *JiggleQuickDirty
      # 256 cells
      
      - proliferate_quick_and_dirty:
          times: [6]
          target_num_cells: 512
          minimization_quick: *JiggleQuickDirty
      # 512 cells
      
      - proliferate_quick_and_dirty:
          times: [7]
          target_num_cells: 1024
          minimization_quick: *JiggleQuickDirty
      # 1024 cells
      
      - proliferate_quick_and_dirty:
          times: [8]
          target_num_cells: 2048
          minimization_quick: *JiggleQuickDirty
      # 2048 cells 
      
      - proliferate_quick_and_dirty:
          times: [9]
          target_num_cells: 4096
          minimization_quick: *JiggleQuickDirty
      # 4096 cells 

    PCPVertex:
      log_level: info

      space: *SPACE

      # --- Initialization parameters
      agent_manager:
        setup_method: hexagonal
        setup_params:
          single:
            size: 0.62
          hexagonal:
            hexagon_size: 0.62
            lattice_rows: 4
            lattice_columns: 4

      data_manager:
        deciders:
          write_interval: &interval_continuous
            type: interval
            args:
              intervals:
                - [100, 800, 100]
        triggers:
          build_interval: *interval_continuous

    data_manager:
      deciders:
        write_interval: &interval
          type: interval
          args:
            intervals:
              - [0, 11, 1]
      triggers:
        build_interval: *interval
