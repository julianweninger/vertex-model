# The evaluation of PCPTopology differentiation using the NotchDelta model
---
energy:
  based_on: energy

energy_continuous:
  based_on: energy
  model_name: PCPTopology/PCPVertex
      
equilibrium_cellular_structure:
  based_on: cellular_structure

cell_neighbourhood: !pspace
  based_on: cell_neighbourhood
  
  only_type: !sweep
    default: all
    values:
      - all
      - hair
      - support
      - support_hair

NotchDelta_densities:
  based_on: .basic_uni.lineplots
  model_name: PCPTopology
  file_ext: png

  to_plot:
    NotchDelta/Densities/Progenitor:
      label: Progenitor
      color: gray
    NotchDelta/Densities/Support:
      label: Support
      color: black
    NotchDelta/Densities/Hair:
      label: Hair
      color: red
    NotchDelta/Densities/Rosettes:
      label: Rosettes
      color: violet

  helpers:
    set_labels:
      x: time
      y: density
    set_limits:
      y: [0,1.]
