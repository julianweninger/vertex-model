# The evaluation of PCPTopology differentiation using the NotchDelta model
---
energy:
  based_on: energy

energy_continuous:
  based_on: energy
  model_name: PCPTopology/PCPVertex
      
equilibrium_cellular_structure:
  based_on: cellular_structure

cell_neighbourhood: !pspace
  based_on:
    - .default_style_and_helpers
    - universe
    - _cell_neighbourhood

  select: &select_cell_neighbourhood
    area:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: area
    cell_type:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: cell_type
    shape_index:
      path: data/PCPTopology/Cells
      transform:
        - .sel: [!dag_prev , {property: perimeter}]
        - .sel: [!dag_node -2, {property: area_preferential}]
        - pow: [!dag_node -1 , 0.5]
        - div: [!dag_node -3, !dag_node -1]
        - .rename: [!dag_prev , shape_index]
    num_neighbors:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: num_neighbors
    num_hair_neighbors:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: num_hair_neighbors

  only_type: !sweep
    default: all
    values:
      - all
      - hair
      - support
      - support_hair
      - hair_hair

NotchDelta_densities:
  based_on: .basic_uni.lineplots
  model_name: PCPTopology
  file_ext: png

  to_plot:
    NotchDelta/Densities/Progenitor:
      label: Progenitor
      color: gray
    NotchDelta/Densities/Support:
      label: Support
      color: black
    NotchDelta/Densities/Hair:
      label: Hair
      color: red
    NotchDelta/Densities/Rosettes:
      label: Rosettes
      color: violet

  helpers:
    set_labels:
      x: time
      y: density
    set_limits:
      y: [0,1.]
