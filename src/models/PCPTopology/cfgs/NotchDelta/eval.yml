# The evaluation of PCPTopology differentiation using the NotchDelta model
---
energy:
  based_on: energy

energy_continuous:
  based_on: 
    - energy
    - select.uni.continuous_energy_terms
      

NotchDelta_densities:
  based_on:
    - .plot.multiplot
    - universe

  select:
    _progenior: 
      path: data/PCPTopology/NotchDelta/Densities/Progenitor
      transform:
        - .rename: [!dag_prev , density]
    _support: 
      path: data/PCPTopology/NotchDelta/Densities/Support
      transform:
        - .rename: [!dag_prev , density]
    _hair: 
      path: data/PCPTopology/NotchDelta/Densities/Hair
      transform:
        - .rename: [!dag_prev , density]
    _rosettes: 
      path: data/PCPTopology/NotchDelta/Densities/Rosettes
      transform:
        - .rename: [!dag_prev , density]

  transform:
    - import_and_call:
      args: 
        - model_plots.PCPTopology.data_ops
        - to_dataframe
        - !dag_tag _progenior
      tag: progenior
    - import_and_call:
      args: 
        - model_plots.PCPTopology.data_ops
        - to_dataframe
        - !dag_tag _support
      tag: support
    - import_and_call:
      args: 
        - model_plots.PCPTopology.data_ops
        - to_dataframe
        - !dag_tag _hair
      tag: hair
    - import_and_call:
      args: 
        - model_plots.PCPTopology.data_ops
        - to_dataframe
        - !dag_tag _rosettes
      tag: rosettes

  to_plot:
    - function: sns.lineplot
      data: !dag_result progenior
      label: Progenitor
      color: gray
      ci: sd
    - function: sns.lineplot
      data: !dag_result support
      label: Support
      color: black
      ci: sd
    - function: sns.lineplot
      data: !dag_result hair
      label: Hair
      color: red
      ci: sd
    - function: sns.lineplot
      data: !dag_result rosettes
      label: Rosettes
      color: violet
      ci: sd

  x: time
  y: density

  helpers:
    set_labels:
      x: time
      y: density
    set_limits:
      y: [0, 1.]

equilibrium_cellular_structure:
  based_on: cellular_structure

cell_neighbourhood: !pspace
  based_on:
    - universe
    - _cell_neighbourhood

  select: &select_cell_neighbourhood
    area:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: area
    cell_type:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: cell_type
    shape_index:
      path: data/PCPTopology/Cells
      transform:
        - .sel: [!dag_prev , {property: perimeter}]
        - .sel: [!dag_node -2, {property: area_preferential}]
        - pow: [!dag_node -1 , 0.5]
        - div: [!dag_node -3, !dag_node -1]
        - .rename: [!dag_prev , shape_index]
    num_neighbors:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: num_neighbors
    num_hair_neighbors:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: num_hair_neighbors

  only_type: !sweep
    default: all
    values:
      - all
      - hair
      - support
      - support_hair
      - hair_hair
