# The evaluation of default_proliferation_minimal__generations
#
# These can use the `based_on` feature with configurations specified in the
# accompanying *_base_plots.yml file and in the utopya base plot configs.
---
energy:
  based_on: energy

energy_continuous:
  based_on: energy
  model_name: PCPTopology/PCPVertex

transitions:
  based_on:
    - universe

  model_name: PCPTopology
  module: model_plots.PCPTopology
  plot_func: transitions

  map_to_continuous_time: True

transitions_continuous:
  based_on:
    - universe

  model_name: PCPTopology/PCPVertex
  module: model_plots.PCPTopology
  plot_func: transitions
  
  map_to_discrete_time: True

cell_area:
  based_on: cell_property

  enabled: false
  # WARNING: does not work with TimeSeriesGroup of flexible cell number
      
cell_segmentation:
  based_on: cellular_structure

cell_segmentation__continuous:
  based_on: cellular_structure
  datapath: PCPTopology/PCPVertex

cell_neighbourhood: !pspace
  based_on:
    - .default_style_and_helpers
    - universe
    - _cell_neighbourhood

  select: &select_cell_neighbourhood
    area:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: area
    cell_type:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: cell_type
    shape_index:
      path: data/PCPTopology/Cells
      transform:
        - .sel: [!dag_prev , {property: perimeter}]
        - .sel: [!dag_node -2, {property: area_preferential}]
        - pow: [!dag_node -1 , 0.5]
        - div: [!dag_node -3, !dag_node -1]
        - .rename: [!dag_prev , shape_index]
    num_neighbors:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: num_neighbors
    num_hair_neighbors:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: num_hair_neighbors

  only_type: !sweep
    default: all
    values:
      - all
      - hair
      - support
      - support_hair
      - hair_hair
