# A minimal configuration to introduce heterogeneous edge contractility
# In quick and dirty during proliferation the energy is not minimized.
# This results in a significant (~ factor 100) speed up with similar results.
#
# The model can be run by typing : 
# $ cd /path-to-Utopia/vertex-model
# $ utopia run PCPTopology src/models/PCPTopology/cfgs/<case>/run.yml \
#          --plots-cfg src/models/PCPTopology/cfgs/<case>/eval.yml
#
# The content of this file is used to update the corresponding entries in
# ../PCPTopology_cfg.yml
---
perform_sweep: true
paths:
  model_note: default__heterogeneities_coupled_to_polarity__mechanical_relax

worker_manager:
  nonzero_exit_handling: warn_all
  # num_workers: 6
# run_kwargs:
#   timeout: !expr 60*60*18
  # stop_conditions:
  #   - !stop-condition
  #     name: single simulation timeout
  #     description: terminates a simulation if it ran for too long
  #     enabled: true               # (optional, true by default)
  #     to_check:                   # A sequence of AND-connected conditions
  #       - func: timeout_wall      # Looked up in utopya.stopcond_funcs
  #         seconds: 0.1 # !expr 60*40  

parameter_space:
  num_steps: 500

  seed: !sweep
    default: 42
    range: [8]
    order: !expr -np.inf

  PCPTopology:
    space: &space
      periodic: false

    initialisation:
      1_by_proliferation:
        iterations_prolog: 0
        num_generations: 0
        minimization_between_generations: ~
        minimization:
          num_repeat: 1

    # The sequence of operations
    operations:
      - bending_box_bc:
          times: []
          iterations_prolog: 1
          increment_curvature: !sweep
            name: curvature
            default: 6.e-2
            values: 
              - 0.
              # - 5.e-3
              # - 1.e-2
              - 2.e-2
              # - 6.e-2
              # - 1.e-1
          deform_plastic: True
          minimization:
            mode: manual


      # Differentiate hair and support cells
      - differentiate_random:
          times: []
          iterations_prolog: 1
          fraction: 0.26
          set_boundary_sc: true
          minimization:
            mode: manual
      - differentiate_NotchDelta:
          times: []
          iterations_prolog: 1
          discard_initialisation: True
          steps: 2000
          minimization:
            mode: manual

      # Introduce junctional heterogeneity
      - increment_edge_contractility:
          times: []
          iterations_prolog: 1

          support_support: 0.2

          minimization:
            linetension_fluctuation: 0.04
            num_repeat: 240
      # END differentiation


      # Introduce polarity
      - increment_edge_contractility:
          times: []
          iterations_prolog: 1

          set_ppMLC: &ppMLC !sweep
            name: ppMLC
            default: 0.4
            values: [0.4, 0.]
          set_ppMLC_angle: 0.
          ppMLC_curved_axis: True

          set_pMLC: &pMLC 0.1
          reset_HC_polarity: [False, 0.]
          reset_HC_polarity_shuffle: 3.1415
          
          minimization:
            mode: manual


      # Introduce polarity
      # - increment_edge_contractility:
      #     times: []

      #     set_ppMLC: 0.
      #     set_ppMLC_angle: 0.

      #     set_pMLC: *pMLC
      #     reset_HC_polarity: [False, 0.]
          
      #     minimization:
      #       mode: manual

      - jiggle:
          times: !listgen [1, 501]
          minimization:
            linetension_fluctuation: 0.0001
            linetension_fluctuation_tau: 24
            num_repeat: 24

      # - jiggle:
      #     times: !listgen [100, 10001]
      #     minimization:
      #       linetension_fluctuation: !sweep
      #         name: dL
      #         default: 0.06
      #         values: [0.06]  
      #       linetension_fluctuation_tau: &tau_dL_ 1000
      #       num_repeat: *tau_dL_

    # --- Dynamics
    # Minimization parameter
    minimization:
      update_scheme: steepest_gradient
      dt: 0.05  # this was evaluated in the previous test to be a good dt
      num_steps: 20
      jiggle_intensity: 0.
      linetension_fluctuation: 0.02
      linetension_fluctuation_tau: &tau_dL 24
      num_repeat: *tau_dL

    NotchDelta:
      cell_manager:
        grid:
          resolution: 32
    PCPVertex:
      space: *space
      boundary_parameter:
        fix_boundary: True
        area_elasticity: 1.
        area_preferential: 1. # per cell
        contractility: 100.
        shape_index_preferential: 3.54491 # 2 sqrt(pi)

      area_elasticity: 1.
      
      cell_shape_implementation: contractile
      # possible contractile or shape_elastic
      # whether to normalize shape index to A^0 or A, respectively

      agent_manager:
        cell_manager:
          agent_params:
            area_preferential: 1.
            contractility: 1.
            shape_index_preferential: 3.8
            polarity: -1.5708   # -Pi / 2
        edge_manager:
          agent_params:
            linetension: 0.
            contractility: 0.
        setup_params:
          hexagonal:
            # HC_structure: ratio_1_to_2
            lattice_rows: 10
            lattice_columns: 24
      
      T1_barrier: 1.e-2
      T1_probability: 1.
      T1_timeout: 12
      T1_threshold: 0.06


      log_level: warning
      
      # continuous data manager
      data_manager:
        deciders:
          write_energy:
            type: interval
            args: 
              intervals:
                - [0, 1000000000, 50]
        tasks:
          Energy_total: &energy_continuous {decider: write_energy}
          Energy_linetension: *energy_continuous
          Energy_areaelasticity: *energy_continuous
          Energy_cell_contractility: *energy_continuous
          Energy_edge_contractility: *energy_continuous
          Energy_boundary_area_elasticity: {active: false}
          Energy_boundary_shape_elasticity: {active: false}
          Energy_time: *energy_continuous
          transitions: *energy_continuous

          Vertices: &position {active: false}
          Cells: *position
          Edges: *position

    # equilibrium data manager
    data_manager:
      deciders:
        write_always:
          type: always

        write_interval: &interval
          type: interval
          args:
            intervals:
              - [0  ,  50, 5]
              - [50  ,  100, 10]
              - [100  ,  1001, 50]
      triggers:
        build_interval: *interval
      tasks:
        Energy_boundary_area_elasticity: {enabled: false}
        Energy_boundary_shape_elasticity: {enabled: false}
