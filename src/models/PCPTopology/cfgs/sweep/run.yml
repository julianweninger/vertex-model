# A minimal configuration to do cell proliferation
# In quick and dirty during proliferation the energy is not minimized.
# This results in a significant (~ factor 100) speed up with similar results.
#
# The model can be run by typing : 
# $ cd /path-to-Utopia/vertex-model
# $ utopia run PCPTopology src/models/PCPTopology/cfgs/<choose>/run.yml \
#          --plots-cfg src/models/PCPTopology/cfgs/<choose>/eval.yml
#
# The content of this file is used to update the corresponding entries in
# ../PCPTopology_cfg.yml
---
paths:
  model_note: default__sweep_p0__seeds

perform_sweep: true

parameter_space:
  num_steps: 10

  seed: !sweep
    default: 1
    range: [1]

  PCPTopology:
    operations:
      - void: 
          times: []
          iterations_prolog: 1
          minimization: &JiggleQuickDirty
            jiggle_intensity: 1.e-3
            num_repeat: 2
            tolerance: 1.e-8
            jiggle_tolerance: 1.e-6

      - proliferate_generations:
          times: []
          iterations_prolog: 1
          num_generations: 2
          minimization_between_generations:
            num_repeat: 1
          minimization:
            num_repeat: &equilibration_time 5
            # NOTE 50 recommended
            jiggle_intensity: 0.1
      # END of quick-proliferate

      # Differentiate hair and support cells
      - differentiate_random:
          times: []
          iterations_prolog: 1
          method: fraction
          distribution: [0.74, 0.26]
          minimization:
            mode: manual

      # disperse them as much as possible
      - minimize_cell_contacts:
          times: []
          iterations_prolog: 1
          num_steps: 6000
          type: 1
          neutral_probability: 0.2
      # END differentiation
      
      - void: 
          times: [1]
          minimization:
            jiggle_intensity: 1.e-1
            num_repeat: 2
            tolerance: 1.e-8
            jiggle_tolerance: 1.e-6
    PCPVertex:
      log_level: warning

      work_function_terms:
      - linetension_fluctuations:
          amplitude: 0.02
          timescale: 24
      - area_elasticity:
          elastic_modulus: 1
          preferential_area: 1
      - cell_contractility:
          contractility: 1.
          preferential_shape: !sweep
            name: p0
            default: 3.72
            values: [3.62, 3.72, 3.77, 3.805]
            order: 1

      data_manager:
        deciders:
          write_interval: &interval_continuous
            type: interval
            args:
              intervals:
                - [100000000, 100000000, 1]
        triggers:
          build_interval: *interval_continuous

    data_manager:
      deciders:
        write_interval: &interval
          type: interval
          args:
            intervals:
              - [0, 101, 1]
      triggers:
        build_interval: *interval
