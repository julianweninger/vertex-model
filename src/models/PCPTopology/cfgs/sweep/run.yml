# A minimal configuration to do cell proliferation
# In quick and dirty during proliferation the energy is not minimized.
# This results in a significant (~ factor 100) speed up with similar results.
#
# The model can be run by typing : 
# $ cd /path-to-Utopia/vertex-model
# $ utopia run PCPTopology src/models/PCPTopology/cfgs/<choose>/run.yml \
#          --plots-cfg src/models/PCPTopology/cfgs/<choose>/eval.yml
#
# The content of this file is used to update the corresponding entries in
# ../PCPTopology_cfg.yml
---
paths:
  model_note: default__sweep_p0__seeds

perform_sweep: true

parameter_space:
  num_steps: 10

  seed: !sweep
    default: 1
    range: [1]

  PCPTopology:
    operations:
      - jiggle: 
          times: []
          iterations_prolog: 1
          minimization: &JiggleQuickDirty
            jiggle_intensity: 1.e-3
            num_repeat: 2
            tolerance: 1.e-8
            jiggle_tolerance: 1.e-6

      - proliferate_generations:
          times: []
          iterations_prolog: 1
          num_generations: 2
          minimization_between_generations:
            num_repeat: 1
          minimization:
            num_repeat: &equilibration_time 5
            # NOTE 50 recommended
            jiggle_intensity: 0.1
      # END of quick-proliferate

      - differentiate_random:
          times: []
          iterations_prolog: 1
          fraction: 0.26
          minimization:
            mode: manual
      - differentiate_NotchDelta:
          times: []
          iterations_prolog: 1
          discard_initialisation: True
          # NOTE: Notch model skipped because random differentiation terminal
          #       Swap removes HC-HC contacts partially
          
          steps: 2000

          minimization:
            mode: manual
      # END differentiation

      - jiggle: 
          times: [1]
          minimization:
            jiggle_intensity: 1.e-1
            num_repeat: 2
            tolerance: 1.e-8
            jiggle_tolerance: 1.e-6
    PCPVertex:
      log_level: warning

      # --- Initialization parameters
      agent_manager:
        setup_method: hexagonal
        setup_params:
          hexagonal:
            lattice_rows: 4
            lattice_columns: 4
        cell_manager:
          agent_params:
            shape_index_preferential: !sweep
              default: 3.77
              values: [3.62, 3.72, 3.77, 3.805]
              name: p0

      data_manager:
        deciders:
          write_interval: &interval_continuous
            type: interval
            args:
              intervals:
                - [100000000, 100000000, 1]
        triggers:
          build_interval: *interval_continuous

    data_manager:
      deciders:
        write_interval: &interval
          type: interval
          args:
            intervals:
              - [0, 101, 1]
      triggers:
        build_interval: *interval
