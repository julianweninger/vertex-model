# A minimal configuration to do cell proliferation
# In quick and dirty during proliferation the energy is not minimized.
# This results in a significant (~ factor 100) speed up with similar results.
#
# The model can be run by typing : 
# $ cd /path-to-Utopia/vertex-model
# $ utopia run PCPTopology src/models/PCPTopology/cfgs/<choose>/run.yml \
#          --plots-cfg src/models/PCPTopology/cfgs/<choose>/eval.yml
#
# The content of this file is used to update the corresponding entries in
# ../PCPTopology_cfg.yml
---
paths:
  model_note: default__sweep_p0__seeds

perform_sweep: true

parameter_space:
  num_steps: 1

  seed: !sweep
    default: 42
    range: [2]

  PCPTopology:
    space: &SPACE
      periodic: false
      extent: [30, 30]

    operations:
      - jiggle: &JiggleQuickDirty
          times: []
          iterations_prolog: 1
          minimization:
            jiggle_intensity: 1.e-3
            num_repeat: 2
            tolerance: 1.e-8
            jiggle_tolerance: 1.e-6

      - proliferate: &proliferate
          times: []
          iterations_prolog: 16

          num_increases: 0
          area_threshold: 0.

          minimization:
            mode: manual
      - jiggle: *JiggleQuickDirty
      # 32 cells
      
      - proliferate:
          <<: *proliferate
          iterations_prolog: 32
      - jiggle: *JiggleQuickDirty
      # 64 cells

      # - proliferate:
      #     <<: *proliferate
      #     iterations_prolog: 64
      # - jiggle: *JiggleQuickDirty
      # # 128 cells
      # - proliferate:
      #     <<: *proliferate
      #     iterations_prolog: 128
      # - jiggle: *JiggleQuickDirty
      # # 256 cells
      # - proliferate:
      #     <<: *proliferate
      #     iterations_prolog: 256
      # - jiggle: *JiggleQuickDirty
      # # 512 cells
      # - proliferate:
      #     <<: *proliferate
      #     iterations_prolog: 512
      # - jiggle: *JiggleQuickDirty
      # # 1024 cells
      # - proliferate:
      #     <<: *proliferate
      #     iterations_prolog: 1024
      # - jiggle: *JiggleQuickDirty
      # # 2048 cells

      - jiggle:
          times: !listgen [1, 11]
          minimization:
            num_repeat: 15
            jiggle_intensity: 0.1
      # END of quick-proliferate

      - differentiate_random:
          times: []
          iterations_prolog: 1
          fraction: 0.26
          minimization:
            mode: manual
      - differentiate_NotchDelta:
          times: []
          iterations_prolog: 1
          discard_initialisation: True
          # NOTE: Notch model skipped because random differentiation terminal
          #       Swap removes HC-HC contacts partially
          
          steps: 2000

          minimization:
            mode: manual
      # END differentiation



    PCPVertex:
      log_level: warning

      space: *SPACE

      # --- Initialization parameters
      agent_manager:
        setup_method: hexagonal
        setup_params:
          single:
            size: 0.62
          hexagonal:
            hexagon_size: 0.62
            lattice_rows: 4
            lattice_columns: 4
        cell_manager:
          agent_params:
            shape_index_preferential: !sweep
              default: 3.62
              values: [3.62, 3.72, 3.77, 3.81]
              name: p0

      data_manager:
        deciders:
          write_interval: &interval_continuous
            type: interval
            args:
              intervals:
                - [100000000, 100000000, 1]
        triggers:
          build_interval: *interval_continuous

    data_manager:
      deciders:
        write_interval: &interval
          type: interval
          args:
            intervals:
              - [0, 21, 1]
      triggers:
        build_interval: *interval
