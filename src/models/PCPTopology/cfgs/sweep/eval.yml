hexatic_order:
  <<: *Property

  to_plot: 
    bulk_hair_cells:
      label: hair cells (bulk)
  
  property: hexatic_order

  helpers:
    set_labels:
      x: p0
      y: average hexatic_order

rotation:
  <<: *Property

  to_plot: 
    bulk_cells:
      label: all cells (bulk)

  property: rotation

  helpers:
    set_labels:
      x: p0
      y: average rotation