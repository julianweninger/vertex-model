# The evaluation of default_proliferation_minimal__quick_and_dirty
#
# These can use the `based_on` feature with configurations specified in the
# accompanying *_base_plots.yml file and in the utopya base plot configs.
---
energy:
  based_on: energy
  universes:
    seed: 0

transitions:
  based_on: universe
  universes:
    seed: 0

  model_name: PCPTopology
  module: model_plots.PCPTopology
  plot_func: transitions

  map_to_continuous_time: True

transitions_continuous:
  based_on:
    - universe
    - transitions

  model_name: PCPTopology/PCPVertex

# --- Average seeds -----------------------------------------------------------

cell_area_mv: !pspace &Property_MV
  based_on:
    - .default_style_and_helpers
    - multiverse
    - cell_property
  
  plot_func: errorbars

  to_plot: 
    cells:
      label: all cells
    hair_cells:
      label: hair cells
    support_cells:
      label: support cells

  property: area
  average_dim: seed

  select_and_combine:
    fields:
      cells: data/PCPTopology/Statistics/Cell_stats
      hair_cells: data/PCPTopology/Statistics/Hair_cell_stats
      support_cells: data/PCPTopology/Statistics/Support_cell_stats
      bulk_cells: data/PCPTopology/Statistics/Bulk_cell_stats
      bulk_hair_cells: data/PCPTopology/Statistics/Bulk_hair_cell_stats
      bulk_support_cells: data/PCPTopology/Statistics/Bulk_support_cell_stats
    subspace:
      p0: !sweep
        default: 3.62
        values: [3.62, 3.72, 3.77, 3.81]
        name: p0

  helpers:
    set_labels:
      x: time
      y: average area

cell_pref_area_mv: !pspace
  based_on: cell_area_mv

  property: area_preferential

  helpers:
    set_labels:
      x: time
      y: average pref. area

cell_shape_mv: !pspace
  based_on: cell_area_mv

  property: shape_index

  helpers:
    set_labels:
      x: time
      y: average shape index

HC_neighbors_mv: !pspace
  <<: *Property_MV

  to_plot:
    bulk_cells:
      label: all cells (bulk)
    bulk_hair_cells:
      label: hair cells (bulk)
    bulk_support_cells:
      label: support cells (bulk)
  
  property: num_hair_neighbors

  helpers:
    set_labels:
      x: time
      y: average hair cell neighbors

neighbors_mv: !pspace
  based_on: HC_neighbors_mv

  property: num_neighbors

  helpers:
    set_labels:
      x: time
      y: average neighbors


hexatic_order_mv: !pspace
  <<: *Property_MV

  to_plot: 
    bulk_hair_cells:
      label: hair cells (bulk)

  property: hexatic_order

  helpers:
    set_labels:
      x: time
      y: average hexatic_order

rotation_mv: !pspace
  based_on: hexatic_order_mv

  property: rotation

  helpers:
    set_labels:
      x: time
      y: average rotation

cell_neighbourhood_mv: !pspace
  based_on:
    - .default_style_and_helpers
    - multiverse
    - _cell_neighbourhood

  stack_dims: [seed]

  only_type: all

  select_and_combine:
    fields:
      area:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: area
      cell_type:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: cell_type
      shape_index:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: shape_index
      num_neighbors:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: num_neighbors
      num_hair_neighbors:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: num_hair_neighbors
    subspace:
      p0: !sweep
        default: 3.62
        values: [3.62, 3.72, 3.77, 3.81]
        name: p0

    
# --- Average seeds, bifurcation diagram --------------------------------------

cell_area: &Property
  based_on:
    - .default_style_and_helpers
    - multiverse
    - cell_property
  
  plot_func: errorbars
  
  select_and_combine:
    fields:
      cells:
        path: data/PCPTopology/Statistics/Cell_stats
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              time: 1
      hair_cells:
        path: data/PCPTopology/Statistics/Hair_cell_stats
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              time: 1
      support_cells:
        path: data/PCPTopology/Statistics/Support_cell_stats
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              time: 1
      bulk_cells:
        path: data/PCPTopology/Statistics/Bulk_cell_stats
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              time: 1
      bulk_hair_cells:
        path: data/PCPTopology/Statistics/Bulk_hair_cell_stats
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              time: 1
      bulk_support_cells:
        path: data/PCPTopology/Statistics/Bulk_support_cell_stats
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              time: 1

  property: area
  average_dim: seed

  to_plot: 
    cells:
      label: all cells
    hair_cells:
      label: hair cells
    support_cells:
      label: support cells

  helpers:
    set_labels:
      x: p0
      y: average area

cell_pref_area:
  based_on: cell_area

  property: area_preferential  

  helpers:
    set_labels:
      x: p0
      y: average pref. area

cell_shape:
  based_on: cell_area

  property: shape_index

  helpers:
    set_labels:
      x: p0
      y: average shape index

HC_neighbors:
  <<: *Property

  to_plot:
    bulk_cells:
      label: all cells (bulk)
    bulk_hair_cells:
      label: hair cells (bulk)
    bulk_support_cells:
      label: support cells (bulk)

  property: num_hair_neighbors

  helpers:
    set_labels:
      x: p0
      y: average hair cell neighbors

neighbors:
  based_on: HC_neighbors

  property: num_neighbors

  helpers:
    set_labels:
      x: p0
      y: average neighbors


hexatic_order:
  <<: *Property

  to_plot: 
    bulk_hair_cells:
      label: hair cells (bulk)
  
  property: hexatic_order

  helpers:
    set_labels:
      x: p0
      y: average hexatic_order

rotation:
  <<: *Property

  to_plot: 
    bulk_cells:
      label: all cells (bulk)

  property: rotation

  helpers:
    set_labels:
      x: p0
      y: average rotation