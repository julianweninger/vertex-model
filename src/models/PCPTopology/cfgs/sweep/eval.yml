# The evaluation of default_proliferation_minimal__quick_and_dirty
#
# These can use the `based_on` feature with configurations specified in the
# accompanying *_base_plots.yml file and in the utopya base plot configs.
---
energy:
  based_on: energy
  universes:
    seed: 0

transitions:
  based_on: universe
  universes:
    seed: 0

  model_name: PCPTopology
  module: model_plots.PCPTopology
  plot_func: transitions

  map_to_continuous_time: True

transitions_continuous:
  based_on:
    - universe
    - transitions

  model_name: PCPTopology/PCPVertex
  
  map_to_continuous_time: False
  map_to_discrete_time: True

equilibrium_cellular_structure:
  based_on:
    - .default_style_and_helpers
    - cellular_structure
  universes:
    seed: 0


# --- Average cell properties from stats --------------------------------------

cell_stats/cell_area: !pspace &cell_stats
  based_on:
    - .default_style_and_helpers
    - multiverse
    - cell_property
    - select_cell_stats_mv
  
  plot_func: errorbars

  to_plot:
    cells:
      label: all cells
    hair_cells:
      label: hair cells
    support_cells:
      label: support cells

  property: area
  average_dim: seed

  select_and_combine:
    subspace:
      p0: !sweep
        default: 0.2
        values: &SWEEP_VALUES [3.62, 3.72, 3.77, 3.81]

  helpers:
    set_labels:
      x: time
      y: average area
    set_limits:
      x: [0, &TIME_MAX 10]
      y: [0, 5.]

cell_stats/cell_area_pref: !pspace
  based_on: cell_stats/cell_area

  property: area_preferential

  helpers:
    set_labels:
      y: average pref. area
    set_limits:
      y: [0, 5.]

cell_stats/cell_shape: !pspace
  based_on: cell_stats/cell_area

  property: shape_index

  helpers:
    set_labels:
      y: average shape index
    set_limits:
      y: [3.72, 4.3]

cell_stats/HC_neighbors: !pspace
  <<: *cell_stats

  to_plot:
    bulk_cells:
      label: all cells (bulk)
    bulk_hair_cells:
      label: hair cells (bulk)
    bulk_support_cells:
      label: support cells (bulk)
  
  property: num_hair_neighbors

  helpers:
    set_labels:
      x: time
      y: average hair cell neighbors
    set_limits:
      x: [0, *TIME_MAX]
      y: [0., 3.2]

cell_stats/neighbors: !pspace
  based_on: cell_stats/HC_neighbors

  property: num_neighbors

  helpers:
    set_labels:
      x: time
      y: average neighbors
    set_limits:
      y: [3., 12.]

cell_stats/hexatic_order: !pspace
  <<: *cell_stats

  to_plot: 
    bulk_hair_cells:
      label: hair cells (bulk)

  property: hexatic_order

  helpers:
    set_labels:
      x: time
      y: average hexatic_order
    set_limits:
      x: [0, *TIME_MAX]
      y: [0., 1.]

cell_stats/neighbors_vs_area_mv: !pspace
  based_on:
    - .default_style_and_helpers
    - multiverse

  module: model_plots.PCPTopology
  plot_func: scatter_xy_data

  plot_time_color_gradient: true
  cmap: plasma

  select_and_combine:
    fields:
      bulk_hair_cells:
        path: data/PCPTopology/Statistics/Bulk_hair_cell_stats
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: area
      bulk_support_cells:
        path: data/PCPTopology/Statistics/Bulk_support_cell_stats
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: area
      _y:
        path: data/PCPTopology/Statistics/Bulk_hair_cell_stats
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: num_neighbors
    subspace:
      p0: !sweep
        default: 0.2
        values: *SWEEP_VALUES
          
  transform:
    - .mean:
      args: [!dag_tag bulk_hair_cells]
      kwargs:
        dim: seed
      tag: x

    - .mean:
      args: [!dag_tag _y]
      kwargs:
        dim: seed
      tag: y

  helpers:
    set_labels:
      x: aver. HC area
      y: Coordination number
    set_limits:
      x: [0., 7.]
      y: [3., 12]

# Cell properties from cell data ----------------------------------------------
cell_properties/area: !pspace
  based_on:
    - .default_style_and_helpers
    - .dag.multiplot
    - multiverse
    - select_cells_properties_mv

  to_plot: 
    - function: sns.lineplot
      data: !dag_result all_cells
      label: all cells
    - function: sns.lineplot
      data: !dag_result hair_cells
      label: hair cells
    - function: sns.lineplot
      data: !dag_result support_cells
      label: support cells

  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: area}]
          - .rename: [!dag_prev , area]
    subspace:
      p0: !sweep
        default: 0.2
        values: *SWEEP_VALUES

  x: time
  y: area

  helpers:
    set_labels:
      x: time
      y: average area
    set_limits:
      x: [0, *TIME_MAX]
      y: [0, 5.]

cell_properties/pref_area: !pspace
  based_on: cell_properties/area
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: area_preferential}]
          - .rename: [!dag_prev , area_preferential]
  y: area_preferential
  helpers:
    set_labels:
      y: average pref. area
    set_limits:
      y: [0, 5.]

cell_properties/shape: !pspace
  based_on: cell_properties/area
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: shape_index}]
          - .rename: [!dag_prev , shape_index]
  y: shape_index
  helpers:
    set_labels:
      y: average shape index
    set_limits:
      y: [3.72, 4.3]

cell_properties/HC_neighbors: !pspace
  based_on: cell_properties/area
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: num_hair_neighbors}]
          - .rename: [!dag_prev , num_hair_neighbors]
  y: num_hair_neighbors
  helpers:
    set_labels:
      y: average hair neighbors
    set_limits:
      y: [0., 3.2]

cell_properties/neighbors: !pspace
  based_on: cell_properties/area
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: num_neighbors}]
          - .rename: [!dag_prev , num_neighbors]
  y: num_neighbors
  helpers:
    set_labels:
      y: average neighbors
    set_limits:
      y: [3., 12.]

cell_properties/hexatic_order: !pspace
  based_on: cell_properties/area
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: hexatic_order}]
          - .rename: [!dag_prev , hexatic_order]
  y: hexatic_order
  to_plot: 
    - function: sns.lineplot
      data: !dag_result hair_cells_bulk
      label: hair cells
  helpers:
    set_labels:
      y: average hexatic order
    set_limits:
      y: [0., 1.]

cell_properties/rotation: !pspace
  based_on: cell_properties/area
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: rotation}]
          - .rename: [!dag_prev , rotation]
  y: rotation
  to_plot: 
    - function: sns.lineplot
      data: !dag_result all_cells_bulk
      label: hair cells
  helpers:
    set_labels:
      y: average rotation


cell_properties/neighbors_vs_area_mv: !pspace
  based_on:
    - .default_style_and_helpers
    - .dag.multiplot
    - multiverse
    - select_cells_properties_mv.xy_data

  select_and_combine:
    fields:
      _x:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: area}]
          - .rename: [!dag_prev , area]
      _y:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: num_neighbors}]
          - .rename: [!dag_prev , num_neighbors]
    subspace:
      p0: !sweep
        default: 0.2
        values: *SWEEP_VALUES

  to_plot:
    - function: sns.scatterplot
      data: !dag_result hair_cells

  x: area
  y: num_neighbors
  hue: time

cell_neighbourhood_mv: !pspace
  based_on:
    - .default_style_and_helpers
    - multiverse
    - _cell_neighbourhood

  stack_dims: [seed]

  only_type: !sweep
    default: all
    values:
      - all
      - hair
      - support
      - support_hair

  select_and_combine:
    fields:
      area:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: area
      cell_type:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: cell_type
      shape_index:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: shape_index
      num_neighbors:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: num_neighbors
      num_hair_neighbors:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: num_hair_neighbors
    subspace:
      p0: !sweep
        default: 0.2
        values: *SWEEP_VALUES

