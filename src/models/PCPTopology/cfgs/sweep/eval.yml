# --- Average seeds, bifurcation diagram --------------------------------------

cell_area: &Property
  based_on:
    - .default_style_and_helpers
    - multiverse
    - cell_property
  
  plot_func: errorbars
  
  select_and_combine:
    fields:
      cells:
        path: data/PCPTopology/Statistics/Cell_stats
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              time: &END_TIME 1
      hair_cells:
        path: data/PCPTopology/Statistics/Hair_cell_stats
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              time: *END_TIME
      support_cells:
        path: data/PCPTopology/Statistics/Support_cell_stats
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              time: *END_TIME
      bulk_cells:
        path: data/PCPTopology/Statistics/Bulk_cell_stats
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              time: *END_TIME
      bulk_hair_cells:
        path: data/PCPTopology/Statistics/Bulk_hair_cell_stats
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              time: *END_TIME
      bulk_support_cells:
        path: data/PCPTopology/Statistics/Bulk_support_cell_stats
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              time: *END_TIME

  property: area
  average_dim: seed

  to_plot: 
    cells:
      label: all cells
    hair_cells:
      label: hair cells
    support_cells:
      label: support cells

  helpers:
    set_labels:
      x: p0
      y: average area

cell_area_ratio: !pspace
  <<: *Property

  to_plot: 
    ratio:
      label: ~

  transform:
    - div:
      args: [!dag_tag hair_cells, !dag_tag support_cells]
    - .squeeze:
      args: [!dag_prev ]
      tag: ratio

  helpers:
    set_labels:
      x: time
      y: area av HC / av SC
    set_limits:
      y: [0, 10.]

cell_area_fraction: !pspace
  <<: *Property

  to_plot: 
    fraction:
      label: ~
  average_dim: seed

  transform:
    - mul:
      args: [0.26, 64]
      tag: N_HC
    - sub:
      args: [64, !dag_tag N_HC]
      tag: N_SC
      
    - mul:
      args: [!dag_tag hair_cells, !dag_tag N_HC]
      tag: hc_area
    - mul:
      args: [!dag_tag support_cells, !dag_tag N_SC]
      tag: sc_area

    - add:
      args: [!dag_tag hc_area, !dag_tag sc_area]
      tag: tot_area

    - div:
      args: [!dag_tag hc_area, !dag_tag tot_area]
    - .squeeze:
      args: [!dag_prev ]
      tag: fraction

  helpers:
    set_labels:
      x: time
      y: area fraction covered by HCs
    set_limits:
      y: [0, 1.]

cell_area_pref:
  based_on: cell_area

  property: area_preferential  

  helpers:
    set_labels:
      x: p0
      y: average pref. area

cell_shape:
  based_on: cell_area

  property: shape_index

  helpers:
    set_labels:
      x: p0
      y: average shape index

HC_neighbors:
  <<: *Property

  to_plot:
    bulk_cells:
      label: all cells (bulk)
    bulk_hair_cells:
      label: hair cells (bulk)
    bulk_support_cells:
      label: support cells (bulk)

  property: num_hair_neighbors

  helpers:
    set_labels:
      x: p0
      y: average hair cell neighbors

neighbors:
  based_on: HC_neighbors

  property: num_neighbors

  helpers:
    set_labels:
      x: p0
      y: average neighbors


hexatic_order:
  <<: *Property

  to_plot: 
    bulk_hair_cells:
      label: hair cells (bulk)
  
  property: hexatic_order

  helpers:
    set_labels:
      x: p0
      y: average hexatic_order

rotation:
  <<: *Property

  to_plot: 
    bulk_cells:
      label: all cells (bulk)

  property: rotation

  helpers:
    set_labels:
      x: p0
      y: average rotation