# The evaluation of default_proliferation_minimal__generations
#
# These can use the `based_on` feature with configurations specified in the
# accompanying *_base_plots.yml file and in the utopya base plot configs.
---
energy:
  based_on: energy
  universes:
    seed: 0

transitions:
  based_on: transitions

transitions_cumulated:
  based_on: transitions
  cumsum_transitions: true
  enabled: false

transitions_continuous:
  based_on: transitions_continuous
  cumsum_transitions: true
  enabled: false


diffusion:
  based_on: diffusion_mv
  hue: p0
displacement:
  based_on: diffusion

  to_plot: 
  - function: sns.lineplot
    data: !dag_result distance
    y: distance

equilibrium_cellular_structure:
  based_on:
    - cellular_structure
  universes:
    seed: 0



# Cell properties from cell data ----------------------------------------------
cell_properties: !pspace
  based_on:
    - .plot.multiplot
    - multiverse
    - select_cells_properties_mv
  enabled: False

  to_plot: 
    - function: sns.lineplot
      data: !dag_result all_cells
      label: all cells
    - function: sns.lineplot
      data: !dag_result hair_cells
      label: hair cells
    - function: sns.lineplot
      data: !dag_result support_cells
      label: support cells

  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
    subspace:
      p0: !sweep
        default: 0.2
        values: &p0_Sweep_Values [3.62, 3.72, 3.77, 3.805]

  x: time

  helpers:
    set_labels:
      x: time

cell_properties/area: !pspace
  based_on: cell_properties

  select_and_combine:
    fields:
      _property:
        transform:
          - .sel: [!dag_prev , {property: area}]
          - .rename: [!dag_prev , area]
  y: area
  helpers:
    set_labels:
      y: average area
    set_limits:
      y: [0, 5.]

cell_properties/pref_area: !pspace
  based_on: cell_properties/area
  select_and_combine:
    fields:
      _property:
        transform:
          - .sel: [!dag_prev , {property: area_preferential}]
          - .rename: [!dag_prev , area_preferential]
  y: area_preferential
  helpers:
    set_labels:
      y: average pref. area
    set_limits:
      y: [0, 5.]

cell_properties/shape: !pspace
  based_on: cell_properties/area
  select_and_combine:
    fields:
      _property:
        transform:
          - .sel: [!dag_prev , {property: perimeter}]
          - .sel: [!dag_node -2, {property: area_preferential}]
          - pow: [!dag_node -1 , 0.5]
          - div: [!dag_node -3, !dag_node -1]
          - .rename: [!dag_prev , shape_index]
  y: shape_index
  helpers:
    set_labels:
      y: average shape index
    set_limits:
      y: [3.72, 4.3]

cell_properties/HC_neighbors: !pspace
  based_on: cell_properties/area
  select_and_combine:
    fields:
      _property:
        transform:
          - .sel: [!dag_prev , {property: num_hair_neighbors}]
          - .rename: [!dag_prev , num_hair_neighbors]
  y: num_hair_neighbors
  helpers:
    set_labels:
      y: average hair neighbors
    set_limits:
      y: [0., 3.2]

cell_properties/neighbors: !pspace
  based_on: cell_properties/area
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: num_neighbors}]
          - .rename: [!dag_prev , num_neighbors]
  y: num_neighbors
  helpers:
    set_labels:
      y: average neighbors
    set_limits:
      y: [3., 12.]

cell_properties/hexatic_order: !pspace
  based_on: cell_properties/area
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: hexatic_order}]
          - .rename: [!dag_prev , hexatic_order]
  y: hexatic_order
  to_plot: 
    - function: sns.lineplot
      data: !dag_result hair_cells_bulk
      label: hair cells
  helpers:
    set_labels:
      y: average hexatic order
    set_limits:
      y: [0., 1.]


cell_properties/neighbors_vs_area_mv: !pspace
  based_on:
    - .plot.multiplot
    - multiverse
    - select_cells_properties_mv.xy_data

  select_and_combine:
    fields:
      _x:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: area}]
          - .rename: [!dag_prev , area]
      _y:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: num_neighbors}]
          - .rename: [!dag_prev , num_neighbors]
    subspace:
      p0: !sweep
        default: 0.2
        values: *p0_Sweep_Values

  to_plot:
    - function: sns.scatterplot
      data: !dag_result hair_cells

  x: area
  y: num_neighbors
  hue: time

cell_neighbourhood_mv: !pspace
  based_on:
    - multiverse
    - _cell_neighbourhood

  stack_dims: [seed]

  enabled: false

  only_type: !sweep
    default: all
    values:
      - all
      - hair
      - support
      - support_hair

  select_and_combine:
    fields:
      area:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: area
      cell_type:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: cell_type
      shape_index:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: perimeter}]
          - .sel: [!dag_node -2, {property: area_preferential}]
          - pow: [!dag_node -1 , 0.5]
          - div: [!dag_node -3, !dag_node -1]
          - .rename: [!dag_prev , shape_index]
      num_neighbors:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: num_neighbors
      num_hair_neighbors:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: num_hair_neighbors
    subspace:
      p0: !sweep
        default: 0.2
        values: *p0_Sweep_Values
