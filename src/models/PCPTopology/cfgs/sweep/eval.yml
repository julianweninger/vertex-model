# --- Average seeds, bifurcation diagram --------------------------------------

cell_area:
  based_on:
    - .default_style_and_helpers
    - multiverse
    - cell_property
    - select_cells_multiverse
  
  plot_func: errorbars_mv

  to_plot: 
    cells_mean:
      label: all cells
    hair_cells_mean:
      label: hair cells
    support_cells_mean:
      label: support cells

  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: area
          - .isel:
            args: [!dag_prev ]
            kwargs:
              time: 1

      _is_boundary:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: is_boundary
          - .rename:
            args: [!dag_prev , is_boundary]
          - .isel:
            args: [!dag_prev ]
            kwargs:
              time: 1
      _cell_type:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: cell_type
          - .rename:
            args: [!dag_prev , cell_types]
          - .isel:
            args: [!dag_prev ]
            kwargs:
              time: 1

  helpers:
    set_labels:
      x: p0
      y: average area

