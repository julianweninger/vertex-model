cell_area_pref:
  based_on: cell_area

  property: area_preferential  

  helpers:
    set_labels:
      x: p0
      y: average pref. area

cell_shape:
  based_on: cell_area

  property: shape_index

  helpers:
    set_labels:
      x: p0
      y: average shape index

HC_neighbors:
  <<: *Property

  to_plot:
    bulk_cells:
      label: all cells (bulk)
    bulk_hair_cells:
      label: hair cells (bulk)
    bulk_support_cells:
      label: support cells (bulk)

  property: num_hair_neighbors

  helpers:
    set_labels:
      x: p0
      y: average hair cell neighbors

neighbors:
  based_on: HC_neighbors

  property: num_neighbors

  helpers:
    set_labels:
      x: p0
