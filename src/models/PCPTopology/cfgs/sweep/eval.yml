# --- Average seeds -----------------------------------------------------------

cell_area_mv: !pspace
  based_on:
    - .default_style_and_helpers
    - multiverse
    - cell_property
    - select_cells_multiverse
  
  plot_func: errorbars_mv

  to_plot: 
    cells_mean:
      label: all cells
    hair_cells_mean:
      label: hair cells
    support_cells_mean:
      label: support cells

  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: area
    subspace:
      p0: !sweep
        default: 3.62
        values: [3.62, 3.72, 3.77, 3.81]
        name: p0

  helpers:
    set_labels:
      x: time
      y: average area

