---
energy:
  based_on:
    - .plot.multiplot
    - universe

  select:
    _cell_cell_interaction:
      path: data/PCPTopology/PlanarCellPolarity/Energy/Energy
      transform:
      - .sel:
        - !dag_node -1
        - {energy: cell_cell_interaction}
      - .rename: [!dag_node -1, Energy]
    _lagrange_concentration:
      path: data/PCPTopology/PlanarCellPolarity/Energy/Energy
      transform:
      - .sel:
        - !dag_node -1
        - {energy: lagrange_concentration}
      - .rename: [!dag_node -1, Energy]
    _lagrange_net_polarity:
      path: data/PCPTopology/PlanarCellPolarity/Energy/Energy
      transform:
      - .sel:
        - !dag_node -1
        - {energy: lagrange_net_polarity}
      - .rename: [!dag_node -1, Energy]
    _polarity_exclusion:
      path: data/PCPTopology/PlanarCellPolarity/Energy/Energy
      transform:
      - .sel:
        - !dag_node -1
        - {energy: polarity_exclusion}
      - .rename: [!dag_node -1, Energy]
    _total:
      path: data/PCPTopology/PlanarCellPolarity/Energy/Energy
      transform:
      - .sel:
        - !dag_node -1
        - {energy: total}
      - .rename: [!dag_node -1, Energy]

  to_plot:
  - {data: !dag_result lagrange_net_polarity, function: sns.lineplot, label: lagrange
      net polarity}
  - {data: !dag_result lagrange_concentration, function: sns.lineplot, label: lagrange
      concentration}
  - {data: !dag_result cell_cell_interaction, function: sns.lineplot, label: cell-cell
      interaction}
  - {data: !dag_result polarity_exclusion, function: sns.lineplot, label: polarity
      exclusion}
  - {data: !dag_result total, function: sns.lineplot, label: total}

  transform:
  - define: [!dag_tag _total]
  - import_and_call:
    args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    tag: total
  - define: [!dag_tag _cell_cell_interaction]
  - import_and_call:
    args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    tag: cell_cell_interaction
  - define: [!dag_tag _polarity_exclusion]
  - import_and_call:
    args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    tag: polarity_exclusion
  - define: [!dag_tag _lagrange_net_polarity]
  - import_and_call:
    args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    tag: lagrange_net_polarity
  - define: [!dag_tag _lagrange_concentration]
  - import_and_call:
    args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    tag: lagrange_concentration
  x: time
  y: Energy
  ci: sd


cell_segmentation:
  based_on:
    - cellular_structure

  edge_property_path: PlanarCellPolarity/Proteins
  edge_property: 
    # property:
      # - sigma_alpha
      # - sigma_beta
    proteins:
      - sigma_alpha__0
      - sigma_alpha__1
      - sigma_alpha__2
      # - sigma_alpha__3
      # - sigma_alpha__4
      # - sigma_alpha__5
      # - sigma_alpha__6
      - sigma_beta__0
      - sigma_beta__1
      - sigma_beta__2
      # - sigma_beta__3
      # - sigma_beta__4
      # - sigma_beta__5
      # - sigma_beta__6

  edge_property_split:
      # - property: sigma_alpha
      # - property: sigma_beta
      - proteins: sigma_alpha__0
      - proteins: sigma_alpha__1
      - proteins: sigma_alpha__2
      # - proteins: sigma_alpha__3
      # - proteins: sigma_alpha__4
      # - proteins: sigma_alpha__5
      # - proteins: sigma_alpha__6
      - proteins: sigma_beta__0
      - proteins: sigma_beta__1
      - proteins: sigma_beta__2
      # - proteins: sigma_beta__3
      # - proteins: sigma_beta__4
      # - proteins: sigma_beta__5
      # - proteins: sigma_beta__6
  quiver_kwargs:
    clim: [-1, 1]

  vector_property:
    x: {property: polarity_x}
    y: {property: polarity_y}
  vector_property_path: PlanarCellPolarity/Cells
  
cell_segmentation__elongation:
  based_on:
    - cellular_structure
  enabled: true

  vector_property_is_nematic: True

  vector_property:
    x: {property: q_x}
    y: {property: q_y}
  vector_property_kwargs:
    scale: 0.75
    headwidth: 1
    headlength: 1.    

cell_segmentation__cell_polarity:
  based_on:
    - cellular_structure
  enabled: false

  property_path: PlanarCellPolarity/Cells
  property: {property: pcp_net_polarity}

  property_interpolation_kwargs:
    method: nearest
  property_interpolation_plot_kwargs:
    cmap: Reds

cell_segmentation__protein_level:
  based_on: cell_segmentation__polarity
  property: {property: pcp_proteins}
  enabled: false
