# A minimal configuration to introduce heterogeneous edge contractility
# In quick and dirty during proliferation the energy is not minimized.
# This results in a significant (~ factor 100) speed up with similar results.
#
# The model can be run by typing : 
# $ cd /path-to-Utopia/vertex-model
# $ utopia run PCPTopology src/models/PCPTopology/cfgs/<case>/run.yml \
#          --plots-cfg src/models/PCPTopology/cfgs/<case>/eval.yml
#
# The content of this file is used to update the corresponding entries in
# ../PCPTopology_cfg.yml
---
perform_sweep: false
paths:
  model_note: default__PCP

worker_manager:
  nonzero_exit_handling: warn_all

parameter_space:
  num_steps: 5

  # num_cells: &NUM_CELLS 32     # The final number of cells

  seed: !sweep
    default: 42
    range: [2]

  PCPTopology:
    # The sequence of operations
    operations:
      - jiggle:
          times: []
          iterations_prolog: 1
      - iterate_pcp:
          times: []
          iterations_prolog: 1
          num_steps: 500
          minimization:
            mode: manual
      - proliferate:
          times: !listgen [1, 501, 5]
          emit_interval: 32

          iterations: 1

          num_increases: 0
          area_threshold: 0.

          angle_distribution: [1., 1.e-1]

          minimization:
            mode: manual
      - iterate_pcp:
          times: !listgen [1, 501]
          iterations: 5
          num_steps: 100


    # --- Dynamics
    # Minimization parameter
    minimization: &minimization
      update_scheme: steepest_gradient
      dt: 0.01
      tolerance: 1.e-8
      max_steps: 500000
      num_repeat: 10
      num_steps: 100
      jiggle_intensity: 0.
      linetension_fluctuation: 0.001
      jiggle_tolerance: 1.e-6

      area_fluctuation: 0.0
      area_fluctuation_tau: 1.
      area_fluctuation_A_min: 0.15
    
    PlanarCellPolarity:
      cell_cell_polarity_interaction: 0.1
      cell_polarity_exclusion: 0.05
      penalty_net_polarisation: 1.
      penalty_const_proteins: 10.
      use_lagrange_multipliers: false

      dt: 0.01
      fluctuation: 1.e-2
      fluctuation_tau: 3.

      initialization: aligned
      alignment_orientation: 0.785
      alignment_orientation_stddev: 0.5

      log_level: info
      
      data_manager:
        deciders:
          write_always:
            type: always
          write_interval:
            type: interval
            args: 
              intervals:
                - [0, 10000000000000, 5]
        triggers:
          build_once: {type: once, args: {time: 0}}
        tasks:
          Energy: &ENERGY_PCP
            active: true
            decider: write_interval
            trigger: build_once
          Energy_time: *ENERGY_PCP
          
    PCPVertex:      
      area_elasticity: 1.
      
      cell_shape_implementation: contractile
      # possible contractile or shape_elastic
      # whether to normalize shape index to A^0 or A, respectively

      agent_manager:
        cell_manager:
          agent_params:
            area_preferential: 1.
            contractility: 1.
            shape_index_preferential: 3.76
            polarity: -1.5708   # -Pi / 2
        edge_manager:
          agent_params:
            linetension: 0.
            contractility: 0.
        setup_params:
          hexagonal:
            lattice_rows: &ROWS 4
            lattice_columns: *ROWS

      minimization: *minimization

      T1_threshold: 0.03
      T1_separation_factor: 1.05
      T1_probability: 1.
      T1_barrier: 0.02
      T2_threshold: 0.0075


      log_level: warning
      
      # continuous data manager
      data_manager:

        deciders:
          write_energy:
            type: interval
            args: 
              intervals:
                - [0, 1000000000, 50]
        tasks:
          Energy_total: &energy_continuous {decider: write_energy}
          Energy_linetension: *energy_continuous
          Energy_areaelasticity: *energy_continuous
          Energy_cell_contractility: *energy_continuous
          Energy_edge_contractility: *energy_continuous
          Energy_boundary_area_elasticity: {active: false}
          Energy_boundary_shape_elasticity: {active: false}
          Energy_time: *energy_continuous
          transitions: *energy_continuous

          Vertices: &position {active: false}
          Cells: *position
          Edges: *position

    # equilibrium data manager
    data_manager:
      deciders:
        write_always:
          type: always

        write_interval: &interval
          type: interval
          args:
            intervals:
              - [0, 5]
              - [5, 50, 5]
              - [50, 250, 50]
              # - [1000, 10001, 200]
              # - [10000, 100001, 5000]
      triggers:
        build_interval: *interval
      tasks:
        PCP_Cells: {active: true}
        PCP_Edges: {active: true}
        
        Energy_boundary_area_elasticity: {active: false}
        Energy_boundary_shape_elasticity: {active: false}
