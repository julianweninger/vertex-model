# A minimal configuration to introduce heterogeneous edge contractility
# In quick and dirty during proliferation the energy is not minimized.
# This results in a significant (~ factor 100) speed up with similar results.
#
# The model can be run by typing : 
# $ cd /path-to-Utopia/vertex-model
# $ utopia run PCPTopology src/models/PCPTopology/cfgs/<case>/run.yml \
#          --plots-cfg src/models/PCPTopology/cfgs/<case>/eval.yml
#
# The content of this file is used to update the corresponding entries in
# ../PCPTopology_cfg.yml
---
perform_sweep: true
paths:
  model_note: default__cell_sorting

worker_manager:
  nonzero_exit_handling: warn_all

run_kwargs:
  stop_conditions:
    - !stop-condition
      name: single simulation timeout
      description: terminates a simulation if it ran for too long
      enabled: true               # (optional, true by default)
      to_check:                   # A sequence of AND-connected conditions
        - func: timeout_wall      # Looked up in utopya.stopcond_funcs
          seconds: !expr 60*25.    # --> terminated after 10 minutes wall time

parameter_space:
  num_steps: 3

  seed: !sweep
    default: 42
    range: [1]

  PCPTopology:

    initialisation: !sweep
      default: random
      values: [random, sorted]

    case: !sweep
      default: control
      values: [control, DITH, HIT]

    # The sequence of operations
    operations:
      - jiggle:
          times: []
          iterations_prolog: 1
          minimization:
            linetension_fluctuation: 0.001


      - proliferate_generations:
          times: []
          iterations_prolog: 1
          num_generations: 2
          minimization_between_generations:
            num_repeat: 1
          minimization:
            num_repeat: &equilibration_time 5
            # NOTE 50 recommended
      # END proliferation

      # Differentiate hair and support cells
      - !coupled-sweep
          target_name: initialisation
          default: 
            differentiate_random: 
              times: []
              iterations_prolog: 1
              fraction: 0.5
              minimization:
                mode: manual
          values: [
            {differentiate_random: {
              times: [],
              iterations_prolog: 1,
              fraction: 0.5,
              minimization: {mode: manual}}},
            {differentiate_domain: {
              times: [],
              iterations_prolog: 1,
              relative_width: 0.5,
              minimization: {mode: manual}}}
          ]
          name: op_init
      # END differentiation
      
      # Eliminate HC-HC contacts
      - increment_linetension:
          times: []
          iterations_prolog: 1
          
          hair_hair: !coupled-sweep
            target_name: case
            default: 0.
            values: [0., 1., 0.5]
            name: HH
          hair_support: !coupled-sweep
            target_name: case
            default: 0.
            values: [0., 0.2, 1.]
            name: HS
          support_support: !coupled-sweep
            target_name: case
            default: 0.
            values: [0., 0., 0.]
            name: SS
          
          minimization:
            mode: manual
      # END Differential junctional properties

      - jiggle:
          times: !listgen [10001]
          

    # --- Dynamics
    # Minimization parameter
    minimization: &minimization
      update_scheme: steepest_gradient
      dt: 0.01
      tolerance: 1.e-8
      max_steps: 500000
      num_repeat: 1
      num_steps: 100
      jiggle_intensity: 0.
      linetension_fluctuation: 0.
      jiggle_tolerance: 1.e-6

      area_fluctuation: 0.3
      area_fluctuation_tau: 1.
      area_fluctuation_A_min: 0.15

    NotchDelta:
      cell_manager:
        grid:
          resolution: 32
    PCPVertex:      
      area_elasticity: 1.
      
      cell_shape_implementation: contractile
      # possible contractile or shape_elastic
      # whether to normalize shape index to A^0 or A, respectively

      agent_manager:
        cell_manager:
          agent_params:
            area_preferential: 1.
            contractility: 1.
            shape_index_preferential: 3.76
            polarity: -1.5708   # -Pi / 2
        edge_manager:
          agent_params:
            linetension: 0.
            contractility: 0.
        setup_params:
          hexagonal:
            lattice_rows: &ROWS 4
            lattice_columns: *ROWS

      minimization: *minimization

      T1_threshold: 0.03
      T1_separation_factor: 1.05
      T1_probability: 1.
      T1_barrier: 0.02
      T2_threshold: 0.0075


      log_level: warning
      
      # continuous data manager
      data_manager:
        deciders:
          write_energy:
            type: interval
            args: 
              intervals:
                - [0, 1000000000, 50]
        tasks:
          Energy_total: &energy_continuous {decider: write_energy}
          Energy_linetension: *energy_continuous
          Energy_areaelasticity: *energy_continuous
          Energy_cell_contractility: *energy_continuous
          Energy_edge_contractility: *energy_continuous
          Energy_boundary_area_elasticity: {active: false}
          Energy_boundary_shape_elasticity: {active: false}
          Energy_time: *energy_continuous
          transitions: *energy_continuous

          Vertices: &position {active: false}
          Cells: *position
          Edges: *position

    # equilibrium data manager
    data_manager:
      deciders:
        write_always:
          type: always

        write_interval: &interval
          type: interval
          args:
            intervals:
              - [0  ,  5]
              - [5  ,  100,  5]
              - [100 , 200,  25]
              - [200, 15001, 100]
      triggers:
        build_interval: *interval
      tasks:
        Energy_boundary_area_elasticity: {enabled: false}
        Energy_boundary_shape_elasticity: {enabled: false}
