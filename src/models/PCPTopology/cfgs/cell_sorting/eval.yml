# The evaluation of heterogeneous edge contractility simulation
# 
# For testing efficiency only a subspace of the parameter space is evaluated.
# Replace the subspace values with the commented values to evaluate the full
# space.
#
# These can use the `based_on` feature with configurations specified in the
# accompanying *_base_plots.yml file and in the utopya base plot configs.
---
definitions: 
  enabled: false

  # limits in over time plots
  time_min: &TIME_MIN ~
  time_max: &TIME_MAX ~

  # first sweep dimension
  bif_name: &BIF_NAME case
  bif_name_long: &BIF_NAME_LONG ~
  
  # second sweep dimension
  hue_name: &HUE_NAME initialisation

  # slice to single sweep parameter
  subspace_slice: &subspace_slice
    case: !sweep
      default: control
      values: [control, DITH, HIT]
    differentiation: !sweep
      default: random
      values: 
        - random
        - domain

  # slice to keep one sweep dimension
  subspace_slice_hue: &subspace_slice_hue
    differentiation: !sweep
      default: random
      values: 
        - random
        - domain

  # slice to keep two sweep dimensions
  subspace_slice_bif: &subspace_slice_bif ~
  
  # parameters for universe plots
  subspace: &subspace
    seed: 0
    # rho: 0.2
    # # remove for full space
    # Gamma: [0., 0.8]
    # # remove for full space

  # which statistics to evaluate in cell_neighborhood
  neighborhood_only_type_values: &neighborhood_only_type_values
    - all
    - hair
    - support
    - support_hair

  # plot with experimental data
  coordination_number_file_path: &coordination_number_file_path ~
  subordination_number_file_path: &subordination_number_file_path ~
  hc_area_file_path: &hc_area_file_path ~

# modify style parameter
my_style:
  enabled: false
    
universe:
  enabled: false
  based_on:
    - universe
    - my_style

multiverse:
  enabled: false
  based_on:
    - multiverse
    - my_style


# -----------------------------------------------------------------------------


# universe examples
energy:
  based_on: energy
  universes:
    <<: *subspace


# Cell properties from cell data ----------------------------------------------
cell_properties: !pspace
  based_on:
    - .plot.multiplot
    - multiverse
    - select_cells_properties_mv
  enabled: False

  to_plot:
    - function: sns.lineplot
      data: !dag_result all_cells
      label: all cells
      color: grey
      errorbar: ~
    - function: sns.lineplot
      data: !dag_result support_cells
      label: support cells
      color: royalblue
      errorbar: sd
    - function: sns.lineplot
      data: !dag_result hair_cells
      label: hair cells
      color: red
      errorbar: sd

  select_and_combine:
    subspace: *subspace_slice

  x: time

  helpers:
    set_labels:
      x: time [$\tau_\lambda$]
    set_limits:
      x: [*TIME_MIN, *TIME_MAX]

cell_properties/area: !pspace
  based_on: cell_properties

  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: area}]
          - .rename: [!dag_prev , area]

  y: area

  helpers:
    set_labels:
      y: $\langle area \rangle$
    set_limits:
      y: [0, 5.]

cell_properties/shape: !pspace
  based_on: cell_properties
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: perimeter}]
          - .sel: [!dag_node -2, {property: area_preferential}]
          - pow: [!dag_node -1 , 0.5]
          - div: [!dag_node -3, !dag_node -1]
          - .rename: [!dag_prev , shape_index]
  y: shape_index
  helpers:
    set_labels:
      y: average shape index
    set_limits:
      y: [3.72, 4.3]

cell_properties/neighbors: !pspace
  based_on: cell_properties
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: num_neighbors}]
          - .rename: [!dag_prev , num_neighbors]
  y: num_neighbors
  helpers:
    set_labels:
      y: average neighbors
    set_limits:
      y: [3., 11.]


# --- Cell segmentation ------------------------------------------------------
cell_segmentation:
  based_on:
    - cellular_structure
  enabled: false
  universes:
    <<: *subspace

cell_segmentation__linetension:
  based_on:
    - cell_segmentation

  select:
    edge_property:
      path: data/PCPTopology/Edge_energies
      transform:
        - .sel: [!dag_prev , {term: linetension_heterotypic__energy}]
        - .rename: [!dag_prev , Linetension]

  quiver_kwargs:
    cmap: Blues

  cell_center_marker_kwargs:
    s: 10

