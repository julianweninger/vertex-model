# Base plot configuration for this model
#
# The configurations given here can be used in the <model_name>_plots.yml file
---
universe:
  based_on:
    - .defaults.style
    - .creator.universe.all
  file_ext: png

multiverse:
  creator: multiverse
  file_ext: png

select.uni.energy_terms:
  select:
    energy: 
      path: data/PCPTopology/Energy/Terms
      transform:
        - .rename: [!dag_prev , energy]
        - import_and_call:
          args: [model_plots.PCPVertex.data_ops, to_dataframe, !dag_prev ]

select.uni.continuous_energy_terms:
  select:
    energy: 
      path: data/PCPTopology/PCPVertex/Energy/Terms
      transform:
        - .rename: [!dag_prev , energy]
        - import_and_call:
          args: [model_plots.PCPVertex.data_ops, to_dataframe, !dag_prev ]


_energy:
  based_on:
    - .plot.multiplot
    
  to_plot:
  - function: sns.lineplot
    data: !dag_result energy

  x: time
  y: energy
  hue: term

  helpers:
    set_labels:
      x: time
      y: energy [a.u.]

energy:
  based_on:
    - universe
    - _energy
    - select.uni.energy_terms


select.uni.transitions:
  select:
    transitions: 
      path: data/PCPTopology/Energy/Transitions
      transform:
        - .rename: [!dag_prev , transitions]
        - import_and_call:
          args: [model_plots.PCPVertex.data_ops, to_dataframe, !dag_prev ]

select.uni.continuous_transitions:
  select:
    transitions_continous: 
      path: data/PCPTopology/PCPVertex/Energy/Transitions
      transform:
        - .rename: [!dag_prev , transitions]
        - import_and_call:
          args: [model_plots.PCPVertex.data_ops, to_dataframe, !dag_prev ]

transitions:
  based_on:
    - universe
    - .plot.multiplot
    - select.uni.energy_terms
    - select.uni.transitions

  x: time

  to_plot:
    [0, 0]:
    - function: sns.lineplot
      data: !dag_result energy
      hue: term
      y: energy

    [1, 0]:
    - function: sns.lineplot
      data: !dag_result transitions
      y: transitions
      hue: type
      hue_order: [num_T1s, num_T1s_attempted, num_T2s]

  helpers:
    setup_figure:
      ncols: 2
      constrained_layout: True
    set_labels:
      x: time

# the calculation of diffusion
_diffusion:
  transform:
    - pass: [!dag_tag _displacement]
    - .squeeze: [!dag_prev ]
      tag: displacement

    # the time coordinates
    - .coords: [!dag_tag displacement, time]
      tag: time

    # square displacement
    - pow: [!dag_tag displacement, 2]
    - .sum: [!dag_prev , property]
      kwargs: {skipna: False}
    - .rename: [!dag_prev , square_displ]
      tag: square_displ_xr
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: square_displacement

    # diffusion
    - div: [!dag_tag square_displ_xr, !dag_tag time]
    - div: [!dag_prev , 2]
    - .rename: [!dag_prev , diffusion]
      tag: diffusion_xr
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: diffusion

    # sqrt of square displacement
    - pow: [!dag_tag square_displ_xr, 0.5]
    - .rename: [!dag_prev , distance]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: distance

  x: time
  errorbar: sd
  to_plot:
  - function: sns.lineplot
    data: !dag_result diffusion
    y: diffusion

# Diffusion in a universe 
diffusion_uni:
  based_on:
    - .plot.multiplot
    - universe
    - _diffusion

  select: &DIFFUSION_FIELDS
    _displacement:
      path: data/PCPTopology/Cells
      transform:
        - import_and_call:
          args: 
            - model_plots.PCPTopology.data_ops
            - displacement
            - !dag_node -1
            - property
            - [x, y]
        - .rename: [!dag_prev , displacement]

  helpers:
    set_labels:
      x: time
      y: diffusion
    set_limits:
      y: [0, ~]

# Diffusion in a multiverse
diffusion_mv:
  based_on:
    - .plot.multiplot
    - multiverse
    - _diffusion

  select_and_combine:
    allow_missing_or_failing: true
    fields: *DIFFUSION_FIELDS
  
  helpers:
    set_labels:
      x: time
      y: diffusion
    set_limits:
      y: [0, ~]

# Displacement, i.e. MSD**0.5
displacement_uni:
  based_on: diffusion_uni

  to_plot: 
  - function: sns.lineplot
    data: !dag_result distance
    y: distance
  helpers:
    set_labels:
      y: mean displacement
displacement_mv:
  based_on: diffusion_mv

  to_plot: 
  - function: sns.lineplot
    data: !dag_result distance
    y: distance
  helpers:
    set_labels:
      y: mean displacement

select_cells_properties:
  select:
    # NOTE the order in which datasets are created is alphabetically!
    #      (underscores) `_` are treated first

    # the data containing all cells
    _cells: data/PCPTopology/Cells
    
    # a mask to select only bulk cells
    _is_bulk:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: is_boundary
        - .rename:
          args: [!dag_prev , is_bulk]
        - create_mask:
          args: [!dag_prev , <, 0.5] # not boundary

    # the type of the cells
    __cell_type:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: cell_type
        - .rename:
          args: [!dag_prev , cell_types]

    # a mask to select only hair cells
    _hair_cells:
      path: data/PCPTopology/Cells
      transform:
        - create_mask:
          args: [!dag_tag __cell_type, ==, 1]
    
    # a mask to select only support cells
    _support_cells:
      path: data/PCPTopology/Cells
      transform:
        - create_mask:
          args: [!dag_tag __cell_type, '!=', 1]
    
    
  transform:
    # the data for all cells
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_tag property]
      tag: all_cells

    # the data for hair cells
    - .where: [!dag_tag property, !dag_tag _hair_cells]
    - .dropna: [!dag_prev , id]
      kwargs: {how: all}
      tag: hair_cells_xarray
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: hair_cells

    # the data for support cells
    - .where: [!dag_tag property, !dag_tag _support_cells]
    - .dropna: [!dag_prev , id]
      kwargs: {how: all}
      tag: support_cells_xarray
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: support_cells

    # the data for bulk cells
    - .where: [!dag_tag property, !dag_tag _is_bulk]
    - .dropna: [!dag_prev , id]
      kwargs: {how: all}
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: all_cells_bulk
    
    - .where: [!dag_tag hair_cells_xarray, !dag_tag _is_bulk]
    - .dropna: [!dag_prev , id]
      kwargs: {how: all}
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: hair_cells_bulk
    
    - .where: [!dag_tag support_cells_xarray, !dag_tag _is_bulk]
    - .dropna: [!dag_prev , id]
      kwargs: {how: all}
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: support_cells_bulk


select_cells_properties.xy_data:
  based_on: select_cells_properties

  transform:
    # the data for support and hair cells
    - .where: [!dag_tag x, !dag_tag _hair_cells]
      tag: HC_x
    - .where: [!dag_tag x, !dag_tag _support_cells]
      tag: SC_x

    - .where: [!dag_tag y, !dag_tag _hair_cells]
      tag: HC_y
    - .where: [!dag_tag y, !dag_tag _support_cells]
      tag: SC_y

    # create xy data
    - xr.merge: [[!dag_tag x, !dag_tag y]]
      kwargs: {compat: 'override'}
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: all_cells

    - xr.merge: [[!dag_tag HC_x, !dag_tag HC_y]]
      kwargs: {compat: 'override'}
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: hair_cells

    - xr.merge: [[!dag_tag SC_x, !dag_tag SC_y]]
      kwargs: {compat: 'override'}
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: support_cells

      
select_cells_properties_mv:
  select_and_combine:
    allow_missing_or_failing: True
    fields:
      # the type of the cells
      _cell_type:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: cell_type
          - .rename:
            args: [!dag_prev , cell_types]

      _is_boundary:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: is_boundary
          - .rename:
            args: [!dag_prev , is_boundary]
    
  transform:
    # stack the seeds
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _property,
             {ids: [seed, id]}]
    - .squeeze: [!dag_prev ]
      tag: property
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: all_cells

    # a mask to select only hair / support cells
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _cell_type,
             {ids: [seed, id]}]
    - .squeeze: [!dag_prev ]
      tag: cell_type
    - create_mask: [!dag_tag cell_type, ==, 1]
      tag: _hair_cells
    - create_mask: [!dag_tag cell_type, '!=', 1]
      tag: _support_cells

    # mask for bulk cells
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _is_boundary,
             {ids: [seed, id]}]
    - .squeeze: [!dag_prev ]
    - create_mask: [!dag_prev , <, 0.5] # not boundary
    - .rename: [!dag_prev , is_bulk]
      tag: _is_bulk

    # the data for hair cells
    - .where: [!dag_tag property, !dag_tag _hair_cells]
      tag: hair_cells_xarray
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: hair_cells
    # the data for support cells
    - .where: [!dag_tag property, !dag_tag _support_cells]
      tag: support_cells_xarray
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: support_cells
    
    # the data for bulk cells
    - .where: [!dag_tag property, !dag_tag _is_bulk]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: all_cells_bulk
      
    - .where: [!dag_tag hair_cells_xarray, !dag_tag _is_bulk]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: hair_cells_bulk
      
    - .where: [!dag_tag support_cells_xarray, !dag_tag _is_bulk]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: support_cells_bulk

select_cells_properties_mv.xy_data:
  based_on: select_cells_properties_mv

  transform:
    # stack the seeds
