      tag: boundary_edges



cellular_structure:
  based_on: universe

  module: model_plots.PCPVertex
  plot_func: cellular_structure

  select:
    Vertices:
      path: data/PCPTopology/Vertices
      transform:
        - call_lambda:
          - "lambda data: xr.concat([data[t].sel(property=['x', 'y']) for t in data], dim='time')"
          - !dag_prev
        - call_lambda:
          - "lambda data, time_series: data.assign_coords(time=[int(t) for t in time_series])"
          - !dag_node -1
          - !dag_node -2
        - import_and_call:
          - model_plots.PCPTopology.data_ops
          - stack
          - !dag_prev 
          - {ids: [id, time]}
    Edges:
      path: data/PCPTopology/Edges
      transform:
        - call_lambda:
          - "lambda data: xr.concat([data[t].sel(property=['vertex_a', 'vertex_b']) for t in data], dim='time')"
          - !dag_prev
        - call_lambda:
          - "lambda data, time_series: data.assign_coords(time=[int(t) for t in time_series])"
          - !dag_node -1
          - !dag_node -2
        - import_and_call:
          - model_plots.PCPTopology.data_ops
          - stack
          - !dag_prev 
          - {ids: [id, time]}
    Cells:
      path: data/PCPTopology/Cells
      transform:
        - call_lambda:
          - "lambda data: xr.concat([data[t].sel(property=['x', 'y', 'cell_type']) for t in data], dim='time')"
          - !dag_prev
        - call_lambda:
          - "lambda data, time_series: data.assign_coords(time=[int(t) for t in time_series])"
          - !dag_node -1
          - !dag_node -2
        - import_and_call:
          - model_plots.PCPTopology.data_ops
          - stack
          - !dag_prev 
          - {ids: [id, time]}
    # vector_property:
    #   path: data/PCPTopology/Cells
    #   transform:
    #     - .sel: [!dag_prev , {property: polarity}]
    #     - .sel: [!dag_node -2, {property: cell_type}]
    #     - call_lambda:
    #       - "lambda d, type: d.where(type==1)"
    #       - !dag_node -2
    #       - !dag_node -1
    #     - .rename: [!dag_prev , Polarity]
    # edge_property:
    #   path: data/PCPTopology/Edges
    #   transform:
    #     - .sel: [!dag_prev , {property: [type_alpha, type_beta]}]
    #     - .rename: [!dag_prev , Cell type]

    periodic: 
      path: cfg/PCPTopology
      transform:
        - call_lambda:
          - "lambda kv: kv['PCPVertex']['space']['periodic']"
          - !dag_prev
    Lx:
      path: data/PCPTopology/Vertices
      transform:
      - call_lambda:
        - "lambda d: xr.DataArray([d[t].attrs['Lx'][0] for t in d], dims=['time'], coords=dict(time=[int(t) for t in d]))"
        - !dag_prev
    Ly:
      path: data/PCPTopology/Vertices
      transform:
      - call_lambda:
        - "lambda d: xr.DataArray([d[t].attrs['Ly'][0] for t in d], dims=['time'], coords=dict(time=[int(t) for t in d]))"
        - !dag_prev
    skew_x:
      path: data/PCPTopology/Edges
      transform:
      - call_lambda:
        - "lambda d: xr.DataArray([d[t].attrs['skew_x'][0] if 'skew_x' in d[t].attrs else 0. for t in d], dims=['time'], coords=dict(time=[int(t) for t in d]))"
        - !dag_prev
    skew_y:
      path: data/PCPTopology/Edges
      transform:
      - call_lambda:
        - "lambda d: xr.DataArray([d[t].attrs['skew_y'][0] if 'skew_y' in d[t].attrs else 0. for t in d], dims=['time'], coords=dict(time=[int(t) for t in d]))"
        - !dag_prev
    curvature:
      path: data/PCPTopology/Edges
      transform:
      - call_lambda:
        - "lambda d: xr.DataArray([d[t].attrs['curvature'][0] if 'curvature' in d[t].attrs else 0. for t in d], dims=['time'], coords=dict(time=[int(t) for t in d]))"
        - !dag_prev

  plot_vertices: false
  cell_center_marker_kwargs:
    colors: ['white', 'r', 'gray']

  property_interpolation_kwargs:
    method: nearest
  property_interpolation_plot_kwargs: ~
  
  vector_property_is_nematic: False
  vector_property_kwargs:
    scale: 1
    headlength: 2.5
    # headwidth: 3
    headaxislength: 2.5

  quiver_kwargs:
    cmap: Blues

  animation:
    enabled: true
    writer: frames
    writer_kwargs:
      ffmpeg:
        init:
          fps: 10
        saving:
          dpi: 300
      frames:
        saving:
          dpi: 300

    animation_update_kwargs: {}

  helpers:
    save_figure: {bbox_inches: tight}

  # Can use constrained layout, because axis labels don't change
  style:
    figure.constrained_layout.use: true
    axes.grid: false


_cell_neighbourhood:
  module: model_plots.PCPTopology
  plot_func: cell_neighbourhood

  only_type: all
  plot_hist: True
  plot_area: True
  plot_shape_index: True
  
  hist_plot_kwargs:
    align: left
    density: true

  helpers_frame_hist:
    set_labels:
      x: number of neighbours
      y: frequency
    set_limits:
      y: [0., 0.7]
  helpers_frame_area:
    set_labels:
      x: number of neighbours
      y: mean area
    set_limits:
      y: [0., 4.]
      x: [4, 11]
  helpers_frame_shape_index:
    set_labels:
      x: number of neighbours
      y: mean shape index
    set_limits:
      x: [4, 11]
      y: [3.54, 4.1]

  animation:
    enabled: true
    writer: frames
    writer_kwargs:
      ffmpeg:
        init:
          fps: 10
        saving:
          dpi: 300
      frames:
        saving:
          dpi: 300
    animation_update_kwargs:  {}
    

cell_neighbourhood_mv__map_time:
  based_on:
    - multiverse
    - _cell_neighbourhood

  stack_dims: ~

  only_type: all
  plot_hist: True
  plot_area: false
  plot_shape_index: false
  
  hist_plot_kwargs:
    align: left
    density: true

  helpers_frame_hist:
    set_labels:
      x: number of neighbours
      y: frequency
    set_limits:
      y: [0., 0.7]

  select_and_combine:
    allow_missing_or_failing: True
    fields:
      _area:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: area
          - .rename: [!dag_prev , area]
      _cell_type:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: cell_type
          - .rename: [!dag_prev , cell_type]
      _shape_index:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: perimeter}]
          - .sel: [!dag_node -2, {property: area_preferential}]
          - pow: [!dag_node -1 , 0.5]
          - div: [!dag_node -3, !dag_node -1]
          - .rename: [!dag_prev , shape_index]
      _num_neighbors:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: num_neighbors
          - .rename: [!dag_prev , num_neighbors]
      # _num_hair_neighbors:
      #   path: data/PCPTopology/Cells
      #   transform:
      #     - .sel:
      #       args: [!dag_prev ]
      #       kwargs:
      #         property: num_hair_neighbors
      #     - .rename: [!dag_prev , num_hair_neighbors]

  transform:
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _area,
             {ids: [seed, id]}]
    - import_and_call: &map_directional_time
      args: [model_plots.PCPTopology.data_ops, map_directional_time,
            !dag_prev ]
    - .squeeze: [!dag_prev ]
      tag: area
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _cell_type,
             {ids: [seed, id]}]
    - import_and_call: *map_directional_time
    - .squeeze: [!dag_prev ]
      tag: cell_type
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _shape_index,
             {ids: [seed, id]}]
    - import_and_call: *map_directional_time
    - .squeeze: [!dag_prev ]
      tag: shape_index
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _num_neighbors,
             {ids: [seed, id]}]
    - import_and_call: *map_directional_time
    - .squeeze: [!dag_prev ]
      tag: num_neighbors
    # - import_and_call:
    #   args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _num_hair_neighbors,
    #          {ids: [seed, id]}]
    # - import_and_call: *map_directional_time
    # - .squeeze: [!dag_prev ]
    #   tag: num_hair_neighbors