select_cells_properties_mv.map_stage:
  based_on: select_cells_properties_mv

  select_and_combine:
    fields:
      _area:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: area}]
          - .rename: [!dag_prev , area]

  transform:
    # a mask to select only hair / support cells
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _cell_type,
             {ids: [seed, id]}]
    - .squeeze: [!dag_prev ]
      tag: cell_type
    - create_mask: [!dag_tag cell_type, ==, 1]
      tag: _hair_cells
    - create_mask: [!dag_tag cell_type, '!=', 1]
      tag: _support_cells

    # stack the seeds
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _area,
             {ids: [seed, id]}]
    - .squeeze: [!dag_prev ]
      tag: area

    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _property,
             {ids: [seed, id]}]
    - .squeeze: [!dag_prev ]
      tag: property

    # HC area as mapping
    - .where: [!dag_tag area, !dag_tag _hair_cells]
    - .mean: [!dag_prev , ids]
      tag: HC_area
    

    # mask for bulk cells
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _is_boundary,
             {ids: [seed, id]}]
    - .squeeze: [!dag_prev ]
    - create_mask: [!dag_prev , <, 0.5] # not boundary
    - .rename: [!dag_prev , is_bulk]
      tag: _is_bulk

    # the data for support and hair cells
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, map_stage,
             !dag_tag property, !dag_tag HC_area]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: all_cells

    - .where: [!dag_tag property, !dag_tag _hair_cells]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, map_stage,
             !dag_prev , !dag_tag HC_area]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: hair_cells

    - .where: [!dag_tag property, !dag_tag _support_cells]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, map_stage,
             !dag_prev , !dag_tag HC_area]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: support_cells


# Extract averaged data from edges dataset
select_edges_properties:
  select:
      # the type of the cells
      bond_type:
        path: data/PCPTopology/Edges
        transform:
          - .sel: [!dag_prev , {property: [type_alpha, type_beta]}]
          - import_and_call:
            args: [model_plots.PCPTopology.data_ops, classify_edges, !dag_prev ]
          - .rename:
            args: [!dag_prev , cell_types]
    
  transform:
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_tag property]
      tag: all_edges

    # a mask to select only hair / support cells
    - create_mask: [!dag_tag bond_type, ==, 0]
      tag: _ss_edges
    - create_mask: [!dag_tag bond_type, ==, 1]
      tag: _hs_edges
    - create_mask: [!dag_tag bond_type, ==, 2]
      tag: _hh_edges
    - create_mask: [!dag_tag bond_type, ==, -1]
      tag: _boundary_edges

    - .where: [!dag_tag property, !dag_tag _ss_edges]
    - .dropna: [!dag_prev , id]
      kwargs: {how: all}
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: ss_edges
    - .where: [!dag_tag property, !dag_tag _hs_edges]
    - .dropna: [!dag_prev , id]
      kwargs: {how: all}
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: hs_edges
    - .where: [!dag_tag property, !dag_tag _hh_edges]
    - .dropna: [!dag_prev , id]
      kwargs: {how: all}
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: hh_edges
    - .where: [!dag_tag property, !dag_tag _boundary_edges]
    - .dropna: [!dag_prev , id]
      kwargs: {how: all}
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
      tag: boundary_edges


