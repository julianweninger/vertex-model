# Base plot configuration for this model
#
# The configurations given here can be used in the <model_name>_plots.yml file
---
energy:
  based_on: .basic_uni.lineplots
  model_name: PCPTopology
  file_ext: png

  to_plot:
    Energy/Total:
      label: TOTAL
    Energy/Linetension:
      label: line-tension
    Energy/Areaelasticity:
      label: area-elasticity
    Energy/Cell_contractility:
      label: cell contractility
    Energy/Edge_contractility:
      label: edge contractility

  helpers:
    set_labels:
      x: time
      y: energy [a.u.]

transitions:
  model_name: PCPTopology
  creator: universe
  universes: all
  module: model_plots.PCPTopology
  plot_func: transitions
  file_ext: png

select_cells:
  select:
    # the data containing all cells
    _cells: data/PCPTopology/Cells
    
  transform:
    # the data containing information of cell_type
    - .sel:
      args: [!dag_tag _cells]
      kwargs:
        property: cell_type
    - .rename:
      args: [!dag_prev , cell_types]
      tag: _cell_type

    # the data containing information of boundary
    - .sel:
      args: [!dag_tag _cells]
      kwargs:
        property: is_boundary
    - .rename:
      args: [!dag_prev , is_bulk]
    - create_mask:
      args: [!dag_prev , <, 0.5] # not boundary
      tag: _is_bulk

    # mask for hair cells
    - create_mask:
      args: [!dag_tag _cell_type, ==, 1]
      tag: _hair_cells
    # mask for support cells
    - create_mask:
      args: [!dag_tag _cell_type, ==, 2]
      tag: _support_cells

    # the data for hair cells
    - .where:
      args: [!dag_tag property, !dag_tag _hair_cells]
      tag: hair_cells
    # the data for support cells
    - .where:
      args: [!dag_tag property, !dag_tag _support_cells]
      tag: support_cells
    # the data for bulk cells
    - .where:
      args: [!dag_tag property, !dag_tag _is_bulk]
      tag: bulk_cells

    # the mean and mean__std data
    - .mean:
      args: [!dag_tag property , id]
      kwargs:
        skipna: True
      tag: cells_mean
    - .std:
      args: [!dag_tag property, id]
      kwargs:
        skipna: True
      tag: cells_mean__std
    - .max:
      args: [!dag_tag property , id]
      kwargs:
        skipna: True
      tag: cells_max
    - .min:
      args: [!dag_tag property , id]
      kwargs:
        skipna: True
      tag: cells_min
    
    # the mean and mean__std data for hair cells
    - .mean:
      args: [!dag_tag hair_cells ,id]
      kwargs:
        skipna: True
      tag: hair_cells_mean
    - .std:
      args: [!dag_tag hair_cells ,id]
      kwargs:
        skipna: True
      tag: hair_cells_mean__std
    - .max:
      args: [!dag_tag hair_cells ,id]
      kwargs:
        skipna: True
      tag: hair_cells_max
    - .min:
      args: [!dag_tag hair_cells ,id]
      kwargs:
        skipna: True
      tag: hair_cells_min

    # the mean and mean__std data for support cells
    - .mean:
      args: [!dag_tag support_cells ,id]
      kwargs:
        skipna: True
      tag: support_cells_mean
    - .std:
      args: [!dag_tag support_cells ,id]
      kwargs:
        skipna: True
      tag: support_cells_mean__std
    - .max:
      args: [!dag_tag support_cells ,id]
      kwargs:
        skipna: True
      tag: support_cells_max
    - .min:
      args: [!dag_tag support_cells ,id]
      kwargs:
        skipna: True
      tag: support_cells_min

    # the mean and mean__std data for bulk cells (non-boundary)
    - .mean:
      args: [!dag_tag bulk_cells , id]
      kwargs:
        skipna: True
      tag: bulk_cells_mean
    - .std:
      args: [!dag_tag bulk_cells, id]
      kwargs:
        skipna: True
      tag: bulk_cells_mean__std
    - .max:
      args: [!dag_tag bulk_cells , id]
      kwargs:
        skipna: True
      tag: bulk_cells_max
    - .min:
      args: [!dag_tag bulk_cells , id]
      kwargs:
        skipna: True
      tag: bulk_cells_min

cell_property:
  module: model_plots.PCPTopology
  plot_func: errorbars
  creator: universe
  universes: all
  file_ext: png

  helpers:
    set_labels:
      x: time

cellular_structure:
  creator: universe
  universes: all
  module: model_plots.PCPVertex
  plot_func: cellular_structure
  file_ext: png
  
  datapath: PCPTopology
  cfgpath: PCPTopology/PCPVertex

  plot_vertices: false
  cell_marker_size: 60

  helpers:
    set_labels:
      x: x [a.u.]
      y: y [a.u.]
    save_figure: {bbox_inches: tight}

  animation:
    enabled: true
    writer: frames
    writer_kwargs:
      ffmpeg:
        init:
          fps: 10
        saving:
          dpi: 300
      frames:
        saving:
          dpi: 300

    animation_update_kwargs: {}

  # Can use constrained layout, because axis labels don't change
  style:
    figure.constrained_layout.use: true
    axes.grid: false


cell_neighbourhood:
  module: model_plots.PCPTopology
  creator: universe
  universes: all
  plot_func: cell_neighbourhood
  file_ext: png

  only_type: all
  plot_hist: True
  plot_area: True
  plot_shape_index: True
  
  hist_plot_kwargs:
    align: left
    density: true

  helpers_frame_hist:
    set_labels:
      x: number of neighbours
      y: frequency
    set_limits:
      y: [0., 0.7]
  helpers_frame_area:
    set_labels:
      x: number of neighbours
      y: mean area
  helpers_frame_shape_index:
    set_labels:
      x: number of neighbours
      y: mean shape index

  animation:
    enabled: true
    writer: frames
    writer_kwargs:
      ffmpeg:
        init:
          fps: 10
        saving:
          dpi: 300
      frames:
        saving:
          dpi: 300
    animation_update_kwargs:  {}

# -- Multiverse plots
cell_property_multiverse:
  based_on: .dag.generic.facet_grid
  creator: multiverse
  file_ext: png
  
  select_and_combine: 
    fields:
      data:
        path: Cells
        with_previous_result: true
        transform:
        - .sel:
            time: 6
        - .mean: {dim: id}
    base_path: data/PCPTopology