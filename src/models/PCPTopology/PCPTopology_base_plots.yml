# Base plot configuration for this model
#
# The configurations given here can be used in the <model_name>_plots.yml file
---
universe:
  creator: universe
  universes: all
  file_ext: png

multiverse:
  creator: multiverse
  file_ext: png

energy:
  based_on:
    - .basic_uni.lineplots
    - universe

  model_name: PCPTopology

  to_plot:
    Energy/Total:
      label: TOTAL
    Energy/Linetension:
      label: line-tension
    Energy/Areaelasticity:
      label: area-elasticity
    Energy/Cell_contractility:
      label: cell contractility
    Energy/Edge_contractility:
      label: edge contractility

  helpers:
    set_labels:
      x: time
      y: energy [a.u.]

cell_property: &CELL_PROP
  module: model_plots.PCPTopology
  plot_func: errorbars

  helpers:
    set_labels:
      x: time

select_cell_stats:
  select:
    cells:
      path: data/PCPTopology/Statistics/Cell_stats
    hair_cells:
      path: data/PCPTopology/Statistics/Hair_cell_stats
    support_cells:
      path: data/PCPTopology/Statistics/Support_cell_stats
    bulk_cells:
      path: data/PCPTopology/Statistics/Bulk_cell_stats
    bulk_hair_cells:
      path: data/PCPTopology/Statistics/Bulk_hair_cell_stats
    bulk_support_cells:
      path: data/PCPTopology/Statistics/Bulk_support_cell_stats

select_cell_stats_mv:
  select_and_combine:
    fields:
      cells:
        path: data/PCPTopology/Statistics/Cell_stats
      hair_cells:
        path: data/PCPTopology/Statistics/Hair_cell_stats
      support_cells:
        path: data/PCPTopology/Statistics/Support_cell_stats
      bulk_cells:
        path: data/PCPTopology/Statistics/Bulk_cell_stats
      bulk_hair_cells:
        path: data/PCPTopology/Statistics/Bulk_hair_cell_stats
      bulk_support_cells:
        path: data/PCPTopology/Statistics/Bulk_support_cell_stats

select_cells_properties:
  select:
    # NOTE the order in which datasets are created is alphabetically!
    #      (underscores) `_` are treated first

    # the data containing all cells
    _cells: data/PCPTopology/Cells
    
    # a mask to select only bulk cells
    _is_bulk:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: is_boundary
        - .rename:
          args: [!dag_prev , is_bulk]
        - create_mask:
          args: [!dag_prev , <, 0.5] # not boundary

    # the type of the cells
    __cell_type:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: cell_type
        - .rename:
          args: [!dag_prev , cell_types]

    # a mask to select only hair cells
    _hair_cells:
      path: data/PCPTopology/Cells
      transform:
        - create_mask:
          args: [!dag_tag __cell_type, ==, 1]
    
    # a mask to select only support cells
    _support_cells:
      path: data/PCPTopology/Cells
      transform:
        - create_mask:
          args: [!dag_tag __cell_type, ==, 2]
    
    
  transform:
    # the data for all cells
    - .to_dataframe: [!dag_tag property]
    - callattr: [!dag_prev , reset_index]
      tag: all_cells

    # the data for hair cells
    - .where: [!dag_tag property, !dag_tag _hair_cells]
      tag: hair_cells_xarray
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: hair_cells

    # the data for support cells
    - .where: [!dag_tag property, !dag_tag _support_cells]
      tag: support_cells_xarray
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: support_cells

    # the data for bulk cells
    - .where: [!dag_tag property, !dag_tag _is_bulk]
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: all_cells_bulk
    
    - .where: [!dag_tag hair_cells_xarray, !dag_tag _is_bulk]
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: hair_cells_bulk
    
    - .where: [!dag_tag support_cells_xarray, !dag_tag _is_bulk]
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: support_cells_bulk


select_cells_properties.xy_data:
  based_on: select_cells_properties

  transform:
    # the data for support and hair cells
    - .where: [!dag_tag x, !dag_tag _hair_cells]
      tag: HC_x
    - .where: [!dag_tag x, !dag_tag _support_cells]
      tag: SC_x

    - .where: [!dag_tag y, !dag_tag _hair_cells]
      tag: HC_y
    - .where: [!dag_tag y, !dag_tag _support_cells]
      tag: SC_y

    # create xy data
    - xr.merge: [[!dag_tag x, !dag_tag y]]
      kwargs: {compat: 'override'}
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: all_cells

    - xr.merge: [[!dag_tag HC_x, !dag_tag HC_y]]
      kwargs: {compat: 'override'}
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: hair_cells

    - xr.merge: [[!dag_tag SC_x, !dag_tag SC_y]]
      kwargs: {compat: 'override'}
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: support_cells

      
select_cells_properties_mv:
  select_and_combine:
    fields:
      _cells: data/PCPTopology/Cells

      # the type of the cells
      _cell_type:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: cell_type
          - .rename:
            args: [!dag_prev , cell_types]

      _is_boundary:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: is_boundary
          - .rename:
            args: [!dag_prev , is_boundary]
    
  transform:
    # stack the seeds
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _property,
             {ids: [seed, id]}]
    - .squeeze: [!dag_prev ]
      tag: property
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: all_cells

    # a mask to select only hair / support cells
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _cell_type,
             {ids: [seed, id]}]
    - .squeeze: [!dag_prev ]
      tag: cell_type
    - create_mask: [!dag_tag cell_type, ==, 1]
      tag: _hair_cells
    - create_mask: [!dag_tag cell_type, ==, 2]
      tag: _support_cells

    # mask for bulk cells
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _is_boundary,
             {ids: [seed, id]}]
    - .squeeze: [!dag_prev ]
    - create_mask: [!dag_prev , <, 0.5] # not boundary
    - .rename: [!dag_prev , is_bulk]
      tag: _is_bulk

    # the data for hair cells
    - .where: [!dag_tag property, !dag_tag _hair_cells]
      tag: hair_cells_xarray
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: hair_cells
    # the data for support cells
    - .where: [!dag_tag property, !dag_tag _support_cells]
      tag: support_cells_xarray
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: support_cells
    
    # the data for bulk cells
    - .where: [!dag_tag property, !dag_tag _is_bulk]
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: all_cells_bulk
      
    - .where: [!dag_tag hair_cells_xarray, !dag_tag _is_bulk]
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: hair_cells_bulk
      
    - .where: [!dag_tag support_cells_xarray, !dag_tag _is_bulk]
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: support_cells_bulk

select_cells_properties_mv.xy_data:
  based_on: select_cells_properties_mv

  transform:
    # stack the seeds
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _x,
             {ids: [seed, id]}]
    - .squeeze: [!dag_prev ]
      tag: x
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _y,
             {ids: [seed, id]}]
    - .squeeze: [!dag_prev ]
      tag: y

    # a mask to select only hair / support cells
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _cell_type,
             {ids: [seed, id]}]
    - .squeeze: [!dag_prev ]
      tag: cell_type
    - create_mask: [!dag_tag cell_type, ==, 1]
      tag: _hair_cells
    - create_mask: [!dag_tag cell_type, ==, 2]
      tag: _support_cells

    # mask for bulk cells
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _is_boundary,
             {ids: [seed, id]}]
    - .squeeze: [!dag_prev ]
    - create_mask: [!dag_prev , <, 0.5] # not boundary
    - .rename: [!dag_prev , is_bulk]
      tag: _is_bulk

    # the data for support and hair cells
    - .where: [!dag_tag x, !dag_tag _hair_cells]
      tag: HC_x
    - .where: [!dag_tag x, !dag_tag _support_cells]
      tag: SC_x

    - .where: [!dag_tag y, !dag_tag _hair_cells]
      tag: HC_y
    - .where: [!dag_tag y, !dag_tag _support_cells]
      tag: SC_y

    # create xy data
    - xr.merge: [[!dag_tag x, !dag_tag y]]
      kwargs: {compat: 'override'}
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: all_cells

    - xr.merge: [[!dag_tag HC_x, !dag_tag HC_y]]
      kwargs: {compat: 'override'}
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: hair_cells

    - xr.merge: [[!dag_tag SC_x, !dag_tag SC_y]]
      kwargs: {compat: 'override'}
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: support_cells

cellular_structure:
  creator: universe
  universes: all
  module: model_plots.PCPVertex
  plot_func: cellular_structure
  file_ext: png
  
  datapath: PCPTopology
  cfgpath: PCPTopology/PCPVertex

  plot_vertices: false
  cell_marker_size: 60

  helpers:
    set_labels:
      x: x [a.u.]
      y: y [a.u.]
    save_figure: {bbox_inches: tight}

  animation:
    enabled: true
    writer: frames
    writer_kwargs:
      ffmpeg:
        init:
          fps: 10
        saving:
          dpi: 300
      frames:
        saving:
          dpi: 300

    animation_update_kwargs: {}

  # Can use constrained layout, because axis labels don't change
  style:
    figure.constrained_layout.use: true
    axes.grid: false


_cell_neighbourhood:
  module: model_plots.PCPTopology
  plot_func: cell_neighbourhood

  only_type: all
  plot_hist: True
  plot_area: True
  plot_shape_index: True
  
  hist_plot_kwargs:
    align: left
    density: true

  helpers_frame_hist:
    set_labels:
      x: number of neighbours
      y: frequency
    set_limits:
      y: [0., 0.7]
  helpers_frame_area:
    set_labels:
      x: number of neighbours
      y: mean area
    set_limits:
      y: [0., 4.]
      x: [4, 11]
  helpers_frame_shape_index:
    set_labels:
      x: number of neighbours
      y: mean shape index
    set_limits:
      x: [4, 11]
      y: [3.54, 4.1]

  animation:
    enabled: true
    writer: frames
    writer_kwargs:
      ffmpeg:
        init:
          fps: 10
        saving:
          dpi: 300
      frames:
        saving:
          dpi: 300
    animation_update_kwargs:  {}
    