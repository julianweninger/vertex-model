# Base plot configuration for this model
#
# The configurations given here can be used in the <model_name>_plots.yml file
---
universe:
  creator: universe
  universes: all
  file_ext: png

multiverse:
  creator: multiverse
  file_ext: png

energy:
  based_on:
    - .basic_uni.lineplots
    - universe

  model_name: PCPTopology

  to_plot:
    Energy/Total:
      label: TOTAL
    Energy/Linetension:
      label: line-tension
    Energy/Areaelasticity:
      label: area-elasticity
    Energy/Cell_contractility:
      label: cell contractility
    Energy/Edge_contractility:
      label: edge contractility

  helpers:
    set_labels:
      x: time
      y: energy [a.u.]

select_cells:
  select:
    # NOTE the order in which datasets are created is alphabetically!
    #      (underscores) `_` are treated first

    # the data containing all cells
    _cells: data/PCPTopology/Cells
    
    # a mask to select only bulk cells
    _is_bulk:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: is_boundary
        - .rename:
          args: [!dag_prev , is_bulk]
        - create_mask:
          args: [!dag_prev , <, 0.5] # not boundary

    # the type of the cells
    __cell_type:
      path: data/PCPTopology/Cells
      transform:
        - .sel:
          args: [!dag_prev ]
          kwargs:
            property: cell_type
        - .rename:
          args: [!dag_prev , cell_types]

    # a mask to select only hair cells
    _hair_cells:
      path: data/PCPTopology/Cells
      transform:
        - create_mask:
          args: [!dag_tag __cell_type, ==, 1]
    
    # a mask to select only support cells
    _support_cells:
      path: data/PCPTopology/Cells
      transform:
        - create_mask:
          args: [!dag_tag __cell_type, ==, 2]
    
    
  transform:
    # the data for hair cells
    - .where:
      args: [!dag_tag property, !dag_tag _hair_cells]
      tag: hair_cells
    # the data for support cells
    - .where:
      args: [!dag_tag property, !dag_tag _support_cells]
      tag: support_cells

    # the mean and mean__std data
    - .mean:
      args: [!dag_tag property , id]
      kwargs:
        skipna: True
      tag: cells_mean
    - .std:
      args: [!dag_tag property, id]
      kwargs:
        skipna: True
      tag: cells_mean__std
    - .max:
      args: [!dag_tag property , id]
      kwargs:
        skipna: True
      tag: cells_max
    - .min:
      args: [!dag_tag property , id]
      kwargs:
        skipna: True
      tag: cells_min
    
    # the mean and mean__std data for hair cells
    - .mean:
      args: [!dag_tag hair_cells ,id]
      kwargs:
        skipna: True
      tag: hair_cells_mean
    - .std:
      args: [!dag_tag hair_cells ,id]
      kwargs:
        skipna: True
      tag: hair_cells_mean__std
    - .max:
      args: [!dag_tag hair_cells ,id]
      kwargs:
        skipna: True
      tag: hair_cells_max
    - .min:
      args: [!dag_tag hair_cells ,id]
      kwargs:
        skipna: True
      tag: hair_cells_min

    # the mean and mean__std data for support cells
    - .mean:
      args: [!dag_tag support_cells ,id]
      kwargs:
        skipna: True
      tag: support_cells_mean
    - .std:
      args: [!dag_tag support_cells ,id]
      kwargs:
        skipna: True
      tag: support_cells_mean__std
    - .max:
      args: [!dag_tag support_cells ,id]
      kwargs:
        skipna: True
      tag: support_cells_max
    - .min:
      args: [!dag_tag support_cells ,id]
      kwargs:
        skipna: True
      tag: support_cells_min

select_cells_multiverse:
  select_and_combine:
    fields:
      _cells: data/PCPTopology/Cells

      # the type of the cells
      _cell_type:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: cell_type
          - .rename:
            args: [!dag_prev , cell_types]

      _is_boundary:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: is_boundary
          - .rename:
            args: [!dag_prev , is_boundary]
    
  transform:
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _property,
             {ids: [seed, id]}]
    - .squeeze:
      args: [!dag_prev ]
      tag: property

    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _cell_type,
             {ids: [seed, id]}]
    - .squeeze:
      args: [!dag_prev ]
      tag: cell_type

    # a mask to select only hair cells
    - create_mask:
      args: [!dag_tag cell_type, ==, 1]
      tag: _hair_cells
    
    # a mask to select only support cells
    - create_mask:
      args: [!dag_tag cell_type, ==, 2]
      tag: _support_cells

    # mask for bulk cells
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _is_boundary,
             {ids: [seed, id]}]
    - .squeeze:
      args: [!dag_prev ]
    - create_mask:
      args: [!dag_prev , <, 0.5] # not boundary
    - .rename:
      args: [!dag_prev , is_bulk]
      tag: _is_bulk

    # the data for hair cells
    - .where:
      args: [!dag_tag property, !dag_tag _hair_cells]
      tag: hair_cells
    # the data for support cells
    - .where:
      args: [!dag_tag property, !dag_tag _support_cells]
      tag: support_cells
    # the data for bulk cells
    - .where:
      args: [!dag_tag property, !dag_tag _is_bulk]
      tag: bulk_cells
    # the data for bulk hair cells
    - .where:
      args: [!dag_tag hair_cells, !dag_tag _is_bulk]
      tag: hair_cells_bulk
    # the data for bulk support cells
    - .where:
      args: [!dag_tag support_cells, !dag_tag _is_bulk]
      tag: support_cells_bulk

    # the mean and mean__std data
    - .mean:
      args: [!dag_tag property , ids]
      kwargs:
        skipna: True
      tag: cells_mean
    - .std:
      args: [!dag_tag property, ids]
      kwargs:
        skipna: True
      tag: cells_mean__std
    - .max:
      args: [!dag_tag property , ids]
      kwargs:
        skipna: True
      tag: cells_max
    - .min:
      args: [!dag_tag property , ids]
      kwargs:
        skipna: True
      tag: cells_min
    
    # the mean and mean__std data for hair cells
    - .mean:
      args: [!dag_tag hair_cells ,ids]
      kwargs:
        skipna: True
      tag: hair_cells_mean
    - .std:
      args: [!dag_tag hair_cells ,ids]
      kwargs:
        skipna: True
      tag: hair_cells_mean__std
    - .max:
      args: [!dag_tag hair_cells ,ids]
      kwargs:
        skipna: True
      tag: hair_cells_max
    - .min:
      args: [!dag_tag hair_cells ,ids]
      kwargs:
        skipna: True
      tag: hair_cells_min

    # the mean and mean__std data for support cells
    - .mean:
      args: [!dag_tag support_cells ,ids]
      kwargs:
        skipna: True
      tag: support_cells_mean
    - .std:
      args: [!dag_tag support_cells ,ids]
      kwargs:
        skipna: True
      tag: support_cells_mean__std
    - .max:
      args: [!dag_tag support_cells ,ids]
      kwargs:
        skipna: True
      tag: support_cells_max
    - .min:
      args: [!dag_tag support_cells ,ids]
      kwargs:
        skipna: True
      tag: support_cells_min

    # the mean and mean__std data for bulk cells (non-boundary)
    - .mean:
      args: [!dag_tag bulk_cells , ids]
      kwargs:
        skipna: True
      tag: cells_bulk_mean
    - .std:
      args: [!dag_tag bulk_cells, ids]
      kwargs:
        skipna: True
      tag: cells_bulk_mean__std
    - .max:
      args: [!dag_tag bulk_cells , ids]
      kwargs:
        skipna: True
      tag: cells_bulk_max
    - .min:
      args: [!dag_tag bulk_cells , ids]
      kwargs:
        skipna: True
      tag: cells_bulk_min
    
    # the mean and mean__std data for hair cells (bulk)
    - .mean:
      args: [!dag_tag hair_cells_bulk , ids]
      kwargs:
        skipna: True
      tag: hair_cells_bulk_mean
    - .std:
      args: [!dag_tag hair_cells_bulk , ids]
      kwargs:
        skipna: True
      tag: hair_cells_bulk_mean__std
    - .max:
      args: [!dag_tag hair_cells_bulk , ids]
      kwargs:
        skipna: True
      tag: hair_cells_bulk_max
    - .min:
      args: [!dag_tag hair_cells_bulk , ids]
      kwargs:
        skipna: True
      tag: hair_cells_bulk_min

    # the mean and mean__std data for support cells (bulk)
    - .mean:
      args: [!dag_tag support_cells_bulk , ids]
      kwargs:
        skipna: True
      tag: support_cells_bulk_mean
    - .std:
      args: [!dag_tag support_cells_bulk , ids]
      kwargs:
        skipna: True
      tag: support_cells_bulk_mean__std
    - .max:
      args: [!dag_tag support_cells_bulk , ids]
      kwargs:
        skipna: True
      tag: support_cells_bulk_max
    - .min:
      args: [!dag_tag support_cells_bulk , ids]
      kwargs:
        skipna: True
      tag: support_cells_bulk_min

cell_property: &CELL_PROP
  module: model_plots.PCPTopology
  plot_func: errorbars

  helpers:
    set_labels:
      x: time

cellular_structure:
  creator: universe
  universes: all
  module: model_plots.PCPVertex
  plot_func: cellular_structure
  file_ext: png
  
  datapath: PCPTopology
  cfgpath: PCPTopology/PCPVertex

  plot_vertices: false
  cell_marker_size: 60

  helpers:
    set_labels:
      x: x [a.u.]
      y: y [a.u.]
    save_figure: {bbox_inches: tight}

  animation:
    enabled: true
    writer: frames
    writer_kwargs:
      ffmpeg:
        init:
          fps: 10
        saving:
          dpi: 300
      frames:
        saving:
          dpi: 300

    animation_update_kwargs: {}

  # Can use constrained layout, because axis labels don't change
  style:
    figure.constrained_layout.use: true
    axes.grid: false


cell_neighbourhood:
  module: model_plots.PCPTopology
  creator: universe
  universes: all
  plot_func: cell_neighbourhood
  file_ext: png

  only_type: all
  plot_hist: True
  plot_area: True
  plot_shape_index: True
  
  hist_plot_kwargs:
    align: left
    density: true

  helpers_frame_hist:
    set_labels:
      x: number of neighbours
      y: frequency
    set_limits:
      y: [0., 0.7]
  helpers_frame_area:
    set_labels:
      x: number of neighbours
      y: mean area
  helpers_frame_shape_index:
    set_labels:
      x: number of neighbours
      y: mean shape index

  animation:
    enabled: true
    writer: frames
    writer_kwargs:
      ffmpeg:
        init:
          fps: 10
        saving:
          dpi: 300
      frames:
        saving:
          dpi: 300
    animation_update_kwargs:  {}
    