# Base plot configuration for this model
#
# The configurations given here can be used in the <model_name>_plots.yml file
---
energy:
  based_on: .basic_uni.lineplots
  model_name: PCPTopology
  file_ext: png

  to_plot:
    Energy/Total:
      label: TOTAL
    Energy/Linetension:
      label: line-tension
    Energy/Areaelasticity:
      label: area-elasticity
    Energy/Contractility:
      label: contractility

  helpers:
    set_labels:
      x: time
      y: energy [a.u.]

transitions:
  model_name: PCPTopology
  creator: universe
  universes: all
  module: model_plots.PCPTopology
  plot_func: transitions
  file_ext: png

cell_property:
  module: model_plots.PCPTopology
  plot_func: errorbars
  creator: universe
  universes: all
  file_ext: png

  select:
    _cells: data/PCPTopology/Cells

  helpers:
    set_labels:
      x: time

cellular_structure:
  creator: universe
  universes: all
  module: model_plots.PCPVertex
  plot_func: cellular_structure
  file_ext: png
  
  datapath: PCPTopology
  cfgpath: PCPTopology/PCPVertex

  plot_vertices: false

  helpers:
    set_labels:
      x: x [a.u.]
      y: y [a.u.]
    save_figure: {bbox_inches: tight}

  animation:
    enabled: true
    writer: frames
    writer_kwargs:
      ffmpeg:
        init:
          fps: 10
        saving:
          dpi: 300
      frames:
        saving:
          dpi: 300

    animation_update_kwargs: {}

  # Can use constrained layout, because axis labels don't change
  style:
    figure.constrained_layout.use: true
    axes.grid: false


cell_neighbourhood:
  module: model_plots.PCPTopology
  creator: universe
  universes: all
  plot_func: cell_neighbourhood
  file_ext: png

  only_type: all
  plot_hist: True
  plot_area: True
  plot_shape_index: True
  
  hist_plot_kwargs:
    align: left
    density: true

  helpers_frame_hist:
    set_labels:
      x: number of neighbours
      y: frequency
    set_limits:
      y: [0., 0.7]
  helpers_frame_area:
    set_labels:
      x: number of neighbours
      y: mean area
  helpers_frame_shape_index:
    set_labels:
      x: number of neighbours
      y: mean shape index

  animation:
    enabled: true
    writer: frames
    writer_kwargs:
      ffmpeg:
        init:
          fps: 10
        saving:
          dpi: 300
      frames:
        saving:
          dpi: 300
    animation_update_kwargs:  {}

# -- Multiverse plots
cell_property_multiverse:
  based_on: .dag.generic.facet_grid
  creator: multiverse
  file_ext: png
  
  select_and_combine: 
    fields:
      data:
        path: Cells
        with_previous_result: true
        transform:
        - .sel:
            time: 6
        - .mean: {dim: id}
    base_path: data/PCPTopology