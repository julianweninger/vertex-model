# Base plot configuration for this model
#
# The configurations given here can be used in the <model_name>_plots.yml file
---
energy:
  based_on: .basic_uni.lineplots
  model_name: PCPTopology
  file_ext: png

  helpers:
    set_labels:
      x: time
      y: energy [a.u.]

cellular_structure:
  creator: universe
  universes: all
  module: model_plots.PCPVertex
  plot_func: cellular_structure
  file_ext: png

  plot_vertices: false

  helpers:
    set_labels:
      x: x [a.u.]
      y: y [a.u.]

  animation:
    enabled: true
    writer: frames
    writer_kwargs:
      ffmpeg:
        init:
          fps: 10
        saving:
          dpi: 300
      frames:
        saving:
          dpi: 300

    animation_update_kwargs:  {}

cell_neighbourhood:
  module: model_plots.PCPTopology
  plot_func: cell_neighbourhood
  file_ext: png

  helpers_frame_hist:
    set_labels:
      x: number of neighbours
      y: frequency
    set_limits:
      y: [0., 0.7]
  helpers_frame_area:
    set_labels:
      x: number of neighbours
      y: mean area

# -- Multiverse plots
cell_property_multiverse:
  based_on: .dag.generic.facet_grid
  creator: multiverse
  file_ext: png
  
  select_and_combine: 
    fields:
      data:
        path: Cells
        with_previous_result: true
        transform:
        - .sel:
            time: 6
        - .mean: {dim: id}
    base_path: data/PCPTopology