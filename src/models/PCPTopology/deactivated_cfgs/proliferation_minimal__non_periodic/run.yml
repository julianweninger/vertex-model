    # A minimal configuration to do cell proliferation
# In quick and dirty during proliferation the energy is not minimized.
# This results in a significant (~ factor 100) speed up with similar results.
#
# The model can be run by typing : 
# $ cd /path-to-Utopia/vertex-model
# $ utopia run PCPTopology src/models/PCPTopology/cfgs/<choose>/run.yml \
#          --plots-cfg src/models/PCPTopology/cfgs/<choose>/eval.yml
#
# The content of this file is used to update the corresponding entries in
# ../PCPTopology_cfg.yml
---
paths:
  model_note: default_proliferation_non_periodic

parameter_space:
  num_steps: 2

  PCPTopology:
    space: &SPACE
      periodic: false
      extent: [30, 30]

    minimization:
      dt: 0.01
      num_steps: 100

    initialisation:
      1_by_proliferation:
        enabled: false

    operations:
      - void:
          times: []
          iterations_prolog: 1

          minimization: &JiggleQuickDirty
            jiggle_intensity: 1.e-3
            num_repeat: 2
            tolerance: 1.e-8
            jiggle_tolerance: 1.e-6

      - proliferate:
          times: [1]
          num_cells: 16
          num_increases: 0
          area_threshold: 0.
          minimization_after_division:
            num_steps: 20
          minimize_after_division: True
          minimization: ~
      # 32 cells

      - void:
          times: [2]
      # NOTE time 2: jiggle (see last operation)

      - proliferate:
          times: [3]
          num_cells: 32
          num_increases: 0
          area_threshold: 0.
          minimization_after_division:
            num_steps: 20
          minimize_after_division: True
          minimization: ~
      # 64 cells

      - proliferate:
          times: [4]
          num_cells: 64
          num_increases: 0
          area_threshold: 0.
          minimization_after_division:
            num_steps: 20
          minimize_after_division: True
          minimization: ~
      # 128 cells
      
      - proliferate:
          times: [5]
          num_cells: 128
          num_increases: 0
          area_threshold: 0.
          minimization_after_division:
            num_steps: 20
          minimize_after_division: True
          minimization: ~
      # 256 cells
      
      - proliferate:
          times: [6]
          num_cells: 256
          num_increases: 0
          area_threshold: 0.
          minimization_after_division:
            num_steps: 20
          minimize_after_division: True
          minimization: ~
      # 512 cells
      
      - proliferate:
          times: [7]
          num_cells: 512
          num_increases: 0
          area_threshold: 0.
          minimization_after_division:
            num_steps: 20
          minimize_after_division: True
          minimization: ~
      # 1024 cells
      
      - proliferate:
          times: [8]
          num_cells: 1024
          num_increases: 0
          area_threshold: 0.
          minimization_after_division:
            num_steps: 20
          minimize_after_division: True
          minimization: ~
      # 2048 cells 
      
      - proliferate:
          times: [9]
          num_cells: 2048
          num_increases: 0
          area_threshold: 0.
          minimization_after_division:
            num_steps: 20
          minimize_after_division: True
          minimization: ~
      # 4096 cells 

    PCPVertex:
      log_level: info

      space: *SPACE

      # --- Initialization parameters
      agent_manager:
        setup_method: hexagonal
        setup_params:
          hexagonal:
            lattice_rows: 4
            lattice_columns: 4

      data_manager:
        deciders:
          write_interval: &interval_continuous
            type: interval
            args:
              intervals:
                - [100, 800, 100]
        triggers:
          build_interval: *interval_continuous

    data_manager:
      deciders:
        write_interval: &interval
          type: interval
          args:
            intervals:
              - [0, 11, 1]
      triggers:
        build_interval: *interval
