    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: all_cells

    # the data for hair cells
    - .where: [!dag_tag property, !dag_tag _hair_cells]
    - .swap_dims: [!dag_prev , {time: area}]
      tag: hair_cells_xr
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: hair_cells
    # the data for support cells
    - .where: [!dag_tag property, !dag_tag _support_cells]
      tag: support_cells_xr
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: support_cells
    
    - .mean: [!dag_tag hair_cells_xr, ids]
      tag: hair_cells_mean
    - .coords: [!dag_tag hair_cells_mean, area]
      tag: data_coords
    - create_mask: [!dag_prev ,'>', 0]
    - .where: [!dag_tag hair_cells_mean, !dag_prev ]
      kwargs:
        drop: true
    - .polyfit: 
      args: [!dag_prev , area, 1]
      kwargs: 
        skipna: true
        cov: true
    - getitem: [!dag_prev , polyfit_coefficients]
      tag: fit
    - getitem: [!dag_prev , 0]
      tag: fit_slope
    - getitem: [!dag_tag fit, 1]
      tag: fit_offset

    - mul: [!dag_tag data_coords, !dag_tag fit_slope]
    - add: [!dag_prev , !dag_tag fit_offset]
    - .rename: [!dag_prev , linear_fit]
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: linear_fit


    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, define_exp_coordin_area]
    - .dropna: [!dag_prev , area]
      tag: experiment_xr
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: experiment

    - .coords: [!dag_tag experiment_xr, area]
    - create_mask: [!dag_prev ,'>', 0]
    - .where: [!dag_tag experiment_xr, !dag_prev ]
      kwargs:
        drop: true
    - .polyfit: 
      args: [!dag_prev , area, 1]
      kwargs: 
        skipna: true
        cov: true
    - getitem: [!dag_prev , polyfit_coefficients]
      tag: fit_experiment
    - getitem: [!dag_prev , 0]
      tag: fit_experiment_slope
    - getitem: [!dag_tag fit_experiment, 1]
      tag: fit_experiment_offset

    - mul: [!dag_tag data_coords, !dag_tag fit_experiment_slope]
    - add: [!dag_prev , !dag_tag fit_experiment_offset]
    - .rename: [!dag_prev , linear_fit]
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: linear_fit_experiment
    
  to_plot:
    - function: sns.lineplot
      data: !dag_result hair_cells
      hue: Gamma
      ci: sd
    - function: sns.lineplot
      data: !dag_result linear_fit_experiment
      label: lin. fit experiment
      y: linear_fit
      color: black
    - function: sns.scatterplot
      data: !dag_result experiment
      label: 
      hue: stage
      style: position
      palette: copper
    - function: sns.lineplot
      data: !dag_result linear_fit
      label: lin. fit
      y: linear_fit
      color: orange


