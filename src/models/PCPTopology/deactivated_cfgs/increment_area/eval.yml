area_mapped/neighbors: !pspace
  based_on:
    - .default_style_and_helpers
    - .dag.multiplot
    - multiverse
    - select_cells_properties_mv.map_stage

  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: num_neighbors}]
          - .rename: [!dag_prev , num_neighbors]
    subspace: *subspace_slice

  transform:
    # a mask to select only hair / support cells
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _cell_type,
             {ids: [seed, id]}]
    - *map_directional_time
    - .squeeze: [!dag_prev ]
      tag: cell_type
    - create_mask: [!dag_tag cell_type, ==, 1]
      tag: _hair_cells
    - create_mask: [!dag_tag cell_type, ==, 2]
      tag: _support_cells

    # stack the seeds
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _area,
             {ids: [seed, id]}]
    - *map_directional_time
    - .where: [!dag_prev , !dag_tag _hair_cells]
    - .mean: [!dag_prev , ids]
      tag: HC_area    

    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _property,
             {ids: [seed, id]}]
    - *map_directional_time
    - .assign_coords: [!dag_prev , {area: !dag_tag HC_area}]
    - .squeeze: [!dag_prev ]
      tag: property

    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: all_cells

    # # mask for bulk cells
    # - import_and_call:
    #   args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _is_boundary,
    #          {ids: [seed, id]}]
    # - .squeeze: [!dag_prev ]
    # - create_mask: [!dag_prev , <, 0.5] # not boundary
    # - .rename: [!dag_prev , is_bulk]
    #   tag: _is_bulk

    # the data for hair cells
    - .where: [!dag_tag property, !dag_tag _hair_cells]
      tag: hair_cells_xarray
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: hair_cells
    # the data for support cells
    - .where: [!dag_tag property, !dag_tag _support_cells]
      tag: support_cells_xarray
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: support_cells

  to_plot:
    - function: sns.lineplot
      data: !dag_result all_cells
      label: all cells
      color: grey
      ci: ~
    - function: sns.lineplot
      data: !dag_result hair_cells
      label: hair cells
      color: red
      ci: sd
    - function: sns.lineplot
      data: !dag_result support_cells
      label: support cells
      color: royalblue
      ci: sd

  x: area
  y: num_neighbors

  helpers:
    set_labels:
      y: number of neighbors
      x: normalized HC area
    set_limits:
      x: [0., 5.]
      y: [3., 12]


area_mapped/neighbors_w_data: !pspace
  based_on: area_mapped/neighbors

  transform:
    # a mask to select only hair / support cells
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _cell_type,
             {ids: [seed, id]}]
    - *map_directional_time
    - .squeeze: [!dag_prev ]
      tag: cell_type
    - create_mask: [!dag_tag cell_type, ==, 1]
      tag: _hair_cells
    - create_mask: [!dag_tag cell_type, ==, 2]
      tag: _support_cells

    # stack the seeds
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _area,
             {ids: [seed, id]}]
    - *map_directional_time
    - .where: [!dag_prev , !dag_tag _hair_cells]
    - .mean: [!dag_prev , ids]
      tag: HC_area    

    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _property,
             {ids: [seed, id]}]
    - *map_directional_time
    - .assign_coords: [!dag_prev , {area: !dag_tag HC_area}]
    - .squeeze: [!dag_prev ]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, sortby, !dag_prev , area]
      tag: property

    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: all_cells

    # the data for hair cells
    - .where: [!dag_tag property, !dag_tag _hair_cells]
      tag: hair_cells_xarray
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: hair_cells
    # the data for support cells
    - .where: [!dag_tag property, !dag_tag _support_cells]
      tag: support_cells_xarray
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: support_cells

    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack_xls_sheets, 
             *coordination_number_file_path]
      kwargs:
        label: num_neighbors
        label_columns: position
        label_sheets: stage
        reduce_mean: true
        convert_sheet_labels_to_float: True

      tag: experiment__num_neighbors
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack_xls_sheets, 
             *hc_area_file_path]
      kwargs:
        label: area
        label_columns: stage
        label_sheets: position
        reduce_mean: true
        convert_sheet_labels_to_float: True
      tag: experiment__area
      
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, define_exp_coordin_area]
    # - import_and_call:
    #   args: [model_plots.PCPTopology.data_ops, dropna, !dag_prev , area]
    - .to_dataframe: [!dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: experiment


  to_plot:
    - function: sns.lineplot
      data: !dag_result all_cells
      label: all cells
      color: grey
      ci: ~
    - function: sns.lineplot
      data: !dag_result support_cells
      label: support cells
      color: royalblue
      ci: sd
    - function: sns.lineplot
      data: !dag_result hair_cells
      label: hair cells
      color: red
      ci: sd
    - function: sns.scatterplot
      data: !dag_result experiment
      label: basilar papilla
      hue: stage
      style: position
      palette: copper
      
  helpers:
    # set_legend:
    #   ncol: 1
    #   bbox_to_anchor: [1.05, 1]
    #   loc: 2
    #   borderaxespad: 0.
    set_limits:
      x: [0., 5.]
      y: [3., 11]
    set_hv_lines:
      vlines:
        - pos: 0.58
          linestyle: ':'
          color: black
        - pos: 0.88
          linestyle: ':'
          color: black
        - pos: 0.99
          linestyle: ':'
          color: black
        - pos: 1.39
          linestyle: ':'
          color: black
        - pos: 3.09
          linestyle: ':'
          color: black
        - pos: 3.25
          linestyle: ':'
          color: black
        - pos: 3.47
          linestyle: ':'
          color: black
  
  style:
    legend.fontsize: 8.4

