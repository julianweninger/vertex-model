# --- Cell segmentation ------------------------------------------------------

cell_segmentation:
  based_on:
    - .default_style_and_helpers
    - cellular_structure
  universes:
    <<: *subspace

# --- Cell neighborhood histogram --------------------------------------------
cell_neighborhood: !pspace
  based_on:
    - .default_style_and_helpers
    - multiverse
    - _cell_neighbourhood
  enabled: false

  stack_dims: ~

  only_type: !sweep
    default: all
    values: *neighborhood_only_type_values
  plot_hist: True
  plot_area: false
  plot_shape_index: false
  
  hist_plot_kwargs:
    align: left
    density: true

  helpers_frame_hist:
    set_labels:
      x: number of neighbours
      y: frequency
    set_limits:
      y: [0., 0.7]

  select_and_combine:
    allow_missing_or_failing: True
    fields:
      _area:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: area
          - .rename: [!dag_prev , area]
      _cell_type:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: cell_type
          - .rename: [!dag_prev , cell_type]
      _shape_index:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: shape_index
          - .rename: [!dag_prev , shape_index]
      _num_neighbors:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: num_neighbors
          - .rename: [!dag_prev , num_neighbors]
      _num_hair_neighbors:
        path: data/PCPTopology/Cells
        transform:
          - .sel:
            args: [!dag_prev ]
            kwargs:
              property: num_hair_neighbors
          - .rename: [!dag_prev , num_hair_neighbors]
    subspace: *subspace_slice

  transform:
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _area,
             {ids: [seed, id]}]
    - *map_directional_time
    - .squeeze: [!dag_prev ]
      tag: area
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _cell_type,
             {ids: [seed, id]}]
    - *map_directional_time
    - .squeeze: [!dag_prev ]
      tag: cell_type
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _shape_index,
             {ids: [seed, id]}]
    - *map_directional_time
    - .squeeze: [!dag_prev ]
      tag: shape_index
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _num_neighbors,
             {ids: [seed, id]}]
    - *map_directional_time
    - .squeeze: [!dag_prev ]
      tag: num_neighbors
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, stack, !dag_tag _num_hair_neighbors,
             {ids: [seed, id]}]
    - *map_directional_time
    - .squeeze: [!dag_prev ]
      tag: num_hair_neighbors

