---
single_universe:
  enabled: False
  universes:
    seed: 0
    
_definitions:
  enabled: false
  hue: &HUE Gamma
  subspace_slice: &subspace_slice
    Gamma: !sweep
      default: 0.
      values: 
        # - 0.
        # - 0.1
        # - 0.2
        - 0.4
        # - 0.6
        # - 0.8
    HC_sep: !sweep
      default: false
      values: 
        # - true
        - false
      order: -1

  Gamma_best_fit: &Gamma_best_fit 0.4

  hue_2: &HUE_2 ~
  subspace_slice_2: &subspace_slice_2
    HC_sep: !sweep
      default: false
      values: 
        # - true
        - false
      order: -1


  timepoint_spatial: &TIMEPOINT_SPATIAL 8000
  sel_spatial_time: &TIME_SPATIAL
    # .sel: [!dag_prev , {time: *TIMEPOINT_SPATIAL}]
    .isel: [!dag_prev , {time: -1}]

  map_directional_time: &map_directional_time
    # pass: [!dag_prev ]
    import_and_call:
    args: [model_plots.PCPTopology.data_ops, map_directional_time, !dag_prev ]

  BP_data_path: &BP_data_path '~/ownCloud/Institution/Collaboration_NCBS_UNIGE/data/HCA-Actn4/summary_cells.csv'



# The energy at uniform t distances
energy:
  based_on: [energy, single_universe]
  enabled: false

# The energy at uniform numerical step distances
energy_continuous:
  based_on: [energy, single_universe]
  enabled: false
  model_name: PCPTopology/PCPVertex

# Number of T1 and T2 transitions
transitions:
  based_on: [transitions, single_universe]
  enabled: false

transitions_cumulated:
  based_on: [transitions, single_universe]
  enabled: false
  cumsum_transitions: true


# effective diffusion
diffusion: !pspace
  based_on: diffusion_mv
  enabled: False
  select_and_combine:
    subspace: *subspace_slice
  hue: *HUE
  helpers:
    set_limits:
      y: [0, 0.3]

# Displacement, i.e. MSD**0.5
displacement: !pspace
  based_on: diffusion
  enabled: False

  to_plot: 
  - function: sns.lineplot
    data: !dag_result distance
    y: distance

  helpers:
    set_labels:
      y: $\sqrt{MSD}$
    set_limits:
      y: [0, 16]

diffusion_constant: !pspace
  based_on:
    - .plot.multiplot
    - multiverse
  enabled: False

  select_and_combine:
    allow_missing_or_failing: silent
    fields:
      _displacement:
        path: data/PCPTopology/Cells
        transform:
          - import_and_call:
            args: 
              - model_plots.PCPTopology.data_ops
              - displacement
              - !dag_node -1
              - property
              - [x, y]
          - .rename: [!dag_prev , displacement]
    subspace: *subspace_slice_2
  transform:
    - pass: [!dag_tag _displacement]
    - .squeeze: [!dag_prev ]
      tag: displacement

    # the time coordinates
    - .coords: [!dag_tag displacement, time]
      tag: time
    - create_mask: [!dag_prev , ">=", 120]
      tag: equilibrium_short
    - create_mask: [!dag_tag time, ">=", 800]
      tag: equilibrium

    # square displacement
    - pow: [!dag_tag displacement, 2]
    - .sum: [!dag_prev , property]
      kwargs: {skipna: False}
    - .rename: [!dag_prev , square_displ]
      tag: square_displ_xr

    # diffusion
    - div: [!dag_tag square_displ_xr, !dag_tag time]
    - div: [!dag_prev , 2]
    - .rename: [!dag_prev , diffusion]
      tag: diffusion_xr
    - .where: [!dag_prev , !dag_tag equilibrium]
    - .mean: [!dag_prev , time]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: diffusion_const
    - .where: [!dag_tag diffusion_xr, !dag_tag equilibrium_short]
    - .mean: [!dag_prev , time]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: diffusion_const_short

  x: *HUE
  hue: *HUE_2
  y: diffusion

  to_plot: 
  - function: sns.lineplot
    data: !dag_result diffusion_const
  - function: sns.lineplot
    data: !dag_result diffusion_const_short
    linestyle: ':'

  helpers:
    set_labels:
      y: diffusion constant [$A_0^2 / \tau_\lambda$]
    set_scales:
      y: log
    set_limits: 
      y: [1.e-5, 0.25]


# Spatial mapping in graded space ---------------------------------------------
cells_spatial:
  based_on:
    - .plot.multiplot
    - multiverse
    - select_cells_properties_mv
  enabled: False

  to_plot:
    - function: sns.lineplot
      data: !dag_result all_cells
      label: all cells
    - function: sns.lineplot
      data: !dag_result support_cells
      label: support cells
    - function: sns.lineplot
      data: !dag_result hair_cells
      label: hair cells

  select_and_combine:
    allow_missing_or_failing: silent
    fields:
      _x:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: x}]
          - *TIME_SPATIAL
          - .rename: [!dag_prev , x]
          - call_lambda: null
            args: ['lambda x: x / x.max() - 0.5', !dag_node -1]
            # args: ['lambda x: numpy.abs(2 * (x / x.max() - 0.5))', !dag_node -1]
      _cell_type:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: cell_type}]
          - *TIME_SPATIAL
          - .rename: [!dag_prev , cell_types]
    subspace: *subspace_slice

      
  transform:
    - call_lambda:
      args: 
        - "lambda d, *, args: d.stack(*args)"
        - !dag_tag _x
      kwargs: {args: [{ids: [seed, id]}]}
    - .squeeze: [!dag_prev ]
      tag: x


    - call_lambda:
      args: 
        - "lambda d, *, args: d.stack(*args)"
        - !dag_tag _cell_type
      kwargs: {args: [{ids: [seed, id]}]}
    - .squeeze: [!dag_prev ]
    - .assign_coords: [!dag_prev , {x: !dag_tag x}]

    - call_lambda:
      args: 
        - "lambda d, *, args: d.sortby(*args)"
        - !dag_prev
      kwargs: {args: [x]}
    - .swap_dims: [!dag_prev , {ids: x}]
    - .dropna: [!dag_prev , x]
    - create_mask: [!dag_prev , ==, 1]
      tag: _hair_cells


    - call_lambda:
      args: 
        - "lambda d, *, args: d.stack(*args)"
        - !dag_tag _cell_type
      kwargs: {args: [{ids: [seed, id]}]}
    - .squeeze: [!dag_prev ]
    - .assign_coords: [!dag_prev , {x: !dag_tag x}]

    - call_lambda:
      args: 
        - "lambda d, *, args: d.sortby(*args)"
        - !dag_prev
      kwargs: {args: [x]}
    - .swap_dims: [!dag_prev , {ids: x}]
    - .dropna: [!dag_prev , x]
    - create_mask: [!dag_prev , ==, 2]
      tag: _support_cells


    - call_lambda:
      args: 
        - "lambda d, *, args: d.stack(*args)"
        - !dag_tag _property
      kwargs: {args: [{ids: [seed, id]}]}
    - .squeeze: [!dag_prev ]
    - .assign_coords: [!dag_prev , {x: !dag_tag x}]

    - call_lambda:
      args: 
        - "lambda d, *, args: d.sortby(*args)"
        - !dag_prev
      kwargs: {args: [x]}
    - .swap_dims: [!dag_prev , {ids: x}]
    - .dropna: [!dag_prev , x]
      tag: property


    - .rolling:
      args: [!dag_tag property, {x: &Rolling_all 60}]
      kwargs: {center: True}
    - .mean: [!dag_prev , x]
    - .dropna: [!dag_prev , x]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: all_cells


    - .where: [!dag_tag property , !dag_tag _hair_cells]
    - .dropna: [!dag_prev , x]
    - .rolling:
      args: [!dag_prev , {x: &Rolling_HC 15}]
      kwargs: {center: True}
    - .mean: [!dag_prev , x]
      tag: hair_cells_xr
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: hair_cells

    - .where: [!dag_tag property , !dag_tag _support_cells]
    - .dropna: [!dag_prev , x]
    - .rolling:
      args: [!dag_prev , {x: &Rolling_SC 40}]
      kwargs: {center: True}
    - .mean: [!dag_prev , x]
    - import_and_call:
      args: [model_plots.PCPTopology.data_ops, to_dataframe, !dag_prev ]
    - callattr: [!dag_prev , reset_index]
      tag: support_cells

  x: x
  y: area

  helpers:
    set_labels:
      x: position
    set_limits:
      x: [-0.5, 0.5]

cells_spatial/area: !pspace
  based_on: cells_spatial
  
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: area}]
          - *TIME_SPATIAL
          - .rename: [!dag_prev , area]
  
  y: area

  helpers:
    set_labels:
      y: cell area
    set_limits:
      y: [0., 5.5]


cells_spatial/area_pref: !pspace
  based_on: cells_spatial

  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: area_preferential}]
          - *TIME_SPATIAL
          - .rename: [!dag_prev , area_preferential]

  y: area_preferential

  # helpers:
  #   set_limits:
  #     y: [0., 5.5]

cells_spatial/pressure: !pspace
  based_on: cells_spatial

  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: area_preferential}]
          - *TIME_SPATIAL
          - .sel: [!dag_node -3, {property: area}]
          - *TIME_SPATIAL
          - sub: [!dag_node -1, !dag_node -3]
          - .rename: [!dag_prev , pressure]

  y: pressure

cells_spatial/coordination: !pspace
  based_on: cells_spatial

  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: num_neighbors}]
          - *TIME_SPATIAL
          - .rename: [!dag_prev , num_neighbors]

  y: num_neighbors
  helpers:
    set_labels:
      x: position
      y: number of neighbors
    set_limits:
      y: [3., 12.]

cells_spatial/HC_neighbors: !pspace
  based_on: cells_spatial

  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: num_hair_neighbors}]
          - *TIME_SPATIAL
          - .rename: [!dag_prev , num_hair_neighbors]

  y: num_hair_neighbors
  helpers:
    set_labels:
      x: position
      y: number of neighbors
    set_limits:
      y: [0., 3.]
      
cells_spatial/hexatic_order: !pspace
  based_on: cells_spatial
  
  to_plot:
    - function: sns.lineplot
      data: !dag_result hair_cells
      label: hair cells

  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: hexatic_order__corr}]
          - *TIME_SPATIAL
          - .rename: [!dag_prev , hexatic_order]

  y: hexatic_order
  helpers:
    set_labels:
      x: position
      y: hexatic order
    set_limits:
      y: [0., 1.]

cells_spatial/HC_density: !pspace
  based_on: cells_spatial
  
  to_plot:
    - function: sns.lineplot
      data: !dag_result all_cells
      errorbar: sd

  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: cell_type}]
          - create_mask: [!dag_prev , ==, 1]
          - *TIME_SPATIAL
          - .rename: [!dag_prev , hair_number_density]

  y: hair_number_density
  helpers:
    set_labels:
      y: hair number density
    set_limits:
      y: [0.1, 0.4]

cells_spatial/migration: !pspace
  based_on: cells_spatial
  
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - import_and_call:
            args: 
            - model_plots.PCPTopology.data_ops
            - displacement
            - !dag_node -1
            - property
            - [x, y]
          - .sel: [!dag_prev , {property: x}]
          - .cumsum: [!dag_prev , time]
          - *TIME_SPATIAL
          - .rename: [!dag_prev , migration]
  
  y: migration



# The average cell area
cell_properties: !pspace
  based_on:
    - .plot.multiplot
    - multiverse
    - select_cells_properties_mv
  enabled: false

  to_plot: 
    - function: sns.lineplot
      data: !dag_result all_cells
      errorbar: sd
    - function: sns.lineplot
      data: !dag_result hair_cells
      errorbar: sd
    - function: sns.lineplot
      data: !dag_result support_cells
      errorbar: sd

  select_and_combine:
    subspace: *subspace_slice

  x: time
  hue: *HUE

  helpers:
    set_labels:
      x: time

# The average cell area
cell_properties/area: !pspace
  based_on: cell_properties

  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: area}]
          - .rename: [!dag_prev , area]

  y: area

  helpers:
    set_labels:
      y: average area

cell_properties/area_pref: !pspace
  based_on: cell_properties

  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: area_preferential}]
          - .rename: [!dag_prev , area_preferential]

  y: area_preferential

# The average cell shape
cell_properties/shape: !pspace
  based_on: cell_properties/area
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: perimeter}]
          - .sel: [!dag_node -2, {property: area_preferential}]
          - pow: [!dag_node -1 , 0.5]
          - div: [!dag_node -3, !dag_node -1]
          - .rename: [!dag_prev , shape_index]
  y: shape_index
  helpers:
    set_labels:
      y: average shape index
    set_limits:
      y: [3.72, 4.4]

cell_properties/elongation: !pspace
  based_on: cell_properties/area
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_node -1, {property: q_x}]
          - .sel: [!dag_node -2, {property: q_y}]
          - call_lambda:
            - "lambda qx, qy: (qx**2 + qy**2)**0.5"
            - !dag_node -2
            - !dag_node -1
          - .rename: [!dag_prev , elongation]
  y: elongation
  helpers:
    set_labels:
      y: average elongation

# The average cell geometry
cell_properties/neighbors: !pspace
  based_on: cell_properties/area
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: num_neighbors}]
          - .rename: [!dag_prev , num_neighbors]
  y: num_neighbors
  helpers:
    set_labels:
      y: average neighbors
    set_limits:
      y: [3, 10]

cell_properties/coordination: !pspace
  based_on: cell_properties/neighbors
  to_plot: 
    - function: sns.lineplot
      data: !dag_result hair_cells
      errorbar: sd

cell_properties/subordination: !pspace
  based_on: cell_properties/neighbors
  to_plot: 
    - function: sns.lineplot
      data: !dag_result support_cells
      errorbar: sd

cell_properties/HH_neighbors: !pspace
  based_on: cell_properties/area
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Cells
        transform:
          - .sel: [!dag_prev , {property: num_hair_neighbors}]
          - .rename: [!dag_prev , num_hair_neighbors]
  y: num_hair_neighbors
  to_plot: 
    - function: sns.lineplot
      data: !dag_result hair_cells
      errorbar: sd
  helpers:
    set_labels:
      y: average neighbors
    set_limits:
      y: [0, 4]


edge_properties/min_length: !pspace
  enabled: False
  based_on:
    - .plot.multiplot
    - multiverse
    - select_edges_properties_mv
  to_plot: 
    - function: sns.lineplot
      data: !dag_result all_edges
      errorbar: sd
  select_and_combine:
    fields:
      _property:
        path: data/PCPTopology/Edges
        transform:
          - .sel: [!dag_prev , {property: length}]
          - .min: [!dag_prev , id]
          - .expand_dims: [!dag_prev , id]
          - .rename: [!dag_prev , length]
    subspace: *subspace_slice

  x: time
  y: length
  hue: *HUE

  helpers:
    set_labels:
      x: time
      y: average area


# A 2D representation of the cells by their edges
cell_segmentation:
  based_on:
    - cellular_structure
    - single_universe

  cell_marker_size: 10
  