# A minimal configuration to introduce heterogeneous edge contractility
# In quick and dirty during proliferation the energy is not minimized.
# This results in a significant (~ factor 100) speed up with similar results.
#
# The model can be run by typing : 
# $ cd /path-to-Utopia/vertex-model
# $ utopia run PCPTopology src/models/PCPTopology/cfgs/<case>/run.yml \
#          --plots-cfg src/models/PCPTopology/cfgs/<case>/eval.yml
#
# The content of this file is used to update the corresponding entries in
# ../PCPTopology_cfg.yml
---
perform_sweep: true
paths:
  model_note: default__polarity

worker_manager:
  nonzero_exit_handling: warn_all

parameter_space:
  num_steps: 5

  # num_cells: &NUM_CELLS 256     # The final number of cells

  seed: !sweep
    default: 42
    range: [1]
    order: -1

  PCPTopology:   
    initialisation:
      1_by_proliferation:
        num_generations: 0
    

    # The sequence of operations
    operations:      
      # Eliminate HC-HC contacts
      - increment_linetension:
          times: []
          iterations_prolog: 1
          hair_hair: 1
      - increment_linetension:
          times: []
          iterations_prolog: 1
          hair_hair: 1000
          minimization:
            num_repeat: &equilibration_time 5
      # END Differential junctional properties

      # Introduce junctional heterogeneity
      - increment_edge_contractility:
          times: []
          iterations_prolog: 0

          set_ppMLC: &ppMLC 0.
          ppMLC_angle: 0.
          inhibit_ppMLC: false

          set_pMLC: 0.

          minimization:
            num_repeat: *equilibration_time

      # # Introduce polarity
      - increment_edge_contractility:
          times: []
          iterations_prolog: 1

          set_ppMLC: *ppMLC
          ppMLC_angle: 0.
          inhibit_ppMLC: False

          set_pMLC: &pMLC 0.6
          reset_HC_polarity: [True, 1.5708]
          reset_HC_polarity_random: False
          
          minimization:
            num_repeat: *equilibration_time
            
      - void:
          times:
            start: 1
            stop: 100000
            step: 1
          

    # --- Dynamics
    NotchDelta: {cell_manager: {grid: { resolution: 32}}}

    PCPVertex:      
      boundary_parameter:
        area_elasticity: 1.
        area_preferential: 1.
        shape_elasticity: 0.1
        shape_index_preferential: 3.54491 # 2 sqrt(pi)

      area_elasticity: 1.

      enable_T1_transitions: True
      
      cell_shape_implementation: contractile
      # possible contractile or shape_elastic
      # whether to normalize shape index to A^0 or A, respectively

      agent_manager:
        cell_manager:
          agent_params:
            area_preferential: 1.
            contractility: 1.
            shape_index_preferential: 3.76
            polarity: -1.5708   # -Pi / 2
        edge_manager:
          agent_params:
            linetension: 0.
            contractility: 0.
        setup_params:
          hexagonal:
            HC_structure: ratio_1_to_3
            lattice_rows: 12
            lattice_columns: 12
            HC_structure_no_HC_at_boundary: True
            # lattice_rows: !coupled-sweep
            #   target_name: HC_structure
            #   default: 16
            #   values: [14, 16, 14, 16, 14]
            # lattice_columns: !coupled-sweep
            #   target_name: HC_structure
            #   default: 16
            #   values: [18, 16, 20, 18, 14]
            # HC_structure: !sweep
            #   default: ration_1_to_3
            #   values:
            #     - ratio_1_to_2
            #     - ratio_1_to_3
            #     - ratio_1_to_4
            #     - ratio_1_to_5
            #     - ratio_1_to_6
            #   name: HC_structure

      T1_threshold: 0.03
      T1_separation_factor: 1.05
      T1_probability: 1.
      T1_barrier: 0.02
      T2_threshold: 0.0075


      log_level: warning
      
      # continuous data manager
      data_manager:
        deciders:
          write_energy:
            type: interval
            args: 
              intervals:
                - [0, 1000000000, 50]
        tasks:
          Energy_total: &energy_continuous {decider: write_energy}
          Energy_linetension: *energy_continuous
          Energy_areaelasticity: *energy_continuous
          Energy_cell_contractility: *energy_continuous
          Energy_edge_contractility: *energy_continuous
          Energy_boundary_area_elasticity: *energy_continuous
          Energy_boundary_shape_elasticity: *energy_continuous
          Energy_time: *energy_continuous
          transitions: *energy_continuous

          Vertices: &position {active: false}
          Cells: *position
          Edges: *position

    # equilibrium data manager
    data_manager:
      deciders:
        write_always:
          type: always

        write_interval: &interval
          type: interval
          args:
            intervals:
              - [0  ,  5]
              - [5  ,  100,  5]
              - [100, 1000, 25]
              - [1000, 10000, 100]
      triggers:
        build_interval: *interval
