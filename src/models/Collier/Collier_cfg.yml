# The model configuration for the Collier model
---
# --- Space parameters
# The physical space this model is embedded in
space:
  periodic: true

# --- CellManager and cell initialization
cell_manager:
  grid:
    structure: square
    resolution: 16

  neighborhood:
    mode: Moore

  # Cell initialization parameters
  cell_params:
    notch: 1.
    notch_sigma: 0.2
    delta: 1.
    delta_sigma: 0.2
    nicd: 0.1
    nicd_sigma: 0.02


# --- Model parameters
# Add parameters and their documentation here ...

# -- Dynamics
time_resolution: 1000

degradation_delta: 1.
degradation_notch: 1.

production_notch: 1.
production_delta: 50.
production_nicd: 200.

interaction_strength_trans: 1.
interaction_strength_cis: 10.

cooperativity_delta: 1.
cooperativity_nicd: 1.

notch_threshold_factor: 0.1


# --- Data manager configuration
data_manager:
  # this builds the deciders
  deciders:
    write_density:
      type: interval
      args:
        intervals:
          - [0, 10000000, 100]
    
    write_interval: &interval
      type: interval
      args:
        intervals:
          - [0, 1000000, 500]

  # this builds the triggers, here deciders are used
  triggers:
    build_interval: *interval

    build_once:
      type: once
      args:
        time: 0
    
    build_always:
      type: always
    
  # the tasks
  tasks:
    Density_progenitor: &density
      active: true
      trigger: build_once
      decider: write_density
    Density_hair: *density
    Density_support: *density
    Density_rosettes: *density
    Density_notch: *density
    Density_delta: *density
    Density_nicd: *density
    Density_time: *density

    Cell_type: &CM
      active: true
      decider: write_interval
      trigger: build_interval
    Cluster_id: *CM
    Notch: *CM
    Delta: *CM
    NICD: *CM
    CM_time: *CM


